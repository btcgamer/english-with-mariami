<!doctype html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020817">

<title>მე-3 კლასი — მასწავლებლის რეჟიმი | English with Mariami</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  color:#fff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;

  background:
    radial-gradient(circle at 10% 10%,#00eaff35,transparent 25%),
    radial-gradient(circle at 90% 20%,#7c3cff30,transparent 28%),
    radial-gradient(circle at 50% 100%,#006eff25,transparent 40%),
    linear-gradient(135deg,#01030b,#03152e 45%,#010713);
}

/* ================================
   3D BACKGROUND
================================ */

#visual3d{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  perspective:1200px;
}

.grid{
  position:absolute;
  width:180%;
  height:180%;
  left:-40%;
  top:35%;
  opacity:.22;

  background-image:
    linear-gradient(#00eaff22 1px,transparent 1px),
    linear-gradient(90deg,#00eaff22 1px,transparent 1px);

  background-size:70px 70px;

  transform:
    perspective(700px)
    rotateX(67deg)
    translateZ(-100px);

  animation:gridMove 16s linear infinite;
}

@keyframes gridMove{
  from{
    transform:
      perspective(700px)
      rotateX(67deg)
      translateY(0)
      translateZ(-100px);
  }

  to{
    transform:
      perspective(700px)
      rotateX(67deg)
      translateY(70px)
      translateZ(-100px);
  }
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(2px);
  mix-blend-mode:screen;
}

.orb.one{
  width:300px;
  height:300px;
  left:-90px;
  top:15%;
  background:
    radial-gradient(circle,#00eaff66 0,#00eaff10 45%,transparent 70%);
  animation:orb1 9s ease-in-out infinite alternate;
}

.orb.two{
  width:400px;
  height:400px;
  right:-130px;
  top:5%;
  background:
    radial-gradient(circle,#7c3cff66 0,#7c3cff10 45%,transparent 70%);
  animation:orb2 12s ease-in-out infinite alternate;
}

.orb.three{
  width:350px;
  height:350px;
  left:35%;
  bottom:-180px;
  background:
    radial-gradient(circle,#006eff55 0,#006eff08 50%,transparent 70%);
  animation:orb3 10s ease-in-out infinite alternate;
}

@keyframes orb1{
  from{
    transform:translate3d(0,0,0) scale(1);
  }
  to{
    transform:translate3d(120px,60px,100px) scale(1.25);
  }
}

@keyframes orb2{
  from{
    transform:translate3d(0,0,0) scale(1);
  }
  to{
    transform:translate3d(-100px,100px,150px) scale(1.3);
  }
}

@keyframes orb3{
  from{
    transform:translate3d(0,0,0);
  }
  to{
    transform:translate3d(70px,-80px,100px);
  }
}

/* PARTICLES */

.particles{
  position:absolute;
  inset:0;
}

.particles span{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
  animation:particleFloat linear infinite;
  opacity:.7;
}

.particles span:nth-child(1){
  left:5%;
  top:70%;
  animation-duration:8s;
}
.particles span:nth-child(2){
  left:12%;
  top:40%;
  animation-duration:12s;
}
.particles span:nth-child(3){
  left:22%;
  top:85%;
  animation-duration:10s;
}
.particles span:nth-child(4){
  left:31%;
  top:25%;
  animation-duration:9s;
}
.particles span:nth-child(5){
  left:43%;
  top:65%;
  animation-duration:13s;
}
.particles span:nth-child(6){
  left:55%;
  top:35%;
  animation-duration:11s;
}
.particles span:nth-child(7){
  left:66%;
  top:80%;
  animation-duration:8s;
}
.particles span:nth-child(8){
  left:74%;
  top:20%;
  animation-duration:14s;
}
.particles span:nth-child(9){
  left:84%;
  top:60%;
  animation-duration:10s;
}
.particles span:nth-child(10){
  left:93%;
  top:35%;
  animation-duration:12s;
}
.particles span:nth-child(11){
  left:18%;
  top:10%;
  animation-duration:15s;
}
.particles span:nth-child(12){
  left:48%;
  top:15%;
  animation-duration:9s;
}
.particles span:nth-child(13){
  left:63%;
  top:50%;
  animation-duration:13s;
}
.particles span:nth-child(14){
  left:88%;
  top:85%;
  animation-duration:11s;
}
.particles span:nth-child(15){
  left:37%;
  top:90%;
  animation-duration:14s;
}

@keyframes particleFloat{
  0%{
    transform:translate3d(0,80px,0) scale(.5);
    opacity:0;
  }

  20%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:translate3d(30px,-180px,200px) scale(1.5);
    opacity:0;
  }
}

/* ================================
   TOP BAR
================================ */

#bar{
  position:relative;
  z-index:9999;

  min-height:68px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;
  padding:12px 18px;

  background:
    linear-gradient(
      135deg,
      rgba(3,20,43,.95),
      rgba(2,8,23,.88)
    );

  border-bottom:1px solid #00eaff55;

  box-shadow:
    0 8px 35px #000b,
    inset 0 -1px #00eaff12;

  backdrop-filter:blur(20px);
}

/* glowing line */

#bar:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      #7c3cff,
      #ffe600,
      transparent
    );

  background-size:200% 100%;
  animation:energyLine 4s linear infinite;
}

@keyframes energyLine{
  from{
    background-position:0 0;
  }

  to{
    background-position:200% 0;
  }
}

/* ================================
   BRAND
================================ */

.teacher-title{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.logo3d{
  width:43px;
  height:43px;
  flex:none;

  display:grid;
  place-items:center;

  border-radius:14px;

  background:
    linear-gradient(135deg,#075eff,#00eaff);

  box-shadow:
    0 0 20px #00eaff66,
    0 8px 20px #0008;

  font-size:22px;

  transform:
    perspective(500px)
    rotateY(-12deg)
    rotateX(8deg);

  animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:
      perspective(500px)
      rotateY(-12deg)
      rotateX(8deg)
      translateY(0);
  }

  50%{
    transform:
      perspective(500px)
      rotateY(12deg)
      rotateX(-8deg)
      translateY(-4px);
  }
}

.title-text{
  min-width:0;
}

.title-text strong{
  display:block;
  font-size:16px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 15px #00eaff66;
}

.title-text span{
  display:block;
  margin-top:3px;
  font-size:11px;
  color:#83c8d8;
}

/* ================================
   BUTTON
================================ */

.back{
  position:relative;
  overflow:hidden;

  border:1px solid #00eaff66;
  border-radius:14px;

  padding:11px 16px;

  color:#fff;
  background:
    linear-gradient(
      135deg,
      #075eff,
      #00c8e8
    );

  font-weight:1000;
  cursor:pointer;

  box-shadow:
    0 8px 25px #0008,
    0 0 20px #00eaff25;

  transition:
    transform .25s,
    box-shadow .25s;
}

.back:before{
  content:"";
  position:absolute;
  top:-80%;
  left:-30%;

  width:30%;
  height:260%;

  background:#ffffff55;

  transform:rotate(25deg);

  animation:shine 4s infinite;
}

@keyframes shine{
  0%{
    left:-40%;
  }

  45%,100%{
    left:130%;
  }
}

.back:hover{
  transform:
    translateY(-3px)
    scale(1.03);

  box-shadow:
    0 14px 35px #000b,
    0 0 30px #00eaff55;
}

.back:active{
  transform:scale(.97);
}

/* ================================
   IFRAME
================================ */

#frameWrap{
  position:absolute;
  z-index:10;

  top:68px;
  left:0;
  right:0;
  bottom:0;

  padding:10px;

  perspective:1800px;

  background:
    radial-gradient(
      circle at 50% 0%,
      #00eaff0b,
      transparent 50%
    );
}

.frame-shell{
  position:relative;

  width:100%;
  height:100%;

  border-radius:20px;

  overflow:hidden;

  border:1px solid #00eaff45;

  background:#020817;

  box-shadow:
    0 25px 80px #000c,
    0 0 40px #00eaff12,
    inset 0 1px #ffffff12;

  transform:
    perspective(1800px)
    rotateX(0deg)
    translateZ(0);

  transition:
    transform .5s,
    box-shadow .5s;
}

.frame-shell:hover{
  box-shadow:
    0 30px 90px #000d,
    0 0 55px #00eaff20,
    inset 0 1px #ffffff18;
}

/* FRAME GLOW */

.frame-shell:before{
  content:"";
  position:absolute;
  z-index:20;
  pointer-events:none;

  inset:0;

  border-radius:20px;

  box-shadow:
    inset 0 0 0 1px #00eaff20,
    inset 0 0 60px #00eaff06;

  animation:framePulse 4s ease-in-out infinite;
}

@keyframes framePulse{
  0%,100%{
    box-shadow:
      inset 0 0 0 1px #00eaff20,
      inset 0 0 60px #00eaff06;
  }

  50%{
    box-shadow:
      inset 0 0 0 1px #00eaff45,
      inset 0 0 80px #00eaff0c;
  }
}

/* CORNER DECORATIONS */

.corner{
  position:absolute;
  z-index:30;
  width:35px;
  height:35px;
  pointer-events:none;
}

.corner:before,
.corner:after{
  content:"";
  position:absolute;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
}

.corner.tl{
  left:10px;
  top:10px;
}

.corner.tr{
  right:10px;
  top:10px;
}

.corner.bl{
  left:10px;
  bottom:10px;
}

.corner.br{
  right:10px;
  bottom:10px;
}

.corner:before{
  width:35px;
  height:2px;
}

.corner:after{
  width:2px;
  height:35px;
}

.corner.tr:before,
.corner.br:before{
  right:0;
}

.corner.tr:after,
.corner.br:after{
  right:0;
}

.corner.bl:before,
.corner.br:before{
  bottom:0;
}

.corner.bl:after,
.corner.br:after{
  bottom:0;
}

/* iframe */

iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#020817;

  position:relative;
  z-index:5;
}

/* ================================
   LOADING
================================ */

#loading{
  position:absolute;
  z-index:50;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      #062d4c,
      #020817 65%
    );

  transition:
    opacity .6s,
    visibility .6s;
}

.loader-box{
  text-align:center;
}

.loader-orbit{
  position:relative;

  width:80px;
  height:80px;

  margin:auto auto 20px;
}

.loader-orbit:before,
.loader-orbit:after{
  content:"";

  position:absolute;
  inset:0;

  border-radius:50%;

  border:2px solid transparent;
  border-top-color:#00eaff;
  border-right-color:#7c3cff;

  animation:spin 1s linear infinite;
}

.loader-orbit:after{
  inset:10px;

  border-top-color:#ffe600;
  border-right-color:#00eaff;

  animation:
    spinReverse 1.5s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes spinReverse{
  to{
    transform:rotate(-360deg);
  }
}

.loader-box strong{
  display:block;

  font-size:18px;

  text-shadow:
    0 0 20px #00eaff;
}

.loader-box span{
  display:block;

  margin-top:6px;

  color:#83c8d8;
  font-size:12px;
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:700px){

  #bar{
    min-height:64px;
    padding:9px 10px;
  }

  .logo3d{
    width:38px;
    height:38px;
    font-size:19px;
  }

  .title-text strong{
    font-size:13px;
  }

  .title-text span{
    font-size:9px;
  }

  .back{
    padding:9px 11px;
    font-size:11px;
  }

  #frameWrap{
    top:64px;
    padding:5px;
  }

  .frame-shell{
    border-radius:14px;
  }
}

@media(max-width:450px){

  .title-text span{
    display:none;
  }

  .title-text strong{
    font-size:12px;
  }

  .back{
    font-size:10px;
    padding:8px 9px;
  }
}

/* reduced motion */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<!-- ================================
     3D VISUAL BACKGROUND
================================ -->

<div id="visual3d">

  <div class="grid"></div>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>


<!-- ================================
     TEACHER BAR
================================ -->

<div id="bar">

  <div class="teacher-title">

    <div class="logo3d">
      👩‍🏫
    </div>

    <div class="title-text">
      <strong>
        მასწავლებლის რეჟიმი — მე-3 კლასი
      </strong>

      <span>
        ⚡ English with Mariami • 3D Learning Environment
      </span>
    </div>

  </div>

  <button
    class="back"
    onclick="location.href='teacher-dashboard.html'">

    🔙 მასწავლებლის გვერდზე დაბრუნება

  </button>

</div>


<!-- ================================
     FRAME
================================ -->

<div id="frameWrap">

  <div class="frame-shell">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="loading">

      <div class="loader-box">

        <div class="loader-orbit"></div>

        <strong>
          მე-3 კლასის ჩატვირთვა...
        </strong>

        <span>
          ⚡ English with Mariami
        </span>

      </div>

    </div>

    <iframe
      id="gradeFrame"
      src="grade3.html?teacher_view=1"
      allow="autoplay">
    </iframe>

  </div>

</div>


<script>

/* ==========================================
   GRADE 3 TEACHER MODE
   3D VISUAL SYSTEM
========================================== */

(function(){

  const frame =
    document.getElementById('gradeFrame');

  const loading =
    document.getElementById('loading');

  const shell =
    document.querySelector('.frame-shell');


  /* ======================================
     HIDE STUDENT NAVIGATION
  ====================================== */

  function hideStudentNavigation(){

    try{

      const doc =
        frame.contentDocument ||
        frame.contentWindow.document;

      if(!doc) return;


      /*
       Remove links/buttons that lead
       away from the grade page.
      */

      doc
      .querySelectorAll(
        'a,button,[role="button"]'
      )
      .forEach(function(el){

        const href =
          (
            el.getAttribute('href') ||
            ''
          ).toLowerCase();

        const text =
          (
            el.textContent ||
            ''
          )
          .replace(/\s+/g,' ')
          .trim()
          .toLowerCase();


        const shouldHide =
          href.includes('academy') ||

          href.includes('index.html') ||

          href.includes('teacher-dashboard') ||

          text === 'academy' ||

          text.includes('აკადემია') ||

          text === 'მთავარი' ||

          text.includes('მთავარი გვერდი');


        if(shouldHide){

          el.style.display='none';

        }

      });


      /*
       Hide common navigation areas
       only in teacher mode.
      */

      doc
      .querySelectorAll(
        'header.top nav .links'
      )
      .forEach(function(el){

        el.style.display='none';

      });


      /*
       Add teacher-view class.
      */

      if(doc.body){

        doc.body.classList.add(
          'teacher-view-active'
        );

      }

    }catch(e){

      /*
       Cross-origin protection:
       ignored intentionally.
      */

    }

  }


  /* ======================================
     FRAME LOAD
  ====================================== */

  frame.addEventListener(
    'load',
    function(){

      setTimeout(function(){

        loading.style.opacity='0';
        loading.style.visibility='hidden';

      },450);


      hideStudentNavigation();


      setTimeout(
        hideStudentNavigation,
        300
      );

      setTimeout(
        hideStudentNavigation,
        1000
      );

      setTimeout(
        hideStudentNavigation,
        2000
      );

    }
  );


  /*
   Continuously protect navigation
   because the grade page may dynamically
   recreate elements.
  */

  setInterval(
    hideStudentNavigation,
    1000
  );


  /* ======================================
     3D TILT EFFECT
  ====================================== */

  let raf = null;

  document.addEventListener(
    'mousemove',
    function(e){

      if(window.innerWidth < 800)
        return;

      if(raf)
        cancelAnimationFrame(raf);


      raf =
        requestAnimationFrame(
          function(){

            const x =
              (e.clientX /
              window.innerWidth) -
              .5;

            const y =
              (e.clientY /
              window.innerHeight) -
              .5;


            const rotateY =
              x * 1.4;

            const rotateX =
              y * -1.1;


            shell.style.transform =
              `
              perspective(1800px)
              rotateX(${rotateX}deg)
              rotateY(${rotateY}deg)
              translateZ(0)
              `;
          }
        );

    }
  );


  /* ======================================
     RESET TILT
  ====================================== */

  document.addEventListener(
    'mouseleave',
    function(){

      shell.style.transform =
        `
        perspective(1800px)
        rotateX(0deg)
        rotateY(0deg)
        translateZ(0)
        `;

    }
  );


  /* ======================================
     PARALLAX BACKGROUND
  ====================================== */

  const visual =
    document.getElementById('visual3d');

  document.addEventListener(
    'mousemove',
    function(e){

      const x =
        (e.clientX /
        window.innerWidth -
        .5) * 20;

      const y =
        (e.clientY /
        window.innerHeight -
        .5) * 20;


      visual.style.transform =
        `
        translate3d(
          ${x * -.15}px,
          ${y * -.15}px,
          0
        )
        `;

    }
  );


  /* ======================================
     EXTRA KEYBOARD EFFECT
  ====================================== */

  document.addEventListener(
    'keydown',
    function(e){

      /*
       Press F for fullscreen.
      */

      if(
        e.key.toLowerCase()==='f' &&
        !e.ctrlKey &&
        !e.altKey &&
        !e.shiftKey
      ){

        toggleFullscreen();

      }

    }
  );


  function toggleFullscreen(){

    if(!document.fullscreenElement){

      document
        .documentElement
        .requestFullscreen?.();

    }else{

      document
        .exitFullscreen?.();

    }

  }


})();

</script>

</body>
</html>
