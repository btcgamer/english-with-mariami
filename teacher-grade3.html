<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მე-3 კლასი — მასწავლებლის რეჟიმი</title><style>body{margin:0;background:#020817;color:#fff;font-family:Arial,sans-serif}#bar{position:sticky;top:0;z-index:9999;padding:12px 16px;background:#03142b;border-bottom:1px solid #00eaff55;display:flex;gap:10px;align-items:center;justify-content:space-between}button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#075eff,#00c8e8);color:#fff;font-weight:900;cursor:pointer}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0}</style></head><body><div id="bar"><strong>👩‍🏫 მასწავლებლის რეჟიმი — მე-3 კლასი</strong><button onclick="location.href='teacher-dashboard.html'">🔙 მასწავლებლის გვერდზე დაბრუნება</button></div><iframe src="grade3.html?teacher_view=1"></iframe><script>window.addEventListener('load',function(){try{const f=document.querySelector('iframe');f.addEventListener('load',function(){try{const d=f.contentDocument;d.querySelectorAll('a,button').forEach(function(e){const h=(e.getAttribute('href')||'').toLowerCase(),t=(e.textContent||'').trim().toLowerCase();if(h.includes('academy')||h==='/'||h.endsWith('index.html')||t==='academy'||t.includes('მთავარი'))e.style.setProperty('display','none','important')})}catch(e){}})}catch(e){}});</script></body></html>
