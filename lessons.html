<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>გაკვეთილები | English with Mariami</title><link rel="stylesheet" href="css/style.css"><style>.lesson-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:30px 0}.lesson-nav button{border:1px solid #ddd7ea;background:#fff;padding:12px 18px;border-radius:14px;font-weight:800;cursor:pointer}.lesson-nav button.active{background:#6c5ce7;color:#fff}.lesson{display:none}.lesson.active{display:block}.lesson-card{background:#fff;border:1px solid #e7e2dc;border-radius:24px;padding:28px;margin:18px 0;box-shadow:0 12px 30px #3b315d0b}.vocab{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.vocab div{background:#f8f7ff;border-radius:12px;padding:12px}.quiz button{border:1px solid #ddd7ea;background:#fff;padding:12px 16px;border-radius:12px;cursor:pointer;margin:5px}.quiz .ok{background:#e8f8ee}.quiz .no{background:#fff0f0}.quiz-result{font-weight:800;min-height:25px}.lesson-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.lesson-list a{background:#fff;border:1px solid #e7e2dc;border-radius:14px;padding:14px;text-decoration:none;color:#4d5870;font-weight:750}.lesson-list a:hover{border-color:#6c5ce7}@media(max-width:700px){.vocab,.lesson-list{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html">🌈 English with Mariami</a><nav><a href="index.html">მთავარი</a><a href="games.html">🎮 თამაშები</a><a href="#contact">კონტაქტი</a></nav></div></header><main><section class="hero"><div class="container center"><div class="eyebrow">📚 Lessons • გაკვეთილები</div><h1>ინგლისური <span>10 გაკვეთილად</span></h1><p class="lead">2-ე, 3-ე და 4-ე კლასისთვის — ინგლისურ-ქართული სიტყვები, მაგალითები, სავარჯიშოები და პატარა ტესტები.</p><div class="lesson-nav"><button class="active" data-grade="g2">🌱 2-ე კლასი</button><button data-grade="g3">🚀 3-ე კლასი</button><button data-grade="g4">⭐ 4-ე კლასი</button></div></div></section><section class="section"><div class="container"><div id="g2" class="lesson active"></div><div id="g3" class="lesson"></div><div id="g4" class="lesson"></div></div></section></main><footer id="contact"><div class="container footer-wrap"><span>© 2026 English with Mariami</span><span>📍 ქუთაისი • 📞 598 93 02 08</span></div></footer><script>const data={g2:[['გაკვეთილი 1 — Greetings','მისალმებები',['hello — გამარჯობა','good morning — დილა მშვიდობისა','goodbye — ნახვამდის','thank you — მადლობა'],['What does “hello” mean?',['გამარჯობა','ვაშლი','სკოლა'],0]],['გაკვეთილი 2 — Colors','ფერები',['red — წითელი','blue — ლურჯი','green — მწვანე','yellow — ყვითელი'],['Which means “green”?',['წითელი','მწვანე','ლურჯი'],1]],['გაკვეთილი 3 — Numbers','რიცხვები',['one — ერთი','two — ორი','three — სამი','four — ოთხი'],['What is “three”?',['ორი','ხუთი','სამი'],2]],['გაკვეთილი 4 — Family','ოჯახი',['mother — დედა','father — მამა','sister — და','brother — ძმა'],['What means “mother”?',['დედა','ძმა','მამა'],0]],['გაკვეთილი 5 — Animals','ცხოველები',['dog — ძაღლი','cat — კატა','bird — ჩიტი','fish — თევზი'],['What means “fish”?',['ძაღლი','თევზი','კატა'],1]],['გაკვეთილი 6 — Food','საჭმელი',['apple — ვაშლი','banana — ბანანი','bread — პური','milk — რძე'],['What means “bread”?',['პური','რძე','ვაშლი'],0]],['გაკვეთილი 7 — School','სკოლა',['book — წიგნი','pen — კალამი','school — სკოლა','teacher — მასწავლებელი'],['What means “book”?',['კალამი','წიგნი','მასწავლებელი'],1]],['გაკვეთილი 8 — Toys','სათამაშოები',['ball — ბურთი','doll — თოჯინა','car — მანქანა','game — თამაში'],['What means “ball”?',['ბურთი','თოჯინა','მანქანა'],0]],['გაკვეთილი 9 — Home','სახლი',['house — სახლი','door — კარი','table — მაგიდა','chair — სკამი'],['What means “chair”?',['მაგიდა','კარი','სკამი'],2]],['გაკვეთილი 10 — Review','გამეორება',['I am Mariami. — მე ვარ მარიამი.','I am happy. — მე ბედნიერი ვარ.','This is a cat. — ეს არის კატა.','I like apples. — მე მიყვარს ვაშლები.'],['Translate: “I am happy.”',['მე მშიერი ვარ.','მე ბედნიერი ვარ.','მე სახლში ვარ.'],1]]],g3:[['გაკვეთილი 1 — Daily phrases','ყოველდღიური ფრაზები',['How are you? — როგორ ხარ?','I am fine. — კარგად ვარ.','See you! — შევხვდებით!','Please — გთხოვ.'],['What means “Please”?',['გთხოვ','მადლობა','ნახვამდის'],0]],['გაკვეთილი 2 — School','სკოლა',['lesson — გაკვეთილი','homework — საშინაო დავალება','classroom — საკლასო ოთახი','student — მოსწავლე'],['What means “student”?',['მასწავლებელი','მოსწავლე','გაკვეთილი'],1]],['გაკვეთილი 3 — Family','ოჯახი',['parents — მშობლები','grandmother — ბებია','grandfather — ბაბუა','cousin — ბიძაშვილი'],['What means “grandmother”?',['ბებია','დედა','და'],0]],['გაკვეთილი 4 — House','სახლი',['kitchen — სამზარეულო','bedroom — საძინებელი','window — ფანჯარა','garden — ბაღი'],['What means “window”?',['კარი','ფანჯარა','ბაღი'],1]],['გაკვეთილი 5 — Weather','ამინდი',['sunny — მზიანი','rainy — წვიმიანი','cloudy — მოღრუბლული','windy — ქარიანი'],['What means “rainy”?',['მზიანი','ქარიანი','წვიმიანი'],2]],['გაკვეთილი 6 — Actions','მოქმედებები',['read — კითხვა','write — წერა','run — სირბილი','sleep — ძილი'],['What means “write”?',['წერა','ძილი','სირბილი'],0]],['გაკვეთილი 7 — Clothes','ტანსაცმელი',['shirt — პერანგი','shoes — ფეხსაცმელი','dress — კაბა','hat — ქუდი'],['What means “shoes”?',['ქუდი','ფეხსაცმელი','კაბა'],1]],['გაკვეთილი 8 — Food','საჭმელი',['breakfast — საუზმე','lunch — სადილი','dinner — ვახშამი','hungry — მშიერი'],['What means “hungry”?',['მშიერი','მშიერი არა','დაღლილი'],0]],['გაკვეთილი 9 — Time','დრო',['today — დღეს','tomorrow — ხვალ','yesterday — გუშინ','now — ახლა'],['What means “tomorrow”?',['გუშინ','ახლა','ხვალ'],2]],['გაკვეთილი 10 — Review','გამეორება',['I like school. — მე მიყვარს სკოლა.','She is my sister. — ის ჩემი დაა.','It is sunny. — მზიანი ამინდია.','I read a book. — მე წიგნს ვკითხულობ.'],['Translate: “I read a book.”',['მე წიგნს ვკითხულობ.','მე ვწერ წიგნს.','მე წიგნს ვხატავ.'],0]]],g4:[['გაკვეთილი 1 — Present Simple','აწმყო მარტივი დრო',['I play — მე ვთამაშობ','You read — შენ კითხულობ','He plays — ის თამაშობს','She reads — ის კითხულობს'],['Choose: She ___ a book.',['read','reads','reading'],1]],['გაკვეთილი 2 — To be','am / is / are',['I am — მე ვარ','You are — შენ ხარ','He is — ის არის','They are — ისინი არიან'],['Choose: They ___ happy.',['is','am','are'],2]],['გაკვეთილი 3 — Actions','მოქმედებები',['study — სწავლა','listen — მოსმენა','speak — საუბარი','watch — ყურება'],['What means “listen”?',['მოსმენა','საუბარი','სწავლა'],0]],['გაკვეთილი 4 — Nature','ბუნება',['tree — ხე','flower — ყვავილი','river — მდინარე','mountain — მთა'],['What means “mountain”?',['მდინარე','ყვავილი','მთა'],2]],['გაკვეთილი 5 — Places','ადგილები',['park — პარკი','library — ბიბლიოთეკა','shop — მაღაზია','hospital — საავადმყოფო'],['What means “library”?',['მაღაზია','ბიბლიოთეკა','პარკი'],1]],['გაკვეთილი 6 — Adjectives','ზედსართავები',['big — დიდი','small — პატარა','fast — სწრაფი','slow — ნელი'],['What means “fast”?',['ნელი','დიდი','სწრაფი'],2]],['გაკვეთილი 7 — Questions','კითხვები',['What? — რა?','Where? — სად?','Who? — ვინ?','When? — როდის?'],['What means “Where”?',['ვინ?','სად?','როდის?'],1]],['გაკვეთილი 8 — Can / Can’t','შეძლება',['I can swim. — მე ცურვა შემიძლია.','I can read. — მე კითხვა შემიძლია.','I can’t fly. — მე ფრენა არ შემიძლია.','Can you help? — შეგიძლია დამეხმარო?'],['Choose: Birds ___ fly.',['can','can’t','are'],0]],['გაკვეთილი 9 — Everyday English','ყოველდღიური ინგლისური',['Good luck! — წარმატებები!','Well done! — ყოჩაღ!','Excuse me. — უკაცრავად.','You’re welcome. — არაფრის.'],['What means “Well done!”?',['ნახვამდის','ყოჩაღ!','გთხოვ'],1]],['გაკვეთილი 10 — Final Review','საბოლოო გამეორება',['I am a student. — მე მოსწავლე ვარ.','She is my teacher. — ის ჩემი მასწავლებელია.','We can speak English. — ჩვენ ინგლისურად საუბარი შეგვიძლია.','They are at school. — ისინი სკოლაში არიან.'],['Choose: We ___ speak English.',['can','is','am'],0]]]};function render(id){const el=document.getElementById(id);el.innerHTML='<div class="center"><div class="eyebrow">📖 10 გაკვეთილი</div><h2>'+({g2:'2-ე კლასი — საწყისი დონე',g3:'3-ე კლასი — განვითარება',g4:'4-ე კლასი — გაძლიერება'}[id])+'</h2></div><div class="lesson-list">'+data[id].map((x,i)=>'<a href="#'+id+'-'+i+'">'+(i+1)+'. '+x[0]+'</a>').join('')+'</div>'+data[id].map((x,i)=>'<article class="lesson-card" id="'+id+'-'+i+'"><div class="eyebrow">'+x[0]+'</div><h2>'+x[1]+'</h2><div class="vocab">'+x[2].map(v=>'<div>'+v+'</div>').join('')+'</div><div class="quiz"><h3>✏️ სავარჯიშო / Exercise</h3><p>'+x[3][0]+'</p>'+x[3][1].map((a,j)=>'<button onclick="answer(this,'+j+','+x[3][2]+')">'+a+'</button>').join('')+'<div class="quiz-result"></div></div></article>').join('')}Object.keys(data).forEach(render);document.querySelectorAll('.lesson-nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lesson-nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.grade).classList.add('active')});function answer(btn,j,c){const box=btn.parentElement;box.querySelectorAll('button').forEach(b=>b.disabled=true);const r=box.querySelector('.quiz-result');if(j===c){btn.classList.add('ok');r.textContent='🎉 სწორია! Great job!'}else{btn.classList.add('no');r.textContent='❌ არასწორია. Try again!'}}</script></body></html>
