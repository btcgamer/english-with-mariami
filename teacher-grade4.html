<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მე-4 კლასი — მასწავლებლის რეჟიმი</title><style>body{margin:0;background:#020817;color:#fff;font-family:Arial,sans-serif}#bar{position:sticky;top:0;z-index:9999;padding:12px 16px;background:#03142b;border-bottom:1px solid #00eaff55;display:flex;gap:10px;align-items:center;justify-content:space-between}button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#075eff,#00c8e8);color:#fff;font-weight:900;cursor:pointer}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0}</style></head><body><div id="bar"><strong>👩‍🏫 მასწავლებლის რეჟიმი — მე-4 კლასი</strong><button onclick="location.href='teacher-dashboard.html'">🔙 მასწავლებლის გვერდზე დაბრუნება</button></div><iframe id="gradeFrame" src="grade4.html?teacher_view=1"></iframe><script>(function(){const f=document.getElementById('gradeFrame');function hide(){try{const d=f.contentDocument;if(!d)return;d.querySelectorAll('a,button,[role="button"]').forEach(function(e){const h=(e.getAttribute('href')||'').toLowerCase(),t=(e.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();if(h.includes('academy')||h.includes('index.html')||t==='academy'||t.includes('მთავარი'))e.remove();});}catch(e){}}f.addEventListener('load',function(){hide();setTimeout(hide,300);setTimeout(hide,1000);});setInterval(hide,500);})();</script></body></html>
