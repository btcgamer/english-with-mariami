<!doctype html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020817">

<title>მე-4 კლასი — მასწავლებლის რეჟიმი | English with Mariami</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  margin:0;
  overflow:hidden;
  color:#fff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
  background:
    radial-gradient(circle at 15% 15%,#00eaff35,transparent 25%),
    radial-gradient(circle at 85% 20%,#8b5cff35,transparent 28%),
    radial-gradient(circle at 50% 100%,#006eff30,transparent 40%),
    linear-gradient(135deg,#01030b,#03152e 45%,#010713);
}

/* =========================================================
   3D VISUAL WORLD
========================================================= */

#visual3d{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  perspective:1400px;
}

/* deep atmosphere */

.atmosphere{
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at 50% 45%,
      transparent 0%,
      #00eaff05 25%,
      #00000055 70%,
      #000000aa 100%);
  animation:atmospherePulse 8s ease-in-out infinite;
}

@keyframes atmospherePulse{
  0%,100%{
    transform:scale(1);
    opacity:.8;
  }
  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

/* =========================================================
   FUTURE GRID
========================================================= */

.grid-floor{
  position:absolute;
  width:220%;
  height:170%;
  left:-60%;
  top:42%;

  background-image:
    linear-gradient(#00eaff20 1px,transparent 1px),
    linear-gradient(90deg,#00eaff20 1px,transparent 1px);

  background-size:65px 65px;

  transform:
    perspective(700px)
    rotateX(68deg)
    translateZ(-120px);

  opacity:.4;

  animation:gridTravel 8s linear infinite;
}

.grid-floor:after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      transparent 0%,
      #00eaff05 40%,
      #00eaff18 65%,
      transparent 100%
    );
}

@keyframes gridTravel{
  from{
    transform:
      perspective(700px)
      rotateX(68deg)
      translateY(0)
      translateZ(-120px);
  }

  to{
    transform:
      perspective(700px)
      rotateX(68deg)
      translateY(65px)
      translateZ(-120px);
  }
}

/* =========================================================
   NEON HORIZON
========================================================= */

.horizon{
  position:absolute;
  left:-20%;
  right:-20%;
  top:48%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      #7c3cff,
      #ffe600,
      #00eaff,
      transparent
    );

  background-size:300% 100%;

  box-shadow:
    0 0 8px #00eaff,
    0 0 20px #00eaff,
    0 0 45px #7c3cff;

  animation:horizonMove 5s linear infinite;
}

@keyframes horizonMove{
  from{
    background-position:0 0;
  }
  to{
    background-position:300% 0;
  }
}

/* =========================================================
   NEON ORBS
========================================================= */

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(1px);
  mix-blend-mode:screen;
}

.orb1{
  width:420px;
  height:420px;
  left:-140px;
  top:5%;

  background:
    radial-gradient(
      circle,
      #00eaff70 0%,
      #00eaff25 30%,
      #00eaff08 55%,
      transparent 72%
    );

  animation:orbFloat1 9s ease-in-out infinite alternate;
}

.orb2{
  width:520px;
  height:520px;
  right:-190px;
  top:-80px;

  background:
    radial-gradient(
      circle,
      #8b5cff70 0%,
      #7c3cff22 35%,
      #7c3cff08 55%,
      transparent 72%
    );

  animation:orbFloat2 12s ease-in-out infinite alternate;
}

.orb3{
  width:420px;
  height:420px;
  left:35%;
  bottom:-260px;

  background:
    radial-gradient(
      circle,
      #006eff65 0%,
      #006eff18 40%,
      transparent 72%
    );

  animation:orbFloat3 10s ease-in-out infinite alternate;
}

@keyframes orbFloat1{
  from{
    transform:translate3d(0,0,80px) scale(1);
  }
  to{
    transform:translate3d(170px,90px,220px) scale(1.35);
  }
}

@keyframes orbFloat2{
  from{
    transform:translate3d(0,0,100px) scale(1);
  }
  to{
    transform:translate3d(-150px,120px,250px) scale(1.3);
  }
}

@keyframes orbFloat3{
  from{
    transform:translate3d(0,0,0) scale(1);
  }
  to{
    transform:translate3d(100px,-120px,160px) scale(1.25);
  }
}

/* =========================================================
   NEON RINGS
========================================================= */

.ring{
  position:absolute;
  border-radius:50%;
  border:1px solid #00eaff45;

  box-shadow:
    0 0 15px #00eaff22,
    inset 0 0 15px #00eaff12;

  transform-style:preserve-3d;
}

.ring1{
  width:420px;
  height:420px;
  left:-160px;
  top:28%;

  transform:
    rotateX(65deg)
    rotateZ(20deg);

  animation:ringSpin1 16s linear infinite;
}

.ring2{
  width:300px;
  height:300px;
  right:-80px;
  bottom:5%;

  border-color:#8b5cff45;

  transform:
    rotateX(68deg)
    rotateZ(-20deg);

  animation:ringSpin2 13s linear infinite reverse;
}

.ring3{
  width:180px;
  height:180px;
  left:50%;
  top:25%;
  margin-left:-90px;

  border-color:#ffe60035;

  transform:
    rotateX(70deg);

  animation:ringPulse 4s ease-in-out infinite;
}

@keyframes ringSpin1{
  to{
    transform:
      rotateX(65deg)
      rotateZ(380deg);
  }
}

@keyframes ringSpin2{
  to{
    transform:
      rotateX(68deg)
      rotateZ(-380deg);
  }
}

@keyframes ringPulse{
  0%,100%{
    transform:
      rotateX(70deg)
      scale(.85);
    opacity:.3;
  }

  50%{
    transform:
      rotateX(70deg)
      scale(1.2);
    opacity:.8;
  }
}

/* =========================================================
   PARTICLES
========================================================= */

.particles{
  position:absolute;
  inset:0;
}

.particles span{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:
    0 0 6px #00eaff,
    0 0 15px #00eaff,
    0 0 30px #00eaff;

  animation:
    particleUp linear infinite,
    particlePulse 2s ease-in-out infinite alternate;
}

/* positions */

.particles span:nth-child(1){left:4%;top:75%;animation-duration:7s;}
.particles span:nth-child(2){left:9%;top:35%;animation-duration:11s;}
.particles span:nth-child(3){left:15%;top:85%;animation-duration:9s;}
.particles span:nth-child(4){left:22%;top:55%;animation-duration:13s;}
.particles span:nth-child(5){left:28%;top:20%;animation-duration:8s;}
.particles span:nth-child(6){left:34%;top:75%;animation-duration:12s;}
.particles span:nth-child(7){left:41%;top:45%;animation-duration:10s;}
.particles span:nth-child(8){left:47%;top:15%;animation-duration:14s;}
.particles span:nth-child(9){left:53%;top:70%;animation-duration:9s;}
.particles span:nth-child(10){left:59%;top:30%;animation-duration:12s;}
.particles span:nth-child(11){left:65%;top:85%;animation-duration:8s;}
.particles span:nth-child(12){left:71%;top:50%;animation-duration:15s;}
.particles span:nth-child(13){left:77%;top:18%;animation-duration:10s;}
.particles span:nth-child(14){left:83%;top:72%;animation-duration:13s;}
.particles span:nth-child(15){left:89%;top:38%;animation-duration:9s;}
.particles span:nth-child(16){left:95%;top:80%;animation-duration:14s;}
.particles span:nth-child(17){left:18%;top:8%;animation-duration:11s;}
.particles span:nth-child(18){left:37%;top:10%;animation-duration:8s;}
.particles span:nth-child(19){left:68%;top:10%;animation-duration:12s;}
.particles span:nth-child(20){left:92%;top:15%;animation-duration:10s;}

@keyframes particleUp{
  0%{
    transform:
      translate3d(0,100px,0)
      scale(.2);
    opacity:0;
  }

  15%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:
      translate3d(80px,-250px,250px)
      scale(1.8);
    opacity:0;
  }
}

@keyframes particlePulse{
  from{
    filter:brightness(.7);
  }
  to{
    filter:brightness(1.8);
  }
}

/* =========================================================
   ENERGY BEAMS
========================================================= */

.beam{
  position:absolute;

  width:1px;
  height:120%;

  top:-10%;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #00eaff,
      transparent
    );

  box-shadow:
    0 0 12px #00eaff,
    0 0 30px #00eaff;

  opacity:.18;

  transform:rotate(18deg);

  animation:beamMove 7s linear infinite;
}

.beam:nth-child(1){
  left:15%;
  animation-delay:0s;
}

.beam:nth-child(2){
  left:45%;
  animation-delay:2s;
}

.beam:nth-child(3){
  left:75%;
  animation-delay:4s;
}

@keyframes beamMove{
  0%{
    transform:
      translateX(-500px)
      rotate(18deg);
  }

  100%{
    transform:
      translateX(500px)
      rotate(18deg);
  }
}

/* =========================================================
   TOP BAR
========================================================= */

#bar{
  position:relative;
  z-index:9999;

  min-height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  padding:12px 18px;

  background:
    linear-gradient(
      135deg,
      rgba(3,20,43,.96),
      rgba(2,8,23,.88)
    );

  border-bottom:1px solid #00eaff55;

  box-shadow:
    0 10px 40px #000c,
    0 0 25px #00eaff0d,
    inset 0 -1px #00eaff18;

  backdrop-filter:blur(22px);
}

#bar:before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      #7c3cff,
      transparent
    );

  box-shadow:
    0 0 12px #00eaff;

  animation:topEnergy 3s linear infinite;
}

#bar:after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:-2px;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      #7c3cff,
      #ffe600,
      #00eaff,
      transparent
    );

  background-size:250% 100%;

  box-shadow:
    0 0 12px #00eaff,
    0 0 25px #7c3cff;

  animation:energyLine 4s linear infinite;
}

@keyframes topEnergy{
  0%{
    background-position:-200% 0;
  }
  100%{
    background-position:200% 0;
  }
}

@keyframes energyLine{
  from{
    background-position:0 0;
  }
  to{
    background-position:250% 0;
  }
}

/* =========================================================
   BRAND
========================================================= */

.teacher-title{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.logo3d{
  width:46px;
  height:46px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #075eff,
      #00eaff
    );

  border:1px solid #ffffff25;

  box-shadow:
    0 0 15px #00eaff66,
    0 0 35px #00eaff22,
    0 12px 30px #000b;

  font-size:23px;

  transform-style:preserve-3d;

  animation:logo3d 4s ease-in-out infinite;
}

.logo3d:after{
  content:"";

  position:absolute;

  width:60px;
  height:60px;

  border-radius:50%;

  border:1px solid #00eaff35;

  box-shadow:
    0 0 15px #00eaff25;

  animation:logoRing 4s linear infinite;
}

@keyframes logo3d{
  0%,100%{
    transform:
      perspective(500px)
      rotateY(-15deg)
      rotateX(8deg)
      translateY(0)
      translateZ(0);
  }

  50%{
    transform:
      perspective(500px)
      rotateY(15deg)
      rotateX(-8deg)
      translateY(-5px)
      translateZ(15px);
  }
}

@keyframes logoRing{
  to{
    transform:rotateZ(360deg);
  }
}

.title-text{
  min-width:0;
}

.title-text strong{
  display:block;

  font-size:16px;
  font-weight:1000;

  text-shadow:
    0 0 8px #00eaff66,
    0 0 20px #00eaff22;
}

.title-text span{
  display:block;

  margin-top:3px;

  font-size:11px;

  color:#83c8d8;

  letter-spacing:.3px;
}

/* =========================================================
   BUTTON
========================================================= */

.back{
  position:relative;
  overflow:hidden;

  border:1px solid #00eaff66;

  border-radius:14px;

  padding:11px 17px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #075eff,
      #00c8e8
    );

  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 8px 25px #0008,
    0 0 18px #00eaff25;

  transition:
    transform .25s,
    box-shadow .25s;
}

.back:before{
  content:"";

  position:absolute;

  top:-100%;
  left:-40%;

  width:25%;
  height:300%;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff9,
      transparent
    );

  transform:rotate(25deg);

  animation:buttonShine 3.5s infinite;
}

@keyframes buttonShine{
  0%{
    left:-40%;
  }

  45%,100%{
    left:140%;
  }
}

.back:hover{
  transform:
    translateY(-3px)
    scale(1.04);

  box-shadow:
    0 14px 40px #000c,
    0 0 25px #00eaff66,
    0 0 50px #00eaff22;
}

.back:active{
  transform:scale(.96);
}

/* =========================================================
   FRAME
========================================================= */

#frameWrap{
  position:absolute;

  z-index:10;

  top:70px;
  left:0;
  right:0;
  bottom:0;

  padding:11px;

  perspective:1800px;
}

.frame-shell{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  border-radius:21px;

  border:1px solid #00eaff50;

  background:#020817;

  box-shadow:
    0 25px 90px #000d,
    0 0 35px #00eaff15,
    0 0 80px #7c3cff0b,
    inset 0 1px #ffffff15;

  transform:
    perspective(1800px)
    rotateX(0deg)
    rotateY(0deg)
    translateZ(0);

  transform-style:preserve-3d;

  transition:
    transform .15s ease-out,
    box-shadow .4s;
}

.frame-shell:hover{
  box-shadow:
    0 35px 110px #000e,
    0 0 50px #00eaff25,
    0 0 100px #7c3cff12,
    inset 0 1px #ffffff20;
}

/* animated frame border */

.frame-shell:before{
  content:"";

  position:absolute;

  z-index:20;

  inset:0;

  pointer-events:none;

  border-radius:21px;

  padding:1px;

  background:
    linear-gradient(
      120deg,
      #00eaff55,
      transparent 25%,
      #7c3cff45 50%,
      transparent 75%,
      #00eaff55
    );

  background-size:300% 300%;

  animation:borderFlow 7s linear infinite;

  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  mask-composite:exclude;
}

@keyframes borderFlow{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}

/* inner glow */

.frame-shell:after{
  content:"";

  position:absolute;

  z-index:20;

  pointer-events:none;

  inset:0;

  border-radius:21px;

  box-shadow:
    inset 0 0 70px #00eaff08,
    inset 0 0 25px #7c3cff08;

  animation:framePulse 4s ease-in-out infinite;
}

@keyframes framePulse{
  0%,100%{
    opacity:.6;
  }

  50%{
    opacity:1;
  }
}

/* =========================================================
   HUD CORNERS
========================================================= */

.corner{
  position:absolute;

  z-index:40;

  width:42px;
  height:42px;

  pointer-events:none;
}

.corner:before,
.corner:after{
  content:"";

  position:absolute;

  background:#00eaff;

  box-shadow:
    0 0 8px #00eaff,
    0 0 18px #00eaff;
}

.corner:before{
  width:42px;
  height:2px;
}

.corner:after{
  width:2px;
  height:42px;
}

.tl{
  left:10px;
  top:10px;
}

.tr{
  right:10px;
  top:10px;
}

.bl{
  left:10px;
  bottom:10px;
}

.br{
  right:10px;
  bottom:10px;
}

.tr:before,
.br:before{
  right:0;
}

.tr:after,
.br:after{
  right:0;
}

.bl:before,
.br:before{
  bottom:0;
}

.bl:after,
.br:after{
  bottom:0;
}

/* =========================================================
   SCANLINE
========================================================= */

.scanline{
  position:absolute;

  z-index:25;

  left:0;
  right:0;

  height:2px;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff55,
      transparent
    );

  box-shadow:
    0 0 15px #00eaff;

  opacity:.35;

  animation:scan 5s linear infinite;
}

@keyframes scan{
  0%{
    top:-5%;
  }

  100%{
    top:105%;
  }
}

/* =========================================================
   IFRAME
========================================================= */

iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#020817;

  position:relative;

  z-index:5;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
  position:absolute;

  z-index:100;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      #062d4c,
      #020817 55%,
      #01030b 100%
    );

  transition:
    opacity .7s,
    visibility .7s;
}

.loader-box{
  text-align:center;

  padding:30px;
}

.loader-orbit{
  position:relative;

  width:95px;
  height:95px;

  margin:0 auto 22px;
}

.loader-orbit:before,
.loader-orbit:after{
  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:2px solid transparent;

  border-top-color:#00eaff;
  border-right-color:#7c3cff;

  box-shadow:
    0 0 15px #00eaff55;

  animation:spin 1s linear infinite;
}

.loader-orbit:after{
  inset:12px;

  border-top-color:#ffe600;
  border-right-color:#00eaff;

  box-shadow:
    0 0 15px #ffe60055;

  animation:
    spinReverse 1.4s linear infinite;
}

.loader-orbit{
  box-shadow:
    0 0 25px #00eaff20,
    0 0 60px #7c3cff10;

  border-radius:50%;

  animation:loaderPulse 2s ease-in-out infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes spinReverse{
  to{
    transform:rotate(-360deg);
  }
}

@keyframes loaderPulse{
  0%,100%{
    transform:scale(.95);
  }

  50%{
    transform:scale(1.08);
  }
}

.loader-box strong{
  display:block;

  font-size:19px;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff55;
}

.loader-box span{
  display:block;

  margin-top:7px;

  color:#83c8d8;

  font-size:12px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  #bar{
    min-height:64px;
    padding:9px 10px;
  }

  .logo3d{
    width:39px;
    height:39px;
    font-size:19px;
  }

  .title-text strong{
    font-size:13px;
  }

  .title-text span{
    font-size:9px;
  }

  .back{
    padding:9px 11px;
    font-size:11px;
  }

  #frameWrap{
    top:64px;
    padding:5px;
  }

  .frame-shell{
    border-radius:15px;
  }

  .ring1{
    left:-230px;
  }

  .ring2{
    right:-180px;
  }
}

@media(max-width:450px){

  .title-text span{
    display:none;
  }

  .title-text strong{
    font-size:12px;
  }

  .back{
    font-size:10px;
    padding:8px 9px;
  }

  .particles span:nth-child(n+12){
    display:none;
  }

  .beam{
    opacity:.08;
  }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<!-- ========================================================
     3D WORLD
======================================================== -->

<div id="visual3d">

  <div class="atmosphere"></div>

  <div class="grid-floor"></div>

  <div class="horizon"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>

  <div class="beam"></div>
  <div class="beam"></div>

     TEACHER BAR

<div id="bar">

  <div class="teacher-title">

    <div class="logo3d">
      👩‍🏫
    </div>

    <div class="title-text">

      <strong>
        მასწავლებლის რეჟიმი — მე-4 კლასი

<!-- ========================================================
     MAIN FRAME
======================================================== -->

<div id="frameWrap">

  <div class="frame-shell">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="scanline"></div>

    <div id="loading">

      <div class="loader-box">

        <div class="loader-orbit"></div>

        <strong>
          მე-4 კლასის ჩატვირთვა...
        </strong>

        <span>
          ⚡ English with Mariami • 3D System
        </span>

      </div>

    </div>

    <iframe
      id="gradeFrame"
      src="grade4.html?teacher_view=1"
      allow="autoplay; fullscreen">
    </iframe>

  </div>

</div>


<script>

/* =========================================================
   TEACHER MODE + 3D VISUAL ENGINE
========================================================= */

(function(){

  const frame =
    document.getElementById("gradeFrame");

  const loading =
    document.getElementById("loading");

  const shell =
    document.querySelector(".frame-shell");

  const visual =
    document.getElementById("visual3d");


  /* =======================================================
     HIDE STUDENT NAVIGATION
  ======================================================= */

  function hideStudentNavigation(){

    try{

      const doc =
        frame.contentDocument ||
        frame.contentWindow.document;

      if(!doc) return;


      doc
      .querySelectorAll(
        "a,button,[role='button']"
      )
      .forEach(function(el){

        const href =
          (
            el.getAttribute("href") ||
            ""
          ).toLowerCase();

        const text =
          (
            el.textContent ||
            ""
          )
          .replace(/\s+/g," ")
          .trim()
          .toLowerCase();


        const hide =
          href.includes("academy") ||
          href.includes("index.html") ||
          href.includes("teacher-dashboard") ||
          text === "academy" ||
          text.includes("აკადემია") ||
          text === "მთავარი" ||
          text.includes("მთავარი გვერდი");


        if(hide){
          el.style.display="none";
        }

      });


      doc
      .querySelectorAll(
        "header.top nav .links"
      )
      .forEach(function(el){

        el.style.display="none";

      });


      if(doc.body){

        doc.body.classList.add(
          "teacher-view-active"
        );

      }

    }catch(e){

      /* cross-origin protection */

    }

  }


  /* =======================================================
     FRAME LOADED
  ======================================================= */

  frame.addEventListener(
    "load",
    function(){

      setTimeout(function(){

        loading.style.opacity="0";
        loading.style.visibility="hidden";

      },500);


      hideStudentNavigation();

      setTimeout(hideStudentNavigation,300);
      setTimeout(hideStudentNavigation,800);
      setTimeout(hideStudentNavigation,1500);
      setTimeout(hideStudentNavigation,2500);

    }
  );


  setInterval(
    hideStudentNavigation,
    1000
  );


  /* =======================================================
     3D MOUSE TILT
  ======================================================= */

  let raf = null;

  document.addEventListener(
    "mousemove",
    function(e){

      if(window.innerWidth < 800)
        return;

      if(raf)
        cancelAnimationFrame(raf);


      raf =
        requestAnimationFrame(function(){

          const x =
            e.clientX /
            window.innerWidth -
            .5;

          const y =
            e.clientY /
            window.innerHeight -
            .5;


          const rotateY =
            x * 2.2;

          const rotateX =
            y * -1.8;


          shell.style.transform =
            `
            perspective(1800px)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            translateZ(0)
            `;


          /* deep parallax */

          visual.style.transform =
            `
            translate3d(
              ${x * -18}px,
              ${y * -18}px,
              0
            )
            `;

        });

    }
  );


  /* =======================================================
     RESET 3D
  ======================================================= */

  document.addEventListener(
    "mouseleave",
    function(){

      shell.style.transform =
        `
        perspective(1800px)
        rotateX(0deg)
        rotateY(0deg)
        translateZ(0)
        `;

      visual.style.transform =
        "translate3d(0,0,0)";

    }
  );


  /* =======================================================
     TOUCH PARALLAX
  ======================================================= */

  document.addEventListener(
    "touchmove",
    function(e){

      if(!e.touches || !e.touches[0])
        return;

      const touch =
        e.touches[0];

      const x =
        touch.clientX /
        window.innerWidth -
        .5;

      const y =
        touch.clientY /
        window.innerHeight -
        .5;


      visual.style.transform =
        `
        translate3d(
          ${x * -10}px,
          ${y * -10}px,
          0
        )
        `;

    },
    {passive:true}
  );


  /* =======================================================
     FULLSCREEN
     F KEY
  ======================================================= */

  document.addEventListener(
    "keydown",
    function(e){

      if(
        e.key.toLowerCase()==="f" &&
        !e.ctrlKey &&
        !e.altKey &&
        !e.shiftKey
      ){

        toggleFullscreen();

      }

    }
  );


  function toggleFullscreen(){

    if(!document.fullscreenElement){

      document
        .documentElement
        .requestFullscreen?.();

    }else{

      document
        .exitFullscreen?.();

    }

  }


  /* =======================================================
     DOUBLE CLICK = FULLSCREEN
  ======================================================= */

  shell.addEventListener(
    "dblclick",
    function(){

      toggleFullscreen();

    }
  );


  /* =======================================================
     VISIBILITY PERFORMANCE
  ======================================================= */

  document.addEventListener(
    "visibilitychange",
    function(){

      if(document.hidden){

        visual.style.animationPlayState =
          "paused";

      }else{

        visual.style.animationPlayState =
          "running";

      }

    }
  );

})();

</script>

</body>
</html>
