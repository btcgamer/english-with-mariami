<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>გამოსვლა | English with Mariami</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f8ff;color:#26243a;display:flex;align-items:center;justify-content:center;min-height:100vh}.box{text-align:center;background:#fff;padding:40px;border-radius:24px;box-shadow:0 10px 30px #0001}button{border:0;background:#6c5ce7;color:#fff;padding:14px 24px;border-radius:14px;font-weight:900;cursor:pointer}</style></head><body><div class="box"><h1>🚪 გამოსვლა</h1><p id="msg">გთხოვთ დაელოდოთ...</p><button onclick="location.href='index.html'">მთავარ გვერდზე დაბრუნება</button></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const {createClient}=supabase;const client=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function logout(){const {error}=await client.auth.signOut({scope:'local'});document.getElementById('msg').textContent=error?'გამოსვლისას შეცდომა მოხდა.':'თქვენ წარმატებით გამოხვედით ანგარიშიდან.'}logout();</script></body></html>
