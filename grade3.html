<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English with Mariami — Grade 3</title>

<style>
:root{
  --bg:#02040b;
  --panel:rgba(7,13,28,.82);
  --cyan:#00f6ff;
  --blue:#287bff;
  --purple:#9b4dff;
  --pink:#ff2bd6;
  --green:#00ff9d;
  --yellow:#ffe600;
  --red:#ff3864;
  --text:#f4fbff;
  --muted:#8ca4bb;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,246,255,.14),transparent 28%),
    radial-gradient(circle at 85% 15%,rgba(155,77,255,.15),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(255,43,214,.08),transparent 35%),
    #02040b;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.2;
  background:
    linear-gradient(rgba(0,246,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,246,255,.06) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

.orb{
  position:fixed;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
  z-index:-1;
  animation:float 8s ease-in-out infinite alternate;
}

.orb.a{
  left:-130px;
  top:180px;
  background:rgba(0,246,255,.12);
}

.orb.b{
  right:-130px;
  top:430px;
  background:rgba(155,77,255,.13);
  animation-delay:2s;
}

@keyframes float{
  to{transform:translate(40px,-30px) scale(1.1)}
}

.wrap{
  width:min(1400px,calc(100% - 26px));
  margin:auto;
}

.top{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(2,4,11,.82);
  border-bottom:1px solid rgba(0,246,255,.2);
  backdrop-filter:blur(22px);
}

.nav{
  min-height:72px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:1000;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:linear-gradient(135deg,#00f6ff,#287bff,#9b4dff);
  box-shadow:
    0 0 20px rgba(0,246,255,.35),
    inset 0 0 20px rgba(255,255,255,.12);
}

.brand small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1.5px;
}

.actions{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid rgba(255,255,255,.13);
  color:white;
  background:rgba(255,255,255,.06);
  border-radius:12px;
  padding:11px 15px;
  font-weight:900;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:var(--cyan);
  box-shadow:0 0 22px rgba(0,246,255,.18);
}

.btn.home{
  background:linear-gradient(135deg,#0874ff,#00d9ff);
}

.btn.logout{
  background:linear-gradient(135deg,#a61549,#ff3864);
}

.hero{
  padding:45px 0 20px;
}

.hero-card{
  position:relative;
  overflow:hidden;
  padding:35px;
  border-radius:30px;
  border:1px solid rgba(0,246,255,.2);
  background:
    linear-gradient(135deg,
      rgba(5,25,49,.9),
      rgba(11,5,31,.82));
  box-shadow:
    0 25px 90px rgba(0,0,0,.45),
    inset 0 0 80px rgba(0,246,255,.025);
}

.hero-card:after{
  content:"GRADE 03";
  position:absolute;
  right:-30px;
  bottom:-35px;
  font-size:120px;
  font-weight:1000;
  color:rgba(0,246,255,.035);
  transform:rotate(-8deg);
}

.kicker{
  color:var(--cyan);
  font-weight:1000;
  letter-spacing:4px;
  font-size:12px;
}

h1{
  margin:12px 0;
  font-size:clamp(42px,7vw,90px);
  line-height:.92;
  letter-spacing:-4px;
}

.gradient{
  background:linear-gradient(
    90deg,
    #fff,
    var(--cyan),
    #5b8cff,
    var(--purple),
    var(--pink)
  );
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:800px;
  color:#a9bfd0;
  line-height:1.7;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
  padding:8px 12px;
  border-radius:20px;
  border:1px solid rgba(0,255,157,.2);
  background:rgba(0,255,157,.05);
  color:var(--green);
  font-size:11px;
  font-weight:900;
}

.status i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 15px var(--green);
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{opacity:.3;transform:scale(.65)}
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:20px 0;
  flex-wrap:wrap;
}

.filter{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filter button{
  border:1px solid rgba(0,246,255,.15);
  background:rgba(4,17,34,.8);
  color:#c9d9e5;
  border-radius:12px;
  padding:10px 14px;
  font-weight:900;
  cursor:pointer;
}

.filter button.active,
.filter button:hover{
  color:white;
  border-color:var(--cyan);
  box-shadow:0 0 18px rgba(0,246,255,.12);
}

.search{
  width:250px;
  max-width:100%;
  border:1px solid rgba(0,246,255,.18);
  border-radius:12px;
  padding:11px 13px;
  color:white;
  background:#041020;
  outline:none;
}

.search:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,246,255,.07);
}

.topic-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  padding-bottom:50px;
}

.topic{
  position:relative;
  min-height:190px;
  padding:22px;
  border-radius:23px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(0,246,255,.14);
  background:
    linear-gradient(145deg,
      rgba(7,27,52,.88),
      rgba(12,7,32,.85));
  transition:.25s;
  transform-style:preserve-3d;
}

.topic:hover{
  transform:
    translateY(-7px)
    perspective(700px)
    rotateX(2deg)
    rotateY(-2deg);
  border-color:rgba(0,246,255,.55);
  box-shadow:
    0 20px 55px rgba(0,0,0,.35),
    0 0 35px rgba(0,246,255,.09);
}

.topic:before{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-45px;
  top:-45px;
  border-radius:50%;
  background:rgba(0,246,255,.08);
  filter:blur(5px);
}

.icon{
  font-size:40px;
  filter:drop-shadow(0 0 10px rgba(0,246,255,.3));
}

.topic h3{
  margin:13px 0 6px;
  font-size:19px;
}

.topic p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.topic-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:17px;
}

.level{
  font-size:9px;
  font-weight:1000;
  padding:6px 8px;
  border-radius:8px;
  color:var(--cyan);
  background:rgba(0,246,255,.07);
}

.launch{
  color:var(--green);
  font-size:11px;
  font-weight:1000;
}

.modal{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(15px);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  padding:25px;
  border-radius:28px;
  border:1px solid rgba(0,246,255,.3);
  background:
    linear-gradient(145deg,#06182c,#0b0620);
  box-shadow:0 30px 120px rgba(0,0,0,.65);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.modal-head h2{
  margin:0;
  font-size:28px;
}

.lesson{
  margin-top:18px;
  padding:20px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);
}

.lesson h3{
  margin-top:0;
}

.word{
  display:inline-block;
  margin:5px;
  padding:9px 12px;
  border-radius:10px;
  background:#06213b;
  border:1px solid rgba(0,246,255,.15);
  color:#c9f9ff;
}

.phrase{
  padding:12px;
  margin:8px 0;
  border-left:3px solid var(--purple);
  background:rgba(155,77,255,.06);
  border-radius:8px;
}

.quiz-option{
  width:100%;
  text-align:left;
  margin:6px 0;
  padding:12px;
  border-radius:11px;
  border:1px solid rgba(0,246,255,.15);
  background:#06182d;
  color:white;
  cursor:pointer;
}

.quiz-option:hover{
  border-color:var(--cyan);
}

.result{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  display:none;
}

.result.ok{
  display:block;
  background:rgba(0,255,157,.08);
  border:1px solid rgba(0,255,157,.25);
  color:var(--green);
}

.result.bad{
  display:block;
  background:rgba(255,56,100,.08);
  border:1px solid rgba(255,56,100,.25);
  color:#ff8aa4;
}

@media(max-width:1000px){
  .topic-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .wrap{
    width:calc(100% - 16px);
  }

  .brand small{
    display:none;
  }

  .nav .btn{
    font-size:0;
    padding:10px;
  }

  .nav .btn.home:after{
    content:"⌂";
    font-size:20px;
  }

  .nav .btn.logout:after{
    content:"↪";
    font-size:20px;
  }

  .hero-card{
    padding:23px;
  }

  h1{
    font-size:48px;
    letter-spacing:-2px;
  }

  .topic-grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    align-items:stretch;
  }

  .search{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="orb a"></div>
<div class="orb b"></div>

<header class="top">
  <div class="wrap nav">

    <div class="brand">
      <div class="logo">🚀</div>
      <div>
        ENGLISH WITH MARIAMI
        <small>NEON LEARNING SYSTEM • GRADE 03</small>
      </div>
    </div>

    <div class="actions">
      <button class="btn home" onclick="goHome()">
        🏠 მთავარი
      </button>

      <button class="btn logout" onclick="logout()">
        🚪 გამოსვლა
      </button>
    </div>

  </div>
</header>

<main class="wrap">

<section class="hero">

  <div class="hero-card">

    <div class="kicker">
      XENON ENGLISH // LEVEL 03
    </div>

    <h1>
      <span class="gradient">GRADE 3</span><br>
      ENGLISH UNIVERSE
    </h1>

    <p>
      Welcome to Grade 3 — an interactive English learning universe.
      Explore vocabulary, grammar, reading, listening, speaking,
      writing, exercises and powerful quizzes.
    </p>

    <div class="status">
      <i></i>
      LEARNING SYSTEM ONLINE
    </div>

  </div>

</section>

<div class="toolbar">

  <div class="filter">
    <button class="active" data-filter="all">ALL</button>
    <button data-filter="vocabulary">VOCABULARY</button>
    <button data-filter="grammar">GRAMMAR</button>
    <button data-filter="reading">READING</button>
    <button data-filter="speaking">SPEAKING</button>
    <button data-filter="listening">LISTENING</button>
    <button data-filter="quiz">QUIZ</button>
  </div>

  <input
    id="search"
    class="search"
    placeholder="🔎 Search topic..."
  >

</div>

<section id="topics" class="topic-grid"></section>

</main>

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle"></h2>

      <button class="btn" onclick="closeTopic()">
        ✕
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>

<script>

const TOPICS = [

{
 title:"Everyday Vocabulary",
 icon:"🧠",
 type:"vocabulary",
 desc:"Learn useful English words for everyday life.",
 words:[
  "morning","afternoon","evening","friend",
  "family","school","home","street",
  "market","teacher","student","holiday"
 ]
},

{
 title:"School Life",
 icon:"🏫",
 type:"vocabulary",
 desc:"Talk about school, subjects and classroom objects.",
 words:[
  "classroom","lesson","homework","book",
  "notebook","pencil","teacher","student",
  "question","answer","subject","break"
 ]
},

{
 title:"My Family",
 icon:"👨‍👩‍👧",
 type:"speaking",
 desc:"Describe your family and the people you love.",
 words:[
  "mother","father","brother","sister",
  "grandmother","grandfather","parents",
  "family","child","baby"
 ],
 phrases:[
  "This is my family.",
  "I have one brother.",
  "My mother is very kind.",
  "I love my family."
 ]
},

{
 title:"Daily Routine",
 icon:"⏰",
 type:"grammar",
 desc:"Use the Present Simple to talk about your daily life.",
 words:[
  "wake up","get dressed","have breakfast",
  "go to school","study","play",
  "have dinner","go to bed"
 ],
 phrases:[
  "I wake up at seven.",
  "I go to school every day.",
  "I play football after school.",
  "I go to bed at ten."
 ]
},

{
 title:"Present Simple",
 icon:"⚙️",
 type:"grammar",
 desc:"Learn positive and negative Present Simple sentences.",
 phrases:[
  "I play football.",
  "She plays tennis.",
  "We study English.",
  "He doesn't like milk.",
  "They don't live here."
 ]
},

{
 title:"Present Continuous",
 icon:"🔵",
 type:"grammar",
 desc:"Talk about actions happening right now.",
 phrases:[
  "I am reading.",
  "She is listening.",
  "They are playing.",
  "He is writing.",
  "We are learning English."
 ]
},

{
 title:"Food & Drinks",
 icon:"🍕",
 type:"vocabulary",
 desc:"Food, drinks and talking about what you like.",
 words:[
  "apple","banana","bread","cheese",
  "chicken","rice","pizza","milk",
  "water","juice","breakfast","lunch","dinner"
 ],
 phrases:[
  "I like pizza.",
  "I don't like onions.",
  "Can I have some water?"
 ]
},

{
 title:"Shopping",
 icon:"🛍️",
 type:"speaking",
 desc:"Useful English for shops and buying things.",
 words:[
  "price","cheap","expensive","shop",
  "money","bag","shirt","shoes",
  "size","color"
 ],
 phrases:[
  "How much is it?",
  "I would like this one.",
  "Do you have a bigger size?",
  "Can I pay by card?"
 ]
},

{
 title:"My Town",
 icon:"🏙️",
 type:"vocabulary",
 desc:"Places around town and simple directions.",
 words:[
  "school","park","hospital","bank",
  "shop","restaurant","station","library",
  "cinema","street"
 ],
 phrases:[
  "Where is the library?",
  "Go straight.",
  "Turn left.",
  "Turn right."
 ]
},

{
 title:"Travel & Transport",
 icon:"✈️",
 type:"speaking",
 desc:"Talk about travelling and transportation.",
 words:[
  "airport","plane","train","bus",
  "car","ticket","hotel","station",
  "passport","luggage"
 ],
 phrases:[
  "Where is the airport?",
  "I have a ticket.",
  "Where is my hotel?",
  "I am travelling by plane."
 ]
},

{
 title:"Reading Lab",
 icon:"📖",
 type:"reading",
 desc:"Improve reading and understanding short English texts.",
 reading:`
 Tom gets up at seven o'clock every morning.
 He has breakfast with his family and goes to school.
 His favorite subject is English.
 After school, Tom plays football with his friends.
 In the evening, he does his homework and reads a book.
 `,
 question:"What is Tom's favorite subject?",
 answers:[
  "Math",
  "English",
  "Science",
  "History"
 ],
 correct:1
},

{
 title:"Listening Lab",
 icon:"🎧",
 type:"listening",
 desc:"Listen, repeat and understand simple English sentences.",
 phrases:[
  "Good morning!",
  "How are you today?",
  "I am going to school.",
  "What are you doing?",
  "I am reading a book."
 ]
},

{
 title:"Speaking Lab",
 icon:"🗣️",
 type:"speaking",
 desc:"Build confidence with real-life English conversations.",
 phrases:[
  "Hello! My name is Alex.",
  "Nice to meet you.",
  "Where are you from?",
  "I am from Georgia.",
  "What is your favorite subject?",
  "My favorite subject is English."
 ]
},

{
 title:"Weather & Seasons",
 icon:"🌦️",
 type:"vocabulary",
 desc:"Talk about weather and the four seasons.",
 words:[
  "sunny","rainy","cloudy","windy",
  "snowy","hot","cold","warm",
  "spring","summer","autumn","winter"
 ]
},

{
 title:"Animals",
 icon:"🐾",
 type:"vocabulary",
 desc:"Learn animals and describe them.",
 words:[
  "lion","tiger","elephant","monkey",
  "giraffe","dog","cat","horse",
  "rabbit","bird"
 ],
 phrases:[
  "A lion is strong.",
  "A giraffe is tall.",
  "A rabbit is small."
 ]
},

{
 title:"Technology",
 icon:"💻",
 type:"vocabulary",
 desc:"Modern English words for technology.",
 words:[
  "computer","phone","screen","keyboard",
  "internet","website","game","video",
  "camera","message"
 ]
},

{
 title:"Big Challenge Quiz",
 icon:"🏆",
 type:"quiz",
 desc:"Test your Grade 3 English knowledge.",
 question:"Choose the correct sentence.",
 answers:[
  "She play tennis.",
  "She plays tennis.",
  "She playing tennis.",
  "She is play tennis."
 ],
 correct:1
}

];

const topicsEl=document.getElementById("topics");
const searchEl=document.getElementById("search");

function renderTopics(){

  const filter=
    document.querySelector(".filter button.active")
    ?.dataset.filter || "all";

  const query=
    searchEl.value.trim().toLowerCase();

  const list=TOPICS.filter(t=>{

    const matchesFilter=
      filter==="all" || t.type===filter;

    const matchesSearch=
      !query ||
      t.title.toLowerCase().includes(query) ||
      t.desc.toLowerCase().includes(query);

    return matchesFilter && matchesSearch;
  });

  if(!list.length){

    topicsEl.innerHTML=`
      <div style="
        grid-column:1/-1;
        padding:40px;
        text-align:center;
        color:#8ca4bb;
        border:1px dashed rgba(0,246,255,.2);
        border-radius:20px;
      ">
        🔎 Topic not found
      </div>
    `;

    return;
  }

  topicsEl.innerHTML=list.map((t,i)=>`

    <article
      class="topic"
      onclick="openTopic(${TOPICS.indexOf(t)})"
    >

      <div class="icon">${t.icon}</div>

      <h3>${escapeHtml(t.title)}</h3>

      <p>${escapeHtml(t.desc)}</p>

      <div class="topic-footer">

        <span class="level">
          GRADE 3
        </span>

        <span class="launch">
          OPEN →
        </span>

      </div>

    </article>

  `).join("");
}

function openTopic(index){

  const t=TOPICS[index];

  if(!t)return;

  document.getElementById("modalTitle").textContent=
    `${t.icon} ${t.title}`;

  let html="";

  if(t.words){

    html+=`
      <div class="lesson">
        <h3>📚 Vocabulary</h3>

        ${t.words.map(w=>`
          <span class="word">${escapeHtml(w)}</span>
        `).join("")}
      </div>
    `;
  }

  if(t.phrases){

    html+=`
      <div class="lesson">
        <h3>🗣️ English Phrases</h3>

        ${t.phrases.map(p=>`
          <div class="phrase">
            ${escapeHtml(p)}
            <button
              class="btn"
              style="float:right;padding:5px 8px"
              onclick='speakText(${JSON.stringify(p)})'>
              🔊
            </button>
          </div>
        `).join("")}
      </div>
    `;
  }

  if(t.reading){

    html+=`
      <div class="lesson">

        <h3>📖 Reading</h3>

        <p style="line-height:1.8;color:#c4d7e3">
          ${escapeHtml(t.reading)}
        </p>

      </div>
    `;
  }

  if(t.question){

    html+=`
      <div class="lesson">

        <h3>🎯 Challenge</h3>

        <p>
          <b>${escapeHtml(t.question)}</b>
        </p>

        ${t.answers.map((a,i)=>`
          <button
            class="quiz-option"
            onclick="checkAnswer(${index},${i},this)">
            ${escapeHtml(a)}
          </button>
        `).join("")}

        <div id="quizResult" class="result"></div>

      </div>
    `;
  }

  if(t.type==="listening"){

    html+=`
      <div class="lesson">

        <h3>🎧 Listening Mode</h3>

        <p class="muted">
          დააჭირე 🔊 ღილაკს და მოუსმინე წინადადებას.
        </p>

      </div>
    `;
  }

  if(!html){

    html=`
      <div class="lesson">
        <h3>🚀 Coming Soon</h3>
        <p class="muted">
          This lesson is ready for expansion.
        </p>
      </div>
    `;
  }

  document.getElementById("modalContent").innerHTML=html;

  document.getElementById("modal").classList.add("open");
}

function checkAnswer(topicIndex,answerIndex,button){

  const t=TOPICS[topicIndex];
  const result=document.getElementById("quizResult");

  if(answerIndex===t.correct){

    result.className="result ok";
    result.textContent="✅ Correct! Excellent work!";

    button.style.borderColor="var(--green)";

  }else{

    result.className="result bad";
    result.textContent="❌ Not quite. Try again.";

    button.style.borderColor="var(--red)";
  }
}

function speakText(text){

  if(!("speechSynthesis" in window)){

    alert("ამ ბრაუზერს ხმის ფუნქცია არ აქვს.");

    return;
  }

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);

  u.lang="en-US";
  u.rate=.82;
  u.pitch=1;

  speechSynthesis.speak(u);
}

function closeTopic(){

  document.getElementById("modal")
    .classList.remove("open");

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }
}

document
  .getElementById("modal")
  .addEventListener("click",e=>{

    if(e.target===e.currentTarget){
      closeTopic();
    }

  });

document
  .querySelectorAll(".filter button")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      document
        .querySelectorAll(".filter button")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      renderTopics();

    });

  });

searchEl.addEventListener("input",renderTopics);

document.addEventListener("keydown",e=>{

  if(e.key==="Escape"){
    closeTopic();
  }

});

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function goHome(){

  /*
    თუ შენი მთავარი გვერდის სახელი სხვაა,
    მხოლოდ ეს მისამართი შეცვალე.
  */

  window.location.href="index.html";
}

async function logout(){

  try{

    if(window.supabaseClient?.auth){

      await window.supabaseClient.auth.signOut();
    }

  }catch(e){

    console.warn(e);

  }

  window.location.href="login.html";
}

renderTopics();

</script>
