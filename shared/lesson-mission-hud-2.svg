<rect x="8" y="8" width="1184" height="164" rx="28" fill="#071026" fill-opacity=".9" stroke="url(#g)" stroke-width="2"/>
<rect x="18" y="18" width="1164" height="144" rx="22" fill="url(#grid)"/>
