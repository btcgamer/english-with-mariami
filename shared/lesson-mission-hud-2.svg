<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="Magic Neon Lesson Mission HUD 2.0">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#63f7ff"/><stop offset=".48" stop-color="#8d6bff"/><stop offset="1" stop-color="#ff67df"/></linearGradient>
 <linearGradient id="e" x1="0" x2="1"><stop stop-color="#62f7ff"/><stop offset="1" stop-color="#7568ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
