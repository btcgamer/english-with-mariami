name: Clean up grade access integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize access loader tags
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove the duplicate direct loader from Grade 2.
          p = Path('grade2.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('\n<script src="grade-access.js"></script>\n', '\n')
          p.write_text(text, encoding='utf-8')

          # Replace the literal two-character backslash-n accidentally introduced
          # by the first one-time patch workflow.
          for name in ('grade3.html', 'grade4.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = text.replace('></script>\\n</head>', '></script>\n</head>')
              p.write_text(text, encoding='utf-8')
          PY

          grep -q 'src="config.js"' grade2.html
          grep -q 'src="config.js"' grade3.html
          grep -q 'src="config.js"' grade4.html

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade2.html grade3.html grade4.html
          git rm .github/workflows/cleanup-grade-access.yml
          git commit -m "Normalize automatic grade access integration [skip ci]"
          git push
