name: Protect lesson pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add auth guard to protected HTML pages
        shell: bash
        run: |
          set -e
          for f in *.html; do
            case "$f" in
              index.html|login.html|register.html|404.html) continue ;;
            esac
            if ! grep -q 'src="protect.js"' "$f"; then
              sed -i 's#</head>#<script src="protect.js"></script></head>#' "$f"
            fi
          done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No protection changes needed"
            exit 0
          fi
          git commit -m "Protect lesson pages with Supabase auth"
          git push
