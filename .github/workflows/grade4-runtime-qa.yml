name: Grade 4 Runtime QA

on:
  push:
    paths:
      - 'grade4/**'
      - '.github/workflows/grade4-runtime-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Grade 4 files
        shell: bash
        run: |
          set -euo pipefail
          test -f grade4/index.html
          test -f grade4/grade4-core.js
          test -f grade4/grade4-qa-hardening.js
          test -f grade4/INTERACTION-AUDIT.js
          test -f grade4/grade4-runtime-qa.js
          test -f grade4/grade4-runtime-qa-browser.spec.js

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check grade4/grade4-core.js
          node --check grade4/grade4-qa-hardening.js
          node --check grade4/INTERACTION-AUDIT.js
          node --check grade4/grade4-runtime-qa.js
          node --check grade4/grade4-runtime-qa-browser.spec.js

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Grade 4 static server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --directory . >/tmp/grade4-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/grade4/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/grade4-server.log
          exit 1

      - name: Run Grade 4 60-mission browser QA
        env:
          GRADE4_BASE_URL: http://127.0.0.1:4173/grade4/
        run: npx playwright test grade4/grade4-runtime-qa-browser.spec.js --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grade4-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
