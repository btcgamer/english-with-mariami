name: Validate Learning Universe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate shared and Grade 4 assets
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f config.js
          test -f universe-theme.css
          test -f universe-theme.js
          test -f universe-max.css
          test -f universe-max.js
          test -f grade4/index.html
          test -f grade4/grade4.css
          test -f grade4/grade4.js
          test -f grade4/grade4-futuristic-content.js
