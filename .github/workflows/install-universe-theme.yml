name: Install shared Learning Universe theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject shared theme into existing pages
        shell: bash
        run: |
          set -euo pipefail
          patch_page(){
            local file="$1"
            [ -f "$file" ] || return 0
            if ! grep -q 'universe-theme.css' "$file"; then
              sed -i 's#</head>#<link rel="stylesheet" href="/universe-theme.css"><script src="/universe-theme.js" defer></script>\n</head>#i' "$file"
            fi
          }
          patch_page "index.html"
          patch_page "grade3.html"
          patch_page "grade2/index.html"
          if git diff --quiet; then
            echo "Universe theme already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html grade3.html grade2/index.html
          git commit -m "Add shared futuristic learning universe theme [skip ci]"
          git push
