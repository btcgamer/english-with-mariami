name: Remove Grade 2 registration link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove registration link from grade2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('grade2.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('<a href="register.html">📝 რეგისტრაცია</a>', '')
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade2.html
          git diff --cached --quiet || git commit -m "Remove registration link from grade 2"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-grade2-registration.yml
          git commit -m "Remove temporary grade2 fix workflow"
          git push
