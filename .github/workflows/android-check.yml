name: Android App Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'manifest.webmanifest'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Prepare web bundle
        run: npm run web:prepare
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare Android API 36
        run: node scripts/prepare-android.mjs
      - name: Generate Android icons and splash
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#050814' --iconBackgroundColorDark '#03050c' --splashBackgroundColor '#050814' --splashBackgroundColorDark '#03050c'
      - name: Sync web app
        run: npx cap sync android
      - name: Validate Android release build
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace
