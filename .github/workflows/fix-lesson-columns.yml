name: Fix lesson column names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix lesson column names'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lesson.html Supabase ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lesson.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace(".eq('lesson_id',lesson.id)\n      .order('word_number')", ".eq('lesson_id',lesson.id)\n      .order('sort_order')")
          s = s.replace(".eq('lesson_id',lesson.id)\n      .order('question_number')", ".eq('lesson_id',lesson.id)\n      .order('sort_order')")
          if s == old:
              raise SystemExit('Expected column references were not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson.html
          git commit -m "Fix lesson column names"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-lesson-columns.yml
          git commit -m "Remove temporary lesson fix workflow"
          git push