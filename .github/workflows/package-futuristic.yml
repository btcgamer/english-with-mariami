name: Futuristic project package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f config.js
          test -f grade4/index.html
          test -f grade4/grade4.css
          test -f grade4/grade4.js
          test -f grade4/grade4-futuristic-content.js
      - name: Create project package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package english-with-mariami-futuristic.zip
          mkdir -p package/english-with-mariami-futuristic
          rsync -a --exclude='.git/' --exclude='package/' ./ package/english-with-mariami-futuristic/
          cd package
          zip -qr ../english-with-mariami-futuristic.zip english-with-mariami-futuristic
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: english-with-mariami-futuristic
          path: english-with-mariami-futuristic.zip
          if-no-files-found: error
          retention-days: 30
