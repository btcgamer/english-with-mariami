name: Fix auth page layout once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix login and register
        shell: python
        run: |
          from pathlib import Path
          import re
          footer_text='© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer'
          footer_css='<style id="site-copyright-style">.site-copyright{margin-top:25px;padding:15px 5px;text-align:center;border-top:1px solid rgba(0,234,255,.2);color:#9dc7d5;font-size:13px}</style>'
          for name in ('login.html','register.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'\s*<style\b[^>]*id=["\']site-copyright-style["\'][^>]*>.*?</style>\s*','\n',s,flags=re.I|re.S)
              s=re.sub(r'\s*<!--\s*SITE-COPYRIGHT-2026\s*-->\s*','\n',s,flags=re.I)
              s=re.sub(r'\s*<footer\b[^>]*class=["\'][^"\']*site-copyright[^"\']*["\'][^>]*>.*?</footer>\s*','\n',s,flags=re.I|re.S)
              s=s.replace('<style>','<style>',1)
              if 'body {' in s and 'flex-direction: column;' not in s:
                  s=s.replace('body {','body {\n      flex-direction: column;',1)
              if '</head>' in s:
                  s=s.replace('</head>',footer_css+'\n</head>',1)
              footer='\n<footer class="site-copyright">'+footer_text+'</footer>\n'
              if '</main>' in s:
                  s=s.replace('</main>',footer+'</main>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit and remove one-time fixer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-auth-layout.yml
          git add login.html register.html .github/workflows/fix-auth-layout.yml
          git commit -m 'Fix auth pages shifting left and duplicate footer'
          git push
