name: Add site copyright

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add copyright to every HTML page
        shell: python
        run: |
          from pathlib import Path

          text = "© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer"
          marker = "<!-- SITE-COPYRIGHT-2026 -->"
          footer = f'''\n<!-- SITE-COPYRIGHT-2026 -->\n<footer class="site-copyright">{text}</footer>\n'''
          css = '''\n<style id="site-copyright-style">.site-copyright{margin-top:30px;padding:18px 12px;text-align:center;color:#9dc7d5;font-size:14px;border-top:1px solid #00eaff33;background:linear-gradient(180deg,transparent,#020b19aa);letter-spacing:.2px}.site-copyright::first-letter{color:#00eaff}</style>\n'''

          for path in Path('.').glob('*.html'):
              content = path.read_text(encoding='utf-8')
              if marker in content:
                  continue
              if '</head>' in content and 'site-copyright-style' not in content:
                  content = content.replace('</head>', css + '</head>', 1)
              if '</body>' in content:
                  content = content.replace('</body>', footer + '</body>', 1)
              else:
                  content += footer
              path.write_text(content, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || git commit -m "Add 2026 site copyright to all HTML pages"
          git push
