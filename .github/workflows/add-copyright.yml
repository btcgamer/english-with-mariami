name: Add site copyright and 3D visuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add copyright and 3D visual links
        shell: python
        run: |
          from pathlib import Path

          copyright_text = "© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer"
          copyright_marker = "<!-- SITE-COPYRIGHT-2026 -->"
          visual_marker = "<!-- GRADE-3D-VISUALS-2026 -->"
          footer = f'''\n{copyright_marker}\n<footer class="site-copyright">{copyright_text}</footer>\n'''
          css = '''\n<style id="site-copyright-style">.site-copyright{margin-top:30px;padding:18px 12px;text-align:center;color:#9dc7d5;font-size:14px;border-top:1px solid #00eaff33;background:linear-gradient(180deg,transparent,#020b19aa);letter-spacing:.2px}.site-copyright::first-letter{color:#00eaff}</style>\n'''
          visuals = '''\n{visual_marker}\n<link rel="stylesheet" href="3d-visuals.css">\n<script src="3d-visuals.js" defer></script>\n'''.format(visual_marker=visual_marker)

          for path in Path('.').glob('*.html'):
              content = path.read_text(encoding='utf-8')

              if path.name in {'grade2.html','grade3.html','grade4.html'} and visual_marker not in content:
                  if '</head>' in content:
                      content = content.replace('</head>', visuals + '</head>', 1)

              if copyright_marker not in content:
                  if '</head>' in content and 'site-copyright-style' not in content:
                      content = content.replace('</head>', css + '</head>', 1)
                  if '</body>' in content:
                      content = content.replace('</body>', footer + '</body>', 1)
                  else:
                      content += footer

              path.write_text(content, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || git commit -m "Add live 3D visuals to grades 2 3 and 4"
          git push
