name: Advanced Academy Live UX Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-ux-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: |
          node --check curriculum-runtime.js
          node --check qa/advanced-academy-live-ux-audit.spec.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/advanced-academy-live-server.log 2>&1 &
      - name: Verify static server is ready
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/advanced-academy.html >/dev/null
      - name: Run live UX audit
        run: npx playwright test qa/advanced-academy-live-ux-audit.spec.js --reporter=line
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-academy-live-ux-audit-report
          path: |
            playwright-report/
            /tmp/advanced-academy-live-server.log
          if-no-files-found: ignore
