name: Grade 11 Runtime QA

on:
  push:
    branches: [main]
    paths:
      - 'advanced-academy.html'
      - 'curriculum-runtime.js'
      - 'curriculum-runtime.css'
      - 'curriculum/grade11-world*.json'
      - 'qa/grade11-runtime-integration.spec.js'
      - '.github/workflows/grade11-runtime-qa.yml'
  workflow_dispatch:

jobs:
  grade11-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        run: |
          node --check curriculum-runtime.js
          node --check qa/grade11-runtime-integration.spec.js

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          npx http-server . -p 4173 > /tmp/grade11-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/advanced-academy.html?grade=11 >/dev/null; then
              echo "Grade 11 static server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Static server failed to become ready"
          cat /tmp/grade11-server.log
          exit 1

      - name: Run Grade 11 Runtime Integration QA
        run: npx playwright test qa/grade11-runtime-integration.spec.js --reporter=line
