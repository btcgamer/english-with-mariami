name: Android Production Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Play Store version name, e.g. 1.0.1'
        required: true
        type: string
      version_code:
        description: 'Play Store version code, e.g. 2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare web bundle
        run: npm run web:prepare
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare Android API 36
        run: node scripts/prepare-android.mjs
      - name: Generate Android icons and splash
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#050814' --iconBackgroundColorDark '#03050c' --splashBackgroundColor '#050814' --splashBackgroundColorDark '#03050c'
      - name: Sync web app
        run: npx cap sync android
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/english-with-mariami-upload.p12"
          test -s "$RUNNER_TEMP/english-with-mariami-upload.p12"
      - name: Validate release keystore
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/english-with-mariami-upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          keytool -list -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -F "PrivateKeyEntry"
      - name: Configure signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/english-with-mariami-upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/configure-android-release.mjs
      - name: Validate release metadata
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Validate Android toolchain
        working-directory: android
        run: |
          test -x ./gradlew
          ./gradlew --version
          grep -Eq '^distributionUrl=.*gradle-[0-9]+\\.[0-9]+.*\\.zip
      - name: Verify signed AAB + APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$AAB"
          test -s "$APK"
          unzip -t "$AAB" >/dev/null
          unzip -t "$APK" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          ${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify "$APK"
          AAPT=${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.englishwithmariami.academy'" <<<"$BADGING"
          grep -F "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -F "launchable-activity:" <<<"$BADGING"
          grep -F "uses-permission: name='android.permission.INTERNET'" <<<"$BADGING"
          grep -F "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" <<<"$BADGING"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'English with Mariami'"
          "$AAPT" dump badging "$APK" | grep -F "application-icon-160:"
          sha256sum "$AAB" "$APK" | tee android-release-sha256.txt
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: english-with-mariami-signed-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-sha256.txt
          if-no-files-found: error
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: english-with-mariami-signed-apk-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-release-sha256.txt
          if-no-files-found: error
 gradle/wrapper/gradle-wrapper.properties
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36|compileSdk[[:space:]]*=[[:space:]]*36' variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36|targetSdk[[:space:]]*=[[:space:]]*36' variables.gradle
      - name: Build signed AAB + APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --stacktrace
      - name: Verify signed AAB + APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$AAB"
          test -s "$APK"
          unzip -t "$AAB" >/dev/null
          unzip -t "$APK" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          jarsigner -verify -verbose -certs "$APK" >/dev/null
          ${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify "$APK"
          AAPT=${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.englishwithmariami.academy'" <<<"$BADGING"
          grep -F "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -F "launchable-activity:" <<<"$BADGING"
          grep -F "uses-permission: name='android.permission.INTERNET'" <<<"$BADGING"
          grep -F "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" <<<"$BADGING"
          "$AAPT" dump badging "$APK" | grep -F "application-label:'English with Mariami'"
          "$AAPT" dump badging "$APK" | grep -F "application-icon-160:"
          sha256sum "$AAB" "$APK" | tee android-release-sha256.txt
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: english-with-mariami-signed-aab-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android-release-sha256.txt
          if-no-files-found: error
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: english-with-mariami-signed-apk-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-release-sha256.txt
          if-no-files-found: error
