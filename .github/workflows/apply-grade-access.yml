name: Apply grade access system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add automatic grade access loader without replacing page code
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("grade2.html", "grade3.html", "grade4.html"):
              p = Path(name)
              text = p.read_text(encoding="utf-8")

              # config.js is the single loader: it loads session-guard,
              # grade-access and logout automatically on protected pages.
              if 'src="config.js"' not in text and "src='config.js'" not in text:
                  marker = "</head>"
                  if marker not in text:
                      raise SystemExit(f"Missing </head> in {name}")
                  text = text.replace(
                      marker,
                      '  <script src="config.js"></script>\\n' + marker,
                      1,
                  )
                  p.write_text(text, encoding="utf-8")

          PY

      - name: Verify integration
        run: |
          grep -q 'src="config.js"' grade2.html
          grep -q 'src="config.js"' grade3.html
          grep -q 'src="config.js"' grade4.html
          grep -q 'datogringo@gmail.com' grade-access.js
          grep -q 'role === "parent"' grade-access.js
          grep -q 'grade === currentGrade' grade-access.js

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade2.html grade3.html grade4.html
          git rm .github/workflows/apply-grade-access.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add automatic grade access protection [skip ci]"
          git push
