name: Temporary shared quiz text fix

on:
  push:
    branches:
      - safe/shared-quiz-object-text-fix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply shared quiz text fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared quiz text normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('grade-lessons.js')
          s = p.read_text(encoding='utf-8')
          old = """  function text(value) {\n    if (value == null) return '';\n    if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);\n    return JSON.stringify(value);\n  }"""
          new = """  function text(value) {\n    if (value == null) return '';\n    if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);\n    if (typeof value === 'object') {\n      const candidate = value.text || value.label || value.option || value.value || value.answer || value.name || value.title || value.question || value.content || value.example;\n      if (candidate != null && typeof candidate !== 'object') return String(candidate);\n      return '';\n    }\n    return '';\n  }"""
          if old not in s:
              raise SystemExit('Expected shared quiz text function was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade-lessons.js
          git commit -m "Apply shared quiz text fix"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/temp-shared-quiz-text-fix.yml
          git add .github/workflows/temp-shared-quiz-text-fix.yml
          git commit -m "chore: remove temporary shared quiz text fix workflow"
          git push
