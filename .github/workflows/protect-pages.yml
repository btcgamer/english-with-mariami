name: Protect student pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4
      - name: Verify protected-page guard files exist
        shell: bash
        run: |
          set -e
          for file in protect.js login.html register.html; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
          done
          echo "Protection files are present. No HTML files are modified by this workflow."