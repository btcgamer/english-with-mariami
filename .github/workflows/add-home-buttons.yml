name: Add home buttons to grade pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-buttons:
    if: "!contains(github.event.head_commit.message, '[skip home buttons]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add visible home buttons
        shell: python
        run: |
          from pathlib import Path

          pages = ['grade2.html', 'grade3.html', 'grade4.html']
          block = '''
          <div id="floatingHomeButton" style="position:fixed;right:20px;bottom:20px;z-index:99999;">
            <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;padding:14px 20px;border-radius:18px;background:linear-gradient(135deg,#075eff,#00d084,#ffe600);color:#06162f;text-decoration:none;font-weight:1000;font-family:Arial,sans-serif;border:2px solid #fff;box-shadow:0 0 15px #00eaff,0 8px 30px #0008;transition:.25s;">🏠 მთავარი გვერდი</a>
          </div>
          '''

          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'id="floatingHomeButton"' not in text:
                  marker = '</body>'
                  if marker in text:
                      text = text.replace(marker, block + '\n' + marker, 1)
                      p.write_text(text, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade2.html grade3.html grade4.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add visible home buttons [skip home buttons]"
          git push