name: Grade 12 Final Graduation QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  grade12-graduation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check runtime and QA
        run: |
          node --check curriculum-runtime.js
          node --check qa/grade12-final-graduation.spec.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: python3 -m http.server 4173 > /tmp/magic-academy-server.log 2>&1 &

      - name: Run Grade 12 final graduation QA
        run: npx playwright test qa/grade12-final-graduation.spec.js --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: grade12-final-graduation-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
