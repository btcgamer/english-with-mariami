*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#effcff;font-family:Arial,"Noto Sans Georgian",sans-serif;background:radial-gradient(circle at 8% 8%,#00eaff30,transparent 25%),radial-gradient(circle at 92% 12%,#7c3cff30,transparent 28%),radial-gradient(circle at 50% 100%,#006eff25,transparent 42%),linear-gradient(135deg,#01030b,#03152e 48%,#010713);overflow-x:hidden}.visual3d{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;perspective:1200px}.grid3d{position:absolute;width:180%;height:180%;left:-40%;top:35%;opacity:.18;background-image:linear-gradient(#00eaff22 1px,transparent 1px),linear-gradient(90deg,#00eaff22 1px,transparent 1px);background-size:65px 65px;transform:perspective(700px) rotateX(66deg) translateZ(-100px);animation:gridMove 14s linear infinite}@keyframes gridMove{to{transform:perspective(700px) rotateX(66deg) translateY(65px) translateZ(-100px)}}.orb{position:absolute;border-radius:50%;filter:blur(5px);mix-blend-mode:screen}.orb1{width:360px;height:360px;left:-120px;top:8%;background:radial-gradient(circle,#00eaff66,#00eaff10 45%,transparent 72%);animation:o1 9s ease-in-out infinite alternate}.orb2{width:450px;height:450px;right:-150px;top:3%;background:radial-gradient(circle,#8b5cf666,#7c3cff10 45%,transparent 72%);animation:o2 12s ease-in-out infinite alternate}.orb3{width:400px;height:400px;left:35%;bottom:-220px;background:radial-gradient(circle,#006eff55,#006eff08 45%,transparent 72%);animation:o3 11s ease-in-out infinite alternate}@keyframes o1{to{transform:translate3d(150px,80px,100px) scale(1.25)}}@keyframes o2{to{transform:translate3d(-120px,100px,150px) scale(1.3)}}@keyframes o3{to{transform:translate3d(80px,-90px,100px) scale(1.2)}}.particles{position:absolute;inset:0}.particles span{position:absolute;width:3px;height:3px;border-radius:50%;background:#00eaff;box-shadow:0 0 15px #00eaff;opacity:.7;animation:p 10s linear infinite}.particles span:nth-child(1){left:5%;top:80%}.particles span:nth-child(2){left:12%;top:45%;animation-duration:12s}.particles span:nth-child(3){left:22%;top:88%;animation-duration:10s}.particles span:nth-child(4){left:31%;top:25%;animation-duration:9s}.particles span:nth-child(5){left:43%;top:65%;animation-duration:13s}.particles span:nth-child(6){left:55%;top:35%;animation-duration:11s}.particles span:nth-child(7){left:66%;top:80%;animation-duration:8s}.particles span:nth-child(8){left:74%;top:20%;animation-duration:14s}.particles span:nth-child(9){left:84%;top:60%;animation-duration:10s}.particles span:nth-child(10){left:93%;top:35%;animation-duration:12s}@keyframes p{0%{transform:translate3d(0,80px,0) scale(.4);opacity:0}20%,80%{opacity:.8}100%{transform:translate3d(35px,-200px,180px) scale(1.5);opacity:0}}.top{position:sticky;top:0;z-index:9999;background:rgba(2,8,23,.9);backdrop-filter:blur(20px);border-bottom:1px solid #00eaff40;box-shadow:0 10px 40px #0009}.top:after{content:"";display:block;height:2px;background:linear-gradient(90deg,transparent,#00eaff,#7c3cff,#ffe600,transparent);background-size:200% 100%;animation:e 4s linear infinite}@keyframes e{to{background-position:200%}}.wrap{width:min(1200px,calc(100% - 28px));margin:auto}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{color:#fff;text-decoration:none;font-weight:1000;text-shadow:0 0 18px #00eaff55}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a{color:#dffaff;text-decoration:none;padding:9px 12px;border-radius:11px;border:1px solid #00eaff20;background:#03152caa}.lessons{padding:32px 0 70px}.hero,.panel{position:relative;overflow:hidden;border-radius:26px;border:1px solid #00eaff35;background:linear-gradient(135deg,#061b38dd,#031127ee);box-shadow:0 25px 70px #000a,0 0 45px #00eaff12,inset 0 1px #ffffff12}.hero{padding:38px 25px;text-align:center}.hero h1{margin:15px 0 8px;font-size:clamp(30px,6vw,55px);text-shadow:0 0 15px #00eaff35,0 0 35px #7c3cff25}.hero p{margin:0;color:#acd3df}.badge{display:inline-block;padding:7px 13px;border-radius:20px;color:#ffe600;background:#ffe60012;border:1px solid #ffe60035;font-size:11px;font-weight:1000;letter-spacing:1px}.panel{margin-top:18px;padding:20px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}.section-title h2{margin:0;font-size:21px}.section-title span{color:#8fd8e8;font-size:12px}.class-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.class-btn{min-height:82px;border-radius:18px;border:1px solid #00eaff25;color:#fff;background:linear-gradient(145deg,#061b38,#041127);cursor:pointer;font-weight:1000;font-size:15px;box-shadow:0 10px 25px #0007;transition:.25s}.class-btn:hover,.class-btn.active{transform:translateY(-3px);border-color:#00eaff70;box-shadow:0 18px 35px #000b,0 0 30px #00eaff25}.class-btn.active{background:linear-gradient(145deg,#063a5a,#071b42)}.class-btn .emoji{display:block;font-size:27px;margin-bottom:5px}.class-btn .sub{display:block;color:#82cbd9;font-size:10px}.student-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:15px}.student-row label{display:block;margin-bottom:7px;color:#a9d5df;font-weight:900}.student-row select{width:100%;min-height:48px;border-radius:14px;padding:10px 13px;border:1px solid #00eaff35;background:#020d20;color:#fff;font-size:14px;outline:none}.refresh{min-height:48px;border:0;border-radius:14px;padding:0 18px;color:#fff;font-weight:1000;cursor:pointer;background:linear-gradient(135deg,#075eff,#00bde8);box-shadow:0 8px 25px #0008}.lesson-grid{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.lesson-card{position:relative;overflow:hidden;min-height:215px;padding:20px;border-radius:22px;border:1px solid #00eaff25;background:linear-gradient(145deg,#061a37e8,#031027ed);box-shadow:0 18px 45px #0008,inset 0 1px #ffffff0b;cursor:pointer;transition:.3s;transform-style:preserve-3d}.lesson-card:hover{transform:perspective(900px) rotateX(3deg) rotateY(-2deg) translateY(-7px);border-color:#00eaff65;box-shadow:0 25px 55px #000b,0 0 35px #00eaff18}.lesson-number{position:absolute;right:16px;top:14px;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:#ffe600;background:#ffe60012;border:1px solid #ffe60035;font-weight:1000}.lesson-icon{font-size:36px;margin-bottom:10px}.lesson-card h3{margin:0 55px 8px 0;font-size:19px}.lesson-card p{margin:0;color:#91c5d2;font-size:12px;line-height:1.55}.lesson-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.lesson-tags span{padding:5px 8px;border-radius:9px;background:#00eaff0d;border:1px solid #00eaff1d;color:#82d8e7;font-size:10px;font-weight:800}.open-btn{display:inline-block;margin-top:15px;padding:9px 13px;border-radius:11px;color:#fff;background:linear-gradient(135deg,#075eff,#00bde8);font-size:11px;font-weight:1000}.state{padding:35px 20px;text-align:center;border-radius:20px;border:1px solid #00eaff25;background:#03142bdd;color:#9acbd7}.error{color:#ffabb5;border-color:#ff4f6d35}@media(max-width:700px){.class-buttons,.lesson-grid{grid-template-columns:1fr}.student-row{grid-template-columns:1fr}.nav{min-height:62px}.navlinks a{font-size:11px}.lessons{padding-top:18px}.panel{padding:15px}}
</style>
</head>
<body>
<div class="visual3d"><div class="grid3d"></div><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div><div class="particles"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
<header class="top"><div class="wrap nav"><a class="brand" href="teacher-dashboard.html">⚡ ENGLISH WITH MARIAMI</a><nav class="navlinks"><a href="teacher-dashboard.html">← მასწავლებლის სივრცე</a><a href="teacher-journal.html">📋 ჟურნალი</a></nav></div></header>
<main class="wrap lessons">
<section class="hero"><span class="badge">TEACHER • LESSONS</span><h1>📚 გაკვეთილები</h1><p>მე-2, მე-3 და მე-4 კლასის სრული სასწავლო კატალოგი.</p></section>
<section class="panel"><div class="section-title"><h2>🎓 აირჩიე კლასი</h2><span id="totalInfo">იტვირთება...</span></div><div class="class-buttons"><button class="class-btn active" data-grade="2"><span class="emoji">🌱</span>მე-2 კლასი<span class="sub">დაწყებითი დონე</span></button><button class="class-btn" data-grade="3"><span class="emoji">🚀</span>მე-3 კლასი<span class="sub">საშუალო დაწყებითი</span></button><button class="class-btn" data-grade="4"><span class="emoji">⭐</span>მე-4 კლასი<span class="sub">გაძლიერებული დონე</span></button></div><div class="student-row"><div><label for="student">👤 მოსწავლე</label><select id="student"><option value="">ყველა მოსწავლე</option></select></div><button id="refresh" class="refresh">🔄 განახლება</button></div></section>
<section class="panel"><div class="section-title"><h2 id="lessonHeading">🌱 მე-2 კლასის გაკვეთილები</h2><span id="lessonCount">0 გაკვეთილი</span></div><div id="lessonGrid" class="lesson-grid"><div class="state">📡 გაკვეთილები იტვირთება...</div></div></section>
</main>
<div class="wrap" style="text-align:center;color:#6fa4b2;font-size:11px;padding:0 0 30px">© 2026 English with Mariami • Teacher Learning Space</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260830-lessons-fix2"></script>
<script>
(function(){
'use strict';
const TEACHER_ID='be4b1c4d-e5f2-4039-b35e-aec3c110a94a';
const client=window.supabaseClient;
const grid=document.getElementById('lessonGrid');
const student=document.getElementById('student');
const totalInfo=document.getElementById('totalInfo');
const lessonCount=document.getElementById('lessonCount');
const heading=document.getElementById('lessonHeading');
let selectedGrade=2;
const icons=['👋','👨‍👩‍👧','🏠','🎒','🎨','🔢','🐶','🍎','⚽','☀️','👕','✏️'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function error(msg){grid.innerHTML='<div class="state error">❌ '+esc(msg)+'</div>';lessonCount.textContent='0 გაკვეთილი';}
function renderLessons(rows){
 rows=(rows||[]).slice().sort((a,b)=>Number(a.lesson_number)-Number(b.lesson_number));
 lessonCount.textContent=rows.length+' გაკვეთილი';
 totalInfo.textContent='მე-'+selectedGrade+' კლასი • '+rows.length+' გაკვეთილი';
 heading.textContent=(selectedGrade===2?'🌱':selectedGrade===3?'🚀':'⭐')+' მე-'+selectedGrade+' კლასის გაკვეთილები';
 if(!rows.length){grid.innerHTML='<div class="state">📚 ამ კლასისთვის გაკვეთილები ვერ მოიძებნა.</div>';return;}
 grid.innerHTML=rows.map((l,i)=>{
   const n=Number(l.lesson_number)||i+1;
   const title=esc(l.title||('გაკვეთილი '+n));
   const desc=esc(l.description||'ინგლისური სიტყვები, გრამატიკა, მოსმენა, სავარჯიშოები და ქვიზი.');
   return '<article class="lesson-card" data-number="'+n+'"><div class="lesson-number">'+n+'</div><div class="lesson-icon">'+(icons[i%icons.length])+'</div><h3>'+title+'</h3><p>'+desc+'</p><div class="lesson-tags"><span>📚 სიტყვები</span><span>🔤 გრამატიკა</span><span>🔊 მოსმენა</span><span>🎮 სავარჯიშო</span></div><a class="open-btn" href="lesson.html?grade='+encodeURIComponent(selectedGrade)+'&lesson='+encodeURIComponent(n)+'">▶ გაკვეთილის გახსნა</a></article>';
 }).join('');
}
async function loadStudents(){
 student.innerHTML='<option value="">ყველა მოსწავლე</option>';
 if(!client)return;
 try{
   const r=await client.from('profiles').select('user_id,full_name,grade').eq('role','student').order('full_name',{ascending:true});
   if(r.error)return;
   (r.data||[]).filter(s=>String(s.grade)===String(selectedGrade)).forEach(s=>{const o=document.createElement('option');o.value=s.user_id;o.textContent=s.full_name||'მოსწავლე';student.appendChild(o);});
 }catch(e){}
}
async function loadLessons(){
 grid.innerHTML='<div class="state">📡 '+('მე-'+selectedGrade)+' კლასის გაკვეთილები იტვირთება...</div>';
 if(!client){error('Supabase კლიენტი ვერ ჩაიტვირთა.');return;}
 try{
   const {data:rows,error:dbError}=await client.from('lessons').select('id,grade,lesson_number,title,description').eq('grade',selectedGrade).order('lesson_number',{ascending:true});
   if(dbError)throw dbError;
   renderLessons(rows||[]);
 }catch(e){console.error('teacher-lessons:',e);error('გაკვეთილების ჩატვირთვა ვერ მოხერხდა. შეამოწმე Supabase RLS უფლებები.');}
}
async function checkTeacher(){
 if(!client){error('Supabase კლიენტი ვერ ჩაიტვირთა.');return false;}
 try{
   const {data:{session}}=await client.auth.getSession();
   if(!session||session.user.id!==TEACHER_ID){location.replace('login.html');return false;}
   const {data:p,error:e}=await client.from('profiles').select('role').eq('user_id',session.user.id).maybeSingle();
   if(e||!p||p.role!=='teacher'){location.replace('index.html');return false;}
   return true;
 }catch(e){console.error(e);error('ავტორიზაციის შემოწმება ვერ მოხერხდა.');return false;}
}
async function refresh(){if(await checkTeacher()){await Promise.all([loadStudents(),loadLessons()]);}}
document.querySelectorAll('.class-btn').forEach(btn=>btn.addEventListener('click',async()=>{document.querySelectorAll('.class-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');selectedGrade=Number(btn.dataset.grade);await refresh();}));
document.getElementById('refresh').addEventListener('click',refresh);
student.addEventListener('change',function(){/* მოსწავლის არჩევანი შენარჩუნებულია მომდევნო ეტაპებისთვის */});
refresh();
})();
</script>
</body>
</html>
