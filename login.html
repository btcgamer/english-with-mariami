<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>შესვლა — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,#6c5ce744,transparent 35%),radial-gradient(circle at 80% 80%,#ff7b7240,transparent 35%),linear-gradient(135deg,#070b1f,#111936 55%,#080c20)}.card{width:min(450px,calc(100% - 44px));padding:38px;border:1px solid #ffffff26;border-radius:30px;background:#ffffff12;box-shadow:0 35px 80px #0009,0 0 45px #6c5ce722;backdrop-filter:blur(20px)}.logo{text-align:center;font-size:4rem}.eyebrow{text-align:center;color:#ffe66d;font-weight:900}.card h1{text-align:center}.sub{text-align:center;color:#c9cde0}.field{margin:18px 0}label{display:block;font-weight:800;margin-bottom:8px}input{width:100%;padding:15px;border:1px solid #ffffff25;border-radius:15px;background:#05091a99;color:#fff;font-size:16px;box-sizing:border-box}button{width:100%;border:0;border-radius:15px;padding:16px;background:linear-gradient(135deg,#8f83ff,#6c5ce7);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.message{text-align:center;margin-top:15px;font-weight:700}.success{color:#65e6a5}.error{color:#ff8585}.register{text-align:center;margin-top:22px;color:#c9cde0}.register a{color:#ffe66d;font-weight:900}</style></head><body><main class="card"><div class="logo">🌈📚</div><div class="eyebrow">English with Mariami</div><h1>🔐 შესვლა</h1><p class="sub">კეთილი იყოს შენი დაბრუნება! 🎓</p><form id="loginForm"><div class="field"><label>📧 ელფოსტა</label><input id="email" type="email" required autocomplete="email" placeholder="example@gmail.com"></div><div class="field"><label>🔑 პაროლი</label><input id="password" type="password" required autocomplete="current-password" placeholder="შეიყვანე პაროლი"></div><button id="submitBtn" type="submit">🚀 შესვლა</button><div id="message" class="message"></div></form><div class="register">არ გაქვს ანგარიში? <a href="register.html">რეგისტრაცია →</a></div></main><script>const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message'),b=document.getElementById('submitBtn');m.textContent='';b.disabled=true;try{const{data,error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;const u=data.user,meta=u.user_metadata||{};let{data:p,error:pe}=await supabaseClient.from('profiles').select('user_id,role').eq('user_id',u.id).maybeSingle();if(pe)throw pe;if(!p){const r=await supabaseClient.from('profiles').insert({user_id:u.id,full_name:meta.full_name||u.email?.split('@')[0]||'მოსწავლე',grade:Number(meta.grade)||2,role:'student',points:0}).select('user_id,role').single();if(r.error)throw r.error;p=r.data}m.className='message success';m.textContent='🎉 წარმატებით შეხვედი!';setTimeout(()=>location.href=p?.role==='teacher'?'admin.html':'academy.html',400)}catch(err){m.className='message error';m.textContent='❌ '+(err.message||'შესვლა ვერ მოხერხდა.')}finally{b.disabled=false}});</script></body></html>
