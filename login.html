<html lang="ka">
<head>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow-x:hidden;

  font-family:Arial,"Noto Sans Georgian",sans-serif;
  color:#fff;

  background:
    radial-gradient(circle at 50% 30%,#bdf5ff 0%,#4fb9e5 20%,#14537d 48%,#020817 75%);
}

body::before,
body::after{
  content:"";
  position:fixed;
  left:-20%;
  width:140%;
  height:180px;

  border-radius:50%;

  pointer-events:none;
  opacity:.35;
  filter:blur(4px);
}

body::before{
  top:8%;

  border:2px solid #00eaff;

  box-shadow:
    0 0 20px #00eaff,
    0 0 50px #00eaff;

  animation:wave1 8s ease-in-out infinite;
}

body::after{
  bottom:8%;

  border:2px solid #075eff;

  box-shadow:
    0 0 20px #075eff,
    0 0 50px #075eff;

  animation:wave2 10s ease-in-out infinite;
}

@keyframes wave1{
  0%,100%{
    transform:translateX(-30px) rotate(-3deg);
  }

  50%{
    transform:translateX(30px) rotate(3deg);
  }
}

@keyframes wave2{
  0%,100%{
    transform:translateX(30px) rotate(3deg);
  }

  50%{
    transform:translateX(-30px) rotate(-3deg);
  }
}

.login-card{
  position:relative;
  z-index:5;

  width:min(430px,100%);

  padding:35px 28px;

  text-align:center;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(2,24,42,.94),
      rgba(2,8,23,.98)
    );

  border:1px solid rgba(0,234,255,.65);

  box-shadow:
    0 30px 90px rgba(0,0,0,.8),
    0 0 45px rgba(0,234,255,.3),
    inset 0 1px 0 rgba(255,255,255,.12);

  backdrop-filter:blur(18px);
}

.logo{
  font-size:58px;
  line-height:1;

  margin-bottom:10px;

  filter:
    drop-shadow(0 0 8px #00eaff)
    drop-shadow(0 0 20px #075eff);

  animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }
}

.brand{
  font-size:25px;
  font-weight:900;

  color:#00eaff;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

.subtitle{
  margin:8px 0 25px;
  color:#c9f5ff;
}

h1{
  margin:10px 0;

  color:#00eaff;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

p{
  color:#d9f7ff;
}

.form-group{
  margin:17px 0;
  text-align:left;
}

.form-group label{
  display:block;
  margin-bottom:8px;

  color:#ffe600;
  font-weight:900;
}

.form-group input{
  width:100%;
  height:52px;

  padding:0 15px;

  border-radius:15px;

  border:1px solid rgba(0,234,255,.4);

  outline:none;

  background:
    linear-gradient(
      145deg,
      #041733,
      #020b1e
    );

  color:#fff;

  font-size:16px;

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.5);
}

.form-group input::placeholder{
  color:#8eafbd;
}

.form-group input:focus{
  border-color:#00eaff;

  box-shadow:
    0 0 12px rgba(0,234,255,.4),
    inset 0 0 10px rgba(0,234,255,.08);
}

.login-button{
  width:100%;
  height:55px;

  margin-top:8px;

  border:1px solid #8ff7ff;
  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #00eaff,
      #008cff
    );

  color:#00131a;

  font-size:18px;
  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 0 20px rgba(0,234,255,.35);

  transition:.2s;
}

.login-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 0 25px rgba(0,234,255,.65);
}

.login-button:disabled{
  opacity:.6;
  cursor:wait;
}

.links{
  margin-top:16px;
}

.links a{
  display:inline-block;

  margin:5px;

  padding:9px 13px;

  border-radius:12px;

  color:#ffe600;

  font-weight:900;

  text-decoration:none;

  background:rgba(6,36,67,.8);

  border:1px solid rgba(0,234,255,.25);

  transition:.2s;
}

.links a:hover{
  transform:translateY(-1px);

  border-color:#00eaff;

  box-shadow:0 0 12px rgba(0,234,255,.25);
}

.message{
  min-height:25px;

  margin-top:15px;

  font-weight:700;

  line-height:1.5;
}

.error{
  color:#ff7894;
}

.success{
  color:#5dffad;
}

.site-copyright{
  margin-top:25px;

  padding:15px 5px;

  border-top:
    1px solid rgba(0,234,255,.2);

  color:#9dc7d5;

  font-size:13px;

  text-align:center;
}

@media(max-width:600px){

  body{
    padding:15px;
  }

  .login-card{
    padding:28px 20px;
    border-radius:27px;
  }

  .brand{
    font-size:21px;
  }

  .logo{
    font-size:50px;
  }

  h1{
    font-size:27px;
  }
}
</style>

</head>

<body>

<main class="login-card">

  <div class="logo">
    🌈📚
  </div>

  <div class="brand">
    English with Mariami
  </div>

  <div class="subtitle">
    ინგლისურის სასწავლო აკადემია ✨
  </div>

  <h1>
    🔐 შესვლა
  </h1>

  <p>
    კეთილი იყოს შენი დაბრუნება! 🎓
  </p>

  <form id="loginForm" novalidate>

```
<div class="form-group">

  <label for="email">
    📧 ელფოსტა
  </label>

  <input
    id="email"
    type="email"
    required
    autocomplete="email"
    placeholder="შეიყვანე ელფოსტა"

  <label for="password">

  </label>

  </form>

  <div class="links">

  🔑 დაგავიწყდა პაროლი?
</a>
```

  </div>

  <div id="message" class="message"></div>

  <div class="links">

```
<a href="register.html">
  📝 რეგისტრაცია
</a>

<a href="index.html">
  🏠 მთავარი
</a>
```

  </div>

  <footer class="site-copyright">

</main>

<script>
(function(){

"use strict";

/*
====================================================
ELEMENTS
====================================================
*/

const form =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


/*
====================================================
MESSAGE
====================================================
*/

function showMessage(text,type){

  message.className =
    "message " + (type || "");

  message.textContent =
    text || "";

}


/*
====================================================
SUPABASE CLIENT
====================================================
*/

function getSupabaseClient(){

  if(
    window.__ENGLISH_MARIAMI_SUPABASE_CLIENT
  ){
    return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;
  }

  if(
    window.supabaseClient
  ){
    return window.supabaseClient;
  }

  return null;

}


/*
====================================================
WAIT FOR CONFIG.JS
====================================================
*/

async function waitForSupabase(){

  const existing =
    getSupabaseClient();

  if(existing){
    return existing;
  }

  return new Promise(function(resolve){

    let finished = false;

    function done(){

      if(finished){
        return;
      }

      finished = true;

      resolve(
        getSupabaseClient()
      );

    }

    window.addEventListener(
      "englishMariamiSupabaseReady",
      done,
      {once:true}
    );

    setTimeout(
      done,
      5000
    );

  });

}


/*
====================================================
REDIRECT
====================================================
*/

function redirectTo(page){

  window.location.replace(page);

}


/*
====================================================
LOAD PROFILE
====================================================
*/

async function getUserProfile(client,userId){

  try{

    const result =
      await client
        .from("profiles")
        .select("role,grade,full_name")
        .eq("user_id",userId)
        .maybeSingle();

    if(result.error){

      console.warn(
        "Profile query error:",
        result.error
      );

      return null;

    }

    return result.data || null;

  }catch(error){

    console.warn(
      "Profile loading error:",
      error
    );

    return null;

  }

}


/*
====================================================
LOGIN
====================================================
*/

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    showMessage("");

    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    /*
    ----------------------------------------------
    VALIDATION
    ----------------------------------------------
    */

    if(!email){

      showMessage(
        "❌ შეიყვანე ელფოსტა.",
        "error"
      );

      emailInput.focus();

      return;

    }


    if(!password){

      showMessage(
        "❌ შეიყვანე პაროლი.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    /*
    ----------------------------------------------
    SUPABASE
    ----------------------------------------------
    */

    const client =
      await waitForSupabase();

    if(!client){

      showMessage(
        "❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.",
        "error"
      );

      return;

    }


    /*
    ----------------------------------------------
    BUTTON
    ----------------------------------------------
    */

    loginButton.disabled =
      true;

    loginButton.textContent =
      "⏳ შესვლა...";


    try{

      /*
      ============================================
      SIGN IN
      ============================================
      */

      const result =
        await client.auth.signInWithPassword({

          email:email,

          password:password

        });


      const data =
        result.data;

      const error =
        result.error;


      if(error){

        throw error;

      }


      if(
        !data ||
        !data.user ||
        !data.session
      ){

        throw new Error(
          "სესია ვერ შეიქმნა."
        );

      }


      const user =
        data.user;


      /*
      ============================================
      PROFILE
      ============================================
      */

      const profile =
        await getUserProfile(
          client,
          user.id
        );


      if(!profile){

        /*
        თუ პროფილი ვერ მოიძებნა,
        სესიას ვხურავთ და მომხმარებელს
        არ ვუშვებთ დაცულ გვერდზე.
        */

        await client.auth.signOut();

        throw new Error(
          "მომხმარებლის პროფილი ვერ მოიძებნა. გთხოვთ, დაუკავშირდით მასწავლებელს."
        );

      }


      const role =
        String(
          profile.role || ""
        )
        .trim()
        .toLowerCase();


      const grade =
        Number(
          profile.grade || 0
        );


      /*
      ============================================
      TEACHER
      ============================================
      */

      if(role === "teacher"){

        showMessage(
          "👩‍🏫 შესვლა წარმატებულია! იხსნება მასწავლებლის სივრცე...",
          "success"
        );

        setTimeout(function(){

          redirectTo(
            "teacher-dashboard.html"
          );

        },500);

        return;

      }


      /*
      ============================================
      PARENT
      ============================================
      */

      if(role === "parent"){

        showMessage(
          "👨‍👩‍👧 შესვლა წარმატებულია! იხსნება სასწავლო ცენტრი...",
          "success"
        );

        setTimeout(function(){

          redirectTo(
            "academy.html"
          );

        },500);

        return;

      }


      /*
      ============================================
      STUDENT
      ============================================
      */

      if(role === "student"){

        if(
          ![2,3,4].includes(grade)
        ){

          await client.auth.signOut();

          throw new Error(
            "თქვენს ანგარიშზე კლასი ჯერ არ არის მინიჭებული. გთხოვთ, დაუკავშირდით მასწავლებელს."
          );

        }


        showMessage(
          "🎓 შესვლა წარმატებულია! იხსნება მე-"+grade+" კლასის სივრცე...",
          "success"
        );


        setTimeout(function(){

          redirectTo(
            "grade"+grade+".html"
          );

        },500);

        return;

      }


      /*
      ============================================
      UNKNOWN ROLE
      ============================================
      */

      await client.auth.signOut();

      throw new Error(
        "თქვენს ანგარიშზე მომხმარებლის ტიპი სწორად არ არის განსაზღვრული. გთხოვთ, დაუკავშირდით მასწავლებელს."
      );


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      const errorText =
        String(
          error?.message || ""
        );


      /*
      ============================================
      AUTH ERRORS
      ============================================
      */

      if(
        /invalid login credentials/i
          .test(errorText)
      ){

        showMessage(
          "❌ ელფოსტა ან პაროლი არასწორია.",
          "error"
        );

      }

      else if(
        /email not confirmed/i
          .test(errorText)
      ){

        showMessage(
          "📧 ელფოსტა ჯერ არ არის დადასტურებული. შეამოწმე ელფოსტა.",
          "error"
        );

      }

      else if(
        /failed to fetch|networkerror|err_name_not_resolved|fetch/i
          .test(errorText)
      ){

        showMessage(
          "🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი.",
          "error"
        );

      }

      else{

        showMessage(
          "❌ " +
          (
            errorText ||
            "შესვლა ვერ მოხერხდა."
          ),
          "error"
        );

      }

    }
    finally{

      loginButton.disabled =
        false;

      loginButton.textContent =
        "🚀 შესვლა";

    }

  }
);


/*
====================================================
ENTER KEY / INPUT
====================================================
*/

emailInput.addEventListener(
  "input",
  function(){

    if(message.classList.contains("error")){

      showMessage("");

    }

  }
);

passwordInput.addEventListener(
  "input",
  function(){

    if(message.classList.contains("error")){

      showMessage("");

    }

  }
);

})();
</script>

</body>
</html>
