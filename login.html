<!doctype html>
<html lang="ka">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>English with Mariami — შესვლა</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 50% 30%,
      #bdf5ff 0%,
      #4fb9e5 20%,
      #14537d 48%,
      #020817 75%
    );
}

body::before,
body::after{
  content:"";
  position:fixed;
  left:-20%;
  width:140%;
  height:120px;
  border-radius:50%;
  pointer-events:none;
  opacity:.25;
  filter:blur(4px);
}

body::before{
  top:3%;
  border:2px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    0 0 50px #00eaff;
  animation:wave1 8s ease-in-out infinite;
}

body::after{
  bottom:3%;
  border:2px solid #075eff;
  box-shadow:
    0 0 20px #075eff,
    0 0 50px #075eff;
  animation:wave2 10s ease-in-out infinite;
}

@keyframes wave1{
  0%,100%{
    transform:translateX(-25px) rotate(-3deg);
  }

  50%{
    transform:translateX(25px) rotate(3deg);
  }
}

@keyframes wave2{
  0%,100%{
    transform:translateX(25px) rotate(3deg);
  }

  50%{
    transform:translateX(-25px) rotate(-3deg);
  }
}

.login-card{
  position:relative;
  z-index:5;

  width:min(430px,100%);

  max-height:calc(100dvh - 20px);

  padding:20px 24px;

  text-align:center;

  border-radius:26px;

  background:
    linear-gradient(
      145deg,
      rgba(2,24,42,.96),
      rgba(2,8,23,.98)
    );

  border:1px solid rgba(0,234,255,.65);

  box-shadow:
    0 25px 70px rgba(0,0,0,.8),
    0 0 40px rgba(0,234,255,.3),
    inset 0 1px 0 rgba(255,255,255,.12);

  backdrop-filter:blur(18px);

  overflow:hidden;
}

.logo{
  font-size:44px;
  line-height:1;
  margin-bottom:6px;

  filter:
    drop-shadow(0 0 8px #00eaff)
    drop-shadow(0 0 20px #075eff);

  animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }
}

.brand{
  font-size:21px;
  font-weight:900;

  color:#00eaff;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

.subtitle{
  margin:5px 0 12px;
  color:#c9f5ff;
  font-size:13px;
}

h1{
  margin:5px 0;

  color:#00eaff;

  font-size:26px;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

p{
  color:#d9f7ff;
}

.login-intro{
  margin:5px 0 12px;
  font-size:13px;
}

.form-group{
  margin:9px 0;
  text-align:left;
}

.form-group label{
  display:block;
  margin-bottom:4px;

  color:#ffe600;
  font-weight:900;
  font-size:13px;
}

.form-group input{
  width:100%;
  height:43px;

  padding:0 13px;

  border-radius:13px;

  border:1px solid rgba(0,234,255,.4);

  outline:none;

  background:
    linear-gradient(
      145deg,
      #041733,
      #020b1e
    );

  color:#fff;

  font-size:14px;

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.5);
}

.form-group input:focus{
  border-color:#00eaff;

  box-shadow:
    0 0 12px rgba(0,234,255,.4),
    inset 0 0 10px rgba(0,234,255,.08);
}

.login-button{
  width:100%;
  height:45px;

  margin-top:5px;

  border:1px solid #8ff7ff;
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #00eaff,
      #008cff
    );

  color:#00131a;

  font-size:16px;
  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 0 20px rgba(0,234,255,.35);

  transition:.2s;
}

.login-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 0 25px rgba(0,234,255,.65);
}

.login-button:disabled{
  opacity:.6;
  cursor:wait;
}

.links{
  margin-top:8px;
}

.links a{
  display:inline-block;

  margin:2px;

  padding:7px 10px;

  border-radius:10px;

  color:#ffe600;

  font-weight:900;

  text-decoration:none;

  background:rgba(6,36,67,.8);

  border:1px solid rgba(0,234,255,.25);

  font-size:12px;
}

.message{
  min-height:20px;
  margin-top:8px;

  font-size:13px;
  font-weight:700;
}

.error{
  color:#ff7894;
}

.success{
  color:#5dffad;
}

.site-copyright{
  margin-top:9px;

  padding-top:8px;

  border-top:
    1px solid rgba(0,234,255,.2);

  color:#9dc7d5;

  font-size:9px;

  text-align:center;
}

@media(max-width:600px){

  body{
    padding:7px;
  }

  .login-card{
    padding:15px 17px;
    border-radius:22px;
    max-height:calc(100dvh - 14px);
  }

  .logo{
    font-size:38px;
    margin-bottom:4px;
  }

  .brand{
    font-size:18px;
  }

  .subtitle{
    margin:3px 0 8px;
    font-size:12px;
  }

  h1{
    font-size:23px;
    margin:3px 0;
  }

  .login-intro{
    margin:3px 0 8px;
    font-size:12px;
  }

  .form-group{
    margin:7px 0;
  }

  .form-group label{
    font-size:12px;
  }

  .form-group input{
    height:40px;
    font-size:14px;
  }

  .login-button{
    height:42px;
    font-size:15px;
  }

  .links{
    margin-top:5px;
  }

  .links a{
    padding:6px 8px;
    font-size:11px;
  }

  .site-copyright{
    margin-top:6px;
    padding-top:6px;
  }
}

/* ძალიან დაბალი ეკრანი */
@media(max-width:600px) and (max-height:700px){

  .login-card{
    padding:11px 15px;
  }

  .logo{
    display:none;
  }

  .brand{
    font-size:17px;
  }

  .subtitle{
    margin:2px 0 5px;
  }

  h1{
    font-size:21px;
  }

  .login-intro{
    margin:2px 0 5px;
  }

  .form-group{
    margin:5px 0;
  }

  .form-group input{
    height:37px;
  }

  .login-button{
    height:39px;
  }

  .message{
    min-height:16px;
    margin-top:4px;
  }

  .site-copyright{
    display:none;
  }
}
</style>
</head>

<body>

<main class="login-card">

<div class="logo">
🌈📚
</div>

<div class="brand">
English with Mariami
</div>

<div class="subtitle">
ინგლისურის სასწავლო აკადემია ✨
</div>

<h1>
🔐 შესვლა
</h1>

<p class="login-intro">
კეთილი იყოს შენი დაბრუნება! 🎓
</p>

<form id="loginForm">

<div class="form-group">

<label for="email">
📧 ელფოსტა
</label>

<input
  id="email"
  type="email"
  required
  autocomplete="email"
  placeholder="შეიყვანე ელფოსტა">

</div>

<div class="form-group">

<label for="password">
🔑 პაროლი
</label>

<input
  id="password"
  type="password"
  required
  autocomplete="current-password"
  placeholder="შეიყვანე პაროლი">

</div>

<button
  id="loginButton"
  class="login-button"
  type="submit">

🚀 შესვლა

</button>

</form>

<div class="links">

<a href="reset-password.html">
🔑 დაგავიწყდა პაროლი?
</a>

</div>

<div id="message" class="message"></div>

<div class="links">

<a href="register.html">
📝 რეგისტრაცია
</a>

<a href="index.html">
🏠 მთავარი
</a>

</div>

<footer class="site-copyright">

© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer

</footer>

</main>

<script>
(function(){

"use strict";

const form=
document.getElementById("loginForm");

const emailInput=
document.getElementById("email");

const passwordInput=
document.getElementById("password");

const loginButton=
document.getElementById("loginButton");

const message=
document.getElementById("message");


function showMessage(text,type){

  message.className="message "+type;
  message.textContent=text;

}


async function getClient(){

  if(
    window.__ENGLISH_MARIAMI_SUPABASE_CLIENT
  ){

    return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

  }

  if(window.supabaseClient){

    return window.supabaseClient;

  }

  return new Promise(resolve=>{

    const done=()=>{

      resolve(
        window.__ENGLISH_MARIAMI_SUPABASE_CLIENT ||
        window.supabaseClient ||
        null
      );

    };

    window.addEventListener(
      "englishMariamiSupabaseReady",
      done,
      {once:true}
    );

    setTimeout(done,5000);

  });

}


function getRedirect(){

  const params=
    new URLSearchParams(
      window.location.search
    );

  const redirect=
    params.get("redirect");

  if(!redirect){
    return "";
  }

  /*
    უსაფრთხო redirect:
    მხოლოდ ჩვენი საიტის შიდა HTML გვერდები.
  */

  if(
    redirect.startsWith("/") &&
    !redirect.startsWith("//")
  ){

    return redirect;

  }

  if(
    /^[a-zA-Z0-9_-]+\.html(?:\?.*)?$/
      .test(redirect)
  ){

    return redirect;

  }

  return "";

}


form.addEventListener(
"submit",
async function(event){

  event.preventDefault();

  const client=
    await getClient();

  if(!client){

    showMessage(
      "❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.",
      "error"
    );

    return;

  }

  const email=
    emailInput.value
      .trim()
      .toLowerCase();

  const password=
    passwordInput.value;

  if(!email || !password){

    showMessage(
      "❌ შეავსე ელფოსტა და პაროლი.",
      "error"
    );

    return;

  }

  loginButton.disabled=true;
  loginButton.textContent="⏳ შესვლა...";
  message.textContent="";

  try{

    const {
      data,
      error
    }=
    await client.auth.signInWithPassword({

      email:email,
      password:password

    });

    if(error){

      throw error;

    }

    if(
      !data ||
      !data.session ||
      !data.user
    ){

      throw new Error(
        "სესია ვერ შეიქმნა."
      );

    }

    const user=
      data.user;

    let role="";
    let grade=0;

    const profileResult=
      await client
        .from("profiles")
        .select("role,grade")
        .eq("user_id",user.id)
        .maybeSingle();

    if(profileResult.error){

      console.warn(
        "Profile read error:",
        profileResult.error
      );

    }

    if(profileResult.data){

      role=
        String(
          profileResult.data.role || ""
        )
        .trim()
        .toLowerCase();

      grade=
        Number(
          profileResult.data.grade || 0
        );

    }


    /*
    ==========================================
    TEACHER
    ==========================================
    */

    if(
      role==="teacher" ||
      role==="admin"
    ){

      showMessage(
        "👩‍🏫 მასწავლებლის სივრცე იხსნება...",
        "success"
      );

      setTimeout(()=>{

        location.replace(
          "teacher-dashboard.html"
        );

      },400);

      return;

    }


    /*
    ==========================================
    PARENT
    ==========================================
    */

    if(role==="parent"){

      showMessage(
        "👨‍👩‍👧 მშობლის სივრცე იხსნება...",
        "success"
      );

      setTimeout(()=>{

        location.replace(
          "parent-space.html"
        );

      },400);

      return;

    }


    /*
    ==========================================
    STUDENT
    ==========================================
    */

    if(role==="student"){

      if(
        ![2,3,4].includes(grade)
      ){

        throw new Error(
          "თქვენს ანგარიშზე კლასი ჯერ არ არის მინიჭებული. გთხოვთ, დაუკავშირდით მასწავლებელს."
        );

      }

      showMessage(
        "✅ შესვლა წარმატებულია! მე-"+grade+" კლასის სივრცე იხსნება...",
        "success"
      );

      setTimeout(()=>{

        location.replace(
          "grade"+grade+".html"
        );

      },400);

      return;

    }


    /*
    ==========================================
    უცნობი როლი
    ==========================================
    */

    throw new Error(
      "ანგარიშის ტიპი ვერ განისაზღვრა. დაუკავშირდით მასწავლებელს."
    );


  }catch(error){

    console.error(
      "Login error:",
      error
    );

    const text=
      String(
        error?.message || ""
      );

    if(
      /invalid login credentials/i
        .test(text)
    ){

      showMessage(
        "❌ ელფოსტა ან პაროლი არასწორია.",
        "error"
      );

    }

    else if(
      /email not confirmed/i
        .test(text)
    ){

      showMessage(
        "📧 გთხოვთ, ჯერ დაადასტუროთ ელფოსტა.",
        "error"
      );

    }

    else if(
      /failed to fetch|networkerror|err_name_not_resolved/i
        .test(text)
    ){

      showMessage(
        "🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი.",
        "error"
      );

    }

    else{

      showMessage(
        "❌ "+
        (
          text ||
          "შესვლა ვერ მოხერხდა."
        ),
        "error"
      );

    }

  }finally{

    loginButton.disabled=false;
    loginButton.textContent="🚀 შესვლა";

  }

});

})();
</script>

</body>
</html>
