<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 30%,#bdf5ff 0%,#4fb9e5 20%,#14537d 48%,#020817 75%);
}

body::before,
body::after{
  content:"";
  position:fixed;
  left:-20%;
  width:140%;
  height:180px;
  border-radius:50%;
  pointer-events:none;
  opacity:.35;
  filter:blur(4px);
}

body::before{
  top:8%;
  border:2px solid #00eaff;
  box-shadow:0 0 20px #00eaff,0 0 50px #00eaff;
  animation:wave1 8s ease-in-out infinite;
}

body::after{
  bottom:8%;
  border:2px solid #075eff;
  box-shadow:0 0 20px #075eff,0 0 50px #075eff;
  animation:wave2 10s ease-in-out infinite;
}

@keyframes wave1{
  0%,100%{transform:translateX(-30px) rotate(-3deg)}
  50%{transform:translateX(30px) rotate(3deg)}
}

@keyframes wave2{
  0%,100%{transform:translateX(30px) rotate(3deg)}
  50%{transform:translateX(-30px) rotate(-3deg)}
}

  position:relative;
  z-index:5;
  width:min(430px,100%);
  padding:35px 28px;
  text-align:center;
  border-radius:30px;
  background:linear-gradient(
    145deg,
    rgba(2,24,42,.94),
    rgba(2,8,23,.98)
  );
  border:1px solid rgba(0,234,255,.65);
  box-shadow:
    0 30px 90px rgba(0,0,0,.8),
    0 0 45px rgba(0,234,255,.3),
    inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
}

.logo{
  font-size:58px;
  line-height:1;
  margin-bottom:10px;
  filter:
    drop-shadow(0 0 8px #00eaff)
    drop-shadow(0 0 20px #075eff);
  animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.brand{
  font-size:25px;
  font-weight:900;
  color:#00eaff;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

.subtitle{
  margin:8px 0 25px;
  color:#c9f5ff;
}

h1{
  margin:10px 0;
  color:#00eaff;
  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

p{
  color:#d9f7ff;
}

.form-group{
  margin:17px 0;
  text-align:left;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:#ffe600;
  font-weight:900;
}

.form-group input{
  width:100%;
  height:52px;
  padding:0 15px;
  border-radius:15px;
  border:1px solid rgba(0,234,255,.4);
  outline:none;
  background:linear-gradient(145deg,#041733,#020b1e);

  box-shadow:inset 0 0 15px rgba(0,0,0,.5);

.form-group input:focus{

.login-button{

  margin-top:8px;

  border-radius:16px;

  font-size:18px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,234,255,.35);

}

.login-button:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(0,234,255,.65);
}

.login-button:disabled{
  opacity:.6;
  cursor:wait;

}

.links{

}

}

  margin-top:15px;

}

.error{
  color:#ff7894;
}

}

.site-copyright{

  border-top:1px solid rgba(0,234,255,.2);
  color:#9dc7d5;
  font-size:13px;
  text-align:center;
}

@media(max-width:600px){

  body{
    padding:15px;
  }

    padding:28px 20px;

  }

  }

<body>

<main class="login-card">

  <div class="logo">
    🌈📚
  </div>

  <div class="brand">
    English with Mariami
  </div>

  <div class="subtitle">
    ინგლისურის სასწავლო აკადემია ✨
  </div>

  <h1>
    🔐 შესვლა
  </h1>

  <p>
    კეთილი იყოს შენი დაბრუნება! 🎓
  </p>

  <form id="loginForm" novalidate>

```
<div class="form-group">

  <label for="email">

  <input
    id="email"

  <div id="message" class="message"></div>

  <div class="links">

```

</a>

```

  </div>

<script>
(function(){

"use strict";

/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  message.className =
    "message " + (type || "");

  message.textContent =
    text || "";

}


/* =====================================================
   SUPABASE CLIENT
   მუშაობს როგორც პირდაპირ ჩატვირთულ client-ზე,
   ასევე config.js-ის მიერ შექმნილ client-ზე.
===================================================== */

async function getSupabaseClient(){

  if(window.__ENGLISH_MARIAMI_SUPABASE_CLIENT){

    return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

  }

  if(window.supabaseClient){

    return window.supabaseClient;

  }

  if(window.supabase &&
     typeof window.supabase.createClient === "function"){

    /*
      თუ config.js-მ უკვე შექმნა client,
      მაგრამ გლობალურად სხვა სახელით არ გამოაქვეყნა,
      აქ ხელით შექმნას არ ვცდილობთ.
    */

  }

  return new Promise(function(resolve){

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      resolve(
        window.__ENGLISH_MARIAMI_SUPABASE_CLIENT ||
        window.supabaseClient ||
        null
      );

    }

    window.addEventListener(
      "englishMariamiSupabaseReady",
      done,
      {once:true}
    );

    setTimeout(done,5000);

  });

}


/* =====================================================
   SAFE REDIRECT
   მხოლოდ ჩვენი საიტის ცნობილი გვერდები.
   URL-დან ნებისმიერი უცხო მისამართის გაშვება აკრძალულია.
===================================================== */

function getSafeRedirect(){

  const params =
    new URLSearchParams(window.location.search);

  const requested =
    params.get("redirect");

  if(!requested){
    return null;
  }

  try{

    const decoded =
      decodeURIComponent(requested);

    /*
      მხოლოდ relative local paths
    */

    if(
      !decoded.startsWith("/") ||
      decoded.startsWith("//") ||
      decoded.includes("://")
    ){

      return null;

    }

    const clean =
      decoded.split("?")[0].split("#")[0];

    const allowed = [

      "/academy.html",
      "/teacher-dashboard.html",
      "/grade2.html",
      "/grade3.html",
      "/grade4.html"

    ];

    if(allowed.includes(clean)){

      return decoded;

    }

  }catch(error){

    console.warn(
      "Invalid redirect:",
      error
    );

  }

  return null;

}


/* =====================================================
   ROLE + GRADE ROUTING
===================================================== */

function getDestination(role,grade){

  role =
    String(role || "")
      .trim()
      .toLowerCase();

  grade =
    Number(grade || 0);


  /*
    TEACHER
  */

  if(role === "teacher"){

    return "teacher-dashboard.html";

  }


  /*
    PARENT
  */

  if(role === "parent"){

    return "academy.html";

  }


  /*
    STUDENT
  */

  if(role === "student"){

    if([2,3,4].includes(grade)){

      return "grade" + grade + ".html";

    }

    return null;

  }


  return null;

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if(!email){

      showMessage(
        "❌ შეიყვანე ელფოსტა.",
        "error"
      );

      emailInput.focus();

      return;

    }


    if(!password){

      showMessage(
        "❌ შეიყვანე პაროლი.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    if(password.length < 6){

      showMessage(
        "❌ პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.",
        "error"
      );

      passwordInput.focus();

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "⏳ მოწმდება...";

    showMessage("","");


    try{

      const client =
        await getSupabaseClient();


      if(!client){

        throw new Error(
          "AUTH_CLIENT_NOT_READY"
        );

      }


      /* =================================================
         SUPABASE AUTH
      ================================================= */

      const {
        data,
        error
      } =
        await client.auth.signInWithPassword({

          email:email,

          password:password

        });


      if(error){

        throw error;

      }


      if(
        !data ||
        !data.user ||
        !data.session
      ){

        throw new Error(
          "სესია ვერ შეიქმნა."
        );

      }


      const user =
        data.user;


      /* =================================================
         პროფილის წაკითხვა
         role და grade მხოლოდ profiles-დან.
      ================================================= */

      const {
        data:profile,
        error:profileError
      } =
        await client
          .from("profiles")
          .select("role,grade,full_name")
          .eq("user_id",user.id)
          .maybeSingle();


      if(profileError){

        console.error(
          "Profile error:",
          profileError
        );

        throw new Error(
          "მომხმარებლის პროფილის წაკითხვა ვერ მოხერხდა."
        );

      }


      if(!profile){

        throw new Error(
          "თქვენი პროფილი ჯერ არ არის შექმნილი. გთხოვთ, დაუკავშირდით მასწავლებელს."
        );

      }


      const role =
        String(
          profile.role || "student"
        )
        .trim()
        .toLowerCase();


      const grade =
        Number(
          profile.grade || 0
        );


      /* =================================================
         DESTINATION
      ================================================= */

      const destination =
        getDestination(
          role,
          grade
        );


      /* =================================================
         UNKNOWN ROLE
      ================================================= */

      if(!destination){

        /*
          სტუდენტი რეგისტრირებულია,
          მაგრამ მასწავლებელს ჯერ კლასი არ მიუნიჭებია.
        */

        if(role === "student"){

          showMessage(
            "ℹ️ ანგარიში სწორად არის შექმნილი, მაგრამ კლასი ჯერ არ არის მინიჭებული. გთხოვთ, დაელოდოთ მასწავლებელს.",
            "error"
          );

        }else{

          showMessage(
            "❌ ანგარიშის როლი ან კლასი არასწორად არის მითითებული. დაუკავშირდი ადმინისტრატორს.",
            "error"
          );

        }

        /*
          სესიას ვხურავთ, რადგან მომხმარებელი
          დაუდგენელი/არასწორი მდგომარეობით არ უნდა დარჩეს.
        */

        await client.auth.signOut();

        return;

      }


      /* =================================================
         REDIRECT REQUEST
         მხოლოდ იმ შემთხვევაში გამოიყენება,
         თუ მოთხოვნილი გვერდი შეესაბამება როლს.
      ================================================= */

      const requestedRedirect =
        getSafeRedirect();


      let finalDestination =
        destination;


      if(requestedRedirect){

        const clean =
          requestedRedirect
            .split("?")[0]
            .split("#")[0];


        /*
          STUDENT → მხოლოდ თავისი grade
        */

        if(
          role === "student" &&
          clean === "/grade" + grade + ".html"
        ){

          finalDestination =
            requestedRedirect;

        }


        /*
          TEACHER
        */

        else if(
          role === "teacher" &&
          clean === "/teacher-dashboard.html"
        ){

          finalDestination =
            requestedRedirect;

        }


        /*
          PARENT
        */

        else if(
          role === "parent" &&
          clean === "/academy.html"
        ){

          finalDestination =
            requestedRedirect;

        }

      }


      /* =================================================
         SUCCESS
      ================================================= */

      showMessage(
        "✅ შესვლა წარმატებულია! გადამისამართება...",
        "success"
      );


      setTimeout(function(){

        window.location.replace(
          finalDestination
        );

      },500);


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      const raw =
        String(
          error &&
          error.message
          ? error.message
          : ""
        );


      const lower =
        raw.toLowerCase();


      /* ================================================
         NETWORK
      ================================================ */

      if(
        lower.includes("failed to fetch") ||
        lower.includes("networkerror") ||
        lower.includes("err_name_not_resolved") ||
        lower.includes("fetch")
      ){

        showMessage(
          "🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი და სცადე თავიდან.",
          "error"
        );

      }


      /* ================================================
         WRONG LOGIN
      ================================================ */

      else if(
        lower.includes("invalid login credentials") ||
        lower.includes("invalid_credentials")
      ){

        showMessage(
          "❌ ელფოსტა ან პაროლი არასწორია.",
          "error"
        );

      }


      /* ================================================
         EMAIL NOT CONFIRMED
      ================================================ */

      else if(
        lower.includes("email not confirmed")
      ){

        showMessage(
          "📧 ელფოსტა ჯერ არ არის დადასტურებული. შეამოწმე ელფოსტა და დაადასტურე ანგარიში.",
          "error"
        );

      }


      /* ================================================
         RATE LIMIT
      ================================================ */

      else if(
        lower.includes("rate limit") ||
        lower.includes("too many requests")
      ){

        showMessage(
          "⏳ ძალიან ბევრი მცდელობაა. ცოტა ხანში სცადე თავიდან.",
          "error"
        );

      }


      /* ================================================
         AUTH CLIENT
      ================================================ */

      else if(
        raw === "AUTH_CLIENT_NOT_READY"
      ){

        showMessage(
          "❌ ავტორიზაციის სისტემა ვერ ჩაიტვირთა. განაახლე გვერდი და სცადე თავიდან.",
          "error"
        );

      }


      /* ================================================
         OTHER
      ================================================ */

      else{

        showMessage(
          "❌ " +
          (
            raw ||
            "შესვლა ვერ მოხერხდა. სცადე თავიდან."
          ),
          "error"
        );

      }

    }


    finally{

      loginButton.disabled =
        false;

      loginButton.textContent =
        "🚀 შესვლა";

    }

  }
);

})();
</script>
