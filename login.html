<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#075eff55,transparent 28%),radial-gradient(circle at 85% 20%,#00eaff33,transparent 30%),linear-gradient(135deg,#02091c,#043c55 55%,#071b30)}.box{width:min(500px,calc(100% - 30px));padding:35px;border-radius:30px;background:linear-gradient(145deg,#102d4d,#123b35);border:1px solid #00eaff99;box-shadow:0 25px 70px #000b,0 0 35px #00eaff44}.logo{text-align:center;font-size:65px}.h{text-align:center;font-size:34px;color:#ffe600;margin:10px 0}.sub{text-align:center;color:#dffcff;margin-bottom:28px;font-weight:bold}label{display:block;margin:14px 0 7px;color:#6dffbf;font-weight:900}input{width:100%;padding:15px;border-radius:14px;border:1px solid #00eaff77;background:#06162f;color:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#075eff,#00d084,#ffe600);color:#06162f;font-size:17px;font-weight:1000}.message{text-align:center;min-height:45px;margin-top:18px;font-weight:900;line-height:1.5}.links{text-align:center;margin-top:20px}.links a{color:#ffe600;font-weight:900;text-decoration:none;margin:0 8px}</style>
</head><body><div class="box"><div class="logo">🔐</div><h1 class="h">შესვლა</h1><div class="sub">🌈 English with Mariami</div><form id="loginForm" autocomplete="on"><label>📧 ელფოსტა</label><input type="email" id="email" name="email" autocomplete="username" required><label>🔐 პაროლი</label><input type="password" id="password" name="password" autocomplete="current-password" required><button type="submit" id="loginBtn">🚀 შესვლა</button></form><div id="message" class="message"></div><div class="links">არ გაქვს ანგარიში? <a href="register.html">📝 რეგისტრაცია</a><br><br><a href="index.html">🏠 მთავარი</a></div></div>
<script>const SUPABASE_URL="https://vtdhvsfqhwesxtwmduew.supabase.co",SUPABASE_KEY="sb_publishable_MnrM2ulyJY_ugwfFVfpV5wjCmt",STORAGE_KEY="english-with-mariami-auth";const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:STORAGE_KEY}});const form=document.getElementById('loginForm'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),msg=document.getElementById('message'),btn=document.getElementById('loginBtn');form.addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();btn.disabled=true;btn.textContent='⏳ მოწმდება...';msg.textContent='🔎 ვამოწმებ მონაცემებს...';try{const {data,error}=await db.auth.signInWithPassword({email:emailInput.value.trim(),password:passwordInput.value});if(error){msg.textContent='❌ '+error.message;btn.disabled=false;btn.textContent='🚀 შესვლა';return}if(!data?.session){msg.textContent='❌ ანგარიში ვერ დადასტურდა.';btn.disabled=false;btn.textContent='🚀 შესვლა';return}msg.textContent='🎉 წარმატებით შეხვედი!';setTimeout(()=>window.location.href='student.html',500)}catch(err){console.error(err);msg.textContent='❌ კავშირის შეცდომა. სცადე თავიდან.';btn.disabled=false;btn.textContent='🚀 შესვლა'}});</script></body></html>
