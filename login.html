<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>შესვლა — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;color:#fff;background:#070b1f;perspective:1200px}.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 20%,#6c5ce744,transparent 35%),radial-gradient(circle at 80% 80%,#ff7b7240,transparent 35%),linear-gradient(135deg,#070b1f,#111936 55%,#080c20)}.orb{position:absolute;border-radius:50%;filter:blur(2px);animation:float 8s ease-in-out infinite}.one{width:260px;height:260px;left:-70px;top:-50px;background:linear-gradient(135deg,#6c5ce7,#4b39b8);box-shadow:0 0 100px #6c5ce766}.two{width:210px;height:210px;right:-50px;bottom:-30px;background:linear-gradient(135deg,#ff7b72,#c84d69);box-shadow:0 0 90px #ff7b7266;animation-delay:-3s}.stars{position:absolute;inset:0;background-image:radial-gradient(#ffffffaa 1px,transparent 1px),radial-gradient(#ffffff66 1px,transparent 1px);background-size:70px 70px,110px 110px;opacity:.35}.card{position:relative;width:100%;max-width:450px;padding:38px;border:1px solid #ffffff26;border-radius:30px;background:linear-gradient(145deg,#ffffff18,#ffffff08);box-shadow:inset 0 1px #ffffff22,0 35px 80px #0009,0 0 45px #6c5ce722;backdrop-filter:blur(20px);transform:rotateX(2deg) rotateY(-2deg);animation:appear .8s ease-out}.logo{text-align:center;font-size:4rem;filter:drop-shadow(0 12px 10px #0008);animation:bob 3s ease-in-out infinite}.eyebrow{text-align:center;color:#ffe66d;font-weight:900;letter-spacing:2px;text-transform:uppercase;font-size:12px}.card h1{text-align:center;margin:8px 0;font-size:34px;text-shadow:0 5px 20px #0008}.sub{text-align:center;color:#c9cde0;margin:0 0 28px}.field{margin-bottom:18px}label{display:block;font-weight:800;margin-bottom:8px;color:#eef0ff}input{width:100%;padding:15px 16px;border:1px solid #ffffff25;border-radius:15px;background:#05091a99;color:#fff;font-size:16px;outline:none;box-shadow:inset 0 3px 12px #0006;transition:.25s}input::placeholder{color:#7e849d}input:focus{border-color:#8f83ff;box-shadow:0 0 0 4px #6c5ce722,inset 0 3px 12px #0006;transform:translateY(-2px)}button{width:100%;border:0;border-radius:15px;padding:16px;background:linear-gradient(135deg,#8f83ff,#6c5ce7);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 12px 25px #6c5ce744,inset 0 1px #ffffff55;transition:.25s}button:hover{transform:translateY(-3px);box-shadow:0 18px 35px #6c5ce766}button:disabled{opacity:.6;cursor:wait}.message{margin-top:16px;text-align:center;line-height:1.5;font-weight:700}.success{color:#65e6a5}.error{color:#ff8585}.register{text-align:center;margin-top:22px;color:#c9cde0}.register a{color:#ffe66d;font-weight:900;text-decoration:none}.brand{text-align:center;font-size:13px;color:#858ba5;margin-top:22px}@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-25px)}}@keyframes bob{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-8px) rotateY(8deg)}}@keyframes appear{from{opacity:0;transform:translateY(25px) rotateX(8deg) rotateY(-8deg) scale(.97)}to{opacity:1;transform:rotateX(2deg) rotateY(-2deg) scale(1)}}@media(max-width:600px){.card{padding:28px 22px}.logo{font-size:3.4rem}.card h1{font-size:29px}}</style></head><body><div class="scene"><div class="stars"></div><div class="orb one"></div><div class="orb two"></div></div><main class="card"><div class="logo">🌈📚</div><div class="eyebrow">English with Mariami</div><h1>🔐 შესვლა</h1><p class="sub">კეთილი იყოს შენი დაბრუნება! 🎓</p><form id="loginForm"><div class="field"><label for="email">📧 ელფოსტა</label><input id="email" type="email" required autocomplete="email" placeholder="example@gmail.com"></div><div class="field"><label for="password">🔑 პაროლი</label><input id="password" type="password" required autocomplete="current-password" placeholder="შეიყვანე პაროლი"></div><button id="submitBtn" type="submit">🚀 შესვლა</button><div id="message" class="message"></div></form><div class="register">არ გაქვს ანგარიში? <a href="register.html">რეგისტრაცია →</a></div><div class="brand">ისწავლე • ივარჯიშე • ითამაშე 🇬🇧🇬🇪</div></main><script>const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById('loginForm'),message=document.getElementById('message'),submitBtn=document.getElementById('submitBtn');form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';message.className='message';submitBtn.disabled=true;submitBtn.textContent='მიმდინარეობს...';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.user)throw new Error('შესვლა ვერ მოხერხდა.');const user=data.user,meta=user.user_metadata||{};let{data:profile,error:profileError}=await supabaseClient.from('profiles').select('user_id,role').eq('user_id',user.id).maybeSingle();if(profileError)throw profileError;if(!profile){const{data:newProfile,error:insertError}=await supabaseClient.from('profiles').insert({user_id:user.id,full_name:meta.full_name||user.email?.split('@')[0]||'მოსწავლე',grade:Number(meta.grade)||2,role:'student',points:0}).select('user_id,role').single();if(insertError)throw insertError;profile=newProfile;}message.className='message success';message.textContent='🎉 წარმატებით შეხვედი!';setTimeout(()=>{window.location.href=profile?.role==='teacher'?'admin.html':'platform.html'},500)}catch(error){console.error(error);message.className='message error';message.textContent='❌ '+(error.message||'ელფოსტა ან პაროლი არასწორია.')}finally{submitBtn.disabled=false;submitBtn.textContent='🚀 შესვლა'}});</script></body></html>
