<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔐 შესვლა | English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#075eff55,transparent 28%),radial-gradient(circle at 85% 20%,#00eaff33,transparent 30%),linear-gradient(135deg,#02091c,#043c55 55%,#071b30)}.box{width:min(500px,calc(100% - 30px));padding:35px;border-radius:30px;background:linear-gradient(145deg,#102d4d,#123b35);border:1px solid #00eaff99;box-shadow:0 25px 70px #000b,0 0 35px #00eaff44}.logo{text-align:center;font-size:65px}.h{text-align:center;font-size:34px;color:#ffe600;margin:10px 0}.sub{text-align:center;color:#dffcff;margin-bottom:28px;font-weight:bold}label{display:block;margin:14px 0 7px;color:#6dffbf;font-weight:900}input{width:100%;padding:15px;border-radius:14px;border:1px solid #00eaff77;background:#06162f;color:#fff;font-size:16px;outline:none}button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#075eff,#00d084,#ffe600);color:#06162f;font-size:17px;font-weight:1000;cursor:pointer}button:disabled{opacity:.65}.message{text-align:center;min-height:45px;margin-top:18px;font-weight:900}.links{text-align:center;margin-top:20px}.links a{color:#ffe600;font-weight:900;text-decoration:none}</style></head><body><div class="box"><div class="logo">🔐</div><h1 class="h">შესვლა</h1><div class="sub">🌈 English with Mariami</div><form id="loginForm" autocomplete="on"><label>📧 ელფოსტა</label><input type="email" id="email" autocomplete="username" required><label>🔐 პაროლი</label><input type="password" id="password" autocomplete="current-password" required><button id="loginBtn" type="submit">🚀 შესვლა</button></form><div id="message" class="message"></div><div class="links">არ გაქვს ანგარიში? <a href="register.html">📝 რეგისტრაცია</a><br><br><a href="index.html">🏠 მთავარი</a></div></div><script>const STORAGE_KEY='english-with-mariami-auth';const db=supabase.createClient('https://vtdhvsfqhwesxtwmduew.supabase.co','sb_publishable_MnrM2ulyJY_ugwfFVfpQYA_iV5wjCmt',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:STORAGE_KEY}});const form=document.getElementById('loginForm'),email=document.getElementById('email'),password=document.getElementById('password'),msg=document.getElementById('message'),btn=document.getElementById('loginBtn');const q=new URLSearchParams(location.search),redirect=q.get('redirect');(async()=>{for(let i=0;i<6;i++){const {data}=await db.auth.getSession();if(data&&data.session){location.replace(redirect&&redirect.includes('.html')?redirect:'student.html');return}await new Promise(r=>setTimeout(r,400));}})();form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='⏳ მოწმდება...';msg.style.color='#ffe600';msg.textContent='🔎 ვამოწმებ მონაცემებს...';const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.style.color='#ff7777';msg.textContent='❌ '+error.message;btn.disabled=false;btn.textContent='🚀 შესვლა';return}if(!data.session){msg.style.color='#ff7777';msg.textContent='❌ სესია ვერ შეიქმნა.';btn.disabled=false;btn.textContent='🚀 შესვლა';return}msg.style.color='#6dffbf';msg.textContent='🎉 წარმატებით შეხვედი!';await new Promise(r=>setTimeout(r,300));location.replace(redirect&&redirect.includes('.html')?redirect:'student.html')});</script></body></html>
