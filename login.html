<!doctype html>
<html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>შესვლა — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#fff7ec);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#172033}.card{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 15px 45px rgba(30,60,100,.15)}h1{text-align:center;margin:0 0 8px;font-size:30px}.sub{text-align:center;color:#667085;margin:0 0 26px}.field{margin-bottom:16px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#5b8def;box-shadow:0 0 0 3px rgba(91,141,239,.12)}button{width:100%;border:0;border-radius:12px;padding:14px;background:#4169e1;color:#fff;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.message{margin-top:16px;text-align:center;line-height:1.5}.success{color:#16803c}.error{color:#c62828}.register{text-align:center;margin-top:20px}.register a{color:#4169e1;font-weight:700;text-decoration:none}.brand{text-align:center;font-size:14px;color:#7b8190;margin-top:22px}</style></head><body><main class="card"><h1>🔐 შესვლა</h1><p class="sub">კეთილი იყოს შენი დაბრუნება! 🎓</p><form id="loginForm"><div class="field"><label for="email">ელფოსტა</label><input id="email" type="email" required placeholder="example@gmail.com"></div><div class="field"><label for="password">პაროლი</label><input id="password" type="password" required placeholder="შეიყვანე პაროლი"></div><button id="submitBtn" type="submit">🚀 შესვლა</button><div id="message" class="message"></div></form><div class="register">არ გაქვს ანგარიში? <a href="register.html">რეგისტრაცია</a></div><div class="brand">English with Mariami 🇬🇪 🇬🇧</div></main><script>
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById('loginForm'),message=document.getElementById('message'),submitBtn=document.getElementById('submitBtn');
form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';message.className='message';submitBtn.disabled=true;submitBtn.textContent='მიმდინარეობს...';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.user)throw new Error('შესვლა ვერ მოხერხდა.');const user=data.user,meta=user.user_metadata||{};let{data:profile,error:profileError}=await supabaseClient.from('profiles').select('user_id,role').eq('user_id',user.id).maybeSingle();if(profileError)throw profileError;if(!profile){const{data:newProfile,error:insertError}=await supabaseClient.from('profiles').insert({user_id:user.id,full_name:meta.full_name||user.email?.split('@')[0]||'მოსწავლე',grade:Number(meta.grade)||2,role:'student',points:0}).select('user_id,role').single();if(insertError)throw insertError;profile=newProfile;}message.className='message success';message.textContent='🎉 წარმატებით შეხვედი!';setTimeout(()=>{window.location.href=profile?.role==='teacher'?'admin.html':'index.html'},500)}catch(error){console.error(error);message.className='message error';message.textContent='❌ '+(error.message||'ელფოსტა ან პაროლი არასწორია.')}finally{submitBtn.disabled=false;submitBtn.textContent='🚀 შესვლა'}});
</script></body></html>
