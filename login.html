<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔐 შესვლა | English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#02091c,#043c55)}.box{width:min(500px,calc(100% - 30px));padding:35px;border-radius:30px;background:#102d4d;border:1px solid #00eaff}input{width:100%;padding:15px;margin:7px 0 14px;box-sizing:border-box;border-radius:14px;background:#06162f;color:#fff;border:1px solid #00eaff77}button{width:100%;padding:16px;border:0;border-radius:16px;background:#00d084;font-weight:bold}.message{text-align:center;min-height:35px;margin-top:15px}.links{text-align:center;margin-top:20px}.links a{color:#ffe600;font-weight:bold;text-decoration:none}</style></head><body><div class="box"><div style="text-align:center;font-size:60px">🔐</div><h1 style="text-align:center;color:#ffe600">შესვლა</h1><form id="loginForm"><label>📧 ელფოსტა</label><input type="email" id="email" autocomplete="username" required><label>🔐 პაროლი</label><input type="password" id="password" autocomplete="current-password" required><button id="loginBtn">🚀 შესვლა</button></form><div id="message" class="message"></div><div class="links">არ გაქვს ანგარიში? <a href="register.html">📝 რეგისტრაცია</a><br><br><a href="index.html">🏠 მთავარი</a></div></div><script>const db=supabase.createClient('https://vtdhvsfqhwesxtwmdue.supabase.co','sb_publishable_MnrM2ulyJY_ugwfFVfpV5wjCmt',{auth:{storageKey:'english-with-mariami-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});const q=new URLSearchParams(location.search),redirect=q.get('redirect');(async()=>{const r=await db.auth.getSession();if(r.data?.session)location.replace(redirect&&redirect.endsWith('.html')?redirect:'index.html')})();document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('loginBtn'),m=document.getElementById('message');b.disabled=true;b.textContent='⏳ მოწმდება...';const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){m.textContent='❌ '+r.error.message;b.disabled=false;b.textContent='🚀 შესვლა';return}m.textContent='🎉 წარმატებით შეხვედი!';setTimeout(()=>location.replace(redirect&&redirect.endsWith('.html')?redirect:'index.html'),300)}</script></body></html>
