<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English with Mariami — შესვლა</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;

      font-family: Arial, "Noto Sans Georgian", sans-serif;
      color: white;

      background:
        radial-gradient(circle at 50% 30%, #bdf5ff 0%, #4fb9e5 20%, #14537d 48%, #020817 75%);
    }

    /* 🌊 მოძრავი ნეონური ტალღები */
    body::before,
    body::after {
      content: "";
      position: fixed;
      left: -20%;
      width: 140%;
      height: 180px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.35;
      filter: blur(4px);
    }

    body::before {
      top: 8%;
      border: 2px solid #00eaff;
      box-shadow:
        0 0 20px #00eaff,
        0 0 50px #00eaff;
      animation: wave1 8s ease-in-out infinite;
    }

    body::after {
      bottom: 8%;
      border: 2px solid #075eff;
      box-shadow:
        0 0 20px #075eff,
        0 0 50px #075eff;
      animation: wave2 10s ease-in-out infinite;
    }

    @keyframes wave1 {
      0%, 100% {
        transform: translateX(-30px) rotate(-3deg);
      }

      50% {
        transform: translateX(30px) rotate(3deg);
      }
    }

    @keyframes wave2 {
      0%, 100% {
        transform: translateX(30px) rotate(3deg);
      }

      50% {
        transform: translateX(-30px) rotate(-3deg);
      }
    }

    /* ✨ მთავარი ბარათი */
    .login-card {
      position: relative;
      z-index: 5;

      width: min(430px, 100%);
      padding: 35px 28px;

      text-align: center;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(2, 24, 42, 0.94),
          rgba(2, 8, 23, 0.97)
        );

      border: 1px solid rgba(0, 234, 255, 0.65);

      box-shadow:
        0 30px 90px rgba(0,0,0,0.8),
        0 0 45px rgba(0,234,255,0.3),
        inset 0 1px 0 rgba(255,255,255,0.12);

      backdrop-filter: blur(18px);
    }

    .logo {
      font-size: 58px;
      line-height: 1;
      margin-bottom: 10px;

      filter:
        drop-shadow(0 0 8px #00eaff)
        drop-shadow(0 0 20px #075eff);

      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .brand {
      font-size: 25px;
      font-weight: 900;

      text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
    }

    .subtitle {
      margin: 8px 0 25px;
      color: #c9f5ff;
    }

    h1 {
      margin: 10px 0;
      color: #00eaff;

      text-shadow:
        0 0 10px #00eaff,
        0 0 25px #00eaff;
    }

    p {
      color: #d9f7ff;
    }

    .form-group {
      margin: 17px 0;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;

      color: #ffe600;
      font-weight: 900;
    }

    .form-group input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border-radius: 15px;
      border: 1px solid rgba(0,234,255,0.4);

      outline: none;

      background:
        linear-gradient(
          145deg,
          #041733,
          #020b1e
        );

      color: white;
      font-size: 16px;

      box-shadow:
        inset 0 0 15px rgba(0,0,0,0.5);
    }

    .form-group input:focus {
      border-color: #00eaff;

      box-shadow:
        0 0 12px rgba(0,234,255,0.4),
        inset 0 0 10px rgba(0,234,255,0.08);
    }

    .login-button {
      width: 100%;
      height: 55px;

      margin-top: 8px;

      border: 1px solid #8ff7ff;
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #00eaff,
          #008cff
        );

      color: #00131a;

      font-size: 18px;
      font-weight: 1000;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(0,234,255,0.35);

      transition: 0.2s;
    }

    .login-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 25px rgba(0,234,255,0.65);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .forgot {
      display: inline-block;

      margin-top: 17px;
      padding: 9px 13px;

      border-radius: 12px;

      color: #ffe600;
      font-weight: 900;
      text-decoration: none;

      background: rgba(6,36,67,0.8);
      border: 1px solid rgba(0,234,255,0.25);
    }

    .links {
      margin-top: 16px;
    }

    .links a {
      display: inline-block;

      margin: 5px;
      padding: 9px 13px;

      border-radius: 12px;

      color: #ffe600;
      font-weight: 900;
      text-decoration: none;

      background: rgba(6,36,67,0.8);
      border: 1px solid rgba(0,234,255,0.25);
    }

    .message {
      min-height: 25px;
      margin-top: 15px;

      font-weight: 700;
    }

    .error {
      color: #ff7894;
    }

    .success {
      color: #5dffad;
    }

    /* © მხოლოდ ერთი */
    .site-copyright {
      margin-top: 25px;
      padding: 15px 5px;

      border-top: 1px solid rgba(0,234,255,0.2);

      color: #9dc7d5;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .login-card {
        padding: 28px 20px;
        border-radius: 27px;
      }

      .brand {
        font-size: 21px;
      }

      .logo {
        font-size: 50px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>

<style id="site-copyright-style">.site-copyright{margin-top:30px;padding:18px 12px;text-align:center;color:#9dc7d5;font-size:14px;border-top:1px solid #00eaff33;background:linear-gradient(180deg,transparent,#020b19aa);letter-spacing:.2px}.site-copyright::first-letter{color:#00eaff}</style>
</head>

<body>

  <main class="login-card">

    <div class="logo">🌈📚</div>

    <div class="brand">
      English with Mariami
    </div>

    <div class="subtitle">
      ინგლისურის სასწავლო აკადემია ✨
    </div>

    <h1>🔐 შესვლა</h1>

    <p>
      კეთილი იყოს შენი დაბრუნება! 🎓
    </p>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          📧 ელფოსტა
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          placeholder="შეიყვანე ელფოსტა"
        >

      </div>


      <div class="form-group">

        <label for="password">
          🔑 პაროლი
        </label>

        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
          placeholder="შეიყვანე პაროლი"
        >

      </div>


      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        🚀 შესვლა
      </button>

    </form>


    <a
      href="reset-password.html"
      class="forgot"
    >
      🔑 დაგავიწყდა პაროლი?
    </a>


    <div
      id="message"
      class="message"
    ></div>


    <div class="links">

      <a href="register.html">
        📝 რეგისტრაცია
      </a>

      <a href="index.html">
        🏠 მთავარი
      </a>

    </div>


    <!-- მხოლოდ ერთი Copyright -->
    <footer class="site-copyright">
      © 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer
    </footer>

  </main>


  <script>

    (function () {

      const supabaseClient =
        window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

      const form =
        document.getElementById("loginForm");

      const email =
        document.getElementById("email");

      const password =
        document.getElementById("password");

      const button =
        document.getElementById("loginButton");

      const message =
        document.getElementById("message");


      if (!supabaseClient) {

        message.className =
          "message error";

        message.textContent =
          "❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.";

        return;
      }


      form.addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();


          const em =
            email.value
              .trim()
              .toLowerCase();

          const pw =
            password.value;


          if (!em || !pw) {

            message.className =
              "message error";

            message.textContent =
              "⚠️ შეავსე ელფოსტა და პაროლი.";

            return;
          }


          button.disabled = true;

          button.textContent =
            "⏳ შესვლა...";

          message.className =
            "message";

          message.textContent =
            "";


          try {

            const result =
              await supabaseClient.auth.signInWithPassword({

                email: em,

                password: pw

              });


            const data =
              result.data;

            const error =
              result.error;


            if (error) {

              console.error(
                "Supabase login:",
                error
              );

              let text =
                "❌ შესვლა ვერ მოხერხდა.";

              if (
                /invalid login credentials/i
                .test(error.message)
              ) {

                text =
                  "❌ ელფოსტა ან პაროლი არასწორია.";

              } else if (
                /email not confirmed/i
                .test(error.message)
              ) {

                text =
                  "📧 ელფოსტა ჯერ არ არის დადასტურებული.";

              } else if (
                /failed to fetch/i
                .test(error.message)
              ) {

                text =
                  "🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი.";

              } else {

                text =
                  "❌ " + error.message;
              }


              message.className =
                "message error";

              message.textContent =
                text;

              return;
            }


            if (!data || !data.session) {

              throw new Error(
                "სესია ვერ შეიქმნა."
              );

            }


            message.className =
              "message success";

            message.textContent =
              "✅ შესვლა წარმატებულია!";


            setTimeout(
              function () {

                location.replace(
                  "academy.html"
                );

              },
              500
            );


          } catch (err) {

            console.error(
              "Login error:",
              err
            );

            message.className =
              "message error";

            message.textContent =
              "❌ მოხდა შეცდომა: " +
              (
                err.message ||
                "სცადე თავიდან."
              );

          } finally {

            button.disabled = false;

            button.textContent =
              "🚀 შესვლა";

          }

        }
      );

    })();

  </script>

<!-- SITE-COPYRIGHT-2026 -->
<footer class="site-copyright">© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer</footer>

</body>
</html>
