<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>English with Mariami — შესვლა</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
min-height:100%;
font-family:Arial,"Noto Sans Georgian",sans-serif;
}

body{
min-height:100vh;
overflow:hidden;
color:white;

background:
radial-gradient(
circle at 50% 35%,
#bdf5ff 0%,
#4fb9e5 25%,
#14537d 55%,
#020817 100%
);
}

/* =====================================
   3D WORLD
===================================== */

.world{
position:fixed;
inset:0;
overflow:hidden;
perspective:1000px;
}

/* დიდი განათება */

.glow{
position:absolute;
left:50%;
top:40%;

width:600px;
height:600px;

transform:
translate(-50%,-50%);

border-radius:50%;

background:
radial-gradient(
circle,
#00eaff55 0%,
#008cff22 35%,
transparent 70%
);

filter:blur(5px);

animation:
pulse 5s ease-in-out infinite;
}

@keyframes pulse{

0%,100%{
transform:translate(-50%,-50%) scale(.8);
opacity:.55;
}

50%{
transform:translate(-50%,-50%) scale(1.2);
opacity:1;
}

}

/* =====================================
   3D FLOOR
===================================== */

.floor{
position:absolute;

left:-30%;
bottom:-35%;

width:160%;
height:65%;

transform:
perspective(500px)
rotateX(65deg);

background-image:

linear-gradient(
#00eaff38 1px,
transparent 1px
),

linear-gradient(
90deg,
#00eaff38 1px,
transparent 1px
);

background-size:55px 55px;

mask-image:
linear-gradient(
to top,
black,
transparent
);

opacity:.8;
}

/* =====================================
   FLOATING OBJECTS
===================================== */

.object{
position:absolute;

font-size:70px;

user-select:none;

filter:
drop-shadow(
0 0 15px #00eaff
);

animation:
floatObject 7s ease-in-out infinite;
}

.book1{
left:7%;
top:18%;
animation-delay:-1s;
}

.book2{
right:8%;
top:25%;
font-size:55px;
animation-delay:-4s;
}

.pencil{
left:15%;
bottom:18%;
font-size:55px;
animation-delay:-2s;
}

.school{
right:13%;
bottom:15%;
font-size:65px;
animation-delay:-5s;
}

@keyframes floatObject{

0%,100%{
transform:
translate3d(0,0,0)
rotateY(-20deg)
rotateZ(-5deg);
}

50%{
transform:
translate3d(35px,-45px,100px)
rotateY(30deg)
rotateZ(8deg);
}

}

/* =====================================
   FLOATING LETTERS
===================================== */

.letter{
position:absolute;

font-size:90px;
font-weight:1000;

color:white;

text-shadow:
0 0 5px white,
0 0 18px #00eaff,
0 0 40px #009cff,
0 0 80px #006cff;

animation:
letterFloat 8s ease-in-out infinite;
}

.l1{
left:5%;
top:50%;
animation-delay:-2s;
}

.l2{
left:27%;
top:8%;
font-size:55px;
animation-delay:-5s;
}

.l3{
right:25%;
top:12%;
font-size:65px;
animation-delay:-3s;
}

.l4{
right:4%;
top:55%;
font-size:90px;
animation-delay:-6s;
}

.l5{
left:42%;
bottom:8%;
font-size:50px;
animation-delay:-1s;
}

@keyframes letterFloat{

0%,100%{
transform:
translate3d(0,0,0)
rotateY(-15deg)
rotateZ(-3deg);
}

50%{
transform:
translate3d(30px,-40px,80px)
rotateY(25deg)
rotateZ(5deg);
}

}

/* =====================================
   PARTICLES
===================================== */

.particle{
position:absolute;

width:5px;
height:5px;

border-radius:50%;

background:#fff;

box-shadow:
0 0 10px #00eaff,
0 0 20px #00eaff;

animation:
particleMove 6s linear infinite;
}

.p1{left:20%;top:70%;animation-delay:-1s}
.p2{left:35%;top:25%;animation-delay:-3s}
.p3{left:70%;top:65%;animation-delay:-2s}
.p4{left:80%;top:35%;animation-delay:-5s}
.p5{left:55%;top:15%;animation-delay:-4s}
.p6{left:10%;top:35%;animation-delay:-6s}

@keyframes particleMove{

0%{
transform:
translateY(30px);
opacity:0;
}

30%{
opacity:1;
}

70%{
opacity:1;
}

100%{
transform:
translateY(-100px);
opacity:0;
}

}

/* =====================================
   LOGIN AREA
===================================== */

.login-wrapper{
position:relative;

z-index:20;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;
}

/* =====================================
   LOGIN CARD
===================================== */

.login-card{

width:min(430px,100%);

padding:38px 30px;

text-align:center;

border-radius:30px;

background:
linear-gradient(
145deg,
#02182bea,
#020817ed
);

border:
1px solid #00eaff88;

box-shadow:

0 30px 90px #000c,

0 0 45px #00eaff44,

inset 0 0 30px #00eaff0c;

backdrop-filter:
blur(18px);

animation:
cardAppear 1s ease both;
}

@keyframes cardAppear{

from{
opacity:0;
transform:
translateY(35px)
scale(.94);
}

to{
opacity:1;
transform:
translateY(0)
scale(1);
}

}

/* =====================================
   LOGO
===================================== */

.logo{

font-size:65px;

margin-bottom:5px;

filter:
drop-shadow(
0 0 20px #00eaff
);

animation:
logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:
translateY(-10px)
rotate(-3deg);
}

}

.brand{

font-size:25px;

font-weight:1000;

color:white;

text-shadow:
0 0 15px #00eaff;
}

.subtitle{

margin-top:8px;

color:#c9f5ff;

font-size:15px;

}

/* =====================================
   TITLE
===================================== */

.login-card h1{

font-size:32px;

margin:25px 0 8px;

color:#00eaff;

text-shadow:
0 0 20px #00eaff88;
}

.welcome{

color:#d9f7ff;

margin-bottom:25px;

}

/* =====================================
   FORM
===================================== */

.form-group{

text-align:left;

margin-bottom:17px;
}

.form-group label{

display:block;

margin-bottom:7px;

font-weight:900;

color:#ffe600;

}

.form-group input{

width:100%;

padding:15px 16px;

border-radius:15px;

border:
1px solid #00eaff55;

outline:none;

background:#020d1eee;

color:white;

font-size:16px;

transition:.25s;

}

.form-group input::placeholder{

color:#82aebb;
}

.form-group input:focus{

border-color:#00eaff;

box-shadow:
0 0 0 3px #00eaff18,
0 0 25px #00eaff33;

transform:
translateY(-1px);
}

/* =====================================
   BUTTON
===================================== */

.login-button{

width:100%;

padding:15px;

border:0;

border-radius:16px;

cursor:pointer;

font-size:17px;

font-weight:1000;

color:#00131a;

background:
linear-gradient(
135deg,
#00eaff,
#008cff
);

box-shadow:
0 0 30px #00eaff66;

transition:.25s;

margin-top:5px;
}

.login-button:hover{

transform:
translateY(-3px)
scale(1.02);

box-shadow:
0 0 40px #00eaffaa;
}

.login-button:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;
}

/* =====================================
   LINKS
===================================== */

.links{

margin-top:22px;

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;
}

.links a{

padding:9px 13px;

border-radius:12px;

background:#062443cc;

border:
1px solid #00eaff44;

font-size:13px;

transition:.2s;
}

.links a:hover{

background:#00c9f2;

color:#00131a;

box-shadow:
0 0 20px #00eaff;
}

/* =====================================
   MESSAGE
===================================== */

.message{

min-height:22px;

margin-top:15px;

font-size:14px;

font-weight:bold;

color:#ffe600;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

body{
overflow:auto;
}

.login-wrapper{
padding:15px;
}

.login-card{

padding:30px 20px;

border-radius:25px;
}

.logo{
font-size:55px;
}

.brand{
font-size:21px;
}

.login-card h1{
font-size:28px;
}

.object{
font-size:45px;
}

.letter{
font-size:55px;
}

}

/* =====================================
   REDUCED MOTION
===================================== */

@media(prefers-reduced-motion:reduce){

*{
animation:none!important;
transition:none!important;
}

}

</style>
</head>

<body>

<!-- =====================================
     3D BACKGROUND
===================================== -->

<div class="world">

<div class="glow"></div>

<div class="floor"></div>


<!-- BOOKS -->

<div class="object book1">
📚
</div>

<div class="object book2">
📖
</div>

<div class="object pencil">
✏️
</div>

<div class="object school">
🎓
</div>


<!-- LETTERS -->

<div class="letter l1">A</div>

<div class="letter l2">B</div>

<div class="letter l3">C</div>

<div class="letter l4">D</div>

<div class="letter l5">E</div>


<!-- PARTICLES -->

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>

</div>


<!-- =====================================
     LOGIN
===================================== -->

<div class="login-wrapper">

<div class="login-card">

<div class="logo">
🌈📚
</div>

<div class="brand">
English with Mariami
</div>

<div class="subtitle">
ინგლისურის სასწავლო აკადემია ✨
</div>


<h1>
🔐 შესვლა
</h1>

<p class="welcome">
კეთილი იყოს შენი დაბრუნება! 🎓
</p>


<form id="loginForm">

<div class="form-group">

<label for="email">
📧 ელფოსტა
</label>

<input
id="email"
type="email"
placeholder="შეიყვანე ელფოსტა"
required
autocomplete="email"
>

</div>


<div class="form-group">

<label for="password">
🔑 პაროლი
</label>

<input
id="password"
type="password"
placeholder="შეიყვანე პაროლი"
required
autocomplete="current-password"
>

</div>


<button
id="loginButton"
class="login-button"
type="submit">

🚀 შესვლა

</button>

</form>


<div
id="message"
class="message">
</div>


<div class="links">

<a href="register.html">
📝 რეგისტრაცია
</a>

<a href="index.html">
🏠 მთავარი
</a>

</div>

</div>

</div>


<!-- =====================================
     SUPABASE LOGIN
===================================== -->

<script>

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const form =
document.getElementById("loginForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const button =
document.getElementById("loginButton");

const message =
document.getElementById("message");


form.addEventListener(
"submit",
async function(event){

event.preventDefault();

const email =
emailInput.value.trim();

const password =
passwordInput.value;


if(!email || !password){

message.textContent =
"⚠️ გთხოვ შეავსე ორივე ველი.";

return;

}


button.disabled = true;

button.textContent =
"⏳ შესვლა...";

message.textContent =
"";


try{

const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error){

console.error(error);

message.textContent =
"❌ ელფოსტა ან პაროლი არასწორია.";

button.disabled = false;

button.textContent =
"🚀 შესვლა";

return;

}


/*
   თუ login.html-ზე redirect
   პარამეტრი გვაქვს,
   მომხმარებელი დაბრუნდება
   იმ გვერდზე, საიდანაც მოვიდა.
*/

const params =
new URLSearchParams(
window.location.search
);

const redirect =
params.get("redirect");


if(
redirect &&
redirect.startsWith("/")
){

window.location.replace(
redirect
);

}else{

window.location.replace(
"academy.html"
);

}

}catch(error){

console.error(error);

message.textContent =
"❌ მოხდა შეცდომა. სცადე თავიდან.";

button.disabled = false;

button.textContent =
"🚀 შესვლა";

}

});

</script>

</body>
</html>
