<!DOCTYPE html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English with Mariami — შესვლა</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Georgian",sans-serif;color:#fff;background:radial-gradient(circle at 50% 35%,#bdf5ff,#4fb9e5 25%,#14537d 55%,#020817);display:flex;align-items:center;justify-content:center;padding:15px;overflow-x:hidden}.login-card{width:min(430px,100%);padding:35px 28px;text-align:center;border-radius:30px;background:linear-gradient(145deg,#02182bea,#020817ed);border:1px solid #00eaff88;box-shadow:0 30px 90px #000c,0 0 45px #00eaff44;backdrop-filter:blur(18px)}.logo{font-size:60px}.brand{font-size:25px;font-weight:1000;text-shadow:0 0 15px #00eaff}.subtitle{margin:8px 0;color:#c9f5ff}.login-card h1{color:#00eaff}.form-group{text-align:left;margin:16px 0}.form-group label{display:block;margin-bottom:7px;font-weight:900;color:#ffe600}.form-group input{width:100%;padding:14px;border-radius:15px;border:1px solid #00eaff55;outline:0;background:#020d1e;color:#fff;font-size:16px}.login-button{width:100%;padding:15px;border:0;cursor:pointer;border-radius:16px;font-size:17px;font-weight:900;background:linear-gradient(135deg,#00eaff,#008cff);color:#00131a}.login-button:disabled{opacity:.6}.forgot,.links a{display:inline-block;margin-top:17px;padding:9px 13px;border-radius:12px;color:#ffe600;font-weight:900;background:#062443cc;border:1px solid #00eaff44}.links{margin-top:15px}.message{min-height:24px;margin-top:15px;font-weight:bold;color:#ffe600}.error{color:#ff7894}.success{color:#5dffad}.site-copyright{margin-top:25px;padding:15px 5px;color:#9dc7d5;font-size:13px;border-top:1px solid #00eaff33}@media(max-width:600px){.login-card{padding:28px 20px}.brand{font-size:21px}}</style></head><body><main class="login-card"><div class="logo">🌈📚</div><div class="brand">English with Mariami</div><div class="subtitle">ინგლისურის სასწავლო აკადემია ✨</div><h1>🔐 შესვლა</h1><p>კეთილი იყოს შენი დაბრუნება! 🎓</p><form id="loginForm"><div class="form-group"><label for="email">📧 ელფოსტა</label><input id="email" type="email" required autocomplete="email" placeholder="შეიყვანე ელფოსტა"></div><div class="form-group"><label for="password">🔑 პაროლი</label><input id="password" type="password" required autocomplete="current-password" placeholder="შეიყვანე პაროლი"></div><button id="loginButton" class="login-button" type="submit">🚀 შესვლა</button></form><a href="reset-password.html" class="forgot">🔑 დაგავიწყდა პაროლი?</a><div id="message" class="message"></div><div class="links"><a href="register.html">📝 რეგისტრაცია</a><a href="index.html">🏠 მთავარი</a></div><footer class="site-copyright">© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer</footer></main><script>(function(){const supabaseClient=window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;const form=document.getElementById('loginForm'),email=document.getElementById('email'),password=document.getElementById('password'),button=document.getElementById('loginButton'),message=document.getElementById('message');if(!supabaseClient){message.className='message error';message.textContent='❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.';return}form.addEventListener('submit',async e=>{e.preventDefault();const em=email.value.trim().toLowerCase(),pw=password.value;if(!em||!pw){message.className='message error';message.textContent='⚠️ შეავსე ელფოსტა და პაროლი.';return}button.disabled=true;button.textContent='⏳ შესვლა...';message.className='message';message.textContent='';try{const{data,error}=await supabaseClient.auth.signInWithPassword({email:em,password:pw});if(error){console.error('Supabase login:',error);let t='❌ შესვლა ვერ მოხერხდა.';if(/failed to fetch/i.test(error.message))t='🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი და სცადე თავიდან.';else if(/invalid login credentials/i.test(error.message))t='❌ ელფოსტა ან პაროლი არასწორია. თუ ახლახან დარეგისტრირდი, ჯერ ელფოსტა დაადასტურე.';else if(/email not confirmed/i.test(error.message))t='📧 ელფოსტა ჯერ არ არის დადასტურებული. შეამოწმე ელფოსტა.';else if(/too many requests/i.test(error.message))t='⏳ ძალიან ბევრი მცდელობაა. ცოტა ხანში სცადე.';else t='❌ '+error.message;message.className='message error';message.textContent=t;return}if(!data.session)throw new Error('სესია ვერ შეიქმნა.');message.className='message success';message.textContent='✅ შესვლა წარმატებულია!';const r=new URLSearchParams(location.search).get('redirect');const safe=r&&(r.startsWith('/')||r.startsWith('academy.html')||r.startsWith('grade'));setTimeout(()=>location.replace(safe?r:'academy.html'),250)}catch(err){console.error('Login error:',err);message.className='message error';message.textContent='❌ მოხდა შეცდომა: '+(err.message||'სცადე თავიდან.')}finally{button.disabled=false;button.textContent='🚀 შესვლა'}})})();</script></body></html>
