<!DOCTYPE html>

<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>English with Mariami — შესვლა</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100svh;
  height:100svh;
  padding:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-family:Arial,"Noto Sans Georgian",sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 50% 30%,
      #bdf5ff 0%,
      #4fb9e5 20%,
      #14537d 48%,
      #020817 75%
    );
}

/* =========================
WAVES
========================= */

body::before,
body::after{
  content:"";

  position:fixed;

  left:-20%;

  width:140%;
  height:180px;

  border-radius:50%;

  pointer-events:none;

  opacity:.35;

  filter:blur(4px);
}

body::before{
  top:8%;

  border:2px solid #00eaff;

  box-shadow:
    0 0 20px #00eaff,
    0 0 50px #00eaff;

  animation:wave1 8s ease-in-out infinite;
}

body::after{
  bottom:8%;

  border:2px solid #075eff;

  box-shadow:
    0 0 20px #075eff,
    0 0 50px #075eff;

  animation:wave2 10s ease-in-out infinite;
}

@keyframes wave1{

  0%,100%{
    transform:
      translateX(-30px)
      rotate(-3deg);
  }

  50%{
    transform:
      translateX(30px)
      rotate(3deg);
  }

}

@keyframes wave2{

  0%,100%{
    transform:
      translateX(30px)
      rotate(3deg);
  }

  50%{
    transform:
      translateX(-30px)
      rotate(-3deg);
  }

}

/* =========================
LOGIN CARD
========================= */

.login-card{

  position:relative;

  z-index:5;

  width:min(
    430px,
    calc(100vw - 20px)
  );

  max-height:
    calc(100svh - 20px);

  padding:22px 26px;

  text-align:center;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(2,24,42,.96),
      rgba(2,8,23,.98)
    );

  border:
    1px solid rgba(0,234,255,.65);

  box-shadow:

    0 30px 90px rgba(0,0,0,.8),

    0 0 45px rgba(0,234,255,.3),

    inset
    0 1px 0 rgba(255,255,255,.12);

  backdrop-filter:blur(18px);

  overflow-y:auto;
  overflow-x:hidden;
}

/* =========================
LOGO
========================= */

.logo{

  font-size:47px;

  line-height:1;

  margin-bottom:6px;

  filter:
    drop-shadow(0 0 8px #00eaff)
    drop-shadow(0 0 20px #075eff);

  animation:
    logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-6px);
  }

}

/* =========================
BRAND
========================= */

.brand{

  font-size:23px;

  font-weight:900;

  color:#00eaff;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

.subtitle{

  margin:5px 0 14px;

  color:#c9f5ff;

  font-size:13px;
}

h1{

  margin:7px 0;

  color:#00eaff;

  font-size:28px;

  text-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}

p{

  color:#d9f7ff;

  margin:7px 0 12px;

  font-size:13px;
}

/* =========================
FORM
========================= */

.form-group{

  margin:10px 0;

  text-align:left;
}

.form-group label{

  display:block;

  margin-bottom:5px;

  color:#ffe600;

  font-weight:900;

  font-size:13px;
}

.form-group input{

  width:100%;

  height:46px;

  padding:0 14px;

  border-radius:14px;

  border:
    1px solid
    rgba(0,234,255,.4);

  outline:none;

  background:
    linear-gradient(
      145deg,
      #041733,
      #020b1e
    );

  color:#fff;

  font-size:15px;

  box-shadow:
    inset
    0 0 15px
    rgba(0,0,0,.5);
}

.form-group input::placeholder{

  color:#88aebb;
}

.form-group input:focus{

  border-color:#00eaff;

  box-shadow:

    0 0 12px
    rgba(0,234,255,.4),

    inset
    0 0 10px
    rgba(0,234,255,.08);
}

/* =========================
BUTTON
========================= */

.login-button{

  width:100%;

  height:49px;

  margin-top:5px;

  border:
    1px solid #8ff7ff;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #00eaff,
      #008cff
    );

  color:#00131a;

  font-size:17px;

  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 0 20px
    rgba(0,234,255,.35);

  transition:.2s;
}

.login-button:hover{

  transform:translateY(-2px);

  box-shadow:
    0 0 25px
    rgba(0,234,255,.65);
}

.login-button:disabled{

  opacity:.6;

  cursor:wait;
}

/* =========================
LINKS
========================= */

.links{

  margin-top:8px;
}

.links a{

  display:inline-block;

  margin:3px;

  padding:7px 10px;

  border-radius:11px;

  color:#ffe600;

  font-weight:900;

  font-size:12px;

  text-decoration:none;

  background:
    rgba(6,36,67,.8);

  border:
    1px solid
    rgba(0,234,255,.25);
}

.links a:hover{

  background:#00c9f2;

  color:#00131a;
}

/* =========================
MESSAGE
========================= */

.message{

  min-height:20px;

  margin-top:9px;

  font-weight:700;

  font-size:13px;
}

.error{
  color:#ff7894;
}

.success{
  color:#5dffad;
}

/* =========================
COPYRIGHT
========================= */

.site-copyright{

  margin-top:11px;

  padding:9px 5px;

  border-top:
    1px solid
    rgba(0,234,255,.2);

  color:#9dc7d5;

  font-size:10px;

  text-align:center;
}

/* =========================
PHONE
========================= */

@media(max-width:500px){

  body{
    padding:6px;
  }

  .login-card{

    width:
      calc(100vw - 12px);

    max-height:
      calc(100svh - 12px);

    padding:16px 17px;

    border-radius:24px;
  }

  .logo{
    font-size:39px;
  }

  .brand{
    font-size:19px;
  }

  .subtitle{
    font-size:12px;
    margin:4px 0 9px;
  }

  h1{
    font-size:25px;
    margin:5px 0;
  }

  p{
    font-size:12px;
    margin:5px 0 9px;
  }

  .form-group{
    margin:8px 0;
  }

  .form-group label{
    font-size:12px;
    margin-bottom:4px;
  }

  .form-group input{
    height:43px;
    font-size:14px;
  }

  .login-button{
    height:46px;
    font-size:16px;
  }

  .links{
    margin-top:6px;
  }

  .links a{
    font-size:11px;
    padding:6px 8px;
  }

  .message{
    font-size:12px;
    min-height:18px;
  }

  .site-copyright{
    margin-top:8px;
    padding:7px 3px;
    font-size:8px;
  }
}

/* =========================
VERY SMALL PHONE
========================= */

@media(max-width:380px){

  .login-card{
    padding:12px 14px;
  }

  .logo{
    font-size:35px;
  }

  .brand{
    font-size:17px;
  }

  .subtitle{
    font-size:11px;
  }

  h1{
    font-size:22px;
  }

  p{
    font-size:11px;
  }

  .form-group{
    margin:6px 0;
  }

  .form-group input{
    height:40px;
    font-size:13px;
  }

  .login-button{
    height:43px;
    font-size:15px;
  }

  .links a{
    font-size:10px;
    padding:5px 7px;
  }

  .site-copyright{
    font-size:7px;
  }
}
</style>

</head>

<body>

<main class="login-card">

  <div class="logo">
    🌈📚
  </div>

  <div class="brand">
    English with Mariami
  </div>

  <div class="subtitle">
    ინგლისურის სასწავლო აკადემია ✨
  </div>

  <h1>
    🔐 შესვლა
  </h1>

  <p>
    კეთილი იყოს შენი დაბრუნება! 🎓
  </p>

  <form id="loginForm">

```
<div class="form-group">

  <label for="email">
    📧 ელფოსტა
  </label>

  <input
    id="email"
    type="email"
    required
    autocomplete="email"
    placeholder="შეიყვანე ელფოსტა"
  >

</div>

<div class="form-group">

  <label for="password">
    🔑 პაროლი
  </label>

  <input
    id="password"
    type="password"
    required
    autocomplete="current-password"
    placeholder="შეიყვანე პაროლი"
  >

</div>

<button
  id="loginButton"
  class="login-button"
  type="submit"
>
  🚀 შესვლა
</button>
```

  </form>

  <div class="links">

```
<a href="reset-password.html">
  🔑 დაგავიწყდა პაროლი?
</a>
```

  </div>

  <div
    id="message"
    class="message"
    aria-live="polite"
  ></div>

  <div class="links">

```
<a href="register.html">
  📝 რეგისტრაცია
</a>

<a href="index.html">
  🏠 მთავარი
</a>
```

  </div>

  <footer class="site-copyright">
    © 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer
  </footer>

</main>

<script>
(function(){

"use strict";


const form =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


function setMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + (type || "");

}


/* =========================================
   GET SUPABASE CLIENT
========================================= */

async function getClient(){

  if(
    window.__ENGLISH_MARIAMI_SUPABASE_CLIENT
  ){

    return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

  }

  if(window.supabaseClient){

    return window.supabaseClient;

  }

  if(
    window.supabase &&
    typeof window.supabase.createClient === "function" &&
    typeof window.SUPABASE_URL === "string" &&
    typeof window.SUPABASE_KEY === "string"
  ){

    try{

      window.__ENGLISH_MARIAMI_SUPABASE_CLIENT =
        window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_KEY
        );

      return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

    }catch(error){

      console.error(error);

    }

  }


  return new Promise(function(resolve){

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      resolve(
        window.__ENGLISH_MARIAMI_SUPABASE_CLIENT ||
        window.supabaseClient ||
        null
      );

    }

    window.addEventListener(
      "englishMariamiSupabaseReady",
      done,
      {once:true}
    );

    setTimeout(done,5000);

  });

}


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    setMessage("","");


    const client =
      await getClient();


    if(!client){

      setMessage(
        "❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.",
        "error"
      );

      return;

    }


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    if(!email || !password){

      setMessage(
        "❌ შეავსე ორივე ველი.",
        "error"
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "⏳ შესვლა...";


    try{

      const result =
        await client.auth.signInWithPassword({

          email:email,

          password:password

        });


      const data =
        result.data;

      const error =
        result.error;


      if(error){

        throw error;

      }


      if(
        !data ||
        !data.session ||
        !data.user
      ){

        throw new Error(
          "სესია ვერ შეიქმნა."
        );

      }


      const user =
        data.user;


      /* =========================================
         PROFILE
      ========================================= */

      let role = "";

      let grade = 0;


      const profileResult =
        await client
          .from("profiles")
          .select(
            "role,grade"
          )
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if(profileResult.error){

        console.warn(
          "Profile read warning:",
          profileResult.error
        );

      }


      if(profileResult.data){

        role =
          String(
            profileResult.data.role || ""
          )
          .trim()
          .toLowerCase();


        grade =
          Number(
            profileResult.data.grade || 0
          );

      }


      /* =========================================
         REDIRECT
      ========================================= */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const requestedRedirect =
        params.get("redirect");


      /* =========================================
         TEACHER
      ========================================= */

      if(role === "teacher"){

        setMessage(
          "👩‍🏫 მასწავლებლის სივრცე იხსნება...",
          "success"
        );

        setTimeout(function(){

          window.location.replace(
            "teacher-dashboard.html"
          );

        },500);

        return;

      }


      /* =========================================
         PARENT
      ========================================= */

      if(role === "parent"){

        setMessage(
          "👨‍👩‍👧 მშობლის სივრცე იხსნება...",
          "success"
        );

        setTimeout(function(){

          window.location.replace(
            "parent-space.html"
          );

        },500);

        return;

      }


      /* =========================================
         STUDENT
      ========================================= */

      if(role === "student"){

        if(
          ![2,3,4].includes(grade)
        ){

          setMessage(
            "⚠️ ანგარიში აქტიურია, მაგრამ კლასი ჯერ არ არის მინიჭებული. მასწავლებელმა უნდა დაგინიშნოს კლასი.",
            "error"
          );

          await client.auth.signOut();

          return;

        }


        setMessage(
          "✅ შესვლა წარმატებულია! იხსნება მე-" +
          grade +
          " კლასის სივრცე...",
          "success"
        );


        setTimeout(function(){

          /*
          უსაფრთხოების მიზნით
          მომხმარებელი ყოველთვის
          საკუთარ კლასში გადადის.
          */

          window.location.replace(
            "grade" +
            grade +
            ".html"
          );

        },500);

        return;

      }


      /* =========================================
         UNKNOWN ROLE
      ========================================= */

      setMessage(
        "⚠️ ანგარიშის ტიპი ვერ განისაზღვრა. დაუკავშირდი მასწავლებელს.",
        "error"
      );

      await client.auth.signOut();


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      const text =
        String(
          error &&
          error.message
            ? error.message
            : ""
        );


      if(
        /invalid login credentials/i
          .test(text)
      ){

        setMessage(
          "❌ ელფოსტა ან პაროლი არასწორია.",
          "error"
        );

      }

      else if(
        /email not confirmed/i
          .test(text)
      ){

        setMessage(
          "📧 ჯერ დაადასტურე ელფოსტა.",
          "error"
        );

      }

      else if(
        /failed to fetch|networkerror|err_name_not_resolved/i
          .test(text)
      ){

        setMessage(
          "🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი.",
          "error"
        );

      }

      else{

        setMessage(
          "❌ " +
          (
            text ||
            "შესვლა ვერ მოხერხდა."
          ),
          "error"
        );

      }

    }finally{

      loginButton.disabled =
        false;

      loginButton.textContent =
        "🚀 შესვლა";

    }

  }

);

})();
</script>

</body>
</html>
