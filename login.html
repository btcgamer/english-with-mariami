<!doctype html>
<html lang="ka">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>🔐 შესვლა | English with Mariami</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at 15% 10%,#075eff55,transparent 28%),
radial-gradient(circle at 85% 20%,#00eaff33,transparent 30%),
radial-gradient(circle at 50% 100%,#00d08422,transparent 35%),
linear-gradient(135deg,#02091c,#043c55 55%,#071b30);
}

.box{

width:min(500px,calc(100% - 30px));

padding:35px;

border-radius:30px;

background:
linear-gradient(145deg,#102d4d,#123b35);

border:1px solid #00eaff99;

box-shadow:
0 25px 70px #000b,
0 0 35px #00eaff44,
inset 0 0 30px #00eaff0d;

}

.logo{

text-align:center;

font-size:65px;

filter:
drop-shadow(0 0 18px #00eaff);

}

h1{

text-align:center;

font-size:34px;

color:#ffe600;

margin:10px 0;

text-shadow:
0 0 15px #ffe60066;

}

.subtitle{

text-align:center;

color:#dffcff;

margin-bottom:28px;

font-weight:bold;

}

label{

display:block;

margin:14px 0 7px;

color:#6dffbf;

font-weight:900;

}

input{

width:100%;

padding:15px;

border-radius:14px;

border:1px solid #00eaff77;

background:#06162f;

color:#fff;

font-size:16px;

outline:none;

}

input:focus{

border-color:#00eaff;

box-shadow:
0 0 15px #00eaff55;

}

button{

width:100%;

margin-top:22px;

padding:16px;

border:0;

border-radius:16px;

background:
linear-gradient(
135deg,
#075eff,
#00d084,
#ffe600
);

color:#06162f;

font-size:17px;

font-weight:1000;

cursor:pointer;

box-shadow:
0 0 20px #00eaff66;

transition:.25s;

}

button:hover{

transform:
translateY(-3px)
scale(1.02);

box-shadow:
0 0 30px #00eaff;

}

button:disabled{

opacity:.6;

cursor:not-allowed;

}

.message{

text-align:center;

min-height:25px;

margin-top:18px;

font-weight:900;

line-height:1.5;

}

.register{

text-align:center;

margin-top:22px;

color:#dffcff;

}

.register a{

color:#ffe600;

font-weight:900;

text-decoration:none;

}

.home{

display:block;

text-align:center;

margin-top:20px;

padding:12px;

border-radius:14px;

background:#06162f;

border:1px solid #ffe600;

color:#ffe600;

text-decoration:none;

font-weight:900;

}

</style>

</head>

<body>


<div class="box">

<div class="logo">
🔐
</div>

<h1>
შესვლა
</h1>

<div class="subtitle">
🌈 English with Mariami
</div>


<form id="loginForm">


<label>
📧 ელფოსტა
</label>

<input
type="email"
id="email"
placeholder="შეიყვანე ელფოსტა"
required
>


<label>
🔐 პაროლი
</label>

<input
type="password"
id="password"
placeholder="შეიყვანე პაროლი"
required
>


<button
type="submit"
id="loginBtn"
>
🚀 შესვლა
</button>


</form>


<div
id="message"
class="message"
></div>


<div class="register">

არ გაქვს ანგარიში?

<a href="register.html">
📝 რეგისტრაცია
</a>

</div>


<a
class="home"
href="index.html"
>
🏠 მთავარ გვერდზე დაბრუნება
</a>


</div>


<script>


const SUPABASE_URL =
"https://vtdhvsfqhwesxtwmduew.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MnrM2ulyJY_ugwfFVfpQYA_iV5wjCmt";


const { createClient } =
supabase;


const db =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const message =
document.getElementById("message");


const btn =
document.getElementById("loginBtn");


message.textContent="";

btn.disabled=true;

btn.textContent=
"⏳ მოწმდება...";


try{


const {data,error} =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(error){

message.style.color="#ff7777";

message.textContent=
"❌ ელფოსტა ან პაროლი არასწორია.";

btn.disabled=false;

btn.textContent=
"🚀 შესვლა";

return;

}


if(data.user){

message.style.color="#6dffbf";

message.textContent=
"🎉 წარმატებით შეხვედი!";


setTimeout(()=>{

window.location.href=
"index.html";

},800);

}


}catch(err){

message.style.color="#ff7777";

message.textContent=
"❌ შესვლისას შეცდომა მოხდა.";

btn.disabled=false;

btn.textContent=
"🚀 შესვლა";

}

});


</script>


</body>
</html>
