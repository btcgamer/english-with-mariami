<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">

<title>გაკვეთილი — English with Mariami</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:#effcff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#00eaff35,transparent 25%),
    radial-gradient(circle at 90% 15%,#7c3cff35,transparent 28%),
    radial-gradient(circle at 50% 100%,#006eff30,transparent 40%),
    linear-gradient(135deg,#01030b,#03152e 48%,#010713);
  overflow-x:hidden;
}

/* ================= 3D ================= */

#visual3d{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  overflow:hidden;
  perspective:1200px;
}

.grid{
  position:absolute;
  width:180%;
  height:180%;
  left:-40%;
  top:32%;
  opacity:.2;

  background-image:
    linear-gradient(#00eaff20 1px,transparent 1px),
    linear-gradient(90deg,#00eaff20 1px,transparent 1px);

  background-size:65px 65px;

  transform:
    perspective(700px)
    rotateX(66deg);

  animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
  from{
    transform:
      perspective(700px)
      rotateX(66deg)
      translateY(0);
  }

  to{
    transform:
      perspective(700px)
      rotateX(66deg)
      translateY(65px);
  }
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(4px);
  mix-blend-mode:screen;
}

.orb1{
  width:380px;
  height:380px;
  left:-120px;
  top:10%;
  background:radial-gradient(circle,#00eaff66,transparent 70%);
  animation:o1 9s ease-in-out infinite alternate;
}

.orb2{
  width:450px;
  height:450px;
  right:-140px;
  top:5%;
  background:radial-gradient(circle,#7c3cff66,transparent 70%);
  animation:o2 12s ease-in-out infinite alternate;
}

.orb3{
  width:420px;
  height:420px;
  left:35%;
  bottom:-220px;
  background:radial-gradient(circle,#006eff55,transparent 70%);
  animation:o3 10s ease-in-out infinite alternate;
}

@keyframes o1{
  to{transform:translate3d(150px,80px,100px) scale(1.3)}
}

@keyframes o2{
  to{transform:translate3d(-130px,100px,150px) scale(1.3)}
}

@keyframes o3{
  to{transform:translate3d(80px,-100px,120px) scale(1.2)}
}

.particles{
  position:absolute;
  inset:0;
}

.particles span{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 15px #00eaff;
  animation:p 10s linear infinite;
}

.particles span:nth-child(1){left:5%;top:80%}
.particles span:nth-child(2){left:15%;top:40%;animation-duration:12s}
.particles span:nth-child(3){left:25%;top:70%;animation-duration:9s}
.particles span:nth-child(4){left:35%;top:20%;animation-duration:14s}
.particles span:nth-child(5){left:45%;top:80%;animation-duration:11s}
.particles span:nth-child(6){left:55%;top:30%;animation-duration:13s}
.particles span:nth-child(7){left:65%;top:70%;animation-duration:10s}
.particles span:nth-child(8){left:75%;top:20%;animation-duration:15s}
.particles span:nth-child(9){left:85%;top:60%;animation-duration:9s}
.particles span:nth-child(10){left:95%;top:30%;animation-duration:12s}

@keyframes p{
  0%{
    transform:translate3d(0,80px,0) scale(.4);
    opacity:0;
  }

  25%{opacity:.8}

  80%{opacity:.8}

  100%{
    transform:translate3d(40px,-220px,180px) scale(1.5);
    opacity:0;
  }
}

/* ================= HEADER ================= */

.top{
  position:sticky;
  top:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;
  padding:12px 18px;

  background:rgba(2,8,23,.88);
  backdrop-filter:blur(20px);

  border-bottom:1px solid #00eaff45;

  box-shadow:0 10px 40px #000b;
}

.top:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      #7c3cff,
      #ffe600,
      #00eaff,
      transparent
    );

  background-size:300% 100%;
  animation:energy 5s linear infinite;
}

@keyframes energy{
  from{background-position:0}
  to{background-position:300%}
}

.brand{
  color:#fff;
  text-decoration:none;
  font-weight:1000;
  text-shadow:0 0 15px #00eaff55;
}

.back{
  padding:10px 15px;
  border-radius:13px;

  color:#fff;
  background:linear-gradient(135deg,#075eff,#00c8e8);

  text-decoration:none;
  font-weight:1000;

  box-shadow:
    0 8px 25px #0008,
    0 0 20px #00eaff22;

  transition:.25s;
}

.back:hover{
  transform:translateY(-3px) scale(1.03);
}

/* ================= MAIN ================= */

.container{
  width:min(1250px,94%);
  margin:auto;
  padding:35px 0 70px;
}

.hero{
  position:relative;
  overflow:hidden;

  padding:35px 25px;

  border:1px solid #00eaff35;
  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      #061b38e8,
      #031127ed
    );

  box-shadow:
    0 30px 80px #000c,
    0 0 45px #00eaff15,
    inset 0 1px #ffffff15;
}

.hero h1{
  margin:15px 0 10px;

  font-size:
    clamp(30px,6vw,58px);

  line-height:1.05;

  text-shadow:
    0 0 15px #00eaff45,
    0 0 35px #7c3cff25;
}

.hero p{
  margin:0;
  color:#acd3df;
}

.badge{
  display:inline-block;
  padding:7px 13px;

  border-radius:999px;

  color:#ffe600;

  background:#ffe60012;

  border:1px solid #ffe60035;

  font-size:11px;
  font-weight:1000;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.meta span{
  padding:9px 13px;
  border-radius:12px;

  background:#061a36;

  border:1px solid #00eaff22;

  color:#c9f7ff;

  font-size:13px;
}

/* ================= SECTIONS ================= */

.section{
  position:relative;

  margin-top:22px;
  padding:25px;

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      #051934e8,
      #020b1bed
    );

  border:1px solid #00eaff25;

  box-shadow:
    0 20px 60px #0009,
    inset 0 1px #ffffff0d;

  overflow:hidden;
}

.section:after{
  content:"";

  position:absolute;

  left:-100%;
  top:0;

  width:70%;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      transparent
    );

  animation:scan 5s linear infinite;
}

@keyframes scan{
  to{left:130%}
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:20px;
}

.section-title h2{
  margin:0;
  font-size:25px;
}

.section-title small{
  color:#7fd8e8;
}

/* ================= WORDS ================= */

.words{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:14px;
}

.word{
  position:relative;

  padding:18px;

  min-height:170px;

  border-radius:18px;

  border:1px solid #00eaff25;

  background:
    linear-gradient(
      145deg,
      #061c3a,
      #031126
    );

  box-shadow:
    0 10px 30px #0007;

  transition:.3s;

  transform-style:preserve-3d;
}

.word:hover{
  transform:
    perspective(700px)
    rotateX(4deg)
    rotateY(-5deg)
    translateY(-7px);

  border-color:#00eaff77;

  box-shadow:
    0 20px 45px #000b,
    0 0 25px #00eaff20;
}

.word-number{
  position:absolute;
  right:12px;
  top:10px;

  color:#ffe600;

  font-size:11px;
  font-weight:1000;
}

.word-en{
  font-size:24px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 12px #00eaff33;
}

.word-ka{
  margin-top:7px;
  color:#9bd9e7;
}

.word-emoji{
  font-size:28px;
  margin-bottom:8px;
}

.listen{
  margin-top:13px;

  border:1px solid #00eaff44;
  border-radius:10px;

  padding:8px 11px;

  color:#fff;

  background:#00eaff0d;

  cursor:pointer;

  font-weight:900;
}

.listen:hover{
  background:#00eaff20;
  box-shadow:0 0 15px #00eaff25;
}

/* ================= GRAMMAR ================= */

.grammar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.grammar-box{
  padding:22px;

  border-radius:18px;

  background:#041630;

  border:1px solid #00eaff22;
}

.grammar-box h3{
  margin-top:0;
  color:#ffe600;
}

.example{
  margin-top:12px;

  padding:15px;

  border-radius:13px;

  background:#020d20;

  border-left:3px solid #00eaff;

  color:#cceff6;
}

/* ================= QUIZ ================= */

.quiz{
  display:grid;
  gap:15px;
}

.question{
  padding:20px;

  border-radius:17px;

  background:#041630;

  border:1px solid #00eaff20;
}

.question h3{
  margin-top:0;
}

.options{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);

  gap:9px;
}

.option{
  padding:12px;

  border-radius:12px;

  border:1px solid #00eaff22;

  color:#dffaff;

  background:#020d20;

  cursor:pointer;

  text-align:left;

  transition:.2s;
}

.option:hover{
  border-color:#00eaff;
  background:#06304a;
}

.option.correct{
  background:#075b3c;
  border-color:#00ff9d;
}

.option.wrong{
  background:#631c2b;
  border-color:#ff5470;
}

.result{
  margin-top:20px;

  padding:18px;

  border-radius:17px;

  text-align:center;

  background:#061b38;

  border:1px solid #ffe60035;
}

.score{
  font-size:40px;
  font-weight:1000;
  color:#ffe600;
}

/* ================= LOADING ================= */

.loading,
.error{
  padding:45px 20px;

  text-align:center;

  border-radius:20px;

  background:#03142ddd;

  border:1px solid #00eaff25;
}

.error{
  color:#ff9ca8;
}

.spinner{
  width:50px;
  height:50px;

  margin:0 auto 15px;

  border-radius:50%;

  border:3px solid #00eaff15;

  border-top-color:#00eaff;
  border-right-color:#7c3cff;

  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .words{
    grid-template-columns:
      repeat(2,1fr);
  }

  .grammar{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .top{
    flex-direction:column;
    align-items:stretch;
  }

  .back{
    text-align:center;
  }

  .words{
    grid-template-columns:1fr;
  }

  .options{
    grid-template-columns:1fr;
  }

  .container{
    width:min(100% - 18px,1250px);
    padding-top:18px;
  }

}

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div id="visual3d">

  <div class="grid"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

</div>

<header class="top">

  <a class="brand" href="teacher-lessons.html">
    ⚡ ENGLISH WITH MARIAMI
  </a>

  <a class="back" href="teacher-lessons.html">
    ← გაკვეთილებზე დაბრუნება
  </a>

</header>

<main class="container">

  <div id="app">

    <div class="loading">

      <div class="spinner"></div>

      <b>
        გაკვეთილის ჩატვირთვა...
      </b>

    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260830-lesson-db"></script>

<script>
(function(){

'use strict';

const TEACHER_ID =
  'be4b1c4d-e5f2-4039-b35e-aec3c110a94a';

const client =
  window.supabaseClient;

const app =
  document.getElementById('app');

const params =
  new URLSearchParams(location.search);

const grade =
  Number(params.get('grade'));

const lessonNumber =
  Number(params.get('lesson'));

const studentId =
  params.get('student') || '';

let lesson = null;
let words = [];
let quizzes = [];
let score = 0;
let answered = 0;

/* ================= ESCAPE ================= */

function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g,function(c){

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c];

    });

}

/* ================= AUTH ================= */

async function checkTeacher(){

  if(!client){

    throw new Error(
      'Supabase client ვერ მოიძებნა. შეამოწმე config.js'
    );

  }

  const {
    data:{session},
    error
  } =
    await client.auth.getSession();

  if(error) throw error;

  if(!session){

    location.replace('login.html');

    return false;

  }

  if(session.user.id !== TEACHER_ID){

    location.replace('index.html');

    return false;

  }

  const {data:profile,error:profileError} =
    await client
      .from('profiles')
      .select('role')
      .eq('user_id',session.user.id)
      .maybeSingle();

  if(profileError) throw profileError;

  if(!profile || profile.role !== 'teacher'){

    location.replace('index.html');

    return false;

  }

  return true;
}

/* ================= VALIDATE URL ================= */

function validateParams(){

  if(
    ![2,3,4].includes(grade) ||
    !Number.isInteger(lessonNumber) ||
    lessonNumber < 1
  ){

    throw new Error(
      'გაკვეთილის მისამართი არასწორია. გამოიყენე grade და lesson.'
    );

  }

}

/* ================= LOAD LESSON ================= */

async function loadLesson(){

  const {data,error} =
    await client
      .from('lessons')
      .select(`
        id,
        grade,
        lesson_number,
        title,
        topic,
        description,
        image_url,
        audio_url
      `)
      .eq('grade',grade)
      .eq('lesson_number',lessonNumber)
      .maybeSingle();

  if(error) throw error;

  if(!data){

    throw new Error(
      `მე-${grade} კლასის მე-${lessonNumber} გაკვეთილი Supabase-ში ვერ მოიძებნა.`
    );

  }

  lesson = data;

  const wordsRes =
    await client
      .from('lesson_words')
      .select(`
        id,
        word,
        translation,
        emoji,
        image_url,
        audio_url,
        sort_order
      `)
      .eq('lesson_id',lesson.id)
      .order('sort_order',{ascending:true});

  if(wordsRes.error)
    throw wordsRes.error;

  words =
    wordsRes.data || [];

  const quizRes =
    await client
      .from('lesson_quizzes')
      .select(`
        id,
        question,
        options,
        correct_answer,
        sort_order
      `)
      .eq('lesson_id',lesson.id)
      .order('sort_order',{ascending:true});

  if(quizRes.error)
    throw quizRes.error;

  quizzes =
    quizRes.data || [];
}

/* ================= AUDIO ================= */

function speak(text){

  if(
    !('speechSynthesis' in window)
  ){

    return;

  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    'en-US';

  utterance.rate =
    .78;

  utterance.pitch =
    1;

  window.speechSynthesis.speak(
    utterance
  );
}

/* ================= RENDER ================= */

function render(){

  app.innerHTML = `

    <section class="hero">

      <span class="badge">
        🌟 მე-${grade} კლასი • გაკვეთილი ${lessonNumber}
      </span>

      <h1>
        ${esc(lesson.title)}
      </h1>

      <p>
        ${esc(
          lesson.description ||
          lesson.topic ||
          'ინგლისურის სასწავლო გაკვეთილი'
        )}
      </p>

      <div class="meta">

        <span>
          📚 ${words.length} ახალი სიტყვა
        </span>

        <span>
          🧠 ${quizzes.length} სავარჯიშო კითხვა
        </span>

        <span>
          🎧 მოსმენა
        </span>

        <span>
          ⭐ პრაქტიკა
        </span>

      </div>

    </section>

    <section class="section">

      <div class="section-title">

        <h2>
          🆕 ახალი სიტყვები
        </h2>

        <small>
          ${words.length} სიტყვა
        </small>

      </div>

      <div class="words">

        ${
          words.length
          ? words.map(function(word,index){

              return `

                <article class="word">

                  <div class="word-number">
                    #${index + 1}
                  </div>

                  ${
                    word.emoji
                    ? `<div class="word-emoji">
                         ${esc(word.emoji)}
                       </div>`
                    : ''
                  }

                  <div class="word-en">
                    ${esc(word.word)}
                  </div>

                  <div class="word-ka">
                    ${esc(word.translation || '')}
                  </div>

                  <button
                    class="listen"
                    data-speak="${esc(word.word)}">

                    🔊 მოსმენა
                  </button>

                </article>

              `;

            }).join('')
          : `
              <div class="error">
                ამ გაკვეთილს სიტყვები ჯერ არ აქვს.
              </div>
            `
        }

      </div>

    </section>

    <section class="section">

      <div class="section-title">

        <h2>
          📖 გრამატიკა და პრაქტიკა
        </h2>

        <small>
          ${esc(
            lesson.topic ||
            'ინგლისური ენის საფუძვლები'
          )}
        </small>

      </div>

      <div class="grammar">

        <div class="grammar-box">

          <h3>
            🎯 გაკვეთილის თემა
          </h3>

          <p>
            ${esc(
              lesson.topic ||
              lesson.title
            )}
          </p>

          <div class="example">

            <b>English:</b><br>

            Practice the new words and
            build simple English sentences.

          </div>

        </div>

        <div class="grammar-box">

          <h3>
            🗣️ Speaking Practice
          </h3>

          <p>
            წაიკითხე სიტყვები ხმამაღლა და
            გამოიყენე ისინი წინადადებებში.
          </p>

          <div class="example">

            <b>
              ${esc(
                words[0]?.word ||
                'Hello'
              )}
            </b>

            →
            Make a sentence.

          </div>

        </div>

      </div>

    </section>

    <section class="section">

      <div class="section-title">

        <h2>
          🧠 ქვიზი
        </h2>

        <small>
          ${quizzes.length} კითხვა
        </small>

      </div>

      <div id="quiz" class="quiz">

        ${
          quizzes.length
          ? quizzes.map(function(q,index){

              return renderQuestion(q,index);

            }).join('')
          : `
              <div class="error">
                ამ გაკვეთილს ქვიზი ჯერ არ აქვს.
              </div>
            `
        }

      </div>

      ${
        quizzes.length
        ? `
          <div id="result" class="result">

            <div>
              შედეგი
            </div>

            <div class="score">
              0 / ${quizzes.length}
            </div>

            <div>
              უპასუხე ყველა კითხვას ⭐
            </div>

          </div>
        `
        : ''
      }

    </section>

  `;

  bindEvents();

}

/* ================= QUESTION ================= */

function renderQuestion(q,index){

  let options =
    Array.isArray(q.options)
      ? q.options
      : [];

  if(
    !options.length &&
    q.correct_answer
  ){

    options =
      [q.correct_answer];

  }

  return `

    <article
      class="question"
      data-question="${esc(q.id)}"
      data-correct="${esc(q.correct_answer)}">

      <h3>
        ${index + 1}. ${esc(q.question)}
      </h3>

      <div class="options">

        ${
          options.map(function(option){

            return `

              <button
                class="option"
                data-answer="${esc(option)}">

                ${esc(option)}

              </button>

            `;

          }).join('')
        }

      </div>

    </article>

  `;
}

/* ================= EVENTS ================= */

function bindEvents(){

  document
    .querySelectorAll('[data-speak]')
    .forEach(function(button){

      button.addEventListener(
        'click',
        function(){

          speak(
            button.dataset.speak
          );

        }
      );

    });

  document
    .querySelectorAll('.option')
    .forEach(function(button){

      button.addEventListener(
        'click',
        function(){

          answerQuestion(button);

        }
      );

    });

}

/* ================= QUIZ ANSWER ================= */

async function answerQuestion(button){

  const question =
    button.closest('.question');

  if(!question) return;

  if(question.dataset.done === '1')
    return;

  question.dataset.done =
    '1';

  const correct =
    question.dataset.correct;

  const answer =
    button.dataset.answer;

  const buttons =
    question.querySelectorAll('.option');

  buttons.forEach(function(b){
    b.disabled = true;
  });

  if(answer === correct){

    button.classList.add('correct');

    score++;

  }else{

    button.classList.add('wrong');

    buttons.forEach(function(b){

      if(
        b.dataset.answer === correct
      ){

        b.classList.add('correct');

      }

    });

  }

  answered++;

  updateResult();

  if(
    studentId &&
    client
  ){

    try{

      await client
        .from('student_question_scores')
        .insert({
          student_id:studentId,
          quiz_id:lesson.id,
          question_id:question.dataset.question,
          grade:grade
        });

    }catch(error){

      console.warn(
        'ქულის შენახვა ვერ მოხერხდა:',
        error
      );

    }

  }

}

/* ================= RESULT ================= */

function updateResult(){

  const result =
    document.getElementById('result');

  if(!result) return;

  let message =
    'გააგრძელე! 💪';

  if(
    answered === quizzes.length
  ){

    const percent =
      quizzes.length
        ? Math.round(
            score /
            quizzes.length *
            100
          )
        : 0;

    if(percent >= 90)
      message =
        'შესანიშნავი შედეგია! 🏆';

    else if(percent >= 70)
      message =
        'ძალიან კარგია! ⭐';

    else if(percent >= 50)
      message =
        'კარგია, კიდევ ვივარჯიშოთ! 💪';

    else
      message =
        'არაუშავს — თავიდან გავიმეოროთ! 🚀';

  }

  result.innerHTML = `

    <div>
      შედეგი
    </div>

    <div class="score">
      ${score} / ${quizzes.length}
    </div>

    <div>
      ${message}
    </div>

  `;

}

/* ================= START ================= */

(async function(){

  try{

    const allowed =
      await checkTeacher();

    if(!allowed) return;

    validateParams();

    await loadLesson();

    render();

  }catch(error){

    console.error(
      'Lesson error:',
      error
    );

    app.innerHTML = `

      <div class="error">

        ❌ გაკვეთილის ჩატვირთვა ვერ მოხერხდა.

        <br><br>

        <b>
          ${esc(
            error.message ||
            error
          )}
        </b>

        <br><br>

        <a
          class="back"
          href="teacher-lessons.html">

          ← გაკვეთილებზე დაბრუნება

        </a>

      </div>

    `;

  }

})();

/* ================= PARALLAX ================= */

document.addEventListener(
  'mousemove',
  function(e){

    if(window.innerWidth < 900)
      return;

    const x =
      (e.clientX /
       window.innerWidth - .5) * 14;

    const y =
      (e.clientY /
       window.innerHeight - .5) * 14;

    const visual =
      document.getElementById('visual3d');

    if(visual){

      visual.style.transform =
        `translate3d(${x * -.15}px,${y * -.15}px,0)`;

    }

  }
);

})();
