<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English with Mariami — Courses</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="curriculum.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 10% 10%,#075eff55,transparent 25%),radial-gradient(circle at 90% 15%,#00eaff33,transparent 28%),linear-gradient(135deg,#020817,#05284a 55%,#020b20);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.brand{font-size:24px;font-weight:900;color:#ffe600}.btn{border:1px solid #00eaff;background:#06162f;color:#fff;padding:11px 15px;border-radius:14px;font-weight:900;cursor:pointer;text-decoration:none}.hero,.panel{margin-top:20px;padding:25px;border-radius:28px;background:#071d3ddd;border:1px solid #00eaff55;box-shadow:0 20px 50px #0009}.hero{text-align:center}.hero h1{font-size:clamp(32px,6vw,60px);color:#ffe600;text-shadow:0 0 25px #075eff}.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.grade{padding:22px;text-align:center;border-radius:22px;background:linear-gradient(145deg,#075eff,#063c65);border:1px solid #00eaff55;cursor:pointer;transition:.3s}.grade.active,.grade:hover{transform:translateY(-5px);box-shadow:0 0 30px #00eaff55;border-color:#ffe600}.grade b{font-size:38px;color:#ffe600}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.unit{padding:20px;border-radius:20px;background:#06162f;border:1px solid #00eaff33}.unit h3{color:#ffe600}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 10px;background:#0a3157;border-radius:10px;font-size:13px}.word{color:#6dffbf;font-weight:800}.box{margin-top:12px;padding:13px;border-radius:14px;background:#0a2542;color:#dffcff;line-height:1.7}.audio{border:0;background:none;color:#00eaff;font-size:18px;cursor:pointer}.count{color:#bdefff}.hidden{display:none}@media(max-width:750px){.grades{grid-template-columns:1fr}.top{align-items:flex-start}}</style><script src="protect.js"></script></head><body><main class="wrap"><div class="top"><div class="brand">📚 English with Mariami</div><div><a class="btn" href="index.html">🏠 მთავარი</a> <a class="btn" href="academy.html">🎓 აკადემია</a></div></div><section class="hero"><div style="font-size:65px">🎓</div><h1>სრული სასწავლო კურსები</h1><p>მე-2, მე-3 და მე-4 კლასის ინგლისური — თემებად, სიტყვებად, გრამატიკად და საუბრებად.</p></section><section class="panel"><h2>აირჩიე კლასი</h2><div class="grades"><div class="grade" data-grade="2"><b>🌱 2</b><div>Beginner</div></div><div class="grade" data-grade="3"><b>🚀 3</b><div>Elementary</div></div><div class="grade" data-grade="4"><b>⭐ 4</b><div>Strong Elementary</div></div></div></section><section class="panel"><h2 id="title"></h2><p id="count" class="count"></p><div id="units" class="units"></div></section></main><script>const SUPABASE_URL='https://vtdhvsfqhwesxtwmduew.supabase.co',SUPABASE_KEY='sb_publishable_MnrM2ulyJY_ugwfFVfpQYA_iV5wjCmt';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});let grade=Number(localStorage.getItem('academy_grade')||2);function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}function render(){const c=window.MARIAMI_CURRICULUM?.[grade];if(!c)return;document.getElementById('title').textContent=c.title;document.getElementById('count').textContent=c.units.length+' დიდი თემატური ერთეული';document.getElementById('units').innerHTML=c.units.map((u,i)=>`<article class="unit"><h3>${i+1}. ${u.title}</h3><div class="chips">${u.words.map(w=>`<span class="chip"><span class="word">${w[0]}</span> — ${w[1]} <button class="audio" onclick="speak('${w[0].replace(/'/g,"\\'")}')">🔊</button></span>`).join('')}</div><div class="box"><b>✍️ Grammar</b><br>${u.grammar.join(' • ')}</div><div class="box"><b>🗣️ Speaking</b><br>${u.speaking.map(s=>`<div>${s} <button class="audio" onclick="speak('${s.replace(/'/g,"\\'")}')">🔊</button></div>`).join('')}</div></article>`).join('')}document.querySelectorAll('.grade').forEach(x=>x.onclick=()=>{grade=Number(x.dataset.grade);localStorage.setItem('academy_grade',grade);document.querySelectorAll('.grade').forEach(y=>y.classList.toggle('active',Number(y.dataset.grade)===grade));render()});(async()=>{const {data}=await db.auth.getSession();if(!data?.session){location.replace('login.html?redirect='+encodeURIComponent('courses.html'));return}document.querySelectorAll('.grade').forEach(x=>x.classList.toggle('active',Number(x.dataset.grade)===grade));render()})();</script></body></html>
