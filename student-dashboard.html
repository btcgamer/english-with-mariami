<script>
(function () {
  'use strict';

  /* =========================================================
     ENGLISH WITH MARIAMI
     FUTURISTIC STUDENT DASHBOARD
     
     Uses existing Supabase tables:
     profiles
     lessons
     lesson_words
     lesson_quizzes
     student_progress
     quiz_results
     lesson_progress
     academy_activity
     academy_streaks
     ========================================================= */

  const DB =
    window.__ENGLISH_MARIAMI_SUPABASE_CLIENT ||
    window.supabaseClient ||
    null;

  if (!DB) {
    console.error('Supabase client not found.');
    showFatal('Supabase client ვერ მოიძებნა. შეამოწმე config.js.');
    return;
  }

  const state = {
    user: null,
    profile: null,
    lessons: [],
    words: [],
    quizzes: [],
    progress: [],
    quizResults: []
  };

  const $ = (id) => document.getElementById(id);

  /* =========================================================
     HELPERS
     ========================================================= */

  function escapeHTML(value) {
    return String(value ?? '')
      .replace(/[&<>"']/g, function (char) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[char];
      });
  }

  function toast(message, error = false) {
    const el = $('toast');

    if (!el) return;

    el.textContent = message;
    el.classList.toggle('error', error);
    el.classList.add('show');

    clearTimeout(toast.timer);

    toast.timer = setTimeout(function () {
      el.classList.remove('show');
    }, 3000);
  }

  function showFatal(message) {
    const loading = $('loading');

    if (!loading) return;

    loading.innerHTML = `
      <div class="loader-box">
        <div style="font-size:48px">⚠️</div>
        <h2>Dashboard Error</h2>
        <p>${escapeHTML(message)}</p>

        <button
          class="primary-btn"
          style="margin-top:18px"
          onclick="location.reload()">
          🔄 Try Again
        </button>
      </div>
    `;
  }

  function number(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : 0;
  }

  function gradeIsValid(grade) {
    return [2, 3, 4].includes(number(grade));
  }

  function dateText(value) {
    if (!value) return '—';

    try {
      return new Date(value).toLocaleString('ka-GE', {
        dateStyle: 'short',
        timeStyle: 'short'
      });
    } catch (_) {
      return '—';
    }
  }

  function wordCount(row) {
    if (!row) return 0;

    const learned = Array.isArray(row.learned_words)
      ? row.learned_words.length
      : 0;

    return Math.max(
      number(row.words_learned),
      learned
    );
  }

  /* =========================================================
     AUTH
     ========================================================= */

  async function loadUser() {

    const result = await DB.auth.getUser();

    if (result.error) {
      throw result.error;
    }

    if (!result.data || !result.data.user) {
      window.location.replace(
        'login.html?reason=unauthorized'
      );

      return false;
    }

    state.user = result.data.user;

    return true;
  }

  /* =========================================================
     PROFILE
     ========================================================= */

  async function loadProfile() {

    const result = await DB
      .from('profiles')
      .select('*')
      .eq('user_id', state.user.id)
      .maybeSingle();

    if (result.error) {
      throw result.error;
    }

    if (!result.data) {
      throw new Error(
        'Student profile ვერ მოიძებნა.'
      );
    }

    state.profile = result.data;

    const role = String(
      result.data.role || ''
    )
      .trim()
      .toLowerCase();

    if (role !== 'student') {

      toast(
        'ამ გვერდზე მხოლოდ Student account-ს აქვს წვდომა.',
        true
      );

      setTimeout(function () {

        if (role === 'teacher') {
          window.location.replace(
            'teacher-dashboard.html'
          );
        } else {
          window.location.replace(
            'login.html?reason=wrong-role'
          );
        }

      }, 700);

      return false;
    }

    return true;
  }

  /* =========================================================
     LOAD STUDENT PROGRESS
     ========================================================= */

  async function loadProgress() {

    const result = await DB
      .from('student_progress')
      .select(`
        user_id,
        grade,
        words_learned,
        quiz_completed,
        score,
        learned_words,
        best_quiz,
        quiz_attempts,
        last_active_at,
        updated_at
      `)
      .eq('user_id', state.user.id)
      .in('grade', [2, 3, 4])
      .order('grade', {
        ascending: true
      });

    if (result.error) {
      console.warn(
        'student_progress:',
        result.error.message
      );

      state.progress = [];
      return;
    }

    state.progress = result.data || [];
  }

  /* =========================================================
     LOAD QUIZ RESULTS
     
     IMPORTANT:
     quiz_attempts DOES NOT EXIST.
     Real table = quiz_results
     ========================================================= */

  async function loadQuizResults() {

    const result = await DB
      .from('quiz_results')
      .select(`
        id,
        student_id,
        quiz_id,
        grade,
        score,
        total,
        completed_at,
        created_at
      `)
      .eq('student_id', state.user.id)
      .in('grade', [2, 3, 4])
      .order('created_at', {
        ascending: false
      })
      .limit(100);

    if (result.error) {

      console.warn(
        'quiz_results:',
        result.error.message
      );

      state.quizResults = [];
      return;
    }

    state.quizResults = result.data || [];
  }

  /* =========================================================
     LOAD LESSONS
     ========================================================= */

  async function loadLessons() {

    const result = await DB
      .from('lessons')
      .select(`
        id,
        grade,
        lesson_number,
        title,
        topic,
        description,
        image_url,
        audio_url,
        created_at,
        grammar_rule,
        grammar_examples,
        listening_text,
        speaking_phrases,
        reading_text,
        exercises
      `)
      .in('grade', [2, 3, 4])
      .order('grade', {
        ascending: true
      })
      .order('lesson_number', {
        ascending: true
      });

    if (result.error) {

      console.warn(
        'lessons:',
        result.error.message
      );

      state.lessons = [];
      return;
    }

    state.lessons = result.data || [];
  }

  /* =========================================================
     LOAD WORDS
     ========================================================= */

  async function loadWords() {

    if (!state.lessons.length) {
      state.words = [];
      return;
    }

    const lessonIds = state.lessons
      .map(function (lesson) {
        return lesson.id;
      })
      .filter(Boolean);

    if (!lessonIds.length) {
      state.words = [];
      return;
    }

    const result = await DB
      .from('lesson_words')
      .select(`
        id,
        lesson_id,
        word,
        translation,
        emoji,
        image_url,
        audio_url,
        sort_order,
        created_at
      `)
      .in('lesson_id', lessonIds)
      .order('sort_order', {
        ascending: true
      });

    if (result.error) {

      console.warn(
        'lesson_words:',
        result.error.message
      );

      state.words = [];
      return;
    }

    state.words = result.data || [];
  }

  /* =========================================================
     LOAD QUIZ QUESTIONS
     ========================================================= */

  async function loadQuizzes() {

    if (!state.lessons.length) {
      state.quizzes = [];
      return;
    }

    const lessonIds = state.lessons
      .map(function (lesson) {
        return lesson.id;
      })
      .filter(Boolean);

    if (!lessonIds.length) {
      state.quizzes = [];
      return;
    }

    const result = await DB
      .from('lesson_quizzes')
      .select(`
        id,
        lesson_id,
        question,
        options,
        correct_answer,
        sort_order,
        created_at
      `)
      .in('lesson_id', lessonIds)
      .order('sort_order', {
        ascending: true
      });

    if (result.error) {

      console.warn(
        'lesson_quizzes:',
        result.error.message
      );

      state.quizzes = [];
      return;
    }

    state.quizzes = result.data || [];
  }

  /* =========================================================
     PROFILE UI
     ========================================================= */

  function renderProfile() {

    const profile = state.profile || {};

    const name =
      profile.full_name ||
      state.user.email?.split('@')[0] ||
      'Student';

    const grade = number(profile.grade);

    if ($('studentName')) {
      $('studentName').textContent = name;
    }

    if ($('profileName')) {
      $('profileName').textContent = name;
    }

    if ($('profileEmail')) {
      $('profileEmail').textContent =
        state.user.email || 'Student account';
    }

    if ($('profileRole')) {
      $('profileRole').textContent = 'Student';
    }

    if ($('profileGrade')) {
      $('profileGrade').textContent =
        gradeIsValid(grade)
          ? `Grade ${grade}`
          : 'Not assigned';
    }

    if ($('activeGrade')) {
      $('activeGrade').textContent =
        gradeIsValid(grade)
          ? `G${grade}`
          : '—';
    }
  }

  /* =========================================================
     STATS
     ========================================================= */

  function renderStats() {

    const totalWords =
      state.progress.reduce(
        function (sum, row) {
          return sum + wordCount(row);
        },
        0
      );

    const bestProgress =
      Math.max(
        0,
        ...state.progress.map(function (row) {
          return number(row.best_quiz);
        }),
        ...state.progress.map(function (row) {
          return number(row.score);
        })
      );

    const bestResults =
      Math.max(
        0,
        ...state.quizResults.map(function (row) {

          const score = number(row.score);
          const total = number(row.total);

          if (total > 0) {
            return Math.round(
              (score / total) * 100
            );
          }

          return score;
        })
      );

    const best =
      Math.max(
        bestProgress,
        bestResults
      );

    if ($('totalWords')) {
      $('totalWords').textContent =
        totalWords;
    }

    if ($('totalQuizzes')) {
      $('totalQuizzes').textContent =
        state.quizResults.length;
    }

    if ($('bestScore')) {
      $('bestScore').textContent =
        `${best}%`;
    }
  }

  /* =========================================================
     GRADE PROGRESS
     ========================================================= */

  function maxWords(grade) {

    /*
     * These are UI progress targets only.
     * They DO NOT modify database data.
     */

    if (grade === 2) return 300;
    if (grade === 3) return 400;
    if (grade === 4) return 500;

    return 300;
  }

  function renderGrades() {

    [2, 3, 4].forEach(function (grade) {

      const row =
        state.progress.find(function (item) {
          return number(item.grade) === grade;
        }) || {};

      const words =
        wordCount(row);

      const percentage =
        Math.min(
          100,
          Math.round(
            words / maxWords(grade) * 100
          )
        );

      const bar = $(`bar${grade}`);

      if (bar) {
        bar.style.width =
          `${percentage}%`;
      }

      const wordsEl =
        $(`words${grade}`);

      if (wordsEl) {
        wordsEl.textContent =
          `${words} words`;
      }

      const pct =
        $(`pct${grade}`);

      if (pct) {
        pct.textContent =
          `${percentage}%`;
      }

      const card =
        document.querySelector(
          `.grade-card[data-grade="${grade}"]`
        );

      if (!card) return;

      const assigned =
        number(state.profile?.grade) === grade;

      card.classList.toggle(
        'active',
        assigned
      );

      const button =
        card.querySelector(
          '[data-open-grade]'
        );

      if (!button) return;

      button.textContent =
        assigned
          ? `🚀 Continue Grade ${grade}`
          : `📚 Open Grade ${grade}`;
    });

    if ($('gradeSyncStatus')) {
      const grade =
        number(state.profile?.grade);

      $('gradeSyncStatus').textContent =
        gradeIsValid(grade)
          ? `✓ Grade ${grade} synced`
          : '⚠ Grade not assigned';
    }
  }

  /* =========================================================
     RECENT WORDS
     ========================================================= */

  function renderWords() {

    const words = [];

    state.words.forEach(function (item) {

      if (!item.word) return;

      words.push({
        word: item.word,
        translation: item.translation || '',
        emoji: item.emoji || ''
      });
    });

    const unique = [];
    const seen = new Set();

    words.forEach(function (item) {

      const key =
        item.word
          .trim()
          .toLowerCase();

      if (!key || seen.has(key)) {
        return;
      }

      seen.add(key);
      unique.push(item);
    });

    const visible =
      unique.slice(0, 100);

    if (!$('wordsContainer')) return;

    if (!visible.length) {

      $('wordsContainer').innerHTML = `
        <span class="word">
          🌱 Lessons-ის სიტყვები ჯერ არ მოიძებნა
        </span>
      `;

      return;
    }

    $('wordsContainer').innerHTML =
      visible.map(function (item) {

        return `
          <span
            class="word"
            title="${escapeHTML(item.translation)}">

            ${escapeHTML(item.emoji)}
            ${escapeHTML(item.word)}

          </span>
        `;

      }).join('');
  }

  /* =========================================================
     QUIZ ACTIVITY
     ========================================================= */

  function resultPercentage(row) {

    const score = number(row.score);
    const total = number(row.total);

    if (total > 0) {
      return Math.round(
        score / total * 100
      );
    }

    return score;
  }

  function renderActivity() {

    if (!$('activity')) return;

    const activity =
      state.quizResults.slice(0, 8);

    if (!activity.length) {

      $('activity').innerHTML = `
        <div class="activity-item">

          <div class="activity-icon">
            🎯
          </div>

          <div class="activity-main">

            <strong>
              No quiz attempts yet
            </strong>

            <span>
              Start your first lesson quiz
            </span>

          </div>

        </div>
      `;

      return;
    }

    $('activity').innerHTML =
      activity.map(function (item) {

        const grade =
          number(item.grade);

        const score =
          resultPercentage(item);

        const icon =
          grade === 2
            ? '🌱'
            : grade === 3
              ? '🚀'
              : '⭐';

        return `
          <div class="activity-item">

            <div class="activity-icon">
              ${icon}
            </div>

            <div class="activity-main">

              <strong>
                Grade ${grade || '—'} Quiz
              </strong>

              <span>
                ${escapeHTML(
                  dateText(
                    item.completed_at ||
                    item.created_at
                  )
                )}
              </span>

            </div>

            <div class="activity-score">
              ${score}%
            </div>

          </div>
        `;

      }).join('');
  }

  /* =========================================================
     ACHIEVEMENTS
     ========================================================= */

  function renderAchievements() {

    const totalWords =
      state.progress.reduce(
        function (sum, row) {
          return sum + wordCount(row);
        },
        0
      );

    const best =
      Math.max(
        0,
        ...state.progress.map(function (x) {
          return number(x.best_quiz);
        }),
        ...state.quizResults.map(resultPercentage)
      );

    const definitions = [

      [
        '🌱',
        'First Word',
        'Learn 1 word',
        totalWords >= 1
      ],

      [
        '📚',
        '50 Words',
        'Learn 50 words',
        totalWords >= 50
      ],

      [
        '📖',
        '100 Words',
        'Learn 100 words',
        totalWords >= 100
      ],

      [
        '🔥',
        '200 Words',
        'Learn 200 words',
        totalWords >= 200
      ],

      [
        '🎯',
        'First Quiz',
        'Complete 1 quiz',
        state.quizResults.length >= 1
      ],

      [
        '🏆',
        '10 Quizzes',
        'Complete 10 quizzes',
        state.quizResults.length >= 10
      ],

      [
        '💯',
        'Perfect',
        'Score 100%',
        best >= 100
      ],

      [
        '🥇',
        'Elite',
        'Score 90%+',
        best >= 90
      ],

      [
        '🚀',
        'High Achiever',
        'Score 80%+',
        best >= 80
      ]

    ];

    if (!$('achievements')) return;

    $('achievements').innerHTML =
      definitions.map(function (item) {

        const unlocked = item[3];

        return `
          <div
            class="badge ${unlocked ? '' : 'locked'}">

            <span class="badge-icon">
              ${item[0]}
            </span>

            <b>
              ${escapeHTML(item[1])}
            </b>

            <small>
              ${
                unlocked
                  ? '✓ UNLOCKED'
                  : '🔒 ' + escapeHTML(item[2])
              }
            </small>

          </div>
        `;

      }).join('');
  }

  /* =========================================================
     GRADE OPEN
     
     IMPORTANT:
     Does NOT use database writes.
     Does NOT change student's grade.
     ========================================================= */

  function openGrade(grade) {

    grade = number(grade);

    if (!gradeIsValid(grade)) {
      toast(
        'არასწორი Grade.',
        true
      );
      return;
    }

    /*
     * If your project has grade2.html,
     * grade3.html and grade4.html,
     * this opens them directly.
     */

    const target =
      `grade${grade}.html`;

    window.location.href = target;
  }

  document
    .querySelectorAll('[data-open-grade]')
    .forEach(function (button) {

      button.addEventListener(
        'click',
        function () {

          openGrade(
            number(
              button.dataset.openGrade
            )
          );

        }
      );

    });

  /* =========================================================
     CONTINUE
     ========================================================= */

  if ($('continueBtn')) {

    $('continueBtn')
      .addEventListener(
        'click',
        function () {

          const grade =
            number(
              state.profile?.grade
            );

          if (!gradeIsValid(grade)) {

            toast(
              'Teacher-ს ჯერ Grade არ აქვს მინიჭებული.',
              true
            );

            return;
          }

          openGrade(grade);
        }
      );
  }

  /* =========================================================
     REFRESH
     ========================================================= */

  if ($('refreshBtn')) {

    $('refreshBtn')
      .addEventListener(
        'click',
        async function () {

          const button =
            $('refreshBtn');

          button.disabled = true;
          button.textContent =
            '⏳ Syncing...';

          try {

            await Promise.all([
              loadProgress(),
              loadQuizResults(),
              loadLessons()
            ]);

            await Promise.all([
              loadWords(),
              loadQuizzes()
            ]);

            renderProfile();
            renderStats();
            renderGrades();
            renderWords();
            renderActivity();
            renderAchievements();

            toast(
              '✓ მონაცემები განახლებულია'
            );

          } catch (error) {

            console.error(error);

            toast(
              'განახლება ვერ მოხერხდა.',
              true
            );

          } finally {

            button.disabled = false;

            button.textContent =
              '🔄 Refresh Progress';
          }
        }
      );
  }

  /* =========================================================
     LOGOUT
     ========================================================= */

  if ($('logoutBtn')) {

    $('logoutBtn')
      .addEventListener(
        'click',
        async function () {

          const button =
            $('logoutBtn');

          button.disabled = true;
          button.textContent = '⏳';

          try {

            await DB.auth.signOut({
              scope: 'global'
            });

          } catch (error) {

            console.warn(
              'Logout:',
              error
            );

          } finally {

            window.location.replace(
              'login.html?logout=1'
            );
          }
        }
      );
  }

  /* =========================================================
     REALTIME PROFILE GRADE SYNC
     ========================================================= */

  function subscribeRealtime() {

    try {

      DB
        .channel(
          `student-profile-${state.user.id}`
        )
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'profiles',
            filter:
              `user_id=eq.${state.user.id}`
          },
          async function (payload) {

            if (!payload.new) return;

            state.profile =
              payload.new;

            renderProfile();
            renderGrades();

            toast(
              `🔄 Grade განახლდა: ${payload.new.grade}`
            );
          }
        )
        .subscribe();

    } catch (error) {

      console.warn(
        'Realtime unavailable:',
        error
      );
    }
  }

  /* =========================================================
     BOOT
     ========================================================= */

  async function boot() {

    try {

      const authenticated =
        await loadUser();

      if (!authenticated) return;

      const profileLoaded =
        await loadProfile();

      if (!profileLoaded) return;

      /*
       * Lessons are loaded from the REAL lessons table.
       * Words are loaded from lesson_words.
       * Quiz questions are loaded from lesson_quizzes.
       * Quiz history is loaded from quiz_results.
       */

      await Promise.all([
        loadProgress(),
        loadQuizResults(),
        loadLessons()
      ]);

      await Promise.all([
        loadWords(),
        loadQuizzes()
      ]);

      renderProfile();
      renderStats();
      renderGrades();
      renderWords();
      renderActivity();
      renderAchievements();

      subscribeRealtime();

      if ($('loading')) {
        $('loading').style.display =
          'none';
      }

      if ($('app')) {
        $('app').hidden = false;
      }

    } catch (error) {

      console.error(
        'Student Dashboard:',
        error
      );

      showFatal(
        error?.message ||
        'Unknown dashboard error'
      );
    }
  }

  boot();

})();
</script>
