<!DOCTYPE html>

<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>English with Mariami — პაროლის აღდგენა</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
min-height:100%;
font-family:Arial,"Noto Sans Georgian",sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
background:
radial-gradient(
circle at 50% 35%,
#eaffff 0,
#8ed8f4 25%,
#286c98 58%,
#010712 100%
);
overflow:hidden;
}

.bg{
position:fixed;
inset:0;
z-index:-1;
background:
radial-gradient(
ellipse at center,
transparent 25%,
#001329aa 65%,
#00040c 100%
);
}

.letters span{
position:absolute;
font-size:90px;
font-weight:1000;
color:#fff;

text-shadow:
0 0 8px #fff,
0 0 20px #00eaff,
0 0 45px #008cff;

animation:
float 6s ease-in-out infinite;
}

.letters span:nth-child(1){
left:8%;
top:15%;
}

.letters span:nth-child(2){
right:10%;
top:20%;
animation-delay:-2s;
}

.letters span:nth-child(3){
left:15%;
bottom:15%;
animation-delay:-4s;
}

.letters span:nth-child(4){
right:18%;
bottom:18%;
animation-delay:-1s;
}

@keyframes float{

50%{
transform:
translate3d(25px,-30px,50px)
rotateY(25deg);
}

}

.card{
width:min(440px,calc(100% - 28px));
padding:34px 28px;

border:
1px solid #00eaff77;

border-radius:28px;

background:
linear-gradient(
145deg,
#041a31ee,
#020b19ee
);

box-shadow:
0 25px 70px #000b,
0 0 40px #00eaff33;

backdrop-filter:
blur(12px);

text-align:center;
}

.logo{
font-size:42px;
}

.card h1{
margin:8px 0 10px;

font-size:31px;

color:#00eaff;

text-shadow:
0 0 18px #00eaff88;
}

.card h2{
margin:15px 0;
}

.card p{
color:#cdeef7;
line-height:1.6;
}

.field{
text-align:left;
margin:18px 0;
}

.field label{
display:block;
margin-bottom:7px;

font-weight:800;
color:#ffe600;
}

.field input{
width:100%;

padding:14px;

border-radius:13px;

border:
1px solid #00eaff55;

background:#020c1a;

color:#fff;

font-size:16px;

outline:none;
}

.field input:focus{
border-color:#00eaff;

box-shadow:
0 0 15px #00eaff33;
}

.btn{
width:100%;

padding:14px;

border:0;

border-radius:14px;

background:#00c9f2;

color:#00131a;

font-size:16px;

font-weight:1000;

cursor:pointer;

box-shadow:
0 0 25px #00eaff66;
}

.btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
margin-top:15px;
min-height:24px;
font-weight:700;
line-height:1.5;
}

.success{
color:#8dffb0;
}

.error{
color:#ff9b9b;
}

.hidden{
display:none!important;
}

.back{
display:inline-block;
margin-top:18px;
color:#00eaff;
}

.loading{
color:#ffe600;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="letters">
<span>A</span>
<span>B</span>
<span>C</span>
<span>D</span>
</div>

<div class="card">

<div class="logo">
🌈📚
</div>

<h1>
English with Mariami
</h1>

<h2>
🔐 ახალი პაროლი
</h2>

<p>
შეიყვანე ახალი პაროლი და განაახლე შენი ანგარიშის პაროლი.
</p>

<div
id="loading"
class="message loading"
>
🔄 მოწმდება აღდგენის ბმული...
</div>

<form
id="resetForm"
class="hidden"
>

<div class="field">

<label for="password">
🔑 ახალი პაროლი
</label>

<input
id="password"
type="password"
minlength="6"
required
placeholder="მინიმუმ 6 სიმბოლო"

>

</div>

<div class="field">

<label for="confirm">
🔑 გაიმეორე პაროლი
</label>

<input
id="confirm"
type="password"
minlength="6"
required
placeholder="გაიმეორე ახალი პაროლი"

>

</div>

<button
class="btn"
id="submitBtn"
type="submit"

>

პაროლის შეცვლა → </button>

</form>

<div
id="message"
class="message"
>
</div>

<a
class="back"
href="login.html"

>

← შესვლის გვერდზე დაბრუნება </a>

</div>

<script>

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const form =
document.getElementById("resetForm");

const loading =
document.getElementById("loading");

const message =
document.getElementById("message");

const button =
document.getElementById("submitBtn");


let recoveryReady = false;


/*
==================================================
SUPABASE PASSWORD RECOVERY
==================================================
*/

client.auth.onAuthStateChange(
async (event, session) => {

console.log(
"Supabase Auth Event:",
event
);

if(event === "PASSWORD_RECOVERY"){

recoveryReady = true;

loading.classList.add("hidden");

form.classList.remove("hidden");

message.textContent =
"შეიყვანე ახალი პაროლი.";

message.className =
"message";

return;
}


/*
თუ უკვე გვაქვს აქტიური session,
აღდგენის ფორმაც შეგვიძლია ვაჩვენოთ.
*/

if(
session &&
!recoveryReady
){

recoveryReady = true;

loading.classList.add("hidden");

form.classList.remove("hidden");

message.textContent =
"შეიყვანე ახალი პაროლი.";

message.className =
"message";

}

}
);


/*
==================================================
დამატებით ვამოწმებთ session-ს
==================================================
*/

(async function(){

try{

const {
data,
error
} =
await client.auth.getSession();


if(error){

console.error(
"Session error:",
error
);

}


if(
data &&
data.session
){

recoveryReady = true;

loading.classList.add("hidden");

form.classList.remove("hidden");

message.textContent =
"შეიყვანე ახალი პაროლი.";

message.className =
"message";

return;

}


/*
თუ session ჯერ არ არის,
ცოტა ხანს ველოდებით PASSWORD_RECOVERY-ს.
*/

setTimeout(function(){

if(!recoveryReady){

loading.classList.add("hidden");

message.textContent =
"აღდგენის ბმული არასწორია ან ვადა გაუვიდა. თავიდან მოითხოვე პაროლის აღდგენა.";

message.className =
"message error";

}

},5000);


}catch(error){

console.error(
error
);

loading.classList.add("hidden");

message.textContent =
"ვერ მოხერხდა აღდგენის ბმულის შემოწმება. თავიდან მოითხოვე პაროლის აღდგენა.";

message.className =
"message error";

}

})();


/*
==================================================
PASSWORD UPDATE
==================================================
*/

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirm").value;


message.textContent = "";


if(password.length < 6){

message.textContent =
"პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.";

message.className =
"message error";

return;

}


if(password !== confirm){

message.textContent =
"პაროლები ერთმანეთს არ ემთხვევა.";

message.className =
"message error";

return;

}


button.disabled = true;

button.textContent =
"იცვლება...";


try{

const {
data,
error
} =
await client.auth.updateUser({
password: password
});


if(error){

console.error(
"Password update error:",
error
);

message.textContent =
"შეცდომა: " +
error.message;

message.className =
"message error";

button.disabled = false;

button.textContent =
"პაროლის შეცვლა →";

return;

}


/*
წარმატებული ცვლილება
*/

message.textContent =
"✅ პაროლი წარმატებით შეიცვალა!";

message.className =
"message success";

form.classList.add("hidden");


setTimeout(
function(){

window.location.href =
"login.html";

},
1800
);


}catch(error){

console.error(
error
);

message.textContent =
"დაფიქსირდა შეცდომა. გთხოვ თავიდან სცადო.";

message.className =
"message error";

button.disabled = false;

button.textContent =
"პაროლის შეცვლა →";

}

});

</script>

</body>
</html>
