<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English with Mariami — პაროლის აღდგენა</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Georgian",sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 50% 35%,#eaffff 0,#8ed8f4 25%,#286c98 58%,#010712 100%);overflow:hidden}.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,transparent 25%,#001329aa 65%,#00040c 100%)}.letters span{position:absolute;font-size:90px;font-weight:1000;color:#fff;text-shadow:0 0 8px #fff,0 0 20px #00eaff,0 0 45px #008cff;animation:float 6s ease-in-out infinite}.letters span:nth-child(1){left:8%;top:15%}.letters span:nth-child(2){right:10%;top:20%;animation-delay:-2s}.letters span:nth-child(3){left:15%;bottom:15%;animation-delay:-4s}.letters span:nth-child(4){right:18%;bottom:18%;animation-delay:-1s}@keyframes float{50%{transform:translate3d(25px,-30px,50px) rotateY(25deg)}}.card{width:min(440px,calc(100% - 28px));padding:34px 28px;border:1px solid #00eaff77;border-radius:28px;background:linear-gradient(145deg,#041a31ee,#020b19ee);box-shadow:0 25px 70px #000b,0 0 40px #00eaff33;backdrop-filter:blur(12px);text-align:center}.logo{font-size:42px}.card h1{margin:8px 0 10px;font-size:31px;color:#00eaff;text-shadow:0 0 18px #00eaff88}.card h2{margin:15px 0}.card p{color:#cdeef7;line-height:1.6}.field{text-align:left;margin:18px 0}.field label{display:block;margin-bottom:7px;font-weight:800;color:#ffe600}.field input{width:100%;padding:14px;border-radius:13px;border:1px solid #00eaff55;background:#020c1a;color:#fff;font-size:16px;outline:none}.field input:focus{border-color:#00eaff;box-shadow:0 0 15px #00eaff33}.btn{width:100%;padding:14px;border:0;border-radius:14px;background:#00c9f2;color:#00131a;font-size:16px;font-weight:1000;cursor:pointer;box-shadow:0 0 25px #00eaff66}.btn:disabled{opacity:.6;cursor:not-allowed}.message{margin-top:15px;min-height:24px;font-weight:700;line-height:1.5}.success{color:#8dffb0}.error{color:#ff9b9b}.hidden{display:none!important}.back{display:inline-block;margin-top:18px;color:#00eaff}.loading{color:#ffe600}.divider{height:1px;background:#00eaff22;margin:22px 0}
</style>
</head>
<body>
<div class="bg"></div>
<div class="letters"><span>A</span><span>B</span><span>C</span><span>D</span></div>
<div class="card">
<div class="logo">🌈📚</div>
<h1>English with Mariami</h1>
<div id="requestBox">
<h2>🔑 დაგავიწყდა პაროლი?</h2>
<p>შეიყვანე შენი ელფოსტა და გამოგიგზავნით პაროლის აღდგენის ბმულს.</p>
<form id="requestForm">
<div class="field"><label for="email">📧 ელფოსტა</label><input id="email" type="email" required autocomplete="email" placeholder="შეიყვანე ელფოსტა"></div>
<button class="btn" id="requestBtn" type="submit">📩 აღდგენის ბმულის გაგზავნა</button>
</form>
</div>
<div id="resetBox" class="hidden">
<h2>🔐 ახალი პაროლი</h2>
<p>შეიყვანე ახალი პაროლი და განაახლე შენი ანგარიშის პაროლი.</p>
<form id="resetForm">
<div class="field"><label for="password">🔑 ახალი პაროლი</label><input id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="მინიმუმ 6 სიმბოლო"></div>
<div class="field"><label for="confirm">🔑 გაიმეორე პაროლი</label><input id="confirm" type="password" minlength="6" required autocomplete="new-password" placeholder="გაიმეორე ახალი პაროლი"></div>
<button class="btn" id="submitBtn" type="submit">პაროლის შეცვლა →</button>
</form>
</div>
<div id="loading" class="message loading hidden">🔄 მოწმდება აღდგენის ბმული...</div>
<div id="message" class="message"></div>
<div class="divider"></div>
<a class="back" href="login.html">← შესვლის გვერდზე დაბრუნება</a>
</div>
<script>
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
const requestBox=document.getElementById('requestBox');
const resetBox=document.getElementById('resetBox');
const requestForm=document.getElementById('requestForm');
const resetForm=document.getElementById('resetForm');
const requestBtn=document.getElementById('requestBtn');
const submitBtn=document.getElementById('submitBtn');
const loading=document.getElementById('loading');
const message=document.getElementById('message');
let recoveryReady=false;
let recoveryHandled=false;
function showMessage(text,type=''){message.textContent=text;message.className='message '+type;}
function showResetForm(){if(recoveryReady)return;recoveryReady=true;recoveryHandled=true;requestBox.classList.add('hidden');loading.classList.add('hidden');resetBox.classList.remove('hidden');showMessage('შეიყვანე ახალი პაროლი.');}
function showInvalidLink(){if(recoveryReady)return;loading.classList.add('hidden');requestBox.classList.remove('hidden');showMessage('აღდგენის ბმული არასწორია ან ვადა გაუვიდა. თავიდან მოითხოვე პაროლის აღდგენა.','error');}

/* Supabase-ის recovery event უნდა დამუშავდეს პირველივე წამიდან. */
client.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY' && session){showResetForm();}
});

async function prepareRecovery(){
 const url=new URL(window.location.href);
 const params=url.searchParams;
 const code=params.get('code');
 const tokenHash=params.get('token_hash');
 const type=params.get('type');
 const hashParams=new URLSearchParams(url.hash.startsWith('#')?url.hash.slice(1):url.hash);
 const hasAccessToken=!!hashParams.get('access_token');
 const hashType=hashParams.get('type');
 const isRecoveryHash=hasAccessToken && (!hashType || hashType==='recovery');

 /* PKCE/token-hash ბმული */
 if(code){
   recoveryHandled=true;
   requestBox.classList.add('hidden');
   loading.classList.remove('hidden');
   const {error}=await client.auth.exchangeCodeForSession(code);
   if(!error){
     window.history.replaceState({},document.title,url.pathname);
     showResetForm();
     return;
   }
   console.error('Recovery code exchange error:',error);
   showInvalidLink();
   return;
 }

 /* თუ Supabase-ის recovery template token_hash-ს აგზავნის */
 if(tokenHash && (type==='recovery' || !type)){
   recoveryHandled=true;
   requestBox.classList.add('hidden');
   loading.classList.remove('hidden');
   const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
   if(!error){
     window.history.replaceState({},document.title,url.pathname);
     showResetForm();
     return;
   }
   console.error('Recovery token hash error:',error);
   showInvalidLink();
   return;
 }

 /* ძველი/სტანდარტული implicit recovery ბმული */
 if(isRecoveryHash){
   recoveryHandled=true;
   requestBox.classList.add('hidden');
   loading.classList.remove('hidden');
   const {data,error}=await client.auth.getSession();
   if(!error && data.session){
     showResetForm();
     return;
   }
   /* supabase-js-ს შეიძლება რამდენიმე წამი დასჭირდეს URL fragment-ის დამუშავებას */
   setTimeout(async()=>{
     if(recoveryReady)return;
     const result=await client.auth.getSession();
     if(result.data && result.data.session)showResetForm();
     else showInvalidLink();
   },1500);
   return;
 }

 /* უკვე არსებული recovery session */
 const {data}=await client.auth.getSession();
 if(data && data.session && sessionLooksLikeRecovery(url)){
   showResetForm();
 }
}

function sessionLooksLikeRecovery(url){
 return url.hash.includes('type=recovery') || url.searchParams.get('type')==='recovery';
}

requestForm.addEventListener('submit',async e=>{
 e.preventDefault();
 const email=document.getElementById('email').value.trim();
 if(!email)return;
 requestBtn.disabled=true;
 requestBtn.textContent='⏳ იგზავნება...';
 showMessage('');
 const redirectTo=window.location.origin+window.location.pathname;
 const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo});
 if(error){
   console.error('Password reset request error:',error);
   showMessage('❌ '+error.message,'error');
   requestBtn.disabled=false;
   requestBtn.textContent='📩 აღდგენის ბმულის გაგზავნა';
   return;
 }
 requestForm.reset();
 requestBtn.disabled=false;
 requestBtn.textContent='📩 აღდგენის ბმულის გაგზავნა';
 showMessage('✅ აღდგენის ბმული გამოგზავნილია ელფოსტაზე. შეამოწმე Inbox და Spam/Junk საქაღალდეც.','success');
});

resetForm.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!recoveryReady){showMessage('⚠️ ჯერ გახსენი ელფოსტაზე გამოგზავნილი აღდგენის ბმული.','error');return;}
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirm').value;
 if(password.length<6){showMessage('პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.','error');return;}
 if(password!==confirm){showMessage('პაროლები ერთმანეთს არ ემთხვევა.','error');return;}
 submitBtn.disabled=true;
 submitBtn.textContent='⏳ იცვლება...';
 const {error}=await client.auth.updateUser({password});
 if(error){
   console.error('Password update error:',error);
   showMessage('❌ '+error.message,'error');
   submitBtn.disabled=false;
   submitBtn.textContent='პაროლის შეცვლა →';
   return;
 }
 showMessage('✅ პაროლი წარმატებით შეიცვალა! ახლა შეგიძლია შეხვიდე ანგარიშში.','success');
 resetForm.classList.add('hidden');
 await client.auth.signOut();
 setTimeout(()=>window.location.href='login.html',1800);
});

prepareRecovery();
</script>
</body>
</html>
