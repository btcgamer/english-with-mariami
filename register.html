<!doctype html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📝 რეგისტრაცია | English with Mariami</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at 15% 10%,#075eff55,transparent 28%),
radial-gradient(circle at 85% 20%,#00eaff33,transparent 30%),
radial-gradient(circle at 50% 100%,#00d08422,transparent 35%),
linear-gradient(135deg,#02091c,#043c55 55%,#071b30);
}

.box{
width:min(500px,calc(100% - 30px));
padding:35px;
border-radius:30px;
background:linear-gradient(145deg,#102d4d,#123b35);
border:1px solid #00eaff99;
box-shadow:
0 25px 70px #000b,
0 0 35px #00eaff44,
inset 0 0 30px #00eaff0d;
}

.logo{
text-align:center;
font-size:65px;
filter:drop-shadow(0 0 18px #00eaff);
}

h1{
text-align:center;
font-size:34px;
color:#ffe600;
margin:10px 0;
text-shadow:0 0 15px #ffe60066;
}

.subtitle{
text-align:center;
color:#dffcff;
margin-bottom:28px;
font-weight:bold;
}

label{
display:block;
margin:14px 0 7px;
color:#6dffbf;
font-weight:900;
}

input,select{
width:100%;
padding:15px;
border-radius:14px;
border:1px solid #00eaff77;
background:#06162f;
color:#fff;
font-size:16px;
outline:none;
}

input:focus,select:focus{
border-color:#00eaff;
box-shadow:0 0 15px #00eaff55;
}

button{
width:100%;
margin-top:22px;
padding:16px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,#075eff,#00d084,#ffe600);
color:#06162f;
font-size:17px;
font-weight:1000;
cursor:pointer;
box-shadow:0 0 20px #00eaff66;
transition:.25s;
}

button:hover{
transform:translateY(-3px) scale(1.02);
box-shadow:0 0 30px #00eaff;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.message{
text-align:center;
min-height:25px;
margin-top:18px;
font-weight:900;
line-height:1.5;
}

.login{
text-align:center;
margin-top:22px;
color:#dffcff;
}

.login a{
color:#ffe600;
font-weight:900;
text-decoration:none;
}

.home{
display:block;
text-align:center;
margin-top:20px;
padding:12px;
border-radius:14px;
background:#06162f;
border:1px solid #ffe600;
color:#ffe600;
text-decoration:none;
font-weight:900;
}

.small{
font-size:13px;
color:#b9eaf2;
margin-top:8px;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">📝</div>

<h1>რეგისტრაცია</h1>

<div class="subtitle">
🌈 English with Mariami
</div>

<form id="registerForm">

<label>👤 სახელი და გვარი</label>
<input
type="text"
id="fullName"
placeholder="მაგ: ნიკა ბერიძე"
required
>

<label>📚 კლასი</label>

<select id="grade" required>

<option value="">აირჩიე კლასი</option>

<option value="2">🌱 2-ე კლასი</option>

<option value="3">🚀 3-ე კლასი</option>

<option value="4">⭐ 4-ე კლასი</option>

</select>

<label>📧 ელფოსტა</label>

<input
type="email"
id="email"
placeholder="მაგ: student@gmail.com"
required
>

<label>🔐 პაროლი</label>

<input
type="password"
id="password"
placeholder="მინიმუმ 6 სიმბოლო"
minlength="6"
required
>

<div class="small">
🔒 პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.
</div>

<button type="submit" id="registerBtn">
🚀 რეგისტრაცია
</button>

</form>

<div id="message" class="message"></div>

<div class="login">
უკვე გაქვს ანგარიში?
<a href="login.html">🔐 შესვლა</a>
</div>

<a class="home" href="index.html">
🏠 მთავარ გვერდზე დაბრუნება
</a>

</div>


<script>

const SUPABASE_URL =
"https://vtdhvsfqhwesxtwmduew.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MnrM2ulyJY_ugwfFVfpQYA_iV5wjCmt";

const { createClient } =
supabase;

const db =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


document
.getElementById("registerForm")
.addEventListener("submit", async function(e){

e.preventDefault();

const fullName =
document.getElementById("fullName").value.trim();

const grade =
document.getElementById("grade").value;

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

const btn =
document.getElementById("registerBtn");

message.textContent="";
btn.disabled=true;
btn.textContent="⏳ რეგისტრაცია...";


if(password.length < 6){

message.textContent=
"❌ პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.";

btn.disabled=false;
btn.textContent="🚀 რეგისტრაცია";

return;

}


try{

const {data,error} =
await db.auth.signUp({

email:email,

password:password,

options:{
data:{
full_name:fullName,
grade:grade
}
}

});


if(error){

message.textContent=
"❌ "+error.message;

btn.disabled=false;
btn.textContent="🚀 რეგისტრაცია";

return;

}


if(data.session){

message.style.color="#6dffbf";

message.textContent=
"🎉 რეგისტრაცია წარმატებულია! გადაგყავს მთავარ გვერდზე...";

setTimeout(()=>{
window.location.href="index.html";
},1200);

}else{

message.style.color="#6dffbf";

message.textContent=
"✅ რეგისტრაცია დასრულდა! შეამოწმე ელფოსტა დასადასტურებლად.";

btn.disabled=false;
btn.textContent="🚀 რეგისტრაცია";

}

}catch(err){

message.textContent=
"❌ მოხდა შეცდომა. სცადე თავიდან.";

btn.disabled=false;
btn.textContent="🚀 რეგისტრაცია";

}

});

</script>

</body>
</html>
