<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>English with Mariami — რეგისტრაცია</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow-x: hidden;

      font-family: Arial, "Noto Sans Georgian", sans-serif;
      color: white;

      background:
        radial-gradient(circle at 10% 20%, #075eff66, transparent 28%),
        radial-gradient(circle at 90% 80%, #00eaff55, transparent 28%),
        linear-gradient(135deg, #010714, #031a3b 48%, #020918);
    }

    /* 🌊 ნეონური მოძრავი ტალღები */

    body::before,
    body::after {
      content: "";

      position: fixed;

      left: -20%;

      width: 140%;
      height: 170px;

      border-radius: 50%;

      pointer-events: none;

      opacity: 0.35;

      filter: blur(4px);
    }

    body::before {
      top: 5%;

      border: 2px solid #00eaff;

      box-shadow:
        0 0 20px #00eaff,
        0 0 55px #00eaff;

      animation:
        wave1 9s ease-in-out infinite;
    }

    body::after {
      bottom: 5%;

      border: 2px solid #075eff;

      box-shadow:
        0 0 20px #075eff,
        0 0 55px #075eff;

      animation:
        wave2 11s ease-in-out infinite;
    }

    @keyframes wave1 {

      0%,
      100% {
        transform:
          translateX(-35px)
          rotate(-3deg);
      }

      50% {
        transform:
          translateX(35px)
          rotate(3deg);
      }
    }

    @keyframes wave2 {

      0%,
      100% {
        transform:
          translateX(35px)
          rotate(3deg);
      }

      50% {
        transform:
          translateX(-35px)
          rotate(-3deg);
      }
    }

    /* 🌐 3D ბურთები */

    .scene {
      position: fixed;
      inset: 0;

      pointer-events: none;

      perspective: 900px;
    }

    .orb {
      position: absolute;

      border-radius: 50%;

      animation:
        float 8s ease-in-out infinite;
    }

    .orb1 {
      width: 170px;
      height: 170px;

      left: 5%;
      top: 10%;

      background:
        radial-gradient(
          circle at 30% 25%,
          white,
          #075eff 35%,
          #001c65 70%
        );

      box-shadow:
        0 0 30px #075eff,
        0 0 90px #075eff88;
    }

    .orb2 {
      width: 125px;
      height: 125px;

      right: 7%;
      bottom: 12%;

      background:
        radial-gradient(
          circle at 30% 25%,
          white,
          #00eaff 35%,
          #006a91 70%
        );

      box-shadow:
        0 0 30px #00eaff,
        0 0 80px #00eaff66;

      animation-delay: -2s;
    }

    .orb3 {
      width: 65px;
      height: 65px;

      right: 18%;
      top: 12%;

      background:
        radial-gradient(
          circle at 30% 25%,
          white,
          #ffe600 35%,
          #a66b00 70%
        );

      box-shadow:
        0 0 25px #ffe600,
        0 0 55px #ffe60066;

      animation-delay: -4s;
    }

    @keyframes float {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate3d(25px, -30px, 55px)
          rotate(180deg);
      }
    }

    /* 📚 მთავარი ბარათი */

    .register-card {
      position: relative;

      z-index: 10;

      width: min(500px, 100%);

      padding: 36px 32px;

      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(9, 35, 72, 0.94),
          rgba(2, 13, 35, 0.97)
        );

      border:
        1px solid rgba(94, 238, 255, 0.6);

      box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.8),
        0 0 45px rgba(0, 234, 255, 0.25),
        inset 0 1px 0 rgba(255,255,255,0.12);

      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 37px;

      color: white;

      text-shadow:
        0 0 12px #00eaff,
        0 0 35px #075eff;
    }

    .subtitle {
      margin: 9px 0 28px;

      text-align: center;

      color: #c9f7ff;
    }

    .field {
      margin: 17px 0;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #ffe600;

      font-weight: 900;
    }

    input,
    select {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border-radius: 15px;

      border:
        1px solid rgba(0,234,255,0.45);

      outline: none;

      background:
        linear-gradient(
          145deg,
          #041733,
          #020b1e
        );

      color: white;

      font-size: 16px;
    }

    input:focus,
    select:focus {

      border-color: #00eaff;

      box-shadow:
        0 0 15px rgba(0,234,255,0.35);
    }

    option {
      background: #03142b;
      color: white;
    }

    .register-button {
      width: 100%;
      height: 55px;

      margin-top: 8px;

      border-radius: 16px;

      border:
        1px solid #8ff7ff;

      background:
        linear-gradient(
          135deg,
          #075eff,
          #00aeea 55%,
          #00d8c8
        );

      color: white;

      font-size: 18px;

      font-weight: 1000;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(0,234,255,0.35);

      transition: 0.2s;
    }

    .register-button:hover {

      transform: translateY(-2px);

      box-shadow:
        0 0 30px rgba(0,234,255,0.65);
    }

    .register-button:disabled {

      opacity: 0.6;

      cursor: wait;
    }

    .message {

      min-height: 24px;

      margin-top: 16px;

      text-align: center;

      font-weight: 700;
    }

    .success {
      color: #5dffad;
    }

    .error {
      color: #ff7894;
    }

    .login {

      margin-top: 22px;

      text-align: center;

      color: #cdefff;
    }

    .login a {

      color: #ffe600;

      font-weight: 1000;

      text-decoration: none;
    }

    .brand {

      margin-top: 20px;

      text-align: center;

      color: #00eaff;

      font-weight: 900;

      text-shadow:
        0 0 10px #00eaff;
    }

    /* © მხოლოდ ერთი */

    .site-copyright {

      margin-top: 24px;

      padding: 15px 5px;

      text-align: center;

      border-top:
        1px solid rgba(0,234,255,0.2);

      color: #9dc7d5;

      font-size: 13px;
    }

    @media (max-width: 600px) {

      body {
        padding: 14px;
      }

      .register-card {

        padding: 28px 20px;

        border-radius: 27px;
      }

      h1 {
        font-size: 30px;
      }

      .orb1 {
        width: 110px;
        height: 110px;
      }

      .orb2 {
        width: 85px;
        height: 85px;
      }

      .orb3 {
        width: 45px;
        height: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

  </div>


  <main class="register-card">

    <h1>
      📝 რეგისტრაცია
    </h1>

    <p class="subtitle">
      შექმენი შენი მოსწავლის ანგარიში 🚀
    </p>


    <form id="registerForm">

      <div class="field">

        <label for="fullName">
          👤 სახელი და გვარი
        </label>

        <input
          id="fullName"
          type="text"
          required
          autocomplete="name"
          placeholder="მაგ: ანა ბერიძე"
        >

      </div>


      <div class="field">

        <label for="email">
          📧 ელფოსტა
        </label>

        <input
          id="email"
          type="email"
          required
          autocomplete="email"
          placeholder="example@gmail.com"
        >

      </div>


      <div class="field">

        <label for="password">
          🔐 პაროლი
        </label>

        <input
          id="password"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
          placeholder="მინიმუმ 6 სიმბოლო"
        >

      </div>


      <div class="field">

        <label for="grade">
          🎓 კლასი
        </label>

        <select id="grade" required>

          <option value="">
            აირჩიე კლასი
          </option>

          <option value="2">
            მე-2 კლასი
          </option>

          <option value="3">
            მე-3 კლასი
          </option>

          <option value="4">
            მე-4 კლასი
          </option>

        </select>

      </div>


      <button
        id="submitBtn"
        class="register-button"
        type="submit"
      >
        🚀 რეგისტრაცია
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </form>


    <div class="login">

      უკვე გაქვს ანგარიში?

      <a href="login.html">
        🔐 შესვლა
      </a>

    </div>


    <div class="brand">
      📚 English with Mariami 🇬🇧
    </div>


    <!-- მხოლოდ ერთი Copyright -->

    <footer class="site-copyright">
      © 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer
    </footer>

  </main>


  <script>

    (function () {

      const supabaseClient =
        window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;


      const form =
        document.getElementById("registerForm");

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("submitBtn");


      if (!supabaseClient) {

        message.className =
          "message error";

        message.textContent =
          "❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.";

        return;
      }


      form.addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();


          const fullName =
            document
              .getElementById("fullName")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById("password")
              .value;


          const grade =
            Number(
              document
                .getElementById("grade")
                .value
            );


          if (!fullName || !email || !password || !grade) {

            message.className =
              "message error";

            message.textContent =
              "⚠️ ყველა ველი შეავსე.";

            return;
          }


          button.disabled = true;

          button.textContent =
            "⏳ მიმდინარეობს...";


          message.className =
            "message";

          message.textContent =
            "";


          try {

            const result =
              await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                  data: {

                    full_name: fullName,

                    grade: grade

                  }

                }

              });


            const data =
              result.data;

            const error =
              result.error;


            if (error) {

              console.error(
                "Supabase registration:",
                error
              );

              let text =
                "❌ რეგისტრაცია ვერ მოხერხდა.";

              if (
                /already registered|user already registered/i
                .test(error.message)
              ) {

                text =
                  "❌ ეს ელფოსტა უკვე რეგისტრირებულია.";

              } else if (
                /failed to fetch/i
                .test(error.message)
              ) {

                text =
                  "🌐 სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი.";

              } else {

                text =
                  "❌ " + error.message;
              }


              message.className =
                "message error";

              message.textContent =
                text;

              return;
            }


            if (!data || !data.user) {

              throw new Error(
                "მომხმარებელი ვერ შეიქმნა."
              );
            }


            /*
              თუ Supabase-ს email confirmation
              გამორთული აქვს, პირდაპირ შევა.
            */

            if (data.session) {

              try {

                await supabaseClient
                  .from("profiles")
                  .upsert(

                    {
                      user_id: data.user.id,

                      full_name: fullName,

                      grade: grade,

                      points: 0
                    },

                    {
                      onConflict: "user_id"
                    }

                  );

              } catch (profileError) {

                console.warn(
                  "Profile save:",
                  profileError
                );

              }


              message.className =
                "message success";

              message.textContent =
                "🎉 რეგისტრაცია წარმატებულია!";


              setTimeout(
                function () {

                  location.replace(
                    "academy.html"
                  );

                },
                700
              );


            } else {

              message.className =
                "message success";

              message.textContent =
                "📧 ანგარიში შეიქმნა! ელფოსტა დაადასტურე და შემდეგ შედი.";

            }


          } catch (err) {

            console.error(
              "Registration error:",
              err
            );


            message.className =
              "message error";


            message.textContent =
              "❌ " +
              (
                err.message ||
                "რეგისტრაცია ვერ მოხერხდა."
              );


          } finally {

            button.disabled = false;

            button.textContent =
              "🚀 რეგისტრაცია";

          }

        }

      );

    })();

  </script>

</body>
</html>
