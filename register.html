<!DOCTYPE html>

<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>English with Mariami — რეგისტრაცია</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100svh;
  height:100svh;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  font-family:Arial,"Noto Sans Georgian",sans-serif;
  color:#fff;

  background:
    radial-gradient(circle at 10% 20%,#075eff66,transparent 28%),
    radial-gradient(circle at 90% 80%,#00eaff55,transparent 28%),
    linear-gradient(135deg,#010714,#031a3b 48%,#020918);
}

/* =========================
BACKGROUND WAVES
========================= */

body:before,
body:after{
  content:"";
  position:fixed;
  left:-20%;
  width:140%;
  height:170px;
  border-radius:50%;
  pointer-events:none;
  opacity:.35;
  filter:blur(4px);
}

body:before{
  top:5%;
  border:2px solid #00eaff;
  box-shadow:
    0 0 20px #00eaff,
    0 0 55px #00eaff;
  animation:wave1 9s ease-in-out infinite;
}

body:after{
  bottom:5%;
  border:2px solid #075eff;
  box-shadow:
    0 0 20px #075eff,
    0 0 55px #075eff;
  animation:wave2 11s ease-in-out infinite;
}

@keyframes wave1{
  0%,100%{
    transform:translateX(-35px) rotate(-3deg);
  }
  50%{
    transform:translateX(35px) rotate(3deg);
  }
}

@keyframes wave2{
  0%,100%{
    transform:translateX(35px) rotate(3deg);
  }
  50%{
    transform:translateX(-35px) rotate(-3deg);
  }
}

/* =========================
FLOATING ORBS
========================= */

.scene{
  position:fixed;
  inset:0;
  pointer-events:none;
  perspective:900px;
}

.orb{
  position:absolute;
  border-radius:50%;
  animation:float 8s ease-in-out infinite;
}

.orb1{
  width:170px;
  height:170px;
  left:5%;
  top:10%;

  background:
    radial-gradient(circle at 30% 25%,white,#075eff 35%,#001c65 70%);

  box-shadow:
    0 0 30px #075eff,
    0 0 90px #075eff88;
}

.orb2{
  width:125px;
  height:125px;
  right:7%;
  bottom:12%;

  background:
    radial-gradient(circle at 30% 25%,white,#00eaff 35%,#006a91 70%);

  box-shadow:
    0 0 30px #00eaff,
    0 0 80px #00eaff66;

  animation-delay:-2s;
}

.orb3{
  width:65px;
  height:65px;
  right:18%;
  top:12%;

  background:
    radial-gradient(circle at 30% 25%,white,#ffe600 35%,#a66b00 70%);

  box-shadow:
    0 0 25px #ffe600,
    0 0 55px #ffe60066;

  animation-delay:-4s;
}

@keyframes float{
  0%,100%{
    transform:translate3d(0,0,0) rotate(0);
  }

  50%{
    transform:translate3d(25px,-30px,55px) rotate(180deg);
  }
}

/* =========================
REGISTER CARD
========================= */

.register-card{
  position:relative;
  z-index:10;

  width:min(500px,calc(100vw - 20px));

  max-height:calc(100svh - 20px);

  padding:24px 28px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(9,35,72,.96),
      rgba(2,13,35,.98)
    );

  border:1px solid rgba(94,238,255,.6);

  box-shadow:
    0 35px 100px #000c,
    0 0 45px #00eaff40,
    inset 0 1px 0 #ffffff1f;

  backdrop-filter:blur(18px);

  overflow-y:auto;
  overflow-x:hidden;
}

/* =========================
TITLE
========================= */

h1{
  margin:0;
  text-align:center;

  font-size:34px;

  text-shadow:
    0 0 12px #00eaff,
    0 0 35px #075eff;
}

.subtitle{
  margin:7px 0 18px;

  text-align:center;

  color:#c9f7ff;
}

/* =========================
FIELDS
========================= */

.field{
  margin:12px 0;
}

.field label{
  display:block;
  margin-bottom:6px;

  color:#ffe600;
  font-weight:900;
}

.field input{
  width:100%;
  height:47px;

  padding:0 14px;

  border-radius:14px;

  border:1px solid #00eaff73;

  outline:none;

  background:
    linear-gradient(
      145deg,
      #041733,
      #020b1e
    );

  color:#fff;

  font-size:16px;

  box-shadow:
    inset 0 0 12px #0008;
}

.field input::placeholder{
  color:#88aebb;
}

.field input:focus{
  border-color:#00eaff;

  box-shadow:
    0 0 15px #00eaff59,
    inset 0 0 10px #00eaff12;
}

/* =========================
BUTTON
========================= */

.register-button{
  width:100%;
  height:50px;

  margin-top:6px;

  border-radius:15px;

  border:1px solid #8ff7ff;

  background:
    linear-gradient(
      135deg,
      #075eff,
      #00aeea 55%,
      #00d8c8
    );

  color:#fff;

  font-size:17px;
  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 0 20px #00eaff59;

  transition:.2s;
}

.register-button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 0 30px #00eaffa6;
}

.register-button:disabled{
  opacity:.6;
  cursor:wait;
}

/* =========================
MESSAGE
========================= */

.message{
  min-height:22px;

  margin-top:10px;

  text-align:center;

  font-weight:700;

  font-size:14px;
}

.success{
  color:#5dffad;
}

.error{
  color:#ff7894;
}

/* =========================
LOGIN LINK
========================= */

.login{
  margin-top:13px;

  text-align:center;

  color:#cdefff;

  font-size:14px;
}

.login a{
  color:#ffe600;

  font-weight:1000;

  text-decoration:none;
}

.login a:hover{
  text-decoration:underline;
}

/* =========================
BRAND
========================= */

.brand{
  margin-top:13px;

  text-align:center;

  color:#00eaff;

  font-size:15px;
  font-weight:900;

  text-shadow:
    0 0 10px #00eaff;
}

/* =========================
COPYRIGHT
========================= */

.site-copyright{
  margin-top:13px;

  padding:10px 5px;

  text-align:center;

  border-top:1px solid #00eaff33;

  color:#9dc7d5;

  font-size:10px;
}

/* =========================
TABLET
========================= */

@media(max-width:700px){

  .register-card{
    width:min(500px,calc(100vw - 16px));
    max-height:calc(100svh - 16px);

    padding:20px 22px;
  }

  h1{
    font-size:30px;
  }

  .subtitle{
    margin-bottom:15px;
  }

  .orb1{
    width:110px;
    height:110px;
  }

  .orb2{
    width:85px;
    height:85px;
  }

  .orb3{
    width:45px;
    height:45px;
  }
}

/* =========================
PHONE
========================= */

@media(max-width:500px){

  body{
    padding:6px;
  }

  .register-card{
    width:calc(100vw - 12px);
    max-height:calc(100svh - 12px);

    padding:17px 17px;

    border-radius:24px;
  }

  h1{
    font-size:27px;
  }

  .subtitle{
    font-size:13px;
    margin:5px 0 12px;
  }

  .field{
    margin:9px 0;
  }

  .field label{
    margin-bottom:5px;
    font-size:13px;
  }

  .field input{
    height:44px;
    font-size:14px;
  }

  .register-button{
    height:46px;
    font-size:16px;
  }

  .login{
    margin-top:10px;
    font-size:12px;
  }

  .brand{
    margin-top:10px;
    font-size:13px;
  }

  .site-copyright{
    margin-top:9px;
    padding:8px 3px;
    font-size:9px;
  }
}

/* =========================
VERY SMALL PHONE
========================= */

@media(max-width:380px){

  .register-card{
    padding:13px 14px;
  }

  h1{
    font-size:24px;
  }

  .subtitle{
    font-size:12px;
    margin-bottom:9px;
  }

  .field{
    margin:7px 0;
  }

  .field label{
    font-size:12px;
  }

  .field input{
    height:41px;
    font-size:13px;
  }

  .register-button{
    height:43px;
    font-size:15px;
  }

  .message{
    font-size:12px;
  }

  .login{
    font-size:11px;
  }

  .brand{
    font-size:12px;
  }

  .site-copyright{
    font-size:8px;
  }
}
</style>

</head>

<body>

<div class="scene">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<main class="register-card">

  <h1>📝 რეგისტრაცია</h1>

  <p class="subtitle">
    შექმენი შენი მოსწავლის ანგარიში 🚀
  </p>

  <form id="registerForm">

```
<div class="field">
  <label for="fullName">
    👤 სახელი და გვარი
  </label>

  <input
    id="fullName"
    type="text"
    required
    autocomplete="name"
    placeholder="მაგ: ანა ბერიძე"
  >
</div>

<div class="field">
  <label for="email">
    📧 ელფოსტა
  </label>

  <input
    id="email"
    type="email"
    required
    autocomplete="email"
    placeholder="example@gmail.com"
  >
</div>

<div class="field">
  <label for="password">
    🔐 პაროლი
  </label>

  <input
    id="password"
    type="password"
    minlength="6"
    required
    autocomplete="new-password"
    placeholder="მინიმუმ 6 სიმბოლო"
  >
</div>

<button
  id="submitBtn"
  class="register-button"
  type="submit"
>
  🚀 რეგისტრაცია
</button>

<div
  id="message"
  class="message"
  aria-live="polite"
></div>
```

  </form>

  <div class="login">
    უკვე გაქვს ანგარიში?
    <a href="login.html">
      🔐 შესვლა
    </a>
  </div>

  <div class="brand">
    📚 English with Mariami 🇬🇧
  </div>

  <footer class="site-copyright">
    © 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer
  </footer>

</main>

<script>
(function(){

"use strict";

const form =
  document.getElementById("registerForm");

const message =
  document.getElementById("message");

const button =
  document.getElementById("submitBtn");


function setMessage(text,type){

  message.textContent = text;

  message.className =
    "message " + (type || "");

}


/* =========================================
   GET SUPABASE CLIENT
========================================= */

async function getClient(){

  if(
    window.__ENGLISH_MARIAMI_SUPABASE_CLIENT
  ){

    return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

  }

  if(window.supabaseClient){

    return window.supabaseClient;

  }

  if(
    window.supabase &&
    typeof window.supabase.createClient === "function" &&
    typeof window.SUPABASE_URL === "string" &&
    typeof window.SUPABASE_KEY === "string"
  ){

    try{

      window.__ENGLISH_MARIAMI_SUPABASE_CLIENT =
        window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_KEY
        );

      return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;

    }catch(error){

      console.error(error);

    }

  }


  return new Promise(function(resolve){

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      resolve(
        window.__ENGLISH_MARIAMI_SUPABASE_CLIENT ||
        window.supabaseClient ||
        null
      );

    }

    window.addEventListener(
      "englishMariamiSupabaseReady",
      done,
      {once:true}
    );

    setTimeout(done,5000);

  });

}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    setMessage("","");

    const client =
      await getClient();

    if(!client){

      setMessage(
        "❌ Supabase ვერ ჩაიტვირთა. განაახლე გვერდი და სცადე თავიდან.",
        "error"
      );

      return;

    }


    const fullName =
      document
        .getElementById("fullName")
        .value
        .trim();

    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("password")
        .value;


    if(!fullName){

      setMessage(
        "❌ შეიყვანე სახელი და გვარი.",
        "error"
      );

      return;

    }


    if(!email){

      setMessage(
        "❌ შეიყვანე ელფოსტა.",
        "error"
      );

      return;

    }


    if(password.length < 6){

      setMessage(
        "❌ პაროლი უნდა შეიცავდეს მინიმუმ 6 სიმბოლოს.",
        "error"
      );

      return;

    }


    button.disabled = true;

    button.textContent =
      "⏳ რეგისტრაცია...";


    try{

      const result =
        await client.auth.signUp({

          email:email,

          password:password,

          options:{
            data:{
              full_name:fullName,
              role:"student",
              grade:0
            }
          }

        });


      const data =
        result.data;

      const error =
        result.error;


      if(error){

        throw error;

      }


      if(data && data.user){

        const profileResult =
          await client
            .from("profiles")
            .upsert(
              {
                user_id:data.user.id,
                full_name:fullName,
                role:"student",
                grade:0
              },
              {
                onConflict:"user_id"
              }
            );


        if(profileResult.error){

          console.warn(
            "Profile creation warning:",
            profileResult.error
          );

        }

      }


      if(data && data.session){

        setMessage(
          "🎉 რეგისტრაცია წარმატებულია! კლასი ჯერ არ არის მინიჭებული.",
          "success"
        );

        form.reset();

        setTimeout(function(){

          window.location.replace(
            "login.html"
          );

        },1200);

      }else{

        setMessage(
          "📧 ანგარიში შეიქმნა! დაადასტურე ელფოსტა. კლასი მასწავლებელმა უნდა მოგანიჭოს.",
          "success"
        );

        form.reset();

      }


    }catch(error){

      console.error(
        "Registration error:",
        error
      );


      const text =
        String(
          error &&
          error.message
            ? error.message
            : ""
        );


      if(
        /already registered|user already registered/i
          .test(text)
      ){

        setMessage(
          "❌ ეს ელფოსტა უკვე რეგისტრირებულია.",
          "error"
        );

      }else{

        setMessage(
          "❌ " +
          (
            text ||
            "რეგისტრაცია ვერ მოხერხდა."
          ),
          "error"
        );

      }

    }finally{

      button.disabled = false;

      button.textContent =
        "🚀 რეგისტრაცია";

    }

  }

);

})();
</script>

</body>
</html>
