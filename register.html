<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📝 რეგისტრაცია | English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#02091c,#043c55)}.box{width:min(500px,calc(100% - 30px));padding:35px;border-radius:30px;background:#102d4d;border:1px solid #00eaff}input,select{width:100%;padding:15px;margin:7px 0 14px;box-sizing:border-box;border-radius:14px;background:#06162f;color:#fff;border:1px solid #00eaff77}button{width:100%;padding:16px;border:0;border-radius:16px;background:#00d084;font-weight:bold}.message{text-align:center;min-height:35px;margin-top:15px}.links{text-align:center;margin-top:20px}.links a{color:#ffe600;font-weight:bold;text-decoration:none}</style></head><body><div class="box"><div style="text-align:center;font-size:60px">📝</div><h1 style="text-align:center;color:#ffe600">რეგისტრაცია</h1><form id="registerForm"><label>👤 სახელი და გვარი</label><input id="fullName" required><label>📚 კლასი</label><select id="grade" required><option value="">აირჩიე კლასი</option><option value="2">🌱 2-ე კლასი</option><option value="3">🚀 3-ე კლასი</option><option value="4">⭐ 4-ე კლასი</option></select><label>📧 ელფოსტა</label><input type="email" id="email" required><label>🔐 პაროლი</label><input type="password" id="password" minlength="6" required><button id="registerBtn">🚀 რეგისტრაცია</button></form><div id="message" class="message"></div><div class="links">უკვე გაქვს ანგარიში? <a href="login.html">🔐 შესვლა</a><br><br><a href="index.html">🏠 მთავარი</a></div></div><script>const db=supabase.createClient('https://vtdhvsfqhwesxtwmdue.supabase.co','sb_publishable_MnrM2ulyJY_ugwfFVfpV5wjCmt',{auth:{storageKey:'english-with-mariami-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});(async()=>{const r=await db.auth.getSession();if(r.data?.session)location.replace('index.html')})();document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('registerBtn'),m=document.getElementById('message');b.disabled=true;b.textContent='⏳ რეგისტრაცია...';const r=await db.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:fullName.value.trim(),grade:grade.value}}});if(r.error){m.textContent='❌ '+r.error.message;b.disabled=false;b.textContent='🚀 რეგისტრაცია';return}if(r.data.session){m.textContent='🎉 რეგისტრაცია წარმატებულია!';setTimeout(()=>location.replace('index.html'),300)}else{m.textContent='✅ რეგისტრაცია მიღებულია. შეამოწმე ელფოსტა და შემდეგ შედი.';b.disabled=false;b.textContent='🚀 რეგისტრაცია'}};</script></body></html>
