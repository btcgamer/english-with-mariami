<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>რეგისტრაცია | English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Georgian",sans-serif;color:#fff;background:radial-gradient(circle at 12% 18%,#075eff66,transparent 27%),radial-gradient(circle at 88% 78%,#00eaff55,transparent 28%),linear-gradient(135deg,#010714,#031a3b 48%,#020918);display:flex;align-items:center;justify-content:center;padding:25px;overflow-x:hidden}.scene{position:fixed;inset:0;pointer-events:none;perspective:900px}.orb{position:absolute;border-radius:50%;filter:blur(1px);animation:float 8s ease-in-out infinite}.o1{width:210px;height:210px;left:4%;top:7%;background:radial-gradient(circle at 30% 25%,#fff8,#075eff 35%,#001c65);box-shadow:0 0 30px #075eff,0 0 100px #075eff88}.o2{width:145px;height:145px;right:7%;bottom:10%;background:radial-gradient(circle at 30% 25%,#fff9,#00eaff 35%,#006a91);box-shadow:0 0 30px #00eaff,0 0 90px #00eaff66;animation-delay:-2s}.o3{width:75px;height:75px;right:19%;top:12%;background:radial-gradient(circle at 30% 25%,#fff,#ffe600 35%,#a66b00);box-shadow:0 0 25px #ffe600,0 0 60px #ffe60066;animation-delay:-4s}@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(25px,-30px,55px) rotate(180deg)}}.card{position:relative;z-index:2;width:min(500px,100%);padding:38px 34px;border-radius:34px;background:linear-gradient(145deg,rgba(9,35,72,.88),rgba(2,13,35,.94));border:1px solid #5eeeff88;box-shadow:0 35px 100px #000d,0 0 45px #00eaff33,inset 0 1px 0 #fff5;backdrop-filter:blur(18px);margin:auto}h1{text-align:center;font-size:38px;margin:0 0 7px;color:#fff;text-shadow:0 0 12px #00eaff,0 0 35px #075eff}.sub{text-align:center;color:#c9f7ff;margin:0 0 28px}.field{margin:17px 0}label{display:block;font-weight:900;color:#ffe600;margin-bottom:8px}input,select{width:100%;height:51px;padding:0 15px;border-radius:15px;border:1px solid #00eaff66;background:linear-gradient(145deg,#041733,#020b1e);color:#fff;font-size:16px;outline:0}button{width:100%;height:55px;margin-top:8px;border:1px solid #8ff7ff;border-radius:16px;background:linear-gradient(135deg,#075eff,#00aeea 55%,#00d8c8);color:#fff;font-size:18px;font-weight:1000;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{text-align:center;margin-top:16px;min-height:23px;font-weight:700}.success{color:#5dffad}.error{color:#ff7894}.login{text-align:center;margin-top:22px;color:#cdefff}.login a{color:#ffe600;font-weight:1000;text-decoration:none}.brand{text-align:center;margin-top:21px;color:#00eaff;font-weight:900}.site-copyright{margin-top:25px;padding:15px 5px;text-align:center;color:#9dc7d5;font-size:13px;border-top:1px solid #00eaff33}@media(max-width:600px){body{padding:15px}.card{padding:29px 20px;border-radius:27px}h1{font-size:31px}.o1{width:120px;height:120px}.o2{width:90px;height:90px}.o3{width:50px;height:50px}}</style>

<style id="site-copyright-style">.site-copyright{margin-top:30px;padding:18px 12px;text-align:center;color:#9dc7d5;font-size:14px;border-top:1px solid #00eaff33;background:linear-gradient(180deg,transparent,#020b19aa);letter-spacing:.2px}.site-copyright::first-letter{color:#00eaff}</style>
</head><body><div class="scene"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div><main class="card"><h1>📝 რეგისტრაცია</h1><p class="sub">შექმენი შენი მოსწავლის ანგარიში 🚀</p><form id="registerForm"><div class="field"><label for="fullName">👤 სახელი და გვარი</label><input id="fullName" required placeholder="მაგ: ანა ბერიძე" autocomplete="name"></div><div class="field"><label for="email">📧 ელფოსტა</label><input id="email" type="email" required placeholder="example@gmail.com" autocomplete="email"></div><div class="field"><label for="password">🔐 პაროლი</label><input id="password" type="password" minlength="6" required placeholder="მინიმუმ 6 სიმბოლო" autocomplete="new-password"></div><div class="field"><label for="grade">🎓 კლასი</label><select id="grade" required><option value="">აირჩიე კლასი</option><option value="2">მე-2 კლასი</option><option value="3">მე-3 კლასი</option><option value="4">მე-4 კლასი</option></select></div><button id="submitBtn" type="submit">🚀 რეგისტრაცია</button><div id="message" class="message"></div></form><div class="login">უკვე გაქვს ანგარიში? <a href="login.html">🔐 შესვლა</a></div><div class="brand">📚 English with Mariami 🇬🇧</div><footer class="site-copyright">© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer</footer></main><script>(function(){const db=window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;const form=document.getElementById('registerForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');if(!db){msg.className='message error';msg.textContent='❌ Auth სისტემის ჩატვირთვა ვერ მოხერხდა. განაახლე გვერდი.';return}form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='⏳ მიმდინარეობს...';msg.className='message';msg.textContent='';try{const fullName=document.getElementById('fullName').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,grade=Number(document.getElementById('grade').value);const{data,error}=await db.auth.signUp({email,password,options:{data:{full_name:fullName,grade}}});if(error)throw error;if(!data.user)throw new Error('რეგისტრაცია ვერ მოხერხდა');if(data.session){const{error:pe}=await db.from('profiles').upsert({user_id:data.user.id,full_name:fullName,grade,points:0},{onConflict:'user_id'});if(pe)console.warn('Profile save:',pe);msg.className='message success';msg.textContent='🎉 რეგისტრაცია წარმატებულია!';setTimeout(()=>location.replace('academy.html'),500)}else{msg.className='message success';msg.textContent='📧 ანგარიში შეიქმნა! ელფოსტაზე გამოგზავნილი ბმულით დაადასტურე ანგარიში, შემდეგ შედი.'}}catch(err){console.error('Registration error:',err);let t=err.message||'რეგისტრაცია ვერ მოხერხდა.';if(/already registered|user already registered/i.test(t))t='ეს ელფოსტა უკვე რეგისტრირებულია. შედი ანგარიშში ან აღადგინე პაროლი.';else if(/failed to fetch/i.test(t))t='სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი და სცადე თავიდან.';msg.className='message error';msg.textContent='❌ '+t}finally{btn.disabled=false;btn.textContent='🚀 რეგისტრაცია'}})})();</script>
