<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📝 რეგისტრაცია | English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%,#075eff55,transparent 28%),radial-gradient(circle at 85% 20%,#00eaff33,transparent 30%),linear-gradient(135deg,#02091c,#043c55 55%,#071b30)}.box{width:min(500px,calc(100% - 30px));padding:35px;border-radius:30px;background:linear-gradient(145deg,#102d4d,#123b35);border:1px solid #00eaff99;box-shadow:0 25px 70px #000b,0 0 35px #00eaff44}h1{text-align:center;color:#ffe600}.logo{text-align:center;font-size:65px}.sub{text-align:center;color:#dffcff;font-weight:bold}label{display:block;margin:14px 0 7px;color:#6dffbf;font-weight:900}input,select{width:100%;padding:15px;border-radius:14px;border:1px solid #00eaff77;background:#06162f;color:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#075eff,#00d084,#ffe600);color:#06162f;font-weight:1000;font-size:17px}.message{text-align:center;min-height:25px;margin-top:18px;font-weight:900}.links{text-align:center;margin-top:20px}.links a{color:#ffe600;font-weight:900;text-decoration:none}</style></head><body><div class="box"><div class="logo">📝</div><h1>რეგისტრაცია</h1><div class="sub">🌈 English with Mariami</div><form id="registerForm"><label>👤 სახელი და გვარი</label><input id="fullName" required><label>📚 კლასი</label><select id="grade" required><option value="">აირჩიე კლასი</option><option value="2">🌱 2-ე კლასი</option><option value="3">🚀 3-ე კლასი</option><option value="4">⭐ 4-ე კლასი</option></select><label>📧 ელფოსტა</label><input type="email" id="email" required><label>🔐 პაროლი</label><input type="password" id="password" minlength="6" required><button id="registerBtn">🚀 რეგისტრაცია</button></form><div id="message" class="message"></div><div class="links">უკვე გაქვს ანგარიში? <a href="login.html">🔐 შესვლა</a><br><br><a href="index.html">🏠 მთავარი</a></div></div><script>const URL='https://vtdhvsfqhwesxtwmdue.supabase.co',KEY='sb_publishable_MnrM2ulyJY_ugwfFVfpV5wjCmt',STORAGE_KEY='english-with-mariami-auth';const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:STORAGE_KEY}});document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('fullName').value.trim(),grade=document.getElementById('grade').value,email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('message'),btn=document.getElementById('registerBtn');btn.disabled=true;btn.textContent='⏳ რეგისტრაცია...';const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name,grade}}});if(error){msg.style.color='#ff7777';msg.textContent='❌ '+error.message;btn.disabled=false;btn.textContent='🚀 რეგისტრაცია';return}if(data.session){msg.style.color='#6dffbf';msg.textContent='🎉 რეგისტრაცია წარმატებულია!';setTimeout(()=>location.replace('student.html'),500)}else{msg.style.color='#6dffbf';msg.textContent='✅ რეგისტრაცია დასრულდა! შეამოწმე ელფოსტა დასადასტურებლად.';btn.disabled=false;btn.textContent='🚀 რეგისტრაცია'}});</script></body></html>
