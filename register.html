<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>English with Mariami — რეგისტრაცია</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  min-height:100dvh;
  width:100%;

  margin:0;
  padding:0 10px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  font-family:Arial,"Noto Sans Georgian",sans-serif;
  color:#fff;

  background:
    radial-gradient(
      circle at 10% 20%,
      #075eff66,
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 80%,
      #00eaff55,
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #010714,
      #031a3b 48%,
      #020918
    );
}

/* =========================
   BACKGROUND WAVES
========================= */

body::before,
body::after{
  content:"";
  position:fixed;
  left:-20%;
  width:140%;
  height:120px;
  border-radius:50%;
  pointer-events:none;
  opacity:.25;
  filter:blur(4px);
}

body::before{
  top:3%;

  border:2px solid #00eaff;

  box-shadow:
    0 0 20px #00eaff,
    0 0 55px #00eaff;

  animation:wave1 9s ease-in-out infinite;
}

body::after{
  bottom:3%;

  border:2px solid #075eff;

  box-shadow:
    0 0 20px #075eff,
    0 0 55px #075eff;

  animation:wave2 11s ease-in-out infinite;
}

@keyframes wave1{

  0%,100%{
    transform:
      translateX(-25px)
      rotate(-3deg);
  }

  50%{
    transform:
      translateX(25px)
      rotate(3deg);
  }

}

@keyframes wave2{

  0%,100%{
    transform:
      translateX(25px)
      rotate(3deg);
  }

  50%{
    transform:
      translateX(-25px)
      rotate(-3deg);
  }

}

/* =========================
   FLOATING ORBS
========================= */

.scene{
  position:fixed;
  inset:0;
  pointer-events:none;
  perspective:900px;
}

.orb{
  position:absolute;
  border-radius:50%;
  animation:float 8s ease-in-out infinite;
}

.orb1{
  width:120px;
  height:120px;

  left:3%;
  top:8%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #075eff 35%,
      #001c65 70%
    );

  box-shadow:
    0 0 30px #075eff,
    0 0 90px #075eff88;
}

.orb2{
  width:90px;
  height:90px;

  right:4%;
  bottom:8%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #00eaff 35%,
      #006a91 70%
    );

  box-shadow:
    0 0 30px #00eaff,
    0 0 80px #00eaff66;

  animation-delay:-2s;
}

.orb3{
  width:45px;
  height:45px;

  right:15%;
  top:8%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #ffe600 35%,
      #a66b00 70%
    );

  box-shadow:
    0 0 25px #ffe600,
    0 0 55px #ffe60066;

  animation-delay:-4s;
}

@keyframes float{

  0%,100%{
    transform:
      translate3d(0,0,0);
  }

  50%{
    transform:
      translate3d(18px,-20px,35px);
  }

}

/* =========================
   REGISTER CARD
========================= */

.register-card{

  position:relative;

  z-index:10;

  width:min(500px,100%);

  max-height:
    calc(100dvh - 20px);

  margin:auto;

  padding:22px 26px;

  border-radius:26px;

  background:
    linear-gradient(
      145deg,
      rgba(9,35,72,.96),
      rgba(2,13,35,.98)
    );

  border:
    1px solid
    rgba(94,238,255,.6);

  box-shadow:
    0 25px 70px #000c,
    0 0 35px #00eaff40,
    inset 0 1px 0 #ffffff1f;

  backdrop-filter:blur(18px);

  overflow:hidden;
}

/* =========================
   TITLE
========================= */

h1{

  margin:0;

  text-align:center;

  font-size:30px;

  line-height:1.1;

  text-shadow:
    0 0 12px #00eaff,
    0 0 30px #075eff;
}

.subtitle{

  margin:
    6px 0 16px;

  text-align:center;

  color:#c9f7ff;

  font-size:14px;
}

/* =========================
   FORM
========================= */

.field{
  margin:11px 0;
}

label{

  display:block;

  margin-bottom:5px;

  color:#ffe600;

  font-weight:900;

  font-size:14px;
}

input{

  display:block;

  width:100%;

  height:46px;

  padding:
    0 13px;

  border-radius:13px;

  border:
    1px solid
    #00eaff73;

  outline:none;

  background:
    linear-gradient(
      145deg,
      #041733,
      #020b1e
    );

  color:#fff;

  font-size:15px;
}

input::placeholder{
  color:#8db3c4;
}

input:focus{

  border-color:#00eaff;

  box-shadow:
    0 0 15px #00eaff59;
}

/* =========================
   BUTTON
========================= */

.register-button{

  display:block;

  width:100%;

  height:48px;

  margin-top:5px;

  border-radius:14px;

  border:
    1px solid
    #8ff7ff;

  background:
    linear-gradient(
      135deg,
      #075eff,
      #00aeea 55%,
      #00d8c8
    );

  color:#fff;

  font-size:17px;

  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 0 20px
    #00eaff59;

  transition:.2s;
}

.register-button:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 0 30px
    #00eaffa6;
}

.register-button:disabled{

  opacity:.6;

  cursor:wait;

  transform:none;
}

/* =========================
   MESSAGE
========================= */

.message{

  min-height:20px;

  margin-top:8px;

  text-align:center;

  font-size:13px;

  font-weight:700;
}

.success{
  color:#5dffad;
}

.error{
  color:#ff7894;
}

/* =========================
   LOGIN LINK
========================= */

.login{

  margin-top:9px;

  text-align:center;

  color:#cdefff;

  font-size:14px;
}

.login a{

  color:#ffe600;

  font-weight:1000;

  text-decoration:none;
}

.login a:hover{
  text-decoration:underline;
}

/* =========================
   BRAND
========================= */

.brand{

  margin-top:9px;

  text-align:center;

  color:#00eaff;

  font-weight:900;

  font-size:14px;

  text-shadow:
    0 0 10px #00eaff;
}

/* =========================
   COPYRIGHT
========================= */

.site-copyright{

  margin-top:9px;

  padding-top:8px;

  text-align:center;

  border-top:
    1px solid
    #00eaff33;

  color:#9dc7d5;

  font-size:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  body{

    padding:
      0 7px;
  }

  .register-card{

    width:
      min(500px,100%);

    max-height:
      calc(100dvh - 14px);

    padding:
      17px 18px;

    border-radius:23px;
  }

  h1{
    font-size:26px;
  }

  .subtitle{

    margin:
      5px 0 12px;

    font-size:13px;
  }

  .field{
    margin:8px 0;
  }

  label{

    margin-bottom:4px;

    font-size:13px;
  }

  input{

    height:42px;

    font-size:14px;
  }

  .register-button{

    height:44px;

    font-size:16px;
  }

  .message{

    min-height:18px;

    margin-top:6px;

    font-size:12px;
  }

  .login{

    margin-top:7px;

    font-size:13px;
  }

  .brand{

    margin-top:7px;

    font-size:13px;
  }

  .site-copyright{

    margin-top:7px;

    padding-top:6px;

    font-size:9px;
  }

  .orb1{

    width:75px;
    height:75px;
  }

  .orb2{

    width:60px;
    height:60px;
  }

  .orb3{

    width:30px;
    height:30px;
  }

}

/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:600px) and (max-height:700px){

  .register-card{

    padding:
      12px 15px;
  }

  h1{
    font-size:23px;
  }

  .subtitle{

    margin:
      3px 0 7px;

    font-size:12px;
  }

  .field{
    margin:5px 0;
  }

  label{
    font-size:12px;
  }

  input{
    height:37px;
  }

  .register-button{
    height:40px;
  }

  .message{

    min-height:15px;

    margin-top:4px;
  }

  .login{

    margin-top:5px;

    font-size:12px;
  }

  .brand{
    margin-top:5px;
  }

  .site-copyright{
    display:none;
  }

}

/* =========================
   TABLET
========================= */

@media(min-width:601px) and (max-width:900px){

  .register-card{

    width:
      min(500px,92vw);

    padding:
      24px 27px;
  }

}

/* =========================
   LANDSCAPE PHONE
========================= */

@media(max-height:500px){

  .register-card{

    padding:
      10px 18px;

    border-radius:20px;
  }

  h1{
    font-size:21px;
  }

  .subtitle{

    margin:
      2px 0 5px;

    font-size:11px;
  }

  .field{
    margin:4px 0;
  }

  label{
    font-size:11px;
  }

  input{
    height:34px;
  }

  .register-button{
    height:36px;
    font-size:14px;
  }

  .message{
    min-height:14px;
    margin-top:3px;
    font-size:11px;
  }

  .login{
    margin-top:3px;
    font-size:11px;
  }

  .brand{
    display:none;
  }

  .site-copyright{
    display:none;
  }

}
</style>
</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<div class="scene">

  <div class="orb orb1"></div>

  <div class="orb orb2"></div>

  <div class="orb orb3"></div>

</div>

<!-- =========================
     REGISTER
========================= -->

<main class="register-card">

  <h1>
    📝 რეგისტრაცია
  </h1>

  <p class="subtitle">
    შექმენი შენი მოსწავლის ანგარიში 🚀
  </p>

  <form id="registerForm">

    <div class="field">

      <label for="fullName">
        👤 სახელი და გვარი
      </label>

      <input
        id="fullName"
        type="text"
        required
        autocomplete="name"
        maxlength="100"
        placeholder="მაგ: ანა ბერიძე"
      >

    </div>

    <div class="field">

      <label for="email">
        📧 ელფოსტა
      </label>

      <input
        id="email"
        type="email"
        required
        autocomplete="email"
        maxlength="254"
        placeholder="example@gmail.com"
      >

    </div>

    <div class="field">

      <label for="password">
        🔐 პაროლი
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        required
        autocomplete="new-password"
        placeholder="მინიმუმ 6 სიმბოლო"
      >

    </div>

    <button
      id="submitBtn"
      class="register-button"
      type="submit">

      🚀 რეგისტრაცია

    </button>

    <div
      id="message"
      class="message">
    </div>

  </form>

  <div class="login">

    უკვე გაქვს ანგარიში?

    <a href="login.html">
      🔐 შესვლა
    </a>

  </div>

  <div class="brand">
    📚 English with Mariami 🇬🇧
  </div>

  <footer class="site-copyright">

    © 2026 English with Mariami —
    ყველა უფლება დაცულია •
    Developed by btcgamer

  </footer>

</main>

<script>
(function(){

  "use strict";

  const form =
    document.getElementById(
      "registerForm"
    );

  const message =
    document.getElementById(
      "message"
    );

  const button =
    document.getElementById(
      "submitBtn"
    );


  function setMessage(
    text,
    type
  ){

    message.textContent =
      text;

    message.className =
      "message " +
      (type || "");

  }


  async function getClient(){

    if(
      window.__ENGLISH_MARIAMI_SUPABASE_CLIENT
    ){

      return window
        .__ENGLISH_MARIAMI_SUPABASE_CLIENT;

    }


    if(
      window.supabaseClient
    ){

      return window.supabaseClient;

    }


    return new Promise(
      function(resolve){

        let finished=false;


        function done(){

          if(finished){
            return;
          }

          finished=true;

          resolve(
            window
              .__ENGLISH_MARIAMI_SUPABASE_CLIENT ||
            window.supabaseClient ||
            null
          );

        }


        window.addEventListener(
          "englishMariamiSupabaseReady",
          done,
          {once:true}
        );


        setTimeout(
          done,
          5000
        );

      }
    );

  }


  form.addEventListener(
    "submit",
    async function(event){

      event.preventDefault();


      const client =
        await getClient();


      if(!client){

        setMessage(
          "❌ Supabase ვერ ჩაიტვირთა. სცადე გვერდის განახლება.",
          "error"
        );

        return;

      }


      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("password")
          .value;


      if(
        !fullName ||
        !email ||
        password.length < 6
      ){

        setMessage(
          "❌ შეავსე ყველა ველი სწორად.",
          "error"
        );

        return;

      }


      button.disabled=true;

      button.textContent=
        "⏳ რეგისტრაცია...";


      setMessage(
        "",
        ""
      );


      try{

        const {
          data,
          error
        } =
        await client.auth.signUp({

          email:email,

          password:password,

          options:{

            data:{

              full_name:
                fullName,

              role:
                "student",

              grade:
                0

            }

          }

        });


        if(error){

          throw error;

        }


        /*
        ======================================
        PROFILE
        ======================================
        */

        if(
          data &&
          data.user
        ){

          const {
            error:profileError
          } =
          await client
            .from("profiles")
            .upsert(

              {

                user_id:
                  data.user.id,

                full_name:
                  fullName,

                role:
                  "student",

                grade:
                  0

              },

              {
                onConflict:
                  "user_id"
              }

            );


          if(
            profileError &&
            !/duplicate|conflict/i.test(
              profileError.message || ""
            )
          ){

            console.warn(
              "Profile creation warning:",
              profileError
            );

          }

        }


        /*
        ======================================
        SUCCESS
        ======================================
        */

        if(
          data &&
          data.session
        ){

          setMessage(
            "🎉 რეგისტრაცია წარმატებულია! შენი კლასი ჯერ არ არის მინიჭებული.",
            "success"
          );


          form.reset();


          setTimeout(
            function(){

              location.replace(
                "login.html"
              );

            },
            1200
          );


        }else{

          setMessage(
            "📧 ანგარიში შეიქმნა! დაადასტურე ელფოსტა. კლასი მასწავლებელმა უნდა მოგანიჭოს.",
            "success"
          );


          form.reset();

        }


      }catch(error){

        console.error(
          "Registration error:",
          error
        );


        const text =
          String(
            error &&
            error.message
              ? error.message
              : ""
          );


        if(
          /already registered/i.test(
            text
          )
        ){

          setMessage(
            "❌ ეს ელფოსტა უკვე რეგისტრირებულია.",
            "error"
          );

        }else if(
          /password.*(6|short)/i.test(
            text
          )
        ){

          setMessage(
            "❌ პაროლი უნდა იყოს მინიმუმ 6 სიმბოლო.",
            "error"
          );

        }else if(
          /invalid.*email/i.test(
            text
          )
        ){

          setMessage(
            "❌ ელფოსტის ფორმატი არასწორია.",
            "error"
          );

        }else{

          setMessage(
            "❌ " +
            (
              text ||
              "რეგისტრაცია ვერ მოხერხდა."
            ),
            "error"
          );

        }

      }finally{

        button.disabled=false;

        button.textContent=
          "🚀 რეგისტრაცია";

      }

    }
  );

})();
</script>

</body>
</html>
