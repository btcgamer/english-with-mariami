<!doctype html>
<html lang="ka">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>რეგისტრაცია | English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,#075eff55,transparent 30%),radial-gradient(circle at 80% 80%,#00eaff33,transparent 30%),linear-gradient(135deg,#020817,#031b3b 50%,#020d24);display:flex;align-items:center;justify-content:center;overflow:hidden}.orb{position:fixed;border-radius:50%;filter:blur(2px);opacity:.55;animation:float 7s ease-in-out infinite}.o1{width:180px;height:180px;background:#075eff;left:5%;top:8%;box-shadow:0 0 80px #075eff}.o2{width:130px;height:130px;background:#00eaff;right:8%;bottom:10%;box-shadow:0 0 70px #00eaff;animation-delay:-2s}.o3{width:70px;height:70px;background:#ffe600;right:20%;top:12%;box-shadow:0 0 50px #ffe600;animation-delay:-4s}@keyframes float{50%{transform:translateY(-25px) translateX(15px) scale(1.08)}}.card{position:relative;z-index:2;width:min(470px,calc(100% - 30px));padding:34px 30px;border-radius:30px;background:linear-gradient(145deg,#071d3df2,#03152ff5);border:1px solid #00eaff;box-shadow:0 30px 80px #000b,0 0 35px #00eaff55,inset 0 1px #ffffff33;transform:perspective(1000px) rotateX(2deg)}h1{text-align:center;font-size:34px;margin:0 0 8px;text-shadow:0 0 18px #00eaff}.sub{text-align:center;color:#cdefff;margin:0 0 25px}.field{margin:15px 0}label{display:block;font-weight:900;color:#ffe600;margin-bottom:7px}input,select{width:100%;padding:14px;border-radius:14px;border:1px solid #00eaff88;background:#020d24;color:#fff;font-size:16px;outline:none}input:focus,select:focus{border-color:#00eaff;box-shadow:0 0 20px #00eaff55}button{width:100%;padding:15px;border:1px solid #00eaff;border-radius:15px;background:linear-gradient(135deg,#075eff,#00bfff);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 0 20px #00eaff55;transition:.3s}button:hover{transform:translateY(-3px);box-shadow:0 0 30px #00eaff,0 10px 25px #0008}.message{text-align:center;margin-top:15px;min-height:22px}.success{color:#42f59e}.error{color:#ff718c}.login{text-align:center;margin-top:20px;color:#cdefff}.login a{color:#ffe600;font-weight:900;text-decoration:none}.brand{text-align:center;margin-top:20px;color:#00eaff;font-weight:900}@media(max-width:600px){.card{padding:27px 20px}h1{font-size:29px}}</style></head>
<body><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><main class="card"><h1>📝 რეგისტრაცია</h1><p class="sub">შექმენი შენი მოსწავლის ანგარიში 🚀</p><form id="registerForm"><div class="field"><label>სახელი და გვარი</label><input id="fullName" required placeholder="მაგ: ანა ბერიძე"></div><div class="field"><label>ელფოსტა</label><input id="email" type="email" required placeholder="example@gmail.com"></div><div class="field"><label>პაროლი</label><input id="password" type="password" minlength="6" required placeholder="მინიმუმ 6 სიმბოლო"></div><div class="field"><label>კლასი</label><select id="grade" required><option value="">აირჩიე კლასი</option><option value="2">მე-2 კლასი</option><option value="3">მე-3 კლასი</option><option value="4">მე-4 კლასი</option></select></div><button id="submitBtn">🚀 რეგისტრაცია</button><div id="message" class="message"></div></form><div class="login">უკვე გაქვს ანგარიში? <a href="login.html">🔐 შესვლა</a></div><div class="brand">📚 English with Mariami 🇬🇧</div></main><script>const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const form=document.getElementById('registerForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='მიმდინარეობს...';msg.textContent='';try{const fullName=document.getElementById('fullName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,grade=Number(document.getElementById('grade').value);const {data,error}=await db.auth.signUp({email,password});if(error)throw error;if(!data.user)throw new Error('რეგისტრაცია ვერ მოხერხდა');const {error:pe}=await db.from('profiles').upsert({user_id:data.user.id,full_name:fullName,grade,points:0},{onConflict:'user_id'});if(pe)throw pe;msg.className='message success';msg.textContent=data.session?'🎉 რეგისტრაცია წარმატებულია!':'🎉 ანგარიში შეიქმნა! შეამოწმე ელფოსტა.'}catch(err){msg.className='message error';msg.textContent='❌ '+err.message}finally{btn.disabled=false;btn.textContent='🚀 რეგისტრაცია'}});</script></body></html>
