<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#6c5ce7"><title>რეგისტრაცია — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>:root{--p:#6c5ce7;--p2:#8f83ff;--pink:#ff7b72;--yellow:#ffe66d;--ink:#202039;--muted:#70758a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e9e7ff,#fff6ef);display:flex;align-items:center;justify-content:center;padding:20px}.scene{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.showcase,.panel{border-radius:30px;box-shadow:0 25px 65px #26243a22}.showcase{padding:40px;color:#fff;background:linear-gradient(145deg,#6c5ce7,#8f83ff 55%,#ff7b72);overflow:hidden}.mini{display:inline-block;padding:9px 13px;border-radius:99px;background:#ffffff22;border:1px solid #ffffff44;font-weight:800}.showcase h2{font-size:clamp(2.4rem,5vw,4rem);line-height:1;margin:25px 0 15px}.showcase h2 span{color:var(--yellow)}.showcase p{line-height:1.7;color:#ffffffdd}.orbit{text-align:center;font-size:7rem;margin-top:30px;animation:float 4s ease-in-out infinite}.panel{padding:30px;background:#ffffffee;backdrop-filter:blur(18px)}.back{color:#72778a;text-decoration:none;font-weight:800}.head{display:flex;align-items:center;gap:14px;margin:20px 0}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pink));font-size:27px;color:#fff}.head h1{margin:0;font-size:29px}.sub{margin:4px 0;color:var(--muted)}.field{margin:15px 0}label{display:block;font-weight:800;margin-bottom:7px}input{width:100%;padding:14px;border:1.5px solid #d9dbea;border-radius:14px;background:#fff;font-size:16px;outline:none}input:focus{border-color:var(--p);box-shadow:0 0 0 4px #6c5ce722}.password{position:relative}.password input{padding-right:50px}.toggle{position:absolute;right:5px;top:4px;width:42px;height:42px;border:0;background:transparent;cursor:pointer}.meter{height:6px;background:#e9e9f1;border-radius:99px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7b72,#ffe66d,#52d273);transition:.25s}.note{font-size:12px;color:var(--muted);margin-top:5px}.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grades input{display:none}.grades label{text-align:center;padding:12px 5px;border:1.5px solid #d9dbea;border-radius:13px;cursor:pointer}.grades input:checked+label{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}.submit{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--p),#ff6f91);color:#fff;font-size:17px;font-weight:900;cursor:pointer;margin-top:8px;box-shadow:0 12px 25px #6c5ce744}.submit:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:14px;padding:13px;border-radius:13px;text-align:center;font-weight:700;line-height:1.5}.show{display:block}.success{background:#e9f9ef;color:#16803c}.error{background:#fff0f0;color:#c62828}.info{background:#eef0ff;color:#5144b6}.login{text-align:center;margin-top:18px;color:var(--muted)}.login a{color:var(--p);font-weight:900;text-decoration:none}@keyframes float{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-12px) rotateY(8deg)}}@media(max-width:820px){.scene{grid-template-columns:1fr}.showcase{padding:28px}.orbit{margin-top:10px}.panel{padding:24px}}</style></head><body><div class="scene"><section class="showcase"><div class="mini">🇬🇧 English with Mariami</div><h2>ინგლისური<br><span>თამაშით!</span></h2><p>შექმენი შენი ანგარიში და დაიწყე გაკვეთილები, სავარჯიშოები და თამაშები.</p><div class="orbit">📚🌈✨</div></section><main class="panel"><a class="back" href="index.html">← მთავარი გვერდი</a><div class="head"><div class="logo">🎓</div><div><h1>შექმენი ანგარიში</h1><p class="sub">სულ რამდენიმე წამი და მზად ხარ 🚀</p></div></div><form id="registerForm"><div class="field"><label for="fullName">სახელი და გვარი</label><input id="fullName" type="text" autocomplete="name" required minlength="2" placeholder="მაგ: ანა ბერიძე"></div><div class="field"><label for="email">ელფოსტა</label><input id="email" type="email" autocomplete="email" required placeholder="example@gmail.com"></div><div class="field"><label for="password">პაროლი</label><div class="password"><input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="მინ. 6 სიმბოლო"><button class="toggle" id="togglePassword" type="button">👁️</button></div><div class="meter"><span id="passwordBar"></span></div><div id="passwordNote" class="note">პაროლის სიმტკიცე: ჯერ არ არის შეყვანილი</div></div><div class="field"><label>კლასი</label><div class="grades"><div><input id="g2" name="grade" type="radio" value="2" checked><label for="g2">🌱 მე-2</label></div><div><input id="g3" name="grade" type="radio" value="3"><label for="g3">🚀 მე-3</label></div><div><input id="g4" name="grade" type="radio" value="4"><label for="g4">⭐ მე-4</label></div></div></div><button class="submit" id="submitBtn" type="submit">🚀 რეგისტრაცია და შესვლა</button><div id="message" class="message" role="status"></div></form><div class="login">უკვე გაქვს ანგარიში? <a href="login.html">შესვლა →</a></div></main></div><script>const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),next=new URLSearchParams(location.search).get('next')||'index.html';const form=document.getElementById('registerForm'),message=document.getElementById('message'),btn=document.getElementById('submitBtn');document.getElementById('togglePassword').onclick=()=>{const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'};document.getElementById('password').addEventListener('input',e=>{const n=e.target.value.length,b=document.getElementById('passwordBar'),note=document.getElementById('passwordNote');b.style.width=Math.min(100,n*12)+'%';note.textContent=n<6?'პაროლი ძალიან მოკლეა':n<8?'პაროლის სიმტკიცე: საშუალო':'პაროლის სიმტკიცე: კარგი ✓'});form.addEventListener('submit',async e=>{e.preventDefault();message.className='message';message.textContent='';btn.disabled=true;btn.textContent='მიმდინარეობს...';const fullName=document.getElementById('fullName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,grade=Number(document.querySelector('input[name="grade"]:checked')?.value||2);try{const{data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:fullName,grade},emailRedirectTo:new URL('register.html?confirmed=1&next='+encodeURIComponent(next),location.href).href}});if(error)throw error;if(!data.user)throw new Error('რეგისტრაცია ვერ მოხერხდა.');if(data.session){const{error:pe}=await supabaseClient.from('profiles').upsert({user_id:data.user.id,full_name:fullName,grade,role:'student',points:0},{onConflict:'user_id'});if(pe)throw pe;message.className='message success show';message.textContent='🎉 რეგისტრაცია დასრულდა! საიტზე შევდივართ...';setTimeout(()=>location.replace(next),500)}else{message.className='message info show';message.textContent='📧 რეგისტრაცია დასრულებულია. დაადასტურე ელფოსტა და შემდეგ გადმოხვალ საიტზე.'}}catch(err){console.error(err);message.className='message error show';message.textContent='❌ '+(err.message||'რეგისტრაცია ვერ მოხერხდა.')}finally{btn.disabled=false;btn.textContent='🚀 რეგისტრაცია და შესვლა'}});(async()=>{try{const{data}=await supabaseClient.auth.getSession();if(data?.session&&new URLSearchParams(location.search).get('confirmed')==='1')location.replace(next)}catch(e){}})();</script></body></html>
