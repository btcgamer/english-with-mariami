<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English with Mariami — რეგისტრაცია</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;overflow-x:hidden;font-family:Arial,"Noto Sans Georgian",sans-serif;color:#fff;background:radial-gradient(circle at 10% 20%,#075eff66,transparent 28%),radial-gradient(circle at 90% 80%,#00eaff55,transparent 28%),linear-gradient(135deg,#010714,#031a3b 48%,#020918)}body:before,body:after{content:"";position:fixed;left:-20%;width:140%;height:170px;border-radius:50%;pointer-events:none;opacity:.35;filter:blur(4px)}body:before{top:5%;border:2px solid #00eaff;box-shadow:0 0 20px #00eaff,0 0 55px #00eaff;animation:wave1 9s ease-in-out infinite}body:after{bottom:5%;border:2px solid #075eff;box-shadow:0 0 20px #075eff,0 0 55px #075eff;animation:wave2 11s ease-in-out infinite}@keyframes wave1{0%,100%{transform:translateX(-35px) rotate(-3deg)}50%{transform:translateX(35px) rotate(3deg)}}@keyframes wave2{0%,100%{transform:translateX(35px) rotate(3deg)}50%{transform:translateX(-35px) rotate(-3deg)}}.scene{position:fixed;inset:0;pointer-events:none;perspective:900px}.orb{position:absolute;border-radius:50%;animation:float 8s ease-in-out infinite}.orb1{width:170px;height:170px;left:5%;top:10%;background:radial-gradient(circle at 30% 25%,white,#075eff 35%,#001c65 70%);box-shadow:0 0 30px #075eff,0 0 90px #075eff88}.orb2{width:125px;height:125px;right:7%;bottom:12%;background:radial-gradient(circle at 30% 25%,white,#00eaff 35%,#006a91 70%);box-shadow:0 0 30px #00eaff,0 0 80px #00eaff66;animation-delay:-2s}.orb3{width:65px;height:65px;right:18%;top:12%;background:radial-gradient(circle at 30% 25%,white,#ffe600 35%,#a66b00 70%);box-shadow:0 0 25px #ffe600,0 0 55px #ffe60066;animation-delay:-4s}@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(25px,-30px,55px) rotate(180deg)}}.register-card{position:relative;z-index:10;width:min(500px,100%);padding:36px 32px;border-radius:32px;background:linear-gradient(145deg,rgba(9,35,72,.94),rgba(2,13,35,.97));border:1px solid rgba(94,238,255,.6);box-shadow:0 35px 100px #000c,0 0 45px #00eaff40,inset 0 1px 0 #ffffff1f;backdrop-filter:blur(18px)}h1{margin:0;text-align:center;font-size:37px;text-shadow:0 0 12px #00eaff,0 0 35px #075eff}.subtitle{margin:9px 0 28px;text-align:center;color:#c9f7ff}.field{margin:17px 0}label{display:block;margin-bottom:8px;color:#ffe600;font-weight:900}input{width:100%;height:52px;padding:0 15px;border-radius:15px;border:1px solid #00eaff73;outline:none;background:linear-gradient(145deg,#041733,#020b1e);color:#fff;font-size:16px}input:focus{border-color:#00eaff;box-shadow:0 0 15px #00eaff59}.register-button{width:100%;height:55px;margin-top:8px;border-radius:16px;border:1px solid #8ff7ff;background:linear-gradient(135deg,#075eff,#00aeea 55%,#00d8c8);color:#fff;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 0 20px #00eaff59;transition:.2s}.register-button:hover{transform:translateY(-2px);box-shadow:0 0 30px #00eaffa6}.register-button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin-top:16px;text-align:center;font-weight:700}.success{color:#5dffad}.error{color:#ff7894}.login{margin-top:22px;text-align:center;color:#cdefff}.login a{color:#ffe600;font-weight:1000;text-decoration:none}.brand{margin-top:20px;text-align:center;color:#00eaff;font-weight:900;text-shadow:0 0 10px #00eaff}.site-copyright{margin-top:24px;padding:15px 5px;text-align:center;border-top:1px solid #00eaff33;color:#9dc7d5;font-size:13px}@media(max-width:600px){body{padding:14px}.register-card{padding:28px 20px;border-radius:27px}h1{font-size:30px}.orb1{width:110px;height:110px}.orb2{width:85px;height:85px}.orb3{width:45px;height:45px}}
</style>
</head>
<body>
<div class="scene"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<main class="register-card"><h1>📝 რეგისტრაცია</h1><p class="subtitle">შექმენი შენი მოსწავლის ანგარიში 🚀</p>
<form id="registerForm">
<div class="field"><label for="fullName">👤 სახელი და გვარი</label><input id="fullName" type="text" required autocomplete="name" placeholder="მაგ: ანა ბერიძე"></div>
<div class="field"><label for="email">📧 ელფოსტა</label><input id="email" type="email" required autocomplete="email" placeholder="example@gmail.com"></div>
<div class="field"><label for="password">🔐 პაროლი</label><input id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="მინიმუმ 6 სიმბოლო"></div>
<button id="submitBtn" class="register-button" type="submit">🚀 რეგისტრაცია</button><div id="message" class="message"></div>
</form>
<div class="login">უკვე გაქვს ანგარიში? <a href="login.html">🔐 შესვლა</a></div><div class="brand">📚 English with Mariami 🇬🇧</div><footer class="site-copyright">© 2026 English with Mariami — ყველა უფლება დაცულია • Developed by btcgamer</footer></main>
<script>
(function(){'use strict';const form=document.getElementById('registerForm'),message=document.getElementById('message'),button=document.getElementById('submitBtn');
function setMessage(text,type){message.textContent=text;message.className='message '+type}
async function getClient(){if(window.__ENGLISH_MARIAMI_SUPABASE_CLIENT)return window.__ENGLISH_MARIAMI_SUPABASE_CLIENT;if(window.supabaseClient)return window.supabaseClient;return new Promise(resolve=>{const done=()=>resolve(window.__ENGLISH_MARIAMI_SUPABASE_CLIENT||window.supabaseClient||null);window.addEventListener('englishMariamiSupabaseReady',done,{once:true});setTimeout(done,5000)})}
form.addEventListener('submit',async function(e){e.preventDefault();const client=await getClient();if(!client)return setMessage('❌ Supabase ვერ ჩაიტვირთა. სცადე თავიდან.','error');const fullName=document.getElementById('fullName').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(!fullName||!email||password.length<6)return setMessage('❌ შეავსე ყველა ველი სწორად.','error');button.disabled=true;button.textContent='⏳ რეგისტრაცია...';setMessage('','');try{const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:fullName,role:'student',grade:0}}});if(error)throw error;if(data?.user){const {error:profileError}=await client.from('profiles').upsert({user_id:data.user.id,full_name:fullName,role:'student',grade:0},{onConflict:'user_id'});if(profileError&&!/duplicate|conflict/i.test(profileError.message||''))throw profileError}if(data?.session){setMessage('🎉 რეგისტრაცია წარმატებულია! შენი კლასი ჯერ არ არის მინიჭებული.','success');setTimeout(()=>location.replace('login.html'),1200)}else setMessage('📧 ანგარიში შეიქმნა! დაადასტურე ელფოსტა. კლასი მასწავლებელმა უნდა მოგანიჭოს.','success');form.reset()}catch(error){console.error('Registration error:',error);const t=String(error?.message||'');setMessage(/already registered/i.test(t)?'❌ ეს ელფოსტა უკვე რეგისტრირებულია.':'❌ '+(t||'რეგისტრაცია ვერ მოხერხდა.'),'error')}finally{button.disabled=false;button.textContent='🚀 რეგისტრაცია'}});
})();
</script></body></html>
