<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>მშობლის სივრცე — English with Mariami</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,"Noto Sans Georgian",sans-serif;
background:linear-gradient(135deg,#f8feff,#c9f5ff,#eafcff);
color:#073b5c;
min-height:100vh
}

header{
background:#ffffffdd;
backdrop-filter:blur(15px);
border-bottom:1px solid #00bfff44;
padding:18px
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.logo{
font-weight:900;
font-size:19px;
color:#0076aa;
text-decoration:none
}

.nav a{
text-decoration:none;
color:#07547c;
font-weight:bold;
margin-left:10px
}

.container{
max-width:1050px;
margin:auto;
padding:25px 15px 60px
}

.hero{
text-align:center;
padding:30px 10px
}

.badge{
display:inline-block;
padding:9px 17px;
border-radius:30px;
background:white;
color:#0080ba;
font-weight:900;
box-shadow:0 0 25px #00cfff44
}

h1{
font-size:clamp(38px,7vw,65px);
margin:18px 0 10px
}

.hero p{
color:#59798b;
line-height:1.7
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}

.card{
background:#ffffffdd;
border:1px solid #00bfff44;
border-radius:25px;
padding:24px;
box-shadow:0 20px 55px #007cff18
}

.card h2{
color:#007bb8;
margin-top:0
}

label{
display:block;
font-weight:bold;
margin:12px 0 6px
}

input,select,textarea{
width:100%;
padding:13px;
border:1px solid #9bdff2;
border-radius:13px;
font:inherit;
outline:none;
background:white
}

textarea{
min-height:140px;
resize:vertical
}

input:focus,select:focus,textarea:focus{
border-color:#00aeea;
box-shadow:0 0 15px #00cfff33
}

button{
border:0;
border-radius:13px;
padding:13px 18px;
margin-top:15px;
background:#00c9f2;
color:#002c40;
font-weight:900;
cursor:pointer
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px #00bfff44
}

.status{
margin-top:12px;
padding:12px;
border-radius:12px;
background:#effcff
}

.question{
background:#f4fcff;
border-left:5px solid #00bfff;
border-radius:15px;
padding:16px;
margin-top:12px
}

.answer{
background:#eafff7;
padding:12px;
border-radius:12px;
margin-top:12px
}

.empty{
color:#718999
}

@media(max-width:700px){

.nav{
flex-direction:column
}

.grid{
grid-template-columns:1fr
}

.container{
padding-left:12px;
padding-right:12px
}

.card{
padding:18px
}

h1{
font-size:42px
}
}
</style>
</head>

<body>

<header>

<div class="nav">

<a class="logo" href="index.html">
⚡ ENGLISH WITH MARIAMI
</a>

<div>
<a href="academy.html">🎓 Academy</a>
<a href="index.html">🏠 მთავარი</a>
</div>

</div>

</header>


<main class="container">

<section class="hero">

<span class="badge">
👨‍👩‍👧 PARENT SPACE
</span>

<h1>
მშობლის სივრცე
</h1>

<p>
ბავშვის პროგრესი • კითხვები • მასწავლებელთან კომუნიკაცია
</p>

</section>


<section class="grid">


<div class="card">

<h2>👤 ბავშვის ინფორმაცია</h2>

<label>ბავშვის სახელი</label>

<input
id="childName"
placeholder="მაგ: ნინო"
>

<label>კლასი</label>

<select id="childGrade">

<option value="2">მე-2 კლასი</option>
<option value="3">მე-3 კლასი</option>
<option value="4">მე-4 კლასი</option>

</select>

<button onclick="saveChild()">
💾 შენახვა
</button>

<div id="childStatus" class="status">
ინფორმაცია ჯერ არ არის შენახული.
</div>

</div>


<div class="card">

<h2>❓ ჰკითხე მასწავლებელს</h2>

<textarea
id="question"
placeholder="დაწერე შენი კითხვა..."
></textarea>

<button onclick="sendQuestion()">
📨 კითხვის გაგზავნა
</button>

<div id="sendStatus" class="status"></div>

</div>

</section>


<section class="card" style="margin-top:20px">

<h2>💬 კითხვები და პასუხები</h2>

<div id="questions">

<p class="empty">
კითხვები ჯერ არ არის.
</p>

</div>

</section>

</main>


<script>

/*
========================================
  SUPABASE SETTINGS
========================================

აქ ჩასვი მხოლოდ შენი PUBLIC
Publishable / anon key.

არ ჩასვა service_role ან secret key.
*/

const SUPABASE_URL =
"https://vtdhvsfqhwesxtwmduew.supabase.co";

const SUPABASE_KEY =
"ჩასვი_აქ_შენი_PUBLIC_PUBLISHABLE_KEY";


let parentEmail =
localStorage.getItem("parent_email") || "";


/* ------------------------------------
   SUPABASE REQUEST
------------------------------------ */

async function supabaseRequest(
path,
options={}
){

const response =
await fetch(
SUPABASE_URL + path,
{

...options,

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer " + SUPABASE_KEY,
"Content-Type":
"application/json",
...(options.headers || {})
}

});

if(!response.ok){

const error =
await response.text();

throw new Error(error);

}

if(response.status===204)
return null;

return response.json();

}


/* ------------------------------------
   SAVE CHILD
------------------------------------ */

function saveChild(){

const name =
document
.getElementById("childName")
.value
.trim();

const grade =
document
.getElementById("childGrade")
.value;

if(!name){

document.getElementById(
"childStatus"
).textContent =
"⚠️ ჩაწერე ბავშვის სახელი.";

return;

}

localStorage.setItem(
"child_name",
name
);

localStorage.setItem(
"child_grade",
grade
);

document.getElementById(
"childStatus"
).textContent =
"✅ ინფორმაცია შენახულია.";

}


/* ------------------------------------
   SEND QUESTION
------------------------------------ */

async function sendQuestion(){

const text =
document
.getElementById("question")
.value
.trim();

if(!text){

document.getElementById(
"sendStatus"
).textContent =
"⚠️ დაწერე კითხვა.";

return;

}

if(!parentEmail){

document.getElementById(
"sendStatus"
).textContent =
"⚠️ მშობლის ელფოსტა ჯერ არ არის მითითებული.";

return;

}

const childName =
document
.getElementById("childName")
.value
.trim();

const grade =
Number(
document
.getElementById("childGrade")
.value
);

if(!childName){

document.getElementById(
"sendStatus"
).textContent =
"⚠️ ჯერ მიუთითე ბავშვის სახელი.";

return;

}

try{

await supabaseRequest(
"/rest/v1/parent_questions",
{

method:"POST",

headers:{
"Prefer":
"return=minimal"
},

body:JSON.stringify({

parent_email:
parentEmail,

child_name:
childName,

grade:
grade,

question:
text

})

});


document.getElementById(
"question"
).value="";

document.getElementById(
"sendStatus"
).textContent =
"✅ კითხვა წარმატებით გაიგზავნა.";

loadQuestions();

}
catch(error){

console.error(error);

document.getElementById(
"sendStatus"
).textContent =
"❌ კითხვა ვერ გაიგზავნა. შეამოწმე Supabase-ის Key.";

}

}


/* ------------------------------------
   LOAD QUESTIONS
------------------------------------ */

async function loadQuestions(){

if(!parentEmail)
return;

try{

const data =
await supabaseRequest(
"/rest/v1/parent_questions?parent_email=eq."+
encodeURIComponent(parentEmail)+
"&select=*&order=created_at.desc"
);

renderQuestions(data);

}
catch(error){

console.error(error);

}

}


/* ------------------------------------
   DISPLAY
------------------------------------ */

function renderQuestions(list){

const box =
document.getElementById(
"questions"
);

if(!list || !list.length){

box.innerHTML =
'<p class="empty">კითხვები ჯერ არ არის.</p>';

return;

}

box.innerHTML =
list.map(item=>`

<div class="question">

<strong>
❓ კითხვა
</strong>

<p>
${escapeHTML(item.question)}
</p>

<small>
${new Date(item.created_at)
.toLocaleString("ka-GE")}
</small>

<div class="answer">

<strong>
👩‍🏫 მასწავლებლის პასუხი
</strong>

<p>

${
item.answer
?
escapeHTML(item.answer)
:
"პასუხი ჯერ არ არის."
}

</p>

</div>

</div>

`).join("");

}


/* ------------------------------------
   SECURITY
------------------------------------ */

function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,
char=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char])
);

}


/* ------------------------------------
   LOAD SAVED CHILD
------------------------------------ */

function loadChild(){

const name =
localStorage.getItem(
"child_name"
);

const grade =
localStorage.getItem(
"child_grade"
);

if(name)
document.getElementById(
"childName"
).value=name;

if(grade)
document.getElementById(
"childGrade"
).value=grade;

}


/* START */

loadChild();
loadQuestions();

</script>

</body>
</html>
