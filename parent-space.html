<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მშობლის სივრცე — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#073451;background:radial-gradient(circle at 10% 10%,#00eaff28,transparent 30%),radial-gradient(circle at 90% 20%,#ffe60022,transparent 30%),linear-gradient(135deg,#eefcff,#bdeeff 55%,#e8faff);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:5;background:#ffffffdf;backdrop-filter:blur(15px);border-bottom:1px solid #00aaff44}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:1000;color:#007fb8;text-decoration:none}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;background:#00c9f2;color:#00283a}.ghost{background:#fff;border:1px solid #00aaff55}.hero,.card{background:#ffffffdd;border:1px solid #00aaff44;border-radius:24px;padding:24px;margin:18px 0;box-shadow:0 18px 55px #007cff20;backdrop-filter:blur(12px)}h1{font-size:clamp(34px,6vw,60px);margin:12px 0;color:#063b61}h1 span{color:#00a4e8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat,.student{padding:20px;border-radius:18px;background:#f7fdff;border:1px solid #00bfff33}.stat b{display:block;font-size:28px;color:#008bc7}.student h3{margin:0 0 8px;color:#007eb8}input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #8edcf3;margin:7px 0;font:inherit}textarea{min-height:120px;resize:vertical}.msg{padding:14px;border-radius:12px;background:#e9faff;margin:10px 0}.pending{border-left:5px solid #ffcf00}.answered{border-left:5px solid #00b779}.small{font-size:13px;color:#617c8d}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start;flex-direction:column}.hero,.card{padding:18px}.btn{width:100%;margin-top:6px}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">⚡ ENGLISH WITH MARIAMI</a><div><a class="btn ghost" href="academy.html">Academy</a> <button class="btn ghost" onclick="logout()">გასვლა</button></div></div></header><main class="wrap"><section id="loginBox" class="hero"><h1>👨‍👩‍👧 <span>მშობლის სივრცე</span></h1><p>ნახეთ ბავშვის პროგრესი და დაუსვით კითხვა მასწავლებელს.</p><input id="email" type="email" placeholder="ელფოსტა"><input id="password" type="password" placeholder="პაროლი"><button class="btn" onclick="login()">🔐 შესვლა</button><p id="loginMsg" class="small"></p></section><section id="app" class="hidden"><div class="hero"><div class="small">მოგესალმებით</div><h1>მშობლის <span>კაბინეტი</span> 👋</h1><p>თქვენი ბავშვის სასწავლო პროგრესი და მასწავლებელთან კომუნიკაცია.</p></div><div id="students" class="grid"></div><section class="card"><h2>❓ დაუსვით კითხვა მასწავლებელს</h2><select id="studentSelect"></select><textarea id="question" placeholder="მაგალითად: რომელ თემაზე უნდა იმუშაოს ბავშვმა სახლში?"></textarea><button class="btn" onclick="askQuestion()">📨 კითხვის გაგზავნა</button><p id="askMsg" class="small"></p></section><section class="card"><h2>💬 ჩემი კითხვები და პასუხები</h2><div id="questions"></div></section></section></main><script>const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,links=[];async function login(){const m=document.getElementById('loginMsg');m.textContent='იტვირთება...';const{data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent='❌ '+error.message;return}await load()}async function load(){const{data:{user:u}}=await db.auth.getUser();user=u;if(!user){document.getElementById('loginBox').classList.remove('hidden');return}document.getElementById('loginBox').classList.add('hidden');document.getElementById('app').classList.remove('hidden');const{data,error}=await db.from('parent_students').select('student_id').eq('parent_id',user.id);if(error){alert(error.message);return}links=data||[];await renderStudents();await renderQuestions()}async function renderStudents(){const box=document.getElementById('students'),sel=document.getElementById('studentSelect');box.innerHTML='';sel.innerHTML='';if(!links.length){box.innerHTML='<div class="stat"><b>მოსწავლე ჯერ არ არის დაკავშირებული</b><p>მასწავლებელმა უნდა დაუკავშიროს თქვენი ანგარიში ბავშვის ანგარიშს.</p></div>';return}for(const l of links){const{data:p}=await db.from('profiles').select('full_name,grade,points').eq('user_id',l.student_id).maybeSingle();const{data:q}=await db.from('quiz_results').select('score,total').eq('student_id',l.student_id).order('created_at',{ascending:false}).limit(5);const avg=q?.length?Math.round(q.reduce((a,x)=>a+(x.total?x.score/x.total*100:0),0)/q.length):0;const name=p?.full_name||'მოსწავლე';box.insertAdjacentHTML('beforeend',`<div class="student"><h3>🎓 ${esc(name)}</h3><div>კლასი: <b>${p?.grade||'-'}</b></div><div>ქულები: <b>${p?.points||0}</b></div><div>ბოლო Quiz-ების საშუალო: <b>${avg}%</b></div></div>`);sel.insertAdjacentHTML('beforeend',`<option value="${l.student_id}">${esc(name)} — ${p?.grade||'-'} კლასი</option>`)} }async function askQuestion(){const student_id=document.getElementById('studentSelect').value,question=document.getElementById('question').value.trim(),m=document.getElementById('askMsg');if(!student_id||question.length<2){m.textContent='❌ აირჩიეთ მოსწავლე და დაწერეთ კითხვა.';return}const{error}=await db.from('parent_questions').insert({parent_id:user.id,student_id,question});if(error){m.textContent='❌ '+error.message;return}document.getElementById('question').value='';m.textContent='✅ კითხვა გაიგზავნა მასწავლებელთან.';await renderQuestions()}async function renderQuestions(){const box=document.getElementById('questions');const{data,error}=await db.from('parent_questions').select('question,answer,status,created_at').eq('parent_id',user.id).order('created_at',{ascending:false});if(error){box.textContent='❌ '+error.message;return}box.innerHTML=data?.length?data.map(x=>`<div class="msg ${x.status==='answered'?'answered':'pending'}"><b>❓ ${esc(x.question)}</b><div class="small">${new Date(x.created_at).toLocaleString('ka-GE')}</div>${x.answer?`<hr><b>👩‍🏫 პასუხი:</b> ${esc(x.answer)}`:'<div class="small">⏳ პასუხს ელოდება...</div>'}</div>`).join(''):'<p class="small">ჯერ კითხვა არ დაგისვამთ.</p>'}async function logout(){await db.auth.signOut();location.reload()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
