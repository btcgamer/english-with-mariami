<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ჩემი პროფილი — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef0ff,#fff7ec);color:#24233a;min-height:100vh}.wrap{max-width:800px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-weight:900;color:#6c5ce7;font-size:20px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.home{background:#fff;color:#6c5ce7}.out{background:#eee}.hero{margin-top:25px;background:linear-gradient(135deg,#6c5ce7,#8f83ff);color:#fff;border-radius:28px;padding:35px;text-align:center;box-shadow:0 15px 40px #0002}.avatar{font-size:65px}.hero h1{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}.card{background:#fff;border-radius:22px;padding:25px;text-align:center;box-shadow:0 8px 25px #0001}.num{font-size:35px;font-weight:900;color:#6c5ce7}.label{font-weight:800;color:#667085;margin-top:5px}.notice{text-align:center;margin-top:22px;padding:15px;border-radius:15px;background:#fff}.error{color:#c62828}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{padding:25px}}</style><script src="protect.js"></script></head><body><div class="wrap"><div class="top"><a class="logo" href="index.html">🌈 English with Mariami</a><div><button class="btn home" onclick="location.href='index.html'">🏠 მთავარი</button> <button class="btn out" id="logout">გასვლა</button></div></div><section class="hero"><div class="avatar">👩‍🎓</div><h1 id="name">მოგესალმები!</h1><p id="grade">ვიტვირთები...</p></section><div class="grid"><div class="card"><div class="num" id="points">0</div><div class="label">🏆 ქულა</div></div><div class="card"><div class="num" id="lessons">0</div><div class="label">📚 გაკვეთილი</div></div><div class="card"><div class="num" id="games">0</div><div class="label">🎮 თამაშები</div></div></div><div id="notice" class="notice">მონაცემები იტვირთება...</div></div><script>const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function loadProfile(){const{data:{session}}=await client.auth.getSession();if(!session){location.href='login.html';return}const{data,error}=await client.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();if(error){document.getElementById('notice').className='notice error';document.getElementById('notice').textContent='პროფილის მონაცემების წაკითხვა ვერ მოხერხდა.';return}document.getElementById('name').textContent='მოგესალმები, '+(data?.full_name||session.user.email||'მოსწავლევ')+'! 👋';document.getElementById('grade').textContent=data?.grade?'🎓 '+data.grade+'-ე კლასი':'🎓 კლასი არ არის მითითებული';document.getElementById('points').textContent=data?.points??0;document.getElementById('lessons').textContent=data?.lessons_completed??0;document.getElementById('games').textContent=data?.games_played??0;document.getElementById('notice').textContent='🌟 გააგრძელე სწავლა და დააგროვე მეტი ქულა!'}document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='login.html'};loadProfile();</script></body></html>
