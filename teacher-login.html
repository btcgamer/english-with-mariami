<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მასწავლებლის შესვლა — English with Mariami</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,#075eff55,transparent 30%),radial-gradient(circle at 80% 80%,#00eaff44,transparent 30%),linear-gradient(135deg,#010714,#031a3b,#020918)}.card{width:min(460px,100%);padding:34px;border:1px solid #00eaff66;border-radius:28px;background:#03142bf2;box-shadow:0 0 45px #00eaff22}.logo{text-align:center;font-size:22px;color:#00eaff;font-weight:900}.badge{display:block;width:max-content;margin:18px auto 8px;padding:7px 12px;border-radius:20px;background:#ffe600;color:#07111f;font-weight:900}.card h1{text-align:center;margin:10px 0}.sub{text-align:center;color:#b9dce7}.field{margin:18px 0}label{display:block;color:#ffe600;font-weight:900;margin-bottom:8px}input{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid #00eaff55;background:#020b1e;color:#fff;font-size:16px}button{width:100%;height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,#075eff,#00c8e8);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.msg{min-height:25px;text-align:center;margin-top:15px;font-weight:700}.error{color:#ff7894}.ok{color:#63ffb0}.home{text-align:center;margin-top:20px}.home a{color:#ffe600;text-decoration:none;font-weight:900}</style></head><body><main class="card"><div class="logo">🌈📚 English with Mariami</div><span class="badge">TEACHER ONLY</span><h1>👩‍🏫 მასწავლებლის შესვლა</h1><p class="sub">ეს გვერდი განკუთვნილია მხოლოდ მარიამი რაზმაძისთვის.</p><form id="f"><div class="field"><label>📧 ელფოსტა</label><input id="email" type="email" autocomplete="username" required value="razmadzemariam45@gmail.com"></div><div class="field"><label>🔑 პაროლი</label><input id="password" type="password" autocomplete="current-password" required></div><button id="b">🚀 მასწავლებლის გვერდზე შესვლა</button><div id="m" class="msg"></div></form><div class="home"><a href="index.html">🏠 მთავარზე დაბრუნება</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260828-teacher"></script><script>(async()=>{const c=window.supabaseClient,f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');if(!c){m.className='msg error';m.textContent='სერვერთან დაკავშირება ვერ მოხერხდა.';return}f.onsubmit=async e=>{e.preventDefault();m.textContent='იტვირთება...';b.disabled=true;try{const email=document.getElementById('email').value.trim().toLowerCase();if(email!=='razmadzemariam45@gmail.com')throw Error('ეს გვერდი მხოლოდ მასწავლებლის ანგარიშისთვისაა.');const {data,error}=await c.auth.signInWithPassword({email,password:document.getElementById('password').value});if(error)throw error;const {data:p,error:pe}=await c.from('profiles').select('full_name,role').eq('user_id',data.user.id).single();if(pe||!p||p.role!=='teacher')throw Error('ანგარიშს მასწავლებლის უფლება არ აქვს.');m.className='msg ok';m.textContent='წარმატებით შეხვედი ✓';location.href='teacher-dashboard.html'}catch(x){m.className='msg error';m.textContent=x.message||'შესვლა ვერ მოხერხდა.';try{await c.auth.signOut()}catch(_){}}finally{b.disabled=false}}})()</script></body></html>
