<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მასწავლებლის შესვლა — English with Mariami</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,#075eff55,transparent 30%),radial-gradient(circle at 80% 80%,#00eaff44,transparent 30%),linear-gradient(135deg,#010714,#031a3b,#020918)}.card{width:min(460px,100%);padding:34px;border:1px solid #00eaff66;border-radius:28px;background:#03142bf2;box-shadow:0 0 45px #00eaff22}.logo{text-align:center;font-size:22px;color:#00eaff;font-weight:900}.badge{display:block;width:max-content;margin:18px auto 8px;padding:7px 12px;border-radius:20px;background:#ffe600;color:#07111f;font-weight:900}.card h1{text-align:center;margin:10px 0}.sub{text-align:center;color:#b9dce7}.field{margin:18px 0}label{display:block;color:#ffe600;font-weight:900;margin-bottom:8px}input{width:100%;height:52px;padding:0 14px;border-radius:14px;border:1px solid #00eaff55;background:#020b1e;color:#fff;font-size:16px}button{width:100%;height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,#075eff,#00c8e8);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.msg{min-height:25px;text-align:center;margin-top:15px;font-weight:700}.error{color:#ff7894}.ok{color:#63ffb0}.home{text-align:center;margin-top:20px}.home a{color:#ffe600;text-decoration:none;font-weight:900}</style></head><body><main class="card"><div class="logo">🌈📚 English with Mariami</div><span class="badge">TEACHER ONLY</span><h1>👩‍🏫 მასწავლებლის შესვლა</h1><p class="sub">ეს გვერდი განკუთვნილია მხოლოდ მარიამი რაზმაძისთვის.</p><form id="f"><div class="field"><label>📧 ელფოსტა</label><input id="email" type="email" autocomplete="username" required value="razmadzemariam45@gmail.com"></div><div class="field"><label>🔑 პაროლი</label><input id="password" type="password" autocomplete="current-password" required></div><button id="b">🚀 მასწავლებლის გვერდზე შესვლა</button><div id="m" class="msg"></div></form><div class="home"><a href="index.html">🏠 მთავარზე დაბრუნება</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://vtdhvsfqhwesxtwmdue2.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_MnrM2ulyJY_ugwfFVfpV5wjCmt';const TEACHER_ID='be4b1c4d-e5f2-4039-b35e-aec3c110a94a';const TEACHER_EMAIL='razmadzemariam45@gmail.com';const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');function msg(t,c='msg'){m.className=c;m.textContent=t}f.onsubmit=async e=>{e.preventDefault();b.disabled=true;msg('იტვირთება...');try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw Error('Supabase-ის ბიბლიოთეკა ვერ ჩაიტვირთა.');const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const email=document.getElementById('email').value.trim().toLowerCase();const password=document.getElementById('password').value;if(email!==TEACHER_EMAIL)throw Error('ეს გვერდი მხოლოდ მასწავლებლის ანგარიშისთვისაა.');const {data,error}=await client.auth.signInWithPassword({email,password});if(error)throw error;if(!data.user||data.user.id!==TEACHER_ID)throw Error('ეს ანგარიში არ არის მარიამის მასწავლებლის ანგარიში.');const {data:p,error:pe}=await client.from('profiles').select('full_name,role').eq('user_id',TEACHER_ID).maybeSingle();if(pe)throw pe;if(!p||p.role!=='teacher')throw Error('ანგარიშს მასწავლებლის უფლება არ აქვს.');msg('წარმატებით შეხვედი ✓','msg ok');location.href='teacher-dashboard.html'}catch(x){console.error('Teacher login:',x);let text=x?.message||'შესვლა ვერ მოხერხდა.';if(text.includes('Failed to fetch')||text.includes('NetworkError')||text.includes('ERR_NAME_NOT_RESOLVED'))text='სერვერთან დაკავშირება ვერ მოხერხდა. შეამოწმე ინტერნეტი და თავიდან სცადე.';msg(text,'msg error');try{if(window.supabase&&window.supabase.createClient){const c=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);await c.auth.signOut({scope:'global'})}}catch(_){}}finally{b.disabled=false}}</script></body></html>
