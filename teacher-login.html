<!doctype html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020617">

<title>English with Mariami — შესვლა</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  overflow:hidden;
  background:#020617;
  color:#fff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
}

/* ==================================================
   MAIN 3D SCENE
================================================== */

.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  perspective:1200px;

  background:
    radial-gradient(circle at 15% 20%,#00eaff30,transparent 28%),
    radial-gradient(circle at 85% 20%,#7c3cff35,transparent 30%),
    radial-gradient(circle at 50% 100%,#006eff30,transparent 40%),
    linear-gradient(135deg,#01030b,#03152e 45%,#010713);
}

/* ==================================================
   3D GRID
================================================== */

.grid{
  position:absolute;

  width:180%;
  height:180%;

  left:-40%;
  top:38%;

  opacity:.25;

  background-image:
    linear-gradient(#00eaff20 1px,transparent 1px),
    linear-gradient(90deg,#00eaff20 1px,transparent 1px);

  background-size:65px 65px;

  transform:
    perspective(650px)
    rotateX(67deg)
    translateZ(-100px);

  animation:gridMove 12s linear infinite;
}

@keyframes gridMove{

  0%{
    transform:
      perspective(650px)
      rotateX(67deg)
      translateY(0)
      translateZ(-100px);
  }

  100%{
    transform:
      perspective(650px)
      rotateX(67deg)
      translateY(65px)
      translateZ(-100px);
  }

}

/* ==================================================
   GLOW ORBS
================================================== */

.orb{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  mix-blend-mode:screen;
  filter:blur(3px);
}

.orb1{
  width:420px;
  height:420px;
  left:-150px;
  top:5%;

  background:
    radial-gradient(
      circle,
      #00eaff70 0%,
      #00eaff20 35%,
      transparent 70%
    );

  animation:
    orbFloat1 9s ease-in-out infinite alternate;
}

.orb2{
  width:500px;
  height:500px;
  right:-180px;
  top:-80px;

  background:
    radial-gradient(
      circle,
      #7c3cff70 0%,
      #7c3cff18 40%,
      transparent 72%
    );

  animation:
    orbFloat2 12s ease-in-out infinite alternate;
}

.orb3{
  width:450px;
  height:450px;
  left:35%;
  bottom:-250px;

  background:
    radial-gradient(
      circle,
      #006eff55 0%,
      #006eff12 45%,
      transparent 72%
    );

  animation:
    orbFloat3 11s ease-in-out infinite alternate;
}

@keyframes orbFloat1{

  from{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  to{
    transform:
      translate3d(150px,80px,150px)
      scale(1.25);
  }

}

@keyframes orbFloat2{

  from{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  to{
    transform:
      translate3d(-130px,130px,120px)
      scale(1.3);
  }

}

@keyframes orbFloat3{

  from{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  to{
    transform:
      translate3d(80px,-100px,100px)
      scale(1.2);
  }

}

/* ==================================================
   PARTICLES
================================================== */

.particles{
  position:absolute;
  inset:0;
}

.particles span{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:
    0 0 8px #00eaff,
    0 0 18px #00eaff;

  opacity:.8;

  animation:
    particleFloat linear infinite;
}

/* positions */

.particles span:nth-child(1){left:5%;top:75%;animation-duration:9s}
.particles span:nth-child(2){left:12%;top:45%;animation-duration:12s}
.particles span:nth-child(3){left:20%;top:85%;animation-duration:10s}
.particles span:nth-child(4){left:28%;top:30%;animation-duration:13s}
.particles span:nth-child(5){left:37%;top:65%;animation-duration:8s}
.particles span:nth-child(6){left:45%;top:20%;animation-duration:14s}
.particles span:nth-child(7){left:54%;top:80%;animation-duration:11s}
.particles span:nth-child(8){left:63%;top:35%;animation-duration:9s}
.particles span:nth-child(9){left:72%;top:70%;animation-duration:13s}
.particles span:nth-child(10){left:81%;top:25%;animation-duration:10s}
.particles span:nth-child(11){left:90%;top:60%;animation-duration:15s}
.particles span:nth-child(12){left:16%;top:15%;animation-duration:11s}
.particles span:nth-child(13){left:34%;top:90%;animation-duration:12s}
.particles span:nth-child(14){left:68%;top:15%;animation-duration:9s}
.particles span:nth-child(15){left:94%;top:88%;animation-duration:14s}
.particles span:nth-child(16){left:48%;top:55%;animation-duration:10s}
.particles span:nth-child(17){left:7%;top:25%;animation-duration:13s}
.particles span:nth-child(18){left:77%;top:90%;animation-duration:11s}
.particles span:nth-child(19){left:58%;top:10%;animation-duration:15s}
.particles span:nth-child(20){left:25%;top:55%;animation-duration:12s}

@keyframes particleFloat{

  0%{
    transform:
      translate3d(0,100px,0)
      scale(.3);

    opacity:0;
  }

  20%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:
      translate3d(40px,-220px,180px)
      scale(1.7);

    opacity:0;
  }

}

/* ==================================================
   LIGHT BEAMS
================================================== */

.beam{
  position:absolute;

  width:2px;
  height:120%;

  top:-10%;

  background:
    linear-gradient(
      transparent,
      #00eaff55,
      transparent
    );

  filter:blur(1px);

  opacity:.35;

  transform:rotate(25deg);

  animation:beamMove 7s linear infinite;
}

.beam.one{
  left:20%;
}

.beam.two{
  left:70%;
  animation-delay:3s;
}

@keyframes beamMove{

  from{
    transform:
      translateX(-250px)
      rotate(25deg);
  }

  to{
    transform:
      translateX(500px)
      rotate(25deg);
  }

}

/* ==================================================
   CENTER CONTENT
================================================== */

.center{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  z-index:20;
}

/* ==================================================
   3D GLASS CARD
================================================== */

.card{

  position:relative;

  width:min(520px,94vw);

  padding:45px 35px;

  text-align:center;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(7,28,55,.86),
      rgba(2,9,25,.78)
    );

  border:1px solid #00eaff40;

  backdrop-filter:
    blur(25px)
    saturate(150%);

  -webkit-backdrop-filter:
    blur(25px)
    saturate(150%);

  box-shadow:
    0 35px 100px #000c,
    0 0 50px #00eaff18,
    inset 0 1px #ffffff18;

  transform:
    perspective(1000px)
    rotateX(0deg)
    rotateY(0deg)
    translateZ(0);

  animation:
    cardAppear 1.2s cubic-bezier(.2,.8,.2,1) both,
    cardFloat 6s ease-in-out infinite 1.2s;

  overflow:hidden;
}

/* glowing border */

.card:before{

  content:"";

  position:absolute;

  inset:-2px;

  border-radius:30px;

  padding:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      #7c3cff,
      #00eaff,
      transparent
    );

  background-size:250% 100%;

  animation:borderFlow 5s linear infinite;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);

  -webkit-mask-composite:xor;

  mask-composite:exclude;

  pointer-events:none;
}

.card:after{

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  left:-100px;
  top:-100px;

  border-radius:50%;

  background:#00eaff25;

  filter:blur(30px);

  animation:
    lightMove 7s ease-in-out infinite alternate;
}

@keyframes borderFlow{

  0%{
    background-position:0 0;
  }

  100%{
    background-position:250% 0;
  }

}

@keyframes lightMove{

  to{
    transform:
      translate3d(420px,380px,0)
      scale(1.5);
  }

}

@keyframes cardAppear{

  from{
    opacity:0;

    transform:
      perspective(1000px)
      rotateX(12deg)
      translateY(50px)
      scale(.92);
  }

  to{
    opacity:1;

    transform:
      perspective(1000px)
      rotateX(0)
      translateY(0)
      scale(1);
  }

}

@keyframes cardFloat{

  0%,100%{
    transform:
      perspective(1000px)
      translateY(0);
  }

  50%{
    transform:
      perspective(1000px)
      translateY(-8px);
  }

}

/* ==================================================
   LOGO
================================================== */

.logo{

  position:relative;

  width:90px;
  height:90px;

  margin:0 auto 22px;

  display:grid;
  place-items:center;

  border-radius:25px;

  background:
    linear-gradient(
      135deg,
      #075eff,
      #00eaff
    );

  font-size:43px;

  box-shadow:
    0 0 25px #00eaff70,
    0 15px 40px #000b;

  transform:
    perspective(500px)
    rotateX(8deg)
    rotateY(-10deg);

  animation:
    logo3d 4s ease-in-out infinite;
}

.logo:before{

  content:"";

  position:absolute;

  inset:-10px;

  border-radius:32px;

  border:1px solid #00eaff45;

  box-shadow:
    0 0 30px #00eaff30;

  animation:
    logoRing 3s linear infinite;
}

@keyframes logo3d{

  0%,100%{
    transform:
      perspective(500px)
      rotateX(8deg)
      rotateY(-10deg)
      translateY(0);
  }

  50%{
    transform:
      perspective(500px)
      rotateX(-8deg)
      rotateY(12deg)
      translateY(-7px);
  }

}

@keyframes logoRing{

  to{
    transform:rotate(360deg);
  }

}

/* ==================================================
   TEXT
================================================== */

.badge{

  display:inline-block;

  padding:7px 13px;

  border-radius:999px;

  font-size:11px;

  font-weight:900;

  letter-spacing:1.5px;

  color:#9ff8ff;

  background:#00eaff0d;

  border:1px solid #00eaff35;

  box-shadow:
    0 0 20px #00eaff12;

  margin-bottom:14px;
}

h1{

  margin:0;

  font-size:
    clamp(27px,6vw,43px);

  line-height:1.1;

  font-weight:1000;

  text-shadow:
    0 0 20px #00eaff45;

}

.subtitle{

  margin:15px 0 0;

  color:#a9ced9;

  font-size:14px;

  line-height:1.7;
}

.loading{

  margin-top:30px;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  color:#8ee9f4;

  font-size:13px;
}

/* ==================================================
   LOADER
================================================== */

.loader{

  position:relative;

  width:30px;
  height:30px;
}

.loader:before,
.loader:after{

  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:2px solid transparent;

}

.loader:before{

  border-top-color:#00eaff;
  border-right-color:#7c3cff;

  animation:
    spin 1s linear infinite;
}

.loader:after{

  inset:6px;

  border-top-color:#ffe600;
  border-left-color:#00eaff;

  animation:
    spinReverse 1.2s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

@keyframes spinReverse{

  to{
    transform:rotate(-360deg);
  }

}

/* ==================================================
   FOOTER
================================================== */

.footer{

  position:absolute;

  bottom:20px;

  left:0;
  right:0;

  z-index:30;

  text-align:center;

  color:#668b9a;

  font-size:11px;

  letter-spacing:.4px;
}

/* ==================================================
   SCAN LINE
================================================== */

.scan{

  position:absolute;

  left:0;
  right:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff55,
      transparent
    );

  box-shadow:
    0 0 15px #00eaff55;

  animation:
    scanMove 5s linear infinite;

  opacity:.5;
}

@keyframes scanMove{

  from{
    top:-5%;
  }

  to{
    top:105%;
  }

}

/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

  .card{

    padding:35px 22px;

    border-radius:23px;
  }

  .logo{

    width:75px;
    height:75px;

    font-size:35px;

    border-radius:21px;
  }

  .subtitle{

    font-size:13px;
  }

  .footer{

    bottom:12px;

    padding:0 15px;
  }

}

/* ==================================================
   REDUCED MOTION
================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{

    animation:none!important;
    transition:none!important;
  }

}
</style>
</head>

<body>

<div class="scene">

  <!-- 3D GRID -->
  <div class="grid"></div>

  <!-- GLOW ORBS -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- LIGHT BEAMS -->
  <div class="beam one"></div>
  <div class="beam two"></div>

  <!-- PARTICLES -->
  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- SCAN EFFECT -->
  <div class="scan"></div>

  <!-- CENTER -->
  <div class="center">

    <div class="card">

      <div class="logo">
        ⚡
      </div>

      <div class="badge">
        ENGLISH WITH MARIAMI
      </div>

      <h1>
        შესვლის გვერდი
      </h1>

      <p class="subtitle">
        სასწავლო პლატფორმა იტვირთება...
        <br>
        გთხოვთ, დაელოდოთ.
      </p>

      <div class="loading">

        <div class="loader"></div>

        <span>
          შესვლის გვერდზე გადამისამართება...
        </span>

      </div>

    </div>

  </div>

  <div class="footer">
    © 2026 English with Mariami • Developed by btcgamer
  </div>

</div>


<script>

/* ==================================================
   AUTO REDIRECT
================================================== */

(function(){

  const REDIRECT_URL = "login.html";

  /*
     მცირე დაყოვნება ვიზუალური ეფექტისთვის.
     შემდეგ ავტომატურად გადავა login.html-ზე.
  */

  setTimeout(function(){

    location.replace(REDIRECT_URL);

  },900);

})();


/* ==================================================
   MOUSE 3D PARALLAX
================================================== */

(function(){

  const scene =
    document.querySelector(".scene");

  const card =
    document.querySelector(".card");

  if(!scene || !card) return;

  let raf = null;

  document.addEventListener(
    "mousemove",
    function(e){

      if(window.innerWidth < 800)
        return;

      if(raf)
        cancelAnimationFrame(raf);

      raf =
        requestAnimationFrame(function(){

          const x =
            e.clientX /
            window.innerWidth -
            .5;

          const y =
            e.clientY /
            window.innerHeight -
            .5;

          const rotateY =
            x * 7;

          const rotateX =
            y * -5;

          card.style.transform =
            `
            perspective(1000px)
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            translateY(-3px)
            scale(1.01)
            `;

          scene.style.backgroundPosition =
            `${x * 10}px ${y * 10}px`;

        });

    }
  );

  document.addEventListener(
    "mouseleave",
    function(){

      card.style.transform =
        `
        perspective(1000px)
        rotateX(0deg)
        rotateY(0deg)
        translateY(0)
        scale(1)
        `;

    }
  );

})();

</script>

</body>
</html>
