<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>გაკვეთილები — English with Mariami</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260830"></script>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:#eafcff;
  font-family:Arial,"Noto Sans Georgian",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#00eaff35,transparent 25%),
    radial-gradient(circle at 90% 15%,#7c3cff35,transparent 30%),
    radial-gradient(circle at 50% 100%,#006eff30,transparent 40%),
    linear-gradient(135deg,#01030b,#03152e 45%,#010713);
  overflow-x:hidden;
}

/* =========================
   3D BACKGROUND
========================= */

#scene{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
  perspective:1200px;
}

.grid{
  position:absolute;
  width:180%;
  height:180%;
  left:-40%;
  top:30%;

  background-image:
    linear-gradient(#00eaff20 1px,transparent 1px),
    linear-gradient(90deg,#00eaff20 1px,transparent 1px);

  background-size:65px 65px;

  transform:
    perspective(700px)
    rotateX(65deg);

  animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
  from{
    transform:
      perspective(700px)
      rotateX(65deg)
      translateY(0);
  }

  to{
    transform:
      perspective(700px)
      rotateX(65deg)
      translateY(65px);
  }
}

.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(3px);
  mix-blend-mode:screen;
}

.orb1{
  width:380px;
  height:380px;
  left:-130px;
  top:8%;
  background:
    radial-gradient(circle,#00eaff65,#00eaff12 45%,transparent 70%);
  animation:orb1 9s ease-in-out infinite alternate;
}

.orb2{
  width:450px;
  height:450px;
  right:-150px;
  top:0;
  background:
    radial-gradient(circle,#7c3cff60,#7c3cff10 45%,transparent 70%);
  animation:orb2 12s ease-in-out infinite alternate;
}

.orb3{
  width:420px;
  height:420px;
  left:35%;
  bottom:-250px;
  background:
    radial-gradient(circle,#006eff50,#006eff08 50%,transparent 70%);
  animation:orb3 10s ease-in-out infinite alternate;
}

@keyframes orb1{
  to{
    transform:translate3d(130px,70px,100px) scale(1.25);
  }
}

@keyframes orb2{
  to{
    transform:translate3d(-110px,100px,150px) scale(1.3);
  }
}

@keyframes orb3{
  to{
    transform:translate3d(80px,-80px,100px);
  }
}

/* particles */

.particles span{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 14px #00eaff;
  animation:particle linear infinite;
}

@keyframes particle{
  0%{
    transform:translate3d(0,100px,0) scale(.4);
    opacity:0;
  }

  20%{
    opacity:.8;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:translate3d(40px,-220px,180px) scale(1.5);
    opacity:0;
  }
}

/* =========================
   HEADER
========================= */

.top{
  position:sticky;
  top:0;
  z-index:100;
  padding:13px 18px;

  background:rgba(2,8,23,.78);
  border-bottom:1px solid #00eaff40;
  backdrop-filter:blur(22px);

  box-shadow:
    0 10px 40px #000b;
}

.nav{
  max-width:1250px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  color:#fff;
  text-decoration:none;
  font-weight:1000;
  letter-spacing:.4px;

  text-shadow:
    0 0 18px #00eaff66;
}

.back{
  text-decoration:none;
  color:#fff;

  padding:10px 15px;
  border-radius:13px;

  background:linear-gradient(135deg,#075eff,#00c8e8);

  font-weight:1000;

  box-shadow:
    0 8px 25px #0008,
    0 0 20px #00eaff30;

  transition:.25s;
}

.back:hover{
  transform:translateY(-3px);
  box-shadow:
    0 15px 35px #000b,
    0 0 30px #00eaff55;
}

/* =========================
   MAIN
========================= */

.wrap{
  position:relative;
  z-index:5;

  width:min(1250px,calc(100% - 28px));
  margin:auto;
}

.hero{
  margin-top:28px;
  padding:42px 25px;
  text-align:center;

  border:1px solid #00eaff40;
  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(5,31,61,.78),
      rgba(4,10,28,.72)
    );

  box-shadow:
    0 25px 80px #000b,
    inset 0 1px #ffffff12;

  backdrop-filter:blur(18px);

  transform:
    perspective(1200px)
    rotateX(1deg);
}

.badge{
  display:inline-block;

  padding:7px 13px;
  border-radius:20px;

  color:#06101c;
  background:#ffe600;

  font-size:11px;
  font-weight:1000;

  box-shadow:
    0 0 20px #ffe60055;
}

.hero h1{
  margin:15px 0 8px;

  font-size:clamp(30px,6vw,58px);

  background:
    linear-gradient(
      90deg,
      #fff,
      #00eaff,
      #7c3cff,
      #fff
    );

  background-size:250% auto;

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;

  animation:titleGlow 5s linear infinite;
}

@keyframes titleGlow{
  to{
    background-position:250% center;
  }
}

.hero p{
  color:#a9d8e5;
  font-size:16px;
}

/* =========================
   CONTROLS
========================= */

.controls{
  margin:20px 0;

  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
}

.search{
  position:relative;
}

.search input{
  width:100%;
  min-height:52px;

  border-radius:16px;
  border:1px solid #00eaff45;

  padding:0 18px;

  color:#fff;
  background:#03152dcc;

  outline:none;

  box-shadow:
    inset 0 0 25px #00eaff05,
    0 0 25px #00eaff08;
}

.search input:focus{
  border-color:#00eaff;
  box-shadow:
    0 0 25px #00eaff25,
    inset 0 0 20px #00eaff08;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filter{
  min-height:52px;

  padding:0 17px;

  border-radius:15px;

  border:1px solid #00eaff35;

  color:#cceef5;
  background:#03152dcc;

  font-weight:900;

  cursor:pointer;

  transition:.25s;
}

.filter:hover{
  transform:translateY(-2px);
  border-color:#00eaff;
}

.filter.active{
  color:#06101c;
  background:
    linear-gradient(135deg,#00eaff,#7c3cff);
  box-shadow:
    0 0 25px #00eaff35;
}

/* =========================
   LESSON GRID
========================= */

#lessons{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(280px,1fr));
  gap:18px;

  padding-bottom:50px;
}

.lesson-card{
  position:relative;
  overflow:hidden;

  min-height:290px;

  padding:23px;

  border-radius:23px;

  border:1px solid #00eaff30;

  background:
    linear-gradient(
      145deg,
      rgba(5,28,55,.88),
      rgba(3,9,25,.9)
    );

  box-shadow:
    0 20px 55px #0009,
    inset 0 1px #ffffff0d;

  transform-style:preserve-3d;

  transition:
    transform .35s,
    border-color .35s,
    box-shadow .35s;
}

.lesson-card:hover{
  transform:
    perspective(900px)
    rotateX(4deg)
    rotateY(-4deg)
    translateY(-7px)
    translateZ(20px);

  border-color:#00eaff80;

  box-shadow:
    0 30px 70px #000c,
    0 0 35px #00eaff20;
}

.lesson-card:before{
  content:"";

  position:absolute;
  width:180px;
  height:180px;

  right:-80px;
  top:-80px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #00eaff25,
      transparent 70%
    );

  pointer-events:none;
}

.class-badge{
  display:inline-block;

  padding:6px 11px;

  border-radius:14px;

  color:#06101c;
  background:#00eaff;

  font-size:11px;
  font-weight:1000;

  box-shadow:0 0 16px #00eaff35;
}

.lesson-number{
  margin-top:17px;

  color:#819dab;

  font-size:12px;
  font-weight:900;
}

.lesson-card h2{
  margin:8px 0;

  font-size:23px;

  color:#fff;

  text-shadow:
    0 0 15px #00eaff25;
}

.topic{
  color:#00eaff;
  font-weight:900;
}

.description{
  min-height:48px;

  color:#a9cbd5;
  line-height:1.5;
  font-size:14px;
}

.lesson-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:20px;
  gap:10px;
}

.open{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:11px 15px;

  border-radius:13px;

  text-decoration:none;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #075eff,
      #00c8e8
    );

  font-weight:1000;

  box-shadow:
    0 8px 22px #0008,
    0 0 20px #00eaff25;
}

.open:hover{
  box-shadow:
    0 12px 30px #000b,
    0 0 30px #00eaff50;
}

.type{
  color:#8ab7c4;
  font-size:12px;
}

.empty{
  grid-column:1/-1;

  padding:50px;

  text-align:center;

  border-radius:22px;

  border:1px solid #00eaff25;

  color:#9bc6d2;

  background:#03132bcc;
}

.loader{
  grid-column:1/-1;
  padding:60px;
  text-align:center;
  color:#00eaff;
  font-weight:1000;
}

/* =========================
   FOOTER
========================= */

footer{
  position:relative;
  z-index:5;

  padding:25px;

  text-align:center;

  color:#6f9aa8;
  font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .controls{
    grid-template-columns:1fr;
  }

  .filters{
    display:grid;
    grid-template-columns:
      repeat(4,1fr);
  }

  .filter{
    min-height:45px;
    padding:0 7px;
    font-size:11px;
  }
}

@media(max-width:520px){

  .wrap{
    width:min(100% - 16px,1250px);
  }

  .hero{
    padding:30px 16px;
    border-radius:20px;
  }

  .hero h1{
    font-size:32px;
  }

  .lesson-card{
    min-height:270px;
  }

  .filters{
    grid-template-columns:
      repeat(2,1fr);
  }

  .nav{
    align-items:flex-start;
  }

  .brand{
    font-size:12px;
  }

  .back{
    font-size:11px;
    padding:9px 10px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *:before,
  *:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<div id="scene">
  <div class="grid"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="particles">
    <span style="left:5%;top:70%;animation-duration:8s"></span>
    <span style="left:13%;top:40%;animation-duration:11s"></span>
    <span style="left:22%;top:80%;animation-duration:9s"></span>
    <span style="left:32%;top:25%;animation-duration:13s"></span>
    <span style="left:44%;top:65%;animation-duration:10s"></span>
    <span style="left:55%;top:35%;animation-duration:12s"></span>
    <span style="left:66%;top:78%;animation-duration:8s"></span>
    <span style="left:75%;top:20%;animation-duration:14s"></span>
    <span style="left:85%;top:60%;animation-duration:11s"></span>
    <span style="left:93%;top:35%;animation-duration:9s"></span>
  </div>
</div>

<header class="top">
  <div class="nav">
    <a class="brand" href="teacher-dashboard.html">
      ⚡ ENGLISH WITH MARIAMI
    </a>

    <a class="back" href="teacher-dashboard.html">
      🔙 მასწავლებლის გვერდი
    </a>
  </div>
</header>

<main class="wrap">

<section class="hero">

  <span class="badge">
    👩‍🏫 TEACHER LESSON CENTER
  </span>

  <h1>
    📚 გაკვეთილების ცენტრი
  </h1>

  <p>
    მე-2, მე-3 და მე-4 კლასის ინგლისურის ინტერაქტიული გაკვეთილები
  </p>

</section>

<section class="controls">

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="🔎 მოძებნე გაკვეთილი, თემა ან სიტყვა..."
    >
  </div>

  <div class="filters">

    <button class="filter active" data-grade="all">
      ყველა
    </button>

    <button class="filter" data-grade="2">
      მე-2
    </button>

    <button class="filter" data-grade="3">
      მე-3
    </button>

    <button class="filter" data-grade="4">
      მე-4
    </button>

  </div>

</section>

<section id="lessons">
  <div class="loader">
    ⚡ გაკვეთილების ჩატვირთვა...
  </div>
</section>

</main>

<footer>
  © 2026 English with Mariami — Developed by btcgamer
</footer>

<script>
(function(){

'use strict';

const TEACHER_ID =
  'be4b1c4d-e5f2-4039-b35e-aec3c110a94a';

const client =
  window.supabaseClient;

const lessonsEl =
  document.getElementById('lessons');

const searchEl =
  document.getElementById('search');

let allLessons=[];
let selectedGrade='all';

function esc(value){
  return String(value ?? '')
    .replace(/[&<>"']/g,c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
}

function render(){

  const q =
    searchEl.value
      .trim()
      .toLowerCase();

  const filtered =
    allLessons.filter(l=>{

      const gradeOk =
        selectedGrade==='all' ||
        String(l.grade)===selectedGrade;

      const text =
        [
          l.title,
          l.topic,
          l.description,
          l.grade
        ]
        .join(' ')
        .toLowerCase();

      return gradeOk &&
        (!q || text.includes(q));
    });

  if(!filtered.length){

    lessonsEl.innerHTML=`
      <div class="empty">
        🔎 ამ კრიტერიუმით გაკვეთილი ვერ მოიძებნა.
      </div>
    `;

    return;
  }

  lessonsEl.innerHTML =
    filtered.map((l,i)=>`

      <article class="lesson-card">

        <span class="class-badge">
          მე-${esc(l.grade)} კლასი
        </span>

        <div class="lesson-number">
          LESSON ${String(l.lesson_number).padStart(2,'0')}
        </div>

        <h2>
          ${esc(l.title)}
        </h2>

        <div class="topic">
          ${esc(l.topic || '')}
        </div>

        <p class="description">
          ${esc(
            l.description ||
            'ინტერაქტიული ინგლისურის გაკვეთილი'
          )}
        </p>

        <div class="lesson-bottom">

          <span class="type">
            🎧 🔤 🎮 ⭐
          </span>

          <a
            class="open"
            href="lesson.html?id=${encodeURIComponent(l.id)}"
          >
            🚀 გაკვეთილის გახსნა
          </a>

        </div>

      </article>

    `).join('');
}

async function init(){

  try{

    if(!client){
      throw new Error('Supabase client not found');
    }

    const {
      data:{session}
    } = await client.auth.getSession();

    if(
      !session ||
      session.user.id!==TEACHER_ID
    ){

      location.replace('login.html');
      return;
    }

    const {
      data:profile,
      error:profileError
    } =
      await client
        .from('profiles')
        .select('role')
        .eq('user_id',session.user.id)
        .maybeSingle();

    if(
      profileError ||
      !profile ||
      profile.role!=='teacher'
    ){

      location.replace('index.html');
      return;
    }

    const {
      data,
      error
    } =
      await client
        .from('lessons')
        .select('*')
        .order('grade')
        .order('lesson_number');

    if(error) throw error;

    allLessons=data || [];

    render();

  }catch(error){

    console.error(error);

    lessonsEl.innerHTML=`
      <div class="empty">
        ❌ გაკვეთილების ჩატვირთვა ვერ მოხერხდა.<br><br>
        შეამოწმე Supabase-ის SQL და RLS.
      </div>
    `;
  }
}

document
  .querySelectorAll('.filter')
  .forEach(btn=>{

    btn.addEventListener('click',()=>{

      document
        .querySelectorAll('.filter')
        .forEach(x=>x.classList.remove('active'));

      btn.classList.add('active');

      selectedGrade =
        btn.dataset.grade;

      render();
    });
  });

searchEl.addEventListener(
  'input',
  render
);

init();

})();
</script>

</body>
</html>
