<script>
/* =========================================================
   TEACHER DASHBOARD — SAFE LESSON MATERIAL FIX
   Uses ONLY existing tables:
   lessons
   lesson_words
   lesson_quizzes
   teacher_students
   student_grades
   topic_controls
   ========================================================= */

(function () {
  "use strict";

  /* ---------- helpers ---------- */

  const $ = (s, root = document) => root.querySelector(s);

  function esc(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function arr(value) {
    if (Array.isArray(value)) return value;

    if (value == null) return [];

    if (typeof value === "string") {
      try {
        const x = JSON.parse(value);
        return Array.isArray(x) ? x : [x];
      } catch {
        return value
          .split(/\r?\n/)
          .map(x => x.trim())
          .filter(Boolean);
      }
    }

    return [value];
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) {
      alert("ამ მოწყობილობაზე ხმის ფუნქცია არ არის მხარდაჭერილი.");
      return;
    }

    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = "en-US";
    u.rate = 0.85;
    u.pitch = 1;

    speechSynthesis.speak(u);
  }

  /* ---------- find Supabase ---------- */

  function getSupabase() {
    if (window.supabaseClient) return window.supabaseClient;
    if (window.supabase) {
      if (typeof window.supabase.from === "function") {
        return window.supabase;
      }
    }

    for (const key of Object.keys(window)) {
      try {
        const v = window[key];

        if (
          v &&
          typeof v.from === "function" &&
          typeof v.auth === "object"
        ) {
          return v;
        }
      } catch {}
    }

    return null;
  }

  const db = getSupabase();

  if (!db) {
    console.error("Supabase client ვერ მოიძებნა.");
    return;
  }

  /* =========================================================
     LESSON LOADER
     ========================================================= */

  async function loadLessonsFixed(grade) {

    const container =
      document.querySelector("#lessonsContainer") ||
      document.querySelector(".lessons-container") ||
      document.querySelector("#lessonList") ||
      document.querySelector(".lesson-list");

    if (!container) {
      console.warn("Lessons container ვერ მოიძებნა.");
      return;
    }

    container.innerHTML = `
      <div style="
        padding:30px;
        text-align:center;
        color:#9ff;
        font-size:18px;
      ">
        ⟳ იტვირთება Grade ${grade}...
      </div>
    `;

    const { data, error } = await db
      .from("lessons")
      .select(`
        id,
        grade,
        lesson_number,
        title,
        topic,
        description,
        image_url,
        audio_url,
        created_at,
        grammar_rule,
        grammar_examples,
        listening_text,
        speaking_phrases,
        reading_text,
        exercises
      `)
      .eq("grade", Number(grade))
      .order("lesson_number", { ascending: true });

    if (error) {
      console.error("LESSONS ERROR:", error);

      container.innerHTML = `
        <div style="
          padding:25px;
          border:1px solid #f44;
          border-radius:16px;
          color:#ff8a8a;
          background:rgba(255,0,0,.08);
        ">
          <b>Lesson-ის ჩატვირთვა ვერ მოხერხდა</b>
          <br><br>
          ${esc(error.message)}
        </div>
      `;

      return;
    }

    if (!data || !data.length) {
      container.innerHTML = `
        <div style="
          padding:30px;
          text-align:center;
          color:#aaa;
        ">
          Grade ${grade}-ში გაკვეთილები ვერ მოიძებნა.
        </div>
      `;
      return;
    }

    container.innerHTML = data.map((lesson, i) => `
      <button
        type="button"
        class="safe-lesson-card"
        data-lesson-id="${esc(lesson.id)}"
        data-grade="${Number(grade)}"
        style="
          width:100%;
          display:block;
          margin:12px 0;
          padding:20px;
          border-radius:18px;
          border:1px solid rgba(0,255,255,.35);
          background:
            linear-gradient(
              135deg,
              rgba(0,255,255,.10),
              rgba(130,0,255,.12)
            );
          color:white;
          text-align:left;
          cursor:pointer;
          box-shadow:
            0 0 18px rgba(0,255,255,.08),
            inset 0 0 20px rgba(255,255,255,.02);
          transition:.25s;
        "
      >
        <div style="
          font-size:13px;
          color:#6ff;
          margin-bottom:7px;
          letter-spacing:1px;
        ">
          LESSON ${esc(lesson.lesson_number ?? i + 1)}
        </div>

        <div style="
          font-size:20px;
          font-weight:700;
        ">
          ${esc(lesson.title || "Untitled Lesson")}
        </div>

        ${
          lesson.topic
            ? `<div style="margin-top:7px;color:#bbb;">
                 ${esc(lesson.topic)}
               </div>`
            : ""
        }
      </button>
    `).join("");

    container.querySelectorAll(".safe-lesson-card")
      .forEach(card => {

        card.addEventListener("click", async () => {

          const id = card.dataset.lessonId;

          if (!id) return;

          await openLessonFixed(id);
        });

      });
  }

  /* =========================================================
     OPEN COMPLETE LESSON
     ========================================================= */

  async function openLessonFixed(lessonId) {

    const { data: lesson, error } = await db
      .from("lessons")
      .select("*")
      .eq("id", lessonId)
      .maybeSingle();

    if (error) {
      console.error(error);
      alert("Lesson ვერ გაიხსნა: " + error.message);
      return;
    }

    if (!lesson) {
      alert("Lesson ვერ მოიძებნა.");
      return;
    }

    /* WORDS */

    const { data: words, error: wordsError } = await db
      .from("lesson_words")
      .select("*")
      .eq("lesson_id", lessonId)
      .order("sort_order", { ascending: true });

    if (wordsError) {
      console.warn("WORDS:", wordsError);
    }

    /* QUIZ */

    const { data: quizzes, error: quizError } = await db
      .from("lesson_quizzes")
      .select("*")
      .eq("lesson_id", lessonId)
      .order("sort_order", { ascending: true });

    if (quizError) {
      console.warn("QUIZ:", quizError);
    }

    renderCompleteLesson(
      lesson,
      words || [],
      quizzes || []
    );
  }

  /* =========================================================
     RENDER
     ========================================================= */

  function renderCompleteLesson(lesson, words, quizzes) {

    const container =
      document.querySelector("#lessonsContainer") ||
      document.querySelector(".lessons-container") ||
      document.querySelector("#lessonList") ||
      document.querySelector(".lesson-list");

    if (!container) return;

    const grammarExamples = arr(lesson.grammar_examples);
    const speaking = arr(lesson.speaking_phrases);
    const exercises = arr(lesson.exercises);

    container.innerHTML = `
      <div class="complete-lesson-view"
           style="
             max-width:1100px;
             margin:auto;
             color:white;
           ">

        <button
          type="button"
          id="backToLessonsBtn"
          style="
            padding:11px 18px;
            margin-bottom:20px;
            border-radius:12px;
            border:1px solid #0ff;
            background:rgba(0,255,255,.08);
            color:#7ff;
            cursor:pointer;
          "
        >
          ← გაკვეთილებზე დაბრუნება
        </button>

        <div style="
          padding:25px;
          border-radius:24px;
          border:1px solid rgba(0,255,255,.35);
          background:linear-gradient(
            135deg,
            rgba(0,255,255,.09),
            rgba(130,0,255,.12)
          );
          box-shadow:0 0 30px rgba(0,255,255,.08);
        ">

          ${
            lesson.image_url
              ? `
                <img
                  src="${esc(lesson.image_url)}"
                  alt=""
                  style="
                    width:100%;
                    max-height:350px;
                    object-fit:cover;
                    border-radius:18px;
                    margin-bottom:20px;
                  "
                >
              `
              : ""
          }

          <div style="color:#6ff;font-size:13px;">
            GRADE ${esc(lesson.grade)}
            · LESSON ${esc(lesson.lesson_number)}
          </div>

          <h1 style="
            font-size:34px;
            margin:8px 0;
          ">
            ${esc(lesson.title)}
          </h1>

          ${
            lesson.topic
              ? `<div style="color:#aaa;">${esc(lesson.topic)}</div>`
              : ""
          }

          ${
            lesson.description
              ? `
                <p style="
                  color:#ddd;
                  line-height:1.7;
                ">
                  ${esc(lesson.description)}
                </p>
              `
              : ""
          }

          ${
            lesson.audio_url
              ? `
                <audio
                  controls
                  preload="metadata"
                  src="${esc(lesson.audio_url)}"
                  style="width:100%;margin:15px 0;"
                ></audio>
              `
              : ""
          }

        </div>

        <!-- WORDS -->

        <section class="material-section">
          <h2>📚 Words</h2>

          ${
            words.length
              ? words.map(word => `
                <div class="material-card">

                  <div style="font-size:26px;">
                    ${esc(word.emoji || "📖")}
                  </div>

                  <div style="flex:1;">
                    <b style="font-size:20px;">
                      ${esc(word.word)}
                    </b>

                    <div style="color:#aaa;">
                      ${esc(word.translation)}
                    </div>
                  </div>

                  <button
                    type="button"
                    class="speak-btn"
                    data-speak="${esc(word.word)}"
                  >
                    🔊
                  </button>

                </div>
              `).join("")
              : `<div class="empty-material">
                   ამ Lesson-ში სიტყვები ჯერ არ არის.
                 </div>`
          }

        </section>

        <!-- GRAMMAR -->

        <section class="material-section">
          <h2>🧠 Grammar</h2>

          ${
            lesson.grammar_rule
              ? `
                <div class="material-card block">
                  <b>Rule</b>
                  <p>${esc(lesson.grammar_rule)}</p>
                </div>
              `
              : ""
          }

          ${
            grammarExamples.length
              ? `
                <div class="material-card block">
                  <b>Examples</b>
                  ${grammarExamples.map(x => `
                    <p>• ${esc(
                      typeof x === "object"
                        ? JSON.stringify(x)
                        : x
                    )}</p>
                  `).join("")}
                </div>
              `
              : ""
          }

          ${
            !lesson.grammar_rule && !grammarExamples.length
              ? `<div class="empty-material">
                   Grammar ჯერ არ არის დამატებული.
                 </div>`
              : ""
          }

        </section>

        <!-- LISTENING -->

        <section class="material-section">
          <h2>🎧 Listening</h2>

          ${
            lesson.listening_text
              ? `
                <div class="material-card block">
                  <p id="listeningText">
                    ${esc(lesson.listening_text)}
                  </p>

                  <button
                    type="button"
                    class="speak-btn"
                    data-speak="${esc(lesson.listening_text)}"
                  >
                    🔊 მოსმენა
                  </button>
                </div>
              `
              : `<div class="empty-material">
                   Listening ტექსტი ჯერ არ არის.
                 </div>`
          }

        </section>

        <!-- SPEAKING -->

        <section class="material-section">
          <h2>🗣️ Speaking</h2>

          ${
            speaking.length
              ? speaking.map(x => `
                <div class="material-card">

                  <div style="flex:1;">
                    ${esc(
                      typeof x === "object"
                        ? JSON.stringify(x)
                        : x
                    )}
                  </div>

                  <button
                    type="button"
                    class="speak-btn"
                    data-speak="${esc(
                      typeof x === "object"
                        ? JSON.stringify(x)
                        : x
                    )}"
                  >
                    🔊
                  </button>

                </div>
              `).join("")
              : `<div class="empty-material">
                   Speaking ჯერ არ არის.
                 </div>`
          }

        </section>

        <!-- READING -->

        <section class="material-section">
          <h2>📖 Reading</h2>

          ${
            lesson.reading_text
              ? `
                <div class="material-card block">

                  <p style="
                    white-space:pre-wrap;
                    line-height:1.9;
                  ">
                    ${esc(lesson.reading_text)}
                  </p>

                  <button
                    type="button"
                    class="speak-btn"
                    data-speak="${esc(lesson.reading_text)}"
                  >
                    🔊 წაკითხვა
                  </button>

                </div>
              `
              : `<div class="empty-material">
                   Reading ტექსტი ჯერ არ არის.
                 </div>`
          }

        </section>

        <!-- EXERCISES -->

        <section class="material-section">
          <h2>✏️ Exercises</h2>

          ${
            exercises.length
              ? exercises.map((x, i) => `
                <div class="material-card block">
                  <b>Exercise ${i + 1}</b>
                  <p>
                    ${esc(
                      typeof x === "object"
                        ? JSON.stringify(x)
                        : x
                    )}
                  </p>
                </div>
              `).join("")
              : `<div class="empty-material">
                   Exercises ჯერ არ არის.
                 </div>`
          }

        </section>

        <!-- QUIZ -->

        <section class="material-section">
          <h2>🧩 Quiz</h2>

          ${
            quizzes.length
              ? quizzes.map((q, i) => {

                  const options = arr(q.options);

                  return `
                    <div
                      class="material-card block quiz-question"
                      data-correct="${esc(q.correct_answer)}"
                    >

                      <b>
                        ${i + 1}. ${esc(q.question)}
                      </b>

                      <div style="margin-top:12px;">

                        ${
                          options.map(option => `
                            <button
                              type="button"
                              class="quiz-option"
                              data-answer="${esc(
                                typeof option === "object"
                                  ? JSON.stringify(option)
                                  : option
                              )}"
                            >
                              ${esc(
                                typeof option === "object"
                                  ? JSON.stringify(option)
                                  : option
                              )}
                            </button>
                          `).join("")
                        }

                      </div>

                      <div class="quiz-result"></div>

                    </div>
                  `;
                }).join("")
              : `<div class="empty-material">
                   Quiz ჯერ არ არის დამატებული.
                 </div>`
          }

        </section>

      </div>
    `;

    injectMaterialStyles();

    $("#backToLessonsBtn")?.addEventListener("click", () => {

      const grade = lesson.grade;

      loadLessonsFixed(grade);
    });

    container.querySelectorAll(".speak-btn")
      .forEach(btn => {

        btn.addEventListener("click", () => {
          speak(btn.dataset.speak);
        });

      });

    container.querySelectorAll(".quiz-option")
      .forEach(btn => {

        btn.addEventListener("click", () => {

          const question = btn.closest(".quiz-question");
          const correct = question.dataset.correct;
          const answer = btn.dataset.answer;

          const result =
            question.querySelector(".quiz-result");

          question
            .querySelectorAll(".quiz-option")
            .forEach(x => {
              x.disabled = true;
            });

          if (String(answer) === String(correct)) {

            btn.classList.add("correct");

            result.textContent = "✓ სწორია!";
            result.style.color = "#6f6";

          } else {

            btn.classList.add("wrong");

            result.textContent = "✕ არასწორია";
            result.style.color = "#f77";
          }

        });

      });
  }

  /* =========================================================
     GRADE BUTTONS
     ========================================================= */

  function installGradeHandlers() {

    document.addEventListener("click", function (e) {

      const btn = e.target.closest(
        "[data-grade], [data-grade-select]"
      );

      if (!btn) return;

      const raw =
        btn.dataset.grade ||
        btn.dataset.gradeSelect;

      const grade = Number(raw);

      if (![2, 3, 4].includes(grade)) return;

      e.preventDefault();
      e.stopPropagation();

      loadLessonsFixed(grade);

    }, true);
  }

  /* =========================================================
     CSS
     ========================================================= */

  function injectMaterialStyles() {

    if (document.getElementById("safe-material-style"))
      return;

    const style = document.createElement("style");

    style.id = "safe-material-style";

    style.textContent = `

      .material-section {
        margin-top:24px;
      }

      .material-section h2 {
        font-size:25px;
        margin-bottom:12px;
        color:#8fffff;
        text-shadow:
          0 0 8px rgba(0,255,255,.5);
      }

      .material-card {
        display:flex;
        align-items:center;
        gap:14px;
        margin:10px 0;
        padding:17px;
        border-radius:16px;
        border:1px solid rgba(0,255,255,.18);
        background:rgba(255,255,255,.035);
        color:white;
      }

      .material-card.block {
        display:block;
      }

      .material-card p {
        line-height:1.7;
        color:#ddd;
      }

      .speak-btn {
        border:1px solid rgba(0,255,255,.45);
        background:rgba(0,255,255,.08);
        color:#8fffff;
        border-radius:12px;
        padding:9px 13px;
        cursor:pointer;
      }

      .speak-btn:hover {
        box-shadow:0 0 15px rgba(0,255,255,.35);
        transform:translateY(-1px);
      }

      .quiz-option {
        display:block;
        width:100%;
        text-align:left;
        margin:8px 0;
        padding:12px 15px;
        border-radius:11px;
        border:1px solid rgba(0,255,255,.2);
        background:rgba(255,255,255,.04);
        color:white;
        cursor:pointer;
      }

      .quiz-option:hover {
        border-color:#0ff;
        background:rgba(0,255,255,.08);
      }

      .quiz-option.correct {
        border-color:#5f5;
        background:rgba(0,255,0,.1);
      }

      .quiz-option.wrong {
        border-color:#f55;
        background:rgba(255,0,0,.1);
      }

      .empty-material {
        padding:18px;
        border-radius:14px;
        color:#888;
        background:rgba(255,255,255,.025);
      }

      .safe-lesson-card:hover {
        transform:translateY(-2px);
        border-color:#0ff !important;
        box-shadow:
          0 0 25px rgba(0,255,255,.18) !important;
      }

    `;

    document.head.appendChild(style);
  }

  /* =========================================================
     START
     ========================================================= */

  injectMaterialStyles();
  installGradeHandlers();

  /* expose for existing dashboard buttons */

  window.loadLessonsFixed = loadLessonsFixed;
  window.openLessonFixed = openLessonFixed;

  console.log(
    "✓ Safe Teacher Dashboard Lesson Fix loaded"
  );

})();
</script>
