<!doctype html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მასწავლებლის ჟურნალი — English with Mariami</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>:root{--p:#6c5ce7;--p2:#8f83ff;--pink:#ff7b72;--bg:#f5f4ff;--ink:#25233b;--muted:#74788c;--card:#fff;--ok:#16803c;--bad:#c62828}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff 0 12%,transparent 32%),linear-gradient(135deg,#eceaff,#fff4ee);min-height:100vh}.top{background:#fffdfef2;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #0001}.topin{max-width:1200px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:1000;color:var(--p);font-size:20px}.logout{border:0;border-radius:12px;padding:11px 16px;background:#26243a;color:#fff;font-weight:800;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:28px 20px}.hero{background:linear-gradient(135deg,#5142c8,#8f83ff,#ff7b72);color:#fff;border-radius:28px;padding:28px;box-shadow:0 20px 50px #0002;transform:perspective(1000px) rotateX(1deg)}h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.sub{margin:0;color:#ffffffdd}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px}.card{background:#ffffffed;border:1px solid #fff;border-radius:24px;padding:22px;box-shadow:0 12px 35px #0001}.card h2{margin-top:0}.field{margin:13px 0}label{display:block;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8d8e5;border-radius:12px;background:#fff;font:inherit}textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#eeeefe;color:#5142c8}.message{display:none;margin-top:12px;padding:11px;border-radius:11px;font-weight:700}.show{display:block}.error{background:#fff0f0;color:var(--bad)}.success{background:#eaf9ef;color:var(--ok)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters>*{flex:1;min-width:140px}.tablewrap{overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:720px}th{text-align:left;color:var(--muted);font-size:13px;padding:5px 10px}td{background:#fff;padding:12px 10px}td:first-child{border-radius:12px 0 0 12px}td:last-child{border-radius:0 12px 12px 0}.pill{display:inline-block;padding:6px 9px;border-radius:99px;font-size:12px;font-weight:900}.present{background:#eaf9ef;color:var(--ok)}.absent{background:#fff0f0;color:var(--bad)}.late{background:#fff8df;color:#8a6500}.empty{text-align:center;color:var(--muted);padding:30px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat div{background:#fff;border-radius:16px;padding:14px;box-shadow:0 7px 20px #0001}.stat b{display:block;font-size:24px;color:var(--p)}@media(max-width:900px){.grid{grid-template-columns:1fr}.stat{grid-template-columns:1fr 1fr}}</style><script src="protect.js"></script></head><body><header class="top"><div class="topin"><div class="brand">👩‍🏫 English with Mariami — მასწავლებლის სივრცე</div><button class="logout" id="logout">🚪 გასვლა</button></div></header><main class="wrap"><section class="hero"><h1>📚 მასწავლებლის ჟურნალი</h1><p class="sub">განრიგი • დასწრება • მოსვლა/წასვლა • პირადი შენიშვნები 🔐</p></section><div id="app" style="display:none"><div class="grid"><aside><section class="card"><h2>📅 ახალი გაკვეთილი</h2><form id="scheduleForm"><div class="field"><label>მოსწავლის ID</label><input id="studentId" required placeholder="Supabase user ID"></div><div class="field"><label>თარიღი</label><input id="lessonDate" type="date" required></div><div class="field"><label>დაწყება</label><input id="startTime" type="time" required></div><div class="field"><label>დასრულება</label><input id="endTime" type="time"></div><div class="field"><label>შენიშვნა</label><textarea id="lessonNote" placeholder="მაგ. Vocabulary + Reading"></textarea></div><button class="btn" type="submit">➕ განრიგში დამატება</button><div id="formMessage" class="message"></div></form></section></aside><section class="card"><div class="stat"><div><span>დღეს</span><b id="todayCount">0</b><small> გაკვეთილი</small></div><div><span>მოვიდა</span><b id="presentCount">0</b><small> მოსწავლე</small></div><div><span>არ მოვიდა</span><b id="absentCount">0</b><small> მოსწავლე</small></div></div><div class="filters"><input id="dateFilter" type="date"><button class="btn secondary" id="refresh" type="button">🔄 განახლება</button></div><div class="tablewrap"><table><thead><tr><th>თარიღი</th><th>დრო</th><th>მოსწავლე</th><th>სტატუსი</th><th>მოსვლა</th><th>წასვლა</th><th>შენიშვნა</th><th>მოქმედება</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></div><div id="blocked" class="card" style="margin-top:20px;text-align:center">🔐 მოწმდება მასწავლებლის უფლებები...</div></main><script>const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let teacherId=null;const $=id=>document.getElementById(id);function msg(text,ok=false){const m=$("formMessage");m.textContent=text;m.className="message show "+(ok?"success":"error")}async function load(){const{data:{user}}=await sb.auth.getUser();if(!user){location.replace('login.html?next=admin.html');return}const{data:p,error}=await sb.from('profiles').select('role,full_name').eq('user_id',user.id).maybeSingle();if(error||!p||p.role!=='teacher'){location.replace('index.html');return}teacherId=user.id;$('blocked').style.display='none';$('app').style.display='block';$('dateFilter').value=new Date().toISOString().slice(0,10);await refresh()}async function refresh(){if(!teacherId)return;const date=$('dateFilter').value;let q=sb.from('schedules').select('id,student_id,lesson_date,start_time,end_time,notes').eq('teacher_id',teacherId).order('lesson_date').order('start_time');if(date)q=q.eq('lesson_date',date);const{data:sch,error}=await q;if(error){console.error(error);return}const ids=[...new Set((sch||[]).map(x=>x.student_id))];let prof=[];if(ids.length){const r=await sb.from('profiles').select('user_id,full_name,grade').in('user_id',ids);prof=r.data||[]}const{data:att}=await sb.from('attendance').select('schedule_id,status,arrival_time,departure_time,private_note').eq('teacher_id',teacherId);const pm=new Map((prof||[]).map(x=>[x.user_id,x]));const am=new Map((att||[]).map(x=>[x.schedule_id,x]));$('rows').innerHTML='';let present=0,absent=0;for(const s of sch||[]){const a=am.get(s.id),p=pm.get(s.student_id),status=a?.status||'—';if(status==='present')present++;if(status==='absent')absent++;const tr=document.createElement('tr');tr.innerHTML=`<td>${s.lesson_date}</td><td>${s.start_time?.slice(0,5)||''}${s.end_time?'–'+s.end_time.slice(0,5):''}</td><td>${p?.full_name||'მოსწავლე'}<br><small>მე-${p?.grade||'?' } კლასი</small></td><td><span class="pill ${status}">${status==='present'?'🟢 მოვიდა':status==='absent'?'🔴 არ მოვიდა':status==='late'?'🟡 დაგვიანდა':'—'}</span></td><td>${a?.arrival_time?new Date(a.arrival_time).toLocaleTimeString('ka-GE',{hour:'2-digit',minute:'2-digit'}):'—'}</td><td>${a?.departure_time?new Date(a.departure_time).toLocaleTimeString('ka-GE',{hour:'2-digit',minute:'2-digit'}):'—'}</td><td>${a?.private_note||s.notes||'—'}</td><td><button class="btn" onclick="setAttendance('${s.id}','${s.student_id}','present')">მოვიდა</button></td>`;$('rows').appendChild(tr)}if(!sch?.length)$('rows').innerHTML='<tr><td colspan="8" class="empty">ამ დღისთვის გაკვეთილები არ არის.</td></tr>';$('todayCount').textContent=sch?.length||0;$('presentCount').textContent=present;$('absentCount').textContent=absent}async function setAttendance(scheduleId,studentId,status){const now=new Date().toISOString();const{error}=await sb.from('attendance').upsert({schedule_id:scheduleId,student_id:studentId,teacher_id:teacherId,status,arrival_time:status==='present'?now:null},{onConflict:'schedule_id'});if(error)alert('შეცდომა: '+error.message);else refresh()}$('scheduleForm').addEventListener('submit',async e=>{e.preventDefault();const{error}=await sb.from('schedules').insert({teacher_id:teacherId,student_id:$('studentId').value.trim(),lesson_date:$('lessonDate').value,start_time:$('startTime').value,end_time:$('endTime').value||null,notes:$('lessonNote').value.trim()||null});if(error)msg('❌ '+error.message);else{msg('✅ გაკვეთილი დაემატა.',true);e.target.reset();$('lessonDate').value=new Date().toISOString().slice(0,10);refresh()}});$('refresh').onclick=refresh;$('dateFilter').onchange=refresh;$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('login.html')};load();</script></body></html>
