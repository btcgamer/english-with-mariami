const grid=document.getElementById('grid'),search=document.getElementById('search'),level=document.getElementById('level');function render(){const q=search.value.toLowerCase().trim(),lv=level.value;grid.innerHTML='';groups.forEach(g=>{if(lv!=='all'&&g[1]!==lv)return;const words=g[2].filter(w=>(w[0]+' '+w[1]).toLowerCase().includes(q));if(!words.length)return;const card=document.createElement('article');card.className='vocab-card';card.innerHTML='<span class="level">'+g[1]+'-ე კლასი</span><h3>'+g[0]+'</h3>'+words.map(w=>'<div class="word"><span class="en">'+w[0]+'</span><span class="ka">'+w[1]+'</span></div>').join('');grid.appendChild(card)})}search.addEventListener('input',render);level.addEventListener('change',render);render();</script></body></html>
